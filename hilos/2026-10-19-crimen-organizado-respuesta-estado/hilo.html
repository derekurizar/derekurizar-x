<style>
  :root { --papel:#F6F2E8; --tinta:#0C1520; --gris:#5c6470; --linea:rgba(12,21,32,.14); --acento:#4B92DB; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { font: 700 30px/1.15 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  header .meta { color: var(--gris); font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--tinta); color: var(--papel); }
  .tesis { margin: 18px 0 0; padding: 14px 18px; border-left: 4px solid var(--acento); background: rgba(75,146,219,.08); font-size: 17px; }
  .contacto { margin-top: 18px; }
  .contacto a { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--acento); }
  .contacto img { width: 100%; max-width: 760px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .tuit { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--linea); }
  .tuit .cab { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--gris); }
  .tuit .cab .n { font-weight: 800; font-size: 15px; color: var(--tinta); }
  .texto { position: relative; margin-top: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--linea); border-radius: 10px; white-space: pre-wrap; font-size: 17px; }
  .texto.vacio { color: var(--gris); font-style: italic; }
  .fila { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--gris); }
  .fila .cnt.alerta { color: #B23A26; font-weight: 700; }
  button { font: 600 13px/1 system-ui, sans-serif; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); cursor: pointer; }
  button:hover { background: var(--tinta); color: var(--papel); }
  .img { margin-top: 14px; }
  .img img { width: 100%; max-width: 560px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .alt { margin-top: 10px; font-size: 14px; color: var(--gris); }
  .alt b { color: var(--tinta); }
  .fuente { margin-top: 6px; font-size: 13px; color: var(--gris); }
  section.extra { margin-top: 44px; padding-top: 24px; border-top: 2px solid var(--tinta); }
  section.extra h2 { font: 700 18px/1.2 system-ui, sans-serif; margin: 22px 0 8px; }
  section.extra ul { margin: 0; padding-left: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>

<script id="hilo-json" type="application/json">{"slug": "crimen-organizado-respuesta-estado", "fecha": "2026-10-19", "tema": "Crimen organizado y violencia en Guatemala hoy: las caras del crimen (violencia letal y su geografía, armas, narcotráfico, extorsión y pandillas, desapariciones, violencia contra mujeres y niñez) y lo que el Estado hace al respecto (estado de sitio y de prevención 2026, Ley Antipandillas, presupuesto y agentes, capturas, decomisos, extradiciones, cárceles) con sus resultados medibles", "tesis": "En 2026 el Estado multiplicó lo que controla (8,402.4 kg de cocaína decomisada en el primer semestre, frente a 1,596.2 kg en 2025) y bajaron las denuncias de extorsión y de homicidio, pero la violencia cambió de blanco: 20 policías asesinados al 28 de julio, el doble que en todo 2025, y solo 4% de los casos de homicidio concluidos termina en sentencia.", "paleta": "terracota", "hook_tipo": "pregunta_directa", "modo": "hilo", "pregunta": "¿Cuántas caras tiene hoy el crimen organizado en Guatemala y lo que el Estado ha hecho desde 2025 ya se nota en la violencia que vive la gente?", "n_tuits": 20, "estado": "listo", "tuits": [{"n": 1, "beat": "gancho", "texto": "¿Se nota en la calle la ofensiva del Estado contra el crimen organizado?\n\nEn lo que decomisa y captura, sí: mucho más que en 2025. En lo que vive la gente, la respuesta cambia según el delito.\n\nHilo con datos 🧵", "caracteres": 211, "alt_text": "Tarjeta antes y después: la cocaína decomisada en Guatemala en el primer semestre pasó de 1,596.2 kilogramos en enero–junio de 2025 a 8,402.4 kilogramos en enero–junio de 2026. Fuente: PNC vía AGN.", "imagen": "tuit_1.png", "plantilla": "antes-despues", "fuente": "PNC · vía AGN · primer semestre 2025 y 2026", "cifra_ids": ["nar-c02"]}, {"n": 2, "beat": "contexto", "texto": "Primero, el mapa: así califica un índice internacional cada mercado criminal en Guatemala. Este hilo sigue a los dos de arriba.", "caracteres": 127, "alt_text": "Barras horizontales con el puntaje de 0 a 10 de los ocho mercados criminales más fuertes en Guatemala según el Índice Global de Crimen Organizado 2025: extorsión y cobro de protección 8.5, tráfico de cocaína 8.5, trata de personas 7.5, tráfico ilícito de migrantes 7.5, tráfico de armas 7.0, tráfico de heroína 7.0, delitos financieros 7.0 y drogas sintéticas 6.5. Fuente: GI-TOC.", "imagen": "tuit_2.png", "plantilla": "barras-h", "fuente": "GI-TOC · Global Organized Crime Index 2025", "cifra_ids": ["nar-c13"]}, {"n": 3, "beat": "contexto", "texto": "En seis meses, 2026 ya se acerca a todo 2025. Pero el total de un año depende de pocos cargamentos grandes.", "caracteres": 107, "alt_text": "Barras verticales con la cocaína decomisada en Guatemala por año, en toneladas: 2016 12.8, 2017 13.7, 2018 16.8, 2019 18.9, 2020 13.6, 2021 11.0, 2022 5.8, 2023 5.0, 2024 18.2 y 2025 9.9 (9,850 kilogramos). Fuente: Ministerio de Gobernación, cifras oficiales difundidas por prensa.", "imagen": "tuit_3.png", "plantilla": "barras-v", "fuente": "MINGOB · cifras oficiales vía prensa · 2016–2025", "cifra_ids": ["nar-c01"]}, {"n": 4, "beat": "contexto", "texto": "", "caracteres": 0, "alt_text": "Cifra destacada: 66.7% de la cocaína decomisada en Guatemala del 1 de enero al 28 de mayo de 2026 salió de un solo cargamento, el de Puerto Quetzal en enero de 2026. Fuente: MINGOB vía AGN, cálculo propio.", "imagen": "tuit_4.png", "plantilla": "cifra", "fuente": "MINGOB · vía AGN, cálculo propio · 2026", "cifra_ids": ["nar-c03"]}, {"n": 5, "beat": "contexto", "texto": "Solo por delitos de drogas, las capturas pasaron de 743 a 1,190 en enero–mayo. La pregunta es si más capturas se traducen en menos violencia.", "caracteres": 141, "alt_text": "Tarjeta antes y después: las personas aprehendidas por la Policía Nacional Civil del 1 de enero al 12 de julio pasaron de 22,981 en 2025 a 26,955 en 2026. Fuente: PNC vía AGN.", "imagen": "tuit_5.png", "plantilla": "antes-despues", "fuente": "PNC · vía AGN · 1 ene–12 jul de 2025 y 2026", "cifra_ids": ["est-c10"]}, {"n": 6, "beat": "contexto", "texto": "En la primera semana cayeron 39 del Barrio 18 y 5 de la MS. De la Ley Antipandillas no hay cifra pública de procesados.", "caracteres": 119, "alt_text": "Cifra destacada: 83 pandilleros de alta peligrosidad puestos a disposición judicial al cierre del estado de sitio, del 18 de enero al 16 de febrero de 2026, con una barra de comparación de 44 capturados en la primera semana. Fuente: Presidencia y MINGOB vía prensa.", "imagen": "tuit_6.png", "plantilla": "cifra", "fuente": "Presidencia y MINGOB · vía prensa · estado de sitio 2026", "cifra_ids": ["est-c08", "est-c07"]}, {"n": 7, "beat": "contexto", "texto": "", "caracteres": 0, "alt_text": "Gráfico de dona con las 23,837 personas privadas de libertad del primer censo penitenciario (febrero de 2026): 2,545 pertenecen al Barrio 18 o a la MS-13 y 21,292 no. Fuente: MINGOB vía Emisoras Unidas.", "imagen": "tuit_7.png", "plantilla": "dona", "fuente": "MINGOB · vía Emisoras Unidas · censo penitenciario 2026", "cifra_ids": ["est-c14"]}, {"n": 8, "beat": "contexto", "texto": "Y sigue: el presupuesto vigente de 2026 y el proyecto para 2027 son aún mayores.", "caracteres": 80, "alt_text": "Gráfico de línea con el gasto ejecutado del Ministerio de Gobernación de 2008 a 2025, en millones de quetzales corrientes: de 2,323.6 en 2008 a 7,624.3 en 2025. Fuente: Minfin-Sicoin vía Guate en Datos.", "imagen": "tuit_8.png", "plantilla": "linea", "fuente": "Minfin-Sicoin · vía Guate en Datos · 2008–2025", "cifra_ids": ["est-c01"]}, {"n": 9, "beat": "contexto", "texto": "El dinero crece, pero las obras cuestan: desde 2015, solo en cuatro años Gobernación ejecutó más de la mitad de su inversión.", "caracteres": 125, "alt_text": "Barras verticales con el porcentaje de ejecución del presupuesto de inversión del Ministerio de Gobernación por año: 2015 7.4%, 2016 22.5%, 2017 24.4%, 2018 82.1%, 2019 50.1%, 2020 13.8%, 2021 16.8%, 2022 70.3%, 2023 79.8%, 2024 20.5% y 2025 49.2%. Fuente: Minfin-Sicoin vía Guate en Datos.", "imagen": "tuit_9.png", "plantilla": "barras-v", "fuente": "Minfin-Sicoin · vía Guate en Datos · 2015–2025", "cifra_ids": ["est-c03"]}, {"n": 10, "beat": "contexto", "texto": "De enero a agosto de 2026 hubo 11,126 denuncias de extorsión, frente a 18,325 en los mismos meses de 2025.", "caracteres": 106, "alt_text": "Gráfico de línea con las denuncias mensuales de extorsión ante la PNC de enero de 2025 a agosto de 2026, con el estado de sitio sombreado en enero y febrero de 2026: de 2,457 en enero de 2025 y un máximo de 2,712 en mayo de 2025 a 1,121 en agosto de 2026. Fuente: CIEN con datos de la PNC (PLADEIC).", "imagen": "tuit_10.png", "plantilla": "linea", "fuente": "CIEN · datos PNC (PLADEIC) · IDD agosto 2026", "cifra_ids": ["est-c04"]}, {"n": 11, "beat": "contexto", "texto": "Esa caída coincide con el estado de sitio. Que ocurran a la vez no prueba que una cosa cause la otra.", "caracteres": 101, "alt_text": "Barras verticales con los homicidios denunciados a la Policía Nacional Civil en enero y febrero: 504 en 2025 y 378 en 2026. Fuente: CIEN con datos de la PNC, boletín del Índice de Denuncias de Delitos de agosto de 2026.", "imagen": "tuit_11.png", "plantilla": "barras-v", "fuente": "CIEN · datos PNC · IDD agosto 2026", "cifra_ids": ["est-c06"]}, {"n": 12, "beat": "giro", "texto": "Aquí cambia la historia: mientras el Estado aprieta, la violencia también apunta contra la policía. No hay cifra oficial; es un recuento de EFE.", "caracteres": 144, "alt_text": "Barras verticales con los agentes de la Policía Nacional Civil asesinados: 10 en todo 2025 y 20 en 2026 hasta el 28 de julio. Fuente: recuento de EFE publicado por Emisoras Unidas.", "imagen": "tuit_12.png", "plantilla": "barras-v", "fuente": "EFE · vía Emisoras Unidas · recuento al 28 de julio de 2026", "cifra_ids": ["vle-c15"]}, {"n": 13, "beat": "impacto", "texto": "Dato de 2025, el último año completo: la violencia letal recae sobre todo en la edad de trabajar y formar una familia.", "caracteres": 118, "alt_text": "Gráfico de waffle de 100 cuadros: el 61.3% de las víctimas de homicidio de 2025 en Guatemala tenía entre 18 y 35 años. Fuente: Diálogos, Balance anual de la violencia 2025.", "imagen": "tuit_13.png", "plantilla": "waffle", "fuente": "Diálogos · Balance anual de la violencia 2025", "cifra_ids": ["vle-c13"]}, {"n": 14, "beat": "contexto", "texto": "Es el conteo forense del INACIF, independiente de las denuncias a la PNC. Son absolutos, no tasas: Guatemala también es el departamento más poblado.", "caracteres": 148, "alt_text": "Barras horizontales con las necropsias por herida de proyectil de arma de fuego practicadas por el INACIF en 2025 en los ocho departamentos con más casos: Guatemala 1,475, Escuintla 305, Petén 202, Chiquimula 159, Santa Rosa 117, Izabal 114, Zacapa 95 y Jutiapa 94. Total nacional: 3,105. Fuente: INACIF, estadísticas forenses.", "imagen": "tuit_14.png", "plantilla": "barras-h", "fuente": "INACIF · estadísticas forenses · 2025", "cifra_ids": ["vle-c16"]}, {"n": 15, "beat": "contexto", "texto": "Son pocos casos, pero muestran una violencia que no se mide en decomisos ni en capturas.", "caracteres": 88, "alt_text": "Tarjeta antes y después: los homicidios por linchamiento en Guatemala pasaron de 10 en 2024 a 24 en 2025. Fuente: Diálogos, Balance anual de la violencia 2025.", "imagen": "tuit_15.png", "plantilla": "antes-despues", "fuente": "Diálogos · Balance anual de la violencia 2025", "cifra_ids": ["vle-c14"]}, {"n": 16, "beat": "contexto", "texto": "Capturar no es condenar. El dato es de 2024: mide la justicia que hereda la ofensiva, no su resultado.", "caracteres": 102, "alt_text": "Tarjeta antes y después: de los casos de homicidio simple y calificado concluidos por el Ministerio Público, los que terminaron en sentencia bajaron de 13% en 2014 a 4% en 2024. Fuente: CIEN, boletín Respuesta institucional.", "imagen": "tuit_16.png", "plantilla": "antes-despues", "fuente": "CIEN · datos del MP · 2014 y 2024", "cifra_ids": ["est-c15"]}, {"n": 17, "beat": "contexto", "texto": "La tasa nacional de femicidio es 2.6 por cada 100 mil mujeres; en Chiquimula, 12.5.", "caracteres": 83, "alt_text": "Gráfico de línea con las víctimas registradas por el Ministerio Público de 2019 a 2025: los femicidios pasan de 166 en 2019 a 206 en 2025, el valor más alto del periodo; las otras muertes violentas de mujeres pasan de 651 a 441. Fuente: CIEN con datos del MP.", "imagen": "tuit_17.png", "plantilla": "linea", "fuente": "CIEN · datos del MP · 2019–2025", "cifra_ids": ["vul-c01", "vul-c02"]}, {"n": 18, "beat": "impacto", "texto": "Desde 2010, 4,730 alertas Alba-Keneth siguen activas: menores que no han sido localizados. Con mujeres (Isabel-Claudina), 546.", "caracteres": 126, "alt_text": "Cifra destacada: 18.1 alertas Alba-Keneth por desaparición o sustracción de niñas, niños y adolescentes al día en 2025, promedio del 1 de enero al 10 de diciembre (6,229 alertas). Fuente: PGN, Sistema Alba-Keneth.", "imagen": "tuit_18.png", "plantilla": "cifra", "fuente": "PGN · Sistema de Alerta Alba-Keneth · 2025", "cifra_ids": ["vul-c10", "vul-c09"]}, {"n": 19, "beat": "contexto", "texto": "Una medición externa, que no depende de los resultados que reporta el Gobierno.", "caracteres": 79, "alt_text": "Gráfico de pendiente del Índice Global de Crimen Organizado para Guatemala, escala de 0 a 10: el puntaje de criminalidad sube de 6.48 en 2021 a 6.77 en 2025 y el de resiliencia del Estado baja de 4.42 a 4.00. Fuente: GI-TOC.", "imagen": "tuit_19.png", "plantilla": "pendiente", "fuente": "GI-TOC · Global Organized Crime Index 2021–2025", "cifra_ids": ["nar-c11", "nar-c12"]}, {"n": 20, "beat": "cierre", "texto": "Más decomisos, capturas y gasto; menos denuncias. Pero el doble de policías asesinados y pocos casos con sentencia.\n\nFuentes: PNC, Presidencia y MINGOB, Minfin-Sicoin, CIEN, MP, GI-TOC, Diálogos, INACIF, PGN y EFE (vía AGN, Emisoras Unidas, Guate en Datos y prensa).", "caracteres": 266, "alt_text": "Tuit de cierre sin imagen: resume el hilo y enumera las fuentes.", "imagen": null, "plantilla": null, "fuente": null, "cifra_ids": []}], "no_afirma": ["No afirma que el estado de sitio o la Ley Antipandillas causaran la baja de denuncias de extorsión u homicidio: solo coinciden en el tiempo (la extorsión ya bajaba desde mediados de 2025).", "No afirma que los homicidios de todo 2026 bajen: el dato de homicidios denunciados de 2026 cubre solo enero y febrero.", "No afirma que haya menos extorsiones: se miden denuncias ante la PNC y muchas víctimas no denuncian.", "No afirma que circule menos cocaína: los decomisos dependen de cargamentos puntuales y no hay estimación del flujo que transita por Guatemala.", "No presenta como oficial el número de policías asesinados (es un recuento de EFE) ni afirma que el gasto de Gobernación creciera en términos reales (quetzales corrientes)."], "incertidumbre": ["Todas las cifras usadas tienen segunda fuente no independiente (reproduce la primaria), incluida la ancla nar-c02 (PNC vía AGN): verifican el número, no lo respaldan de forma independiente.", "La serie anual de cocaína (nar-c01) se arma con comunicados oficiales reproducidos por prensa; 2022 tiene versiones en conflicto y no hay segunda fuente independiente.", "Los periodos de comparación difieren entre tarjetas (ene–feb, ene–may, ene–jun, 1 ene–12 jul, ene–ago 2026) según el último corte publicado por cada fuente.", "No hay homicidios de 2026 verificados más allá de enero–febrero (est-c06); las tarjetas de violencia letal usan 2025 (INACIF, Diálogos) y el recuento de EFE de policías asesinados.", "Las necropsias por arma de fuego por departamento (vle-c16) son absolutos, no tasas; el dato de sentencias (est-c15) es de 2024, anterior a la ofensiva de 2025–2026.", "nar-c02 (ancla): los 8,402.4 kg de enero–junio de 2026 están confirmados, pero la cifra de 2026 se atribuye a 'fuerzas de seguridad' y la base de 2025 (1,596.2 kg) es de la PNC; otras instituciones dan conteos distintos y no hay segunda fuente independiente. El salto descansa en buena parte en un solo decomiso de 4.9 toneladas.", "nar-c03: el 66.7% es cálculo propio sobre el acumulado oficial al 28 de mayo de 2026 (7,342 kg), base que declara la nota de la tarjeta; sobre el semestre completo (8,402.4 kg) el mismo cargamento es el 58.3%, es decir, más de la mitad.", "vul-c01: los 206 femicidios de 2025 son la serie de CIEN con datos del MP (delito de femicidio tipificado); no hay segunda fuente independiente para 2025 y las series de prensa de 2023–2024 discrepan según la definición usada.", "vul-c02: las 441 otras muertes violentas de mujeres de 2025 excluyen los femicidios (total 647); no es comparable con otras series de muertes violentas de mujeres ni con proporciones calculadas sobre otros totales. Sin segunda fuente independiente.", "vul-c09: las 6,229 alertas Alba-Keneth de 2025 son un corte parcial al 10 de diciembre, no el cierre anual; no se comparan con las 6,970 de 2024 como una caída (el corte de septiembre, 4,940, es coherente con la serie).", "vul-c10: 18.1 alertas al día = 6,229 alertas / 344 días (1 de enero al 10 de diciembre de 2025), promedio sobre un periodo parcial; una alerta activada no equivale a un menor que siga desaparecido (la mayoría se desactiva al localizarlo)."], "fuentes": ["PNC · vía AGN · primer semestre 2025 y 2026", "GI-TOC · Global Organized Crime Index 2025", "MINGOB · cifras oficiales vía prensa · 2016–2025", "MINGOB · vía AGN, cálculo propio · 2026", "PNC · vía AGN · 1 ene–12 jul de 2025 y 2026", "Presidencia y MINGOB · vía prensa · estado de sitio 2026", "MINGOB · vía Emisoras Unidas · censo penitenciario 2026", "Minfin-Sicoin · vía Guate en Datos · 2008–2025", "Minfin-Sicoin · vía Guate en Datos · 2015–2025", "CIEN · datos PNC (PLADEIC) · IDD agosto 2026", "CIEN · datos PNC · IDD agosto 2026", "EFE · vía Emisoras Unidas · recuento al 28 de julio de 2026", "Diálogos · Balance anual de la violencia 2025 function pesoX(texto) {

  var reUrl = /https?:\/\/\S+|www\.\S+|(?<![\p{L}\p{N}\p{M}_])[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|gt|org|net|io|edu|gov|mx|sv|hn|es|info|co)(\/\S*)?/giu;
  var rangos1 = [[0, 4351], [8192, 8205], [8208, 8223], [8242, 8247]];
  var pesoCp = function (cp) {
    for (var k = 0; k < rangos1.length; k++) if (cp >= rangos1[k][0] && cp <= rangos1[k][1]) return 1;
    return 2;
  };
  var esTono = function (cp) { return cp >= 0x1f3fb && cp <= 0x1f3ff; };
  var esRegional = function (cp) { return cp >= 0x1f1e6 && cp <= 0x1f1ff; };
  var pesoPlano = function (s) {
    var cps = Array.from(s, function (c) { return c.codePointAt(0); });
    var i = 0, n = cps.length, total = 0;
    while (i < n) {
      var j = i + 1;
      if (esRegional(cps[i]) && j < n && esRegional(cps[j])) j += 1; // bandera
      while (j < n) {
        if (cps[j] === 0xfe0f || cps[j] === 0x20e3 || esTono(cps[j])) j += 1;
        else if (cps[j] === 0x200d && j + 1 < n) j += 2; // ZWJ + siguiente
        else break;
      }
      total += j - i > 1 ? 2 : pesoCp(cps[i]);
      i = j;
    }
    return total;
  };
  var total = 0, pos = 0, m;
  while ((m = reUrl.exec(t)) !== null) {
    total += pesoPlano(t.slice(pos, m.index)) + 23;
    pos = m.index + m[0].length;
    if (m[0].length === 0) reUrl.lastIndex++;
  }
  return total + pesoPlano(t.slice(pos));
}
</script>
<script>
(() => {
  const H = JSON.parse(document.getElementById("hilo-json").textContent);
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const toast = (m) => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1400); };
  const copiar = async (txt) => {
    try { await navigator.clipboard.writeText(txt); toast("Copiado"); return; } catch (e) { /* fallback */ }
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copiado"); } catch (e) { toast("No se pudo copiar"); }
    ta.remove();
  };
  if (!H) { app.innerHTML = "<p>Sin datos: este archivo lo genera scripts/ensamblar.py.</p>"; return; }

  let html = `<header>
    <h1>${esc(H.tema)}</h1>
    <div class="meta"><span class="chip">${esc(H.paleta)}</span><span>${esc(H.fecha)}</span>${H.modo && H.modo !== "hilo" ? `<span class="chip" style="background:#e9e3d6;color:#0C1520">modo: ${esc(H.modo)}</span>` : ""}<span>${H.n_tuits} tuits · ${H.tuits.filter((t) => t.imagen).length} imágenes</span><span>gate mecánico: ${esc(H.gate_mecanico)}</span></div>
    ${H.tesis ? `<p class="tesis"><b>Tesis:</b> ${esc(H.tesis)}</p>` : ""}
    ${H.modo && H.modo !== "hilo" && H[H.modo] ? `<div class="meta" style="margin-top:8px;display:block"><b>modo ${esc(H.modo)}:</b> ${Object.entries(H[H.modo]).map(([k, v]) => Array.isArray(v) && v.length && typeof v[0] === "object" ? `<div>${esc(k)}: ${v.map((x) => Object.values(x).map(esc).join(" · ")).join(" | ")}</div>` : `<span style="margin-right:14px">${esc(k)}: ${esc(Array.isArray(v) ? v.join(", ") : v)}</span>`).join("")}</div>` : ""}
  </header>
  <div class="contacto" id="contacto" hidden>
    <a href="contacto.png" target="_blank" rel="noopener">Ver hoja de contacto</a>
    <img src="contacto.png" alt="Hoja de contacto: todas las tarjetas del hilo" onload="this.parentNode.hidden=false" onerror="this.parentNode.remove()">
  </div>`;
  for (const t of H.tuits) {
    const vacio = !t.texto.trim();
    const peso = pesoX(t.texto);
    html += `<article class="tuit" id="t${t.n}">
      <div class="cab"><span class="n">Tuit ${t.n}/${H.n_tuits}</span><span class="chip" style="background:#e9e3d6;color:#0C1520">${esc(t.beat || "")}</span>${t.plantilla ? `<span>tarjeta: ${esc(t.plantilla)}</span>` : "<span>sin imagen</span>"}</div>
      <div class="texto${vacio ? " vacio" : ""}">${vacio ? "(sin texto: la imagen lo dice)" : esc(t.texto)}</div>
      <div class="fila"><span class="cnt${peso > 280 ? " alerta" : ""}">${peso}/280 (peso X${peso !== t.caracteres ? `, ${t.caracteres} caracteres` : ""})</span>${vacio ? "" : `<button data-copy="${esc(t.texto)}">Copiar texto</button>`}</div>
      ${t.imagen ? `<div class="img"><img src="${esc(t.imagen)}" alt="${esc(t.alt_text)}"></div>
      <div class="alt"><b>Alt:</b> ${esc(t.alt_text)} <button data-copy="${esc(t.alt_text)}">Copiar alt</button></div>
      <div class="fuente">Fuente en el pie: ${esc(t.fuente || "")} · cifras: ${esc((t.cifra_ids || []).join(", "))}</div>` : ""}
    </article>`;
  }
  html += `<section class="extra">
    <h2>Lo que este hilo NO afirma</h2><ul>${(H.no_afirma || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Incertidumbre declarada</h2><ul>${(H.incertidumbre || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Fuentes</h2><ul>${(H.fuentes || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <p style="color:var(--gris);font-size:13px">Detalle de cifras y veredictos en <code>datos.json</code>; texto listo para pegar en <code>post.md</code>.</p>
  </section>`;
  app.innerHTML = html;
  app.addEventListener("click", (e) => { const b = e.target.closest("button[data-copy]"); if (b) copiar(b.getAttribute("data-copy")); });
})();
</script>
</body>
</html>
