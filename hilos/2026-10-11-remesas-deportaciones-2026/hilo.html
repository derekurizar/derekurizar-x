<style>
  :root { --papel:#F6F2E8; --tinta:#0C1520; --gris:#5c6470; --linea:rgba(12,21,32,.14); --acento:#4B92DB; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { font: 700 30px/1.15 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  header .meta { color: var(--gris); font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--tinta); color: var(--papel); }
  .tesis { margin: 18px 0 0; padding: 14px 18px; border-left: 4px solid var(--acento); background: rgba(75,146,219,.08); font-size: 17px; }
  .contacto { margin-top: 18px; }
  .contacto a { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--acento); }
  .contacto img { width: 100%; max-width: 760px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .tuit { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--linea); }
  .tuit .cab { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--gris); }
  .tuit .cab .n { font-weight: 800; font-size: 15px; color: var(--tinta); }
  .texto { position: relative; margin-top: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--linea); border-radius: 10px; white-space: pre-wrap; font-size: 17px; }
  .texto.vacio { color: var(--gris); font-style: italic; }
  .fila { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--gris); }
  .fila .cnt.alerta { color: #B23A26; font-weight: 700; }
  button { font: 600 13px/1 system-ui, sans-serif; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); cursor: pointer; }
  button:hover { background: var(--tinta); color: var(--papel); }
  .img { margin-top: 14px; }
  .img img { width: 100%; max-width: 560px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .alt { margin-top: 10px; font-size: 14px; color: var(--gris); }
  .alt b { color: var(--tinta); }
  .fuente { margin-top: 6px; font-size: 13px; color: var(--gris); }
  section.extra { margin-top: 44px; padding-top: 24px; border-top: 2px solid var(--tinta); }
  section.extra h2 { font: 700 18px/1.2 system-ui, sans-serif; margin: 22px 0 8px; }
  section.extra ul { margin: 0; padding-left: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>

<script id="hilo-json" type="application/json">{"slug": "remesas-deportaciones-2026", "fecha": "2026-10-11", "tema": "Remesas y deportaciones en 2026: más guatemaltecos retornados desde EE.UU. y México y, aun así, remesas en récord", "tesis": "De enero a septiembre de 2026 volvieron 53,373 guatemaltecos retornados, 45% más que en 2025 pero menos que en 2022-2024, mientras las remesas marcaron récord mensual en julio (US$2,468.6 millones) y su crecimiento se frenó a 5.5%, el menor desde 2020.", "paleta": "cielo", "hook_tipo": "giro_inversion", "pregunta": "Si en 2026 Guatemala recibe muchos más deportados que en 2025, ¿por qué las remesas siguen en récord y cuánto pesan en los hogares?", "n_tuits": 11, "estado": "listo", "tuits": [{"n": 1, "beat": "gancho", "texto": "Este año Guatemala recibe muchos más deportados que el año pasado.\nPero las remesas no han caído: siguen por encima de las del año pasado.\n\nDos curvas que parecen chocar. Esto dicen los datos del IGM y del Banguat:", "caracteres": 214, "alt_text": "Gráfico antes y después. Personas guatemaltecas retornadas desde Estados Unidos y México de enero a septiembre: 36,800 en 2025 y 53,373 en 2026, un aumento de 45%. Fuente: Instituto Guatemalteco de Migración (IGM).", "imagen": "tuit_1.png", "plantilla": "antes-despues", "fuente": "IGM · retornados enero-septiembre 2025 y 2026", "cifra_ids": ["ret-c01"]}, {"n": 2, "beat": "contexto", "texto": "El primer semestre fue estable; el salto llegó a mitad de año y desde entonces se ha mantenido arriba.", "caracteres": 102, "alt_text": "Gráfico de línea con los retornados guatemaltecos por mes desde Estados Unidos y México, de enero de 2024 a septiembre de 2026. La serie baja de 9,201 en enero de 2024 a un mínimo de 2,839 en abril de 2025 y repunta a 7,463 en julio de 2026, el mes más alto desde febrero de 2024; septiembre de 2026 cierra en 7,179. Fuente: IGM.", "imagen": "tuit_2.png", "plantilla": "linea", "fuente": "IGM · retornados por mes, 2024-2026", "cifra_ids" ", "texto": "Para esas familias, un mes flojo de remesas no es una estadística: es el gasto de la casa.", "caracteres": 90, "alt_text": "Gráfico de barras horizontales con los hogares receptores de remesas según la parte de sus gastos que cubren las remesas, 2022: cubren todo el gasto 24.4%; la mitad 26.7%; 40% del gasto 8.1%; una cuarta parte 13.4%; 10% del gasto 15.0%; no dependen 5.3%. Fuente: OIM, Encuesta de Migración y Remesas 2022.", "imagen": "tuit_10.png", "plantilla": "barras-h", "fuente": "OIM · Encuesta de Migración y Remesas 2022", "cifra_ids": ["hog-c05"]}, {"n": 11, "beat": "cierre", "texto": "En resumen: los retornos suben frente a un 2025 bajo, sin llegar a los de 2024, y las remesas siguen altas pero crecen menos. Los datos muestran que coinciden, no que una cosa cause la otra.\n\nFuentes: IGM, Banguat, OIM, INE.", "caracteres": 224, "alt_text": "Tuit de cierre sin imagen: resumen del hilo y fuentes (IGM, Banguat, OIM, INE).", "imagen": null, "plantilla": null, "fuente": null, "cifra_ids": []}], "no_afirma": ["No afirma que las deportaciones causen (ni que no causen) cambios en las remesas: solo coinciden en el tiempo.", "No afirma que 2026 sea un año récord de deportaciones: en enero-septiembre está por debajo de 2022, 2023 y 2024.", "No afirma que el número de hogares receptores siga siendo el de 2022: el promedio por hogar lo supone constante.", "No afirma ningún efecto del impuesto de 1% de EE.UU. a las remesas en efectivo: no hay cifra oficial confirmada.", "No atribuye el repunte de retornos a una política concreta de EE.UU.: las bases del IGM no registran causas."], "incertidumbre": ["Todas las cifras usadas tienen segunda fuente que reproduce la primaria (IGM, Banguat, OIM, INE); sin verificación independiente. La ancla (ret-c01, ene-sep 2026) no se halló en prensa; solo ene-ago (46,194) tiene confirmación de EFE/Emisoras Unidas.", "La escala de hogares es de la encuesta OIM 2022; el promedio US$ por hogar 2026 supone hogares receptores constantes.", "La proporción de población en hogares receptores (37.8%) es cálculo propio con población estimada INE 2022.", "Octubre 2026 en adelante no publicado: no hay total anual 2026 de remesas ni de retornados; la proyección Banguat (rem-c08) solo se menciona en texto."], "fuentes": ["IGM · retornados enero-septiembre 2025 y 2026", "IGM · retornados por mes, 2024-2026", "IGM · retornados por país, enero-septiembre", "IGM · retornados enero-septiembre, 2020-2026", "IGM · retornados por departamento, enero-septiembre 2026", "Banguat · ingreso de divisas por remesas familiares", "Banguat · remesas familiares, variación acumulada", "OIM · Encuesta de Migración y Remesas 2022; INE", "Banguat · remesas; OIM · Encuesta de Migración y Remesas 2022", "OIM · Encuesta de Migración y Remesas 2022"], "fuentes_cifras": ["Banco de Guatemala (Banguat), Cuadro 1 Ingreso de Divisas por Remesas Familiares", "Banco de Guatemala (Banguat), Cuadro 2 Variaciones porcentuales acumuladas", "Cálculo propio con Banguat, Cuadro 1 Ingreso de divisas por remesas familiares (remfam2002_2026) y OIM 2022 (hogares receptores)", "Cálculo propio con OIM 2022 (6,555,944 beneficiarios) y población estimada 2022 del INE citada por la misma OIM (17,357,886)", "Instituto Guatemalteco de Migración (IGM), base de datos de personas guatemaltecas retornadas (bases 2024, 2025 y ene-sep 2026)", "Instituto Guatemalteco de Migración (IGM), base de datos de personas guatemaltecas retornadas (bases anuales 2020-2026)", "Instituto Guatemalteco de Migración (IGM), base de datos de personas guatemaltecas retornadas (ene-sep 2026 y ene-dic 2025)", "Instituto Guatemalteco de Migración (IGM), base de datos de personas guatemaltecas retornadas (ene-sep 2026, datos por departamento)", "Instituto Guatemalteco de Migración (IGM), base de datos de personas guatemaltecas retornadas (microdatos 2024, 2025 y 2026)", "OIM, Encuesta sobre migración internacional de personas guatemaltecas y remesas 2022 (resumen)", "OIM, Encuesta sobre migración internacional de personas guatemaltecas y remesas 2022 (resumen), Tabla 4"], "gate_mecanico": "ok", "contacto": "contacto.png"}</script>
<script>
/* Peso según X: copia literal de scripts/contar_x.js (pesoX). No editar aquí; regenerar desde el script. */
function pesoX(texto) {
  // Reglas: NFC; cada URL pesa 23; puntos de código en 0–4351, 8192–8205,
  // 8208–8223 y 8242–8247 pesan 1; el resto 2; los emoji compuestos
  // (FE0F, ZWJ+siguiente, tono 1F3FB–1F3FF, keycap 20E3, par regional) son uno y pesan 2.
  var t = String(texto == null ? "" : texto).normalize("NFC");
  var reUrl = /https?:\/\/\S+|www\.\S+|(?<![\p{L}\p{N}\p{M}_])[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|gt|org|net|io|edu|gov|mx|sv|hn|es|info|co)(\/\S*)?/giu;
  var rangos1 = [[0, 4351], [8192, 8205], [8208, 8223], [8242, 8247]];
  var pesoCp = function (cp) {
    for (var k = 0; k < rangos1.length; k++) if (cp >= rangos1[k][0] && cp <= rangos1[k][1]) return 1;
    return 2;
  };
  var esTono = function (cp) { return cp >= 0x1f3fb && cp <= 0x1f3ff; };
  var esRegional = function (cp) { return cp >= 0x1f1e6 && cp <= 0x1f1ff; };
  var pesoPlano = function (s) {
    var cps = Array.from(s, function (c) { return c.codePointAt(0); });
    var i = 0, n = cps.length, total = 0;
    while (i < n) {
      var j = i + 1;
      if (esRegional(cps[i]) && j < n && esRegional(cps[j])) j += 1; // bandera
      while (j < n) {
        if (cps[j] === 0xfe0f || cps[j] === 0x20e3 || esTono(cps[j])) j += 1;
        else if (cps[j] === 0x200d && j + 1 < n) j += 2; // ZWJ + siguiente
        else break;
      }
      total += j - i > 1 ? 2 : pesoCp(cps[i]);
      i = j;
    }
    return total;
  };
  var total = 0, pos = 0, m;
  while ((m = reUrl.exec(t)) !== null) {
    total += pesoPlano(t.slice(pos, m.index)) + 23;
    pos = m.index + m[0].length;
    if (m[0].length === 0) reUrl.lastIndex++;
  }
  return total + pesoPlano(t.slice(pos));
}
</script>
<script>
(() => {
  const H = JSON.parse(document.getElementById("hilo-json").textContent);
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const toast = (m) => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1400); };
  const copiar = async (txt) => {
    try { await navigator.clipboard.writeText(txt); toast("Copiado"); return; } catch (e) { /* fallback */ }
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copiado"); } catch (e) { toast("No se pudo copiar"); }
    ta.remove();
  };
  if (!H) { app.innerHTML = "<p>Sin datos: este archivo lo genera scripts/ensamblar.py.</p>"; return; }

  let html = `<header>
    <h1>${esc(H.tema)}</h1>
    <div class="meta"><span class="chip">${esc(H.paleta)}</span><span>${esc(H.fecha)}</span><span>${H.n_tuits} tuits · ${H.tuits.filter((t) => t.imagen).length} imágenes</span><span>gate mecánico: ${esc(H.gate_mecanico)}</span></div>
    ${H.tesis ? `<p class="tesis"><b>Tesis:</b> ${esc(H.tesis)}</p>` : ""}
  </header>
  <div class="contacto" id="contacto" hidden>
    <a href="contacto.png" target="_blank" rel="noopener">Ver hoja de contacto</a>
    <img src="contacto.png" alt="Hoja de contacto: todas las tarjetas del hilo" onload="this.parentNode.hidden=false" onerror="this.parentNode.remove()">
  </div>`;
  for (const t of H.tuits) {
    const vacio = !t.texto.trim();
    const peso = pesoX(t.texto);
    html += `<article class="tuit" id="t${t.n}">
      <div class="cab"><span class="n">Tuit ${t.n}/${H.n_tuits}</span><span class="chip" style="background:#e9e3d6;color:#0C1520">${esc(t.beat || "")}</span>${t.plantilla ? `<span>tarjeta: ${esc(t.plantilla)}</span>` : "<span>sin imagen</span>"}</div>
      <div class="texto${vacio ? " vacio" : ""}">${vacio ? "(sin texto: la imagen lo dice)" : esc(t.texto)}</div>
      <div class="fila"><span class="cnt${peso > 280 ? " alerta" : ""}">${peso}/280 (peso X${peso !== t.caracteres ? `, ${t.caracteres} caracteres` : ""})</span>${vacio ? "" : `<button data-copy="${esc(t.texto)}">Copiar texto</button>`}</div>
      ${t.imagen ? `<div class="img"><img src="${esc(t.imagen)}" alt="${esc(t.alt_text)}"></div>
      <div class="alt"><b>Alt:</b> ${esc(t.alt_text)} <button data-copy="${esc(t.alt_text)}">Copiar alt</button></div>
      <div class="fuente">Fuente en el pie: ${esc(t.fuente || "")} · cifras: ${esc((t.cifra_ids || []).join(", "))}</div>` : ""}
    </article>`;
  }
  html += `<section class="extra">
    <h2>Lo que este hilo NO afirma</h2><ul>${(H.no_afirma || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Incertidumbre declarada</h2><ul>${(H.incertidumbre || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Fuentes</h2><ul>${(H.fuentes || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <p style="color:var(--gris);font-size:13px">Detalle de cifras y veredictos en <code>datos.json</code>; texto listo para pegar en <code>post.md</code>.</p>
  </section>`;
  app.innerHTML = html;
  app.addEventListener("click", (e) => { const b = e.target.closest("button[data-copy]"); if (b) copiar(b.getAttribute("data-copy")); });
})();
</script>
