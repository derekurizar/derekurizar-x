<style>
  :root { --papel:#F6F2E8; --tinta:#0C1520; --gris:#5c6470; --linea:rgba(12,21,32,.14); --acento:#4B92DB; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { font: 700 30px/1.15 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  header .meta { color: var(--gris); font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--tinta); color: var(--papel); }
  .tesis { margin: 18px 0 0; padding: 14px 18px; border-left: 4px solid var(--acento); background: rgba(75,146,219,.08); font-size: 17px; }
  .contacto { margin-top: 18px; }
  .contacto a { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--acento); }
  .contacto img { width: 100%; max-width: 760px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .tuit { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--linea); }
  .tuit .cab { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--gris); }
  .tuit .cab .n { font-weight: 800; font-size: 15px; color: var(--tinta); }
  .texto { position: relative; margin-top: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--linea); border-radius: 10px; white-space: pre-wrap; font-size: 17px; }
  .texto.vacio { color: var(--gris); font-style: italic; }
  .fila { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--gris); }
  .fila .cnt.alerta { color: #B23A26; font-weight: 700; }
  button { font: 600 13px/1 system-ui, sans-serif; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); cursor: pointer; }
  button:hover { background: var(--tinta); color: var(--papel); }
  .img { margin-top: 14px; }
  .img img { width: 100%; max-width: 560px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .alt { margin-top: 10px; font-size: 14px; color: var(--gris); }
  .alt b { color: var(--tinta); }
  .fuente { margin-top: 6px; font-size: 13px; color: var(--gris); }
  section.extra { margin-top: 44px; padding-top: 24px; border-top: 2px solid var(--tinta); }
  section.extra h2 { font: 700 18px/1.2 system-ui, sans-serif; margin: 22px 0 8px; }
  section.extra ul { margin: 0; padding-left: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>

<script id="hilo-json" type="application/json">{"slug": "economia-tres-gobiernos", "fecha": "2026-09-29", "tema": "Métricas económicas de Guatemala 2016–2026 para comparar el desempeño del gobierno de Arévalo (desde enero 2024) con los de Morales (2016–2019) y Giammattei (2020–2023): PIB, inflación, tipo de cambio, remesas, exportaciones, IED, reservas, deuda, déficit, recaudación, empleo formal IGSS, salario mínimo y calificación crediticia", "tesis": "Con Arévalo el PIB real crece 4% promedio al año (2024–2025), por encima de Morales (3.3%) y Giammattei (3.48%), pero sin la caída de 2020 Giammattei promediaría 5.24%; el cambio más grande de la década son las remesas, que desde 2020 superan a las exportaciones y no las decide ningún gobierno.", "paleta": "cielo", "hook_tipo": "pregunta_directa", "pregunta": "Medida con las mismas series oficiales y por promedios de periodo, ¿le va a la economía guatemalteca mejor con Arévalo (2024–2026) que con Morales (2016–2019) y Giammattei (2020–2023), y cuánto depende de motores externos como las remesas?", "n_tuits": 18, "estado": "listo", "tuits": [{"n": 1, "beat": "gancho", "texto": "¿Con qué gobierno le fue mejor a la economía de Guatemala?\n\nComparé a Morales, Giammattei y Arévalo con las mismas series oficiales. El marcador cambia si quitas un solo año, y el flujo que rebasó a las exportaciones no lo decide ningún presidente. 🧵", "caracteres": 251, "alt_text": "Gráfico de barras verticales del crecimiento real promedio anual del PIB de Guatemala por gobierno: Morales (2016–2019) 3.30%, Giammattei (2020–2023) 3.48% y Arévalo (2024–2025) 4.00%, la barra destacada. Promedio simple de la variación anual. Fuente: Banco de Guatemala, cuentas nacionales base 2013.", "imagen": "tuit_1.png", "plantilla": "barras-v", "fuente": "Banguat · cuentas nacionales, base 2013", "cifra_ids": ["mac-c02"]}, {"n": 2, "beat": "contexto", "texto": "Un promedio de cuatro años se mueve mucho con un solo dato: la caída y el rebote de la pandemia cayeron en el mismo gobierno.", "caracteres": 125, "alt_text": "Gráfico de línea de la variación anual del PIB real de Guatemala, 2016 a 2025: 2.7, 3.1, 3.4, 4.0, -1.8 (2020, marcado como pandemia), 8.0, 4.2, 3.5, 3.7 y 4.3%. Nota: sin 2020, Giammattei promedia 5.24% al año, más que el 4% de Arévalo. Fuente: Banco de Guatemala, cuentas nacionales.", "imagen": "tuit_2.png", "plantilla": "linea", "fuente": "Banguat · cuentas nacionales, base 2013", "cifra_ids": ["mac-c01", "mac-c02"]}, {"n": 3, "beat": "giro", "texto": "Aquí cambia la lectura del marcador. Ningún gobierno decide las remesas: las envían familiares desde fuera. Y crecieron más que lo exportado con los tres presidentes.", "caracteres": 166, "alt_text": "Gráfico de dos líneas, 2016 a 2025, en millones de US$. Remesas familiares (destacada): de 7,160 en 2016 a 25,530.2 en 2025. Exportaciones FOB: de 10,449.3 a 15,592.4. Las remesas superan a las exportaciones desde 2020 (11,340.4 frente a 11,101.2). Fuente: Banco de Guatemala.", "imagen": "tuit_3.png", "plantilla": "linea", "fuente": "Banguat · remesas familiares y comercio exterior", "cifra_ids": ["ext-c01", "ext-c04"]}, {"n": 4, "beat": "contexto", "texto": "El Banco Mundial aún no publica 2025, año en que las remesas volvieron a crecer a doble dígito.", "caracteres": 95, "alt_text": "Gráfico de barras verticales de las remesas personales como porcentaje del PIB de Guatemala: 11.1% en 2016, 13.8% en 2019, 19.2% en 2023 y 19.1% en 2024 (destacada). Fuente: Banco Mundial, WDI.", "imagen": "tuit_4.png", "plantilla": "barras-v", "fuente": "Banco Mundial · WDI, remesas personales % del PIB", "cifra_ids": ["ext-c09"]}, {"n": 5, "beat": "impacto", "texto": "Es la encuesta más reciente de la OIM. Para esas familias, buena parte del marcador económico se juega fuera del país.", "caracteres": 118, "alt_text": "Gráfico de waffle de 100 cuadros: 24.4% de los hogares que reciben remesas en Guatemala dependen por completo de ellas; el resto combina remesas con otros ingresos. Base: 1,748,040 hogares receptores. Fuente: OIM, Encuesta sobre migración internacional y remesas 2022.", "imagen": "tuit_5.png", "plantilla": "waffle", "fuente": "OIM · Encuesta de migración y remesas 2022", "cifra_ids": ["emp-c11", "emp-c10"]}, {"n": 6, "beat": "contexto", "texto": "Ojo: en dólares corrientes se mezclan crecimiento real, inflación y tipo de cambio. No es el ingreso real de los hogares.", "caracteres": 121, "alt_text": "Gráfico de línea del PIB por habitante de Guatemala en US$ corrientes, 2016 a 2025: de 4,172.12 a 6,820.44; solo cae en 2020 (4,609.81 frente a 4,646.81 en 2019). Crecimiento promedio anual en US$: Morales 3.88%, Giammattei 6.34%, Arévalo 7.3%. Fuente: Banco de Guatemala, cuentas nacionales.", "imagen": "tuit_6.png", "plantilla": "linea", "fuente": "Banguat · cuentas nacionales", "cifra_ids": ["mac-c09", "mac-c10"]}, {"n": 7, "beat": "contexto", "texto": "El último dato, agosto de 2026, marca 3.37% interanual: repunta, pero sigue lejos de aquel pico.", "caracteres": 96, "alt_text": "Gráfico de barras verticales de la inflación interanual a diciembre en Guatemala, 2016 a 2025: 4.23, 5.68, 2.31, 3.41, 4.82, 3.07, 9.24 (pico de 2022), 4.18, 1.70 y 1.65% (destacada). Los dos cierres más bajos son 2024 y 2025. Fuente: INE, publicado por Banco de Guatemala.", "imagen": "tuit_7.png", "plantilla": "barras-v", "fuente": "INE · IPC, publicado por Banguat", "cifra_ids": ["mac-c04"]}, {"n": 8, "beat": "contexto", "texto": "Entre enero y agosto de 2026 el promedio sigue en la misma franja.", "caracteres": 66, "alt_text": "Gráfico de línea del tipo de cambio promedio anual en quetzales por US dólar, 2016 a 2025, con eje que no parte de cero: 7.58, 7.33 (mínimo, 2017), 7.52, 7.68, 7.71, 7.71, 7.74, 7.81 (máximo, 2023), 7.73 y 7.66. Fuente: Banco de Guatemala, Mercado Institucional de Divisas.", "imagen": "tuit_8.png", "plantilla": "linea", "fuente": "Banguat · Mercado Institucional de Divisas", "cifra_ids": ["mac-c07"]}, {"n": 9, "beat": "   // Reglas: NFC; cada URL pesa 23; puntos de código en 0–4351, 8192–8205,
  // 8208–8223 y 8242–8247 pesan 1; el resto 2; los emoji compuestos
  // (FE0F, ZWJ+siguiente, tono 1F3FB–1F3FF, keycap 20E3, par regional) son uno y pesan 2.
  var t = String(texto == null ? "" : texto).normalize("NFC");
  var reUrl = /https?:\/\/\S+|www\.\S+|(?<![\p{L}\p{N}\p{M}_])[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|gt|org|net|io|edu|gov|mx|sv|hn|es|info|co)(\/\S*)?/giu;
  var rangos1 = [[0, 4351], [8192, 8205], [8208, 8223], [8242, 8247]];
  var pesoCp = function (cp) {
    for (var k = 0; k < rangos1.length; k++) if (cp >= rangos1[k][0] && cp <= rangos1[k][1]) return 1;
    return 2;
  };
  var esTono = function (cp) { return cp >= 0x1f3fb && cp <= 0x1f3ff; };
  var esRegional = function (cp) { return cp >= 0x1f1e6 && cp <= 0x1f1ff; };
  var pesoPlano = function (s) {
    var cps = Array.from(s, function (c) { return c.codePointAt(0); });
    var i = 0, n = cps.length, total = 0;
    while (i < n) {
      var j = i + 1;
      if (esRegional(cps[i]) && j < n && esRegional(cps[j])) j += 1; // bandera
      while (j < n) {
        if (cps[j] === 0xfe0f || cps[j] === 0x20e3 || esTono(cps[j])) j += 1;
        else if (cps[j] === 0x200d && j + 1 < n) j += 2; // ZWJ + siguiente
        else break;
      }
      total += j - i > 1 ? 2 : pesoCp(cps[i]);
      i = j;
    }
    return total;
  };
  var total = 0, pos = 0, m;
  while ((m = reUrl.exec(t)) !== null) {
    total += pesoPlano(t.slice(pos, m.index)) + 23;
    pos = m.index + m[0].length;
    if (m[0].length === 0) reUrl.lastIndex++;
  }
  return total + pesoPlano(t.slice(pos));
}
</script>
<script>
(() => {
  const H = JSON.parse(document.getElementById("hilo-json").textContent);
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const toast = (m) => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1400); };
  const copiar = async (txt) => {
    try { await navigator.clipboard.writeText(txt); toast("Copiado"); return; } catch (e) { /* fallback */ }
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copiado"); } catch (e) { toast("No se pudo copiar"); }
    ta.remove();
  };
  if (!H) { app.innerHTML = "<p>Sin datos: este archivo lo genera scripts/ensamblar.py.</p>"; return; }

  let html = `<header>
    <h1>${esc(H.tema)}</h1>
    <div class="meta"><span class="chip">${esc(H.paleta)}</span><span>${esc(H.fecha)}</span><span>${H.n_tuits} tuits · ${H.tuits.filter((t) => t.imagen).length} imágenes</span><span>gate mecánico: ${esc(H.gate_mecanico)}</span></div>
    ${H.tesis ? `<p class="tesis"><b>Tesis:</b> ${esc(H.tesis)}</p>` : ""}
  </header>
  <div class="contacto" id="contacto" hidden>
    <a href="contacto.png" target="_blank" rel="noopener">Ver hoja de contacto</a>
    <img src="contacto.png" alt="Hoja de contacto: todas las tarjetas del hilo" onload="this.parentNode.hidden=false" onerror="this.parentNode.remove()">
  </div>`;
  for (const t of H.tuits) {
    const vacio = !t.texto.trim();
    const peso = pesoX(t.texto);
    html += `<article class="tuit" id="t${t.n}">
      <div class="cab"><span class="n">Tuit ${t.n}/${H.n_tuits}</span><span class="chip" style="background:#e9e3d6;color:#0C1520">${esc(t.beat || "")}</span>${t.plantilla ? `<span>tarjeta: ${esc(t.plantilla)}</span>` : "<span>sin imagen</span>"}</div>
      <div class="texto${vacio ? " vacio" : ""}">${vacio ? "(sin texto: la imagen lo dice)" : esc(t.texto)}</div>
      <div class="fila"><span class="cnt${peso > 280 ? " alerta" : ""}">${peso}/280 (peso X${peso !== t.caracteres ? `, ${t.caracteres} caracteres` : ""})</span>${vacio ? "" : `<button data-copy="${esc(t.texto)}">Copiar texto</button>`}</div>
      ${t.imagen ? `<div class="img"><img src="${esc(t.imagen)}" alt="${esc(t.alt_text)}"></div>
      <div class="alt"><b>Alt:</b> ${esc(t.alt_text)} <button data-copy="${esc(t.alt_text)}">Copiar alt</button></div>
      <div class="fuente">Fuente en el pie: ${esc(t.fuente || "")} · cifras: ${esc((t.cifra_ids || []).join(", "))}</div>` : ""}
    </article>`;
  }
  html += `<section class="extra">
    <h2>Lo que este hilo NO afirma</h2><ul>${(H.no_afirma || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Incertidumbre declarada</h2><ul>${(H.incertidumbre || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Fuentes</h2><ul>${(H.fuentes || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <p style="color:var(--gris);font-size:13px">Detalle de cifras y veredictos en <code>datos.json</code>; texto listo para pegar en <code>post.md</code>.</p>
  </section>`;
  app.innerHTML = html;
  app.addEventListener("click", (e) => { const b = e.target.closest("button[data-copy]"); if (b) copiar(b.getAttribute("data-copy")); });
})();
</script>
</body>
</html>
