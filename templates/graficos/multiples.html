<!-- multiples · pequeños múltiplos: 4–9 mini-líneas en la MISMA escala, con el último valor rotulado (brief 7d). Contrato: referencias/diseno/graficos.md -->
<script>
// CIFRAS DE EJEMPLO (índice de producción agrícola, MAGA/Banguat) · verificar antes de publicar
const DATA = {
  kicker: "PRODUCCIÓN AGRÍCOLA · ÍNDICE 2015 = 100",
  titular: ["Seis cultivos,", "seis historias"],
  nota: "",
  fuente: "MAGA · Banguat · volumen de producción 2015–2025",
  handle: "@DerekUrizar",
  formato: { prefijo: "", sufijo: "", decimales: 0, miles: true, escala: 1 },
  etiquetasX: ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"],
  paneles: [                                   // 4–9 paneles, un valor por etiqueta (null = hueco)
    { nombre: "Café",      valores: [100, 97, 95, 96, 94, 92, 93, 94, 93, 92, 92] },
    { nombre: "Azúcar",    valores: [100, 103, 101, 104, 106, 102, 105, 107, 106, 109, 108] },
    { nombre: "Banano",    valores: [100, 106, 110, 115, 118, 120, 124, 128, 130, 133, 135] },
    { nombre: "Cardamomo", valores: [100, 108, 118, 125, 135, 150, 158, 162, 165, 168, 170] },
    { nombre: "Palma",     valores: [100, 112, 125, 140, 155, 165, 178, 190, 198, 205, 210] },
    { nombre: "Maíz",      valores: [100, 99, 101, 100, 98, 99, 100, 102, 101, 100, 101] }
  ],
  destacar: 3,                                 // índice del panel clave (línea en a1) · null = ninguno
  referencia: { valor: 100, texto: "nivel de 2015" },   // línea punteada en todos los paneles · null = ninguna
  yDesdeCero: true                             // false solo con justificación (la plantilla escribe «Eje desde N»)
};

function render(D) {
  H.assert(Array.isArray(D.etiquetasX) && D.etiquetasX.length >= 4 && D.etiquetasX.length <= 30, "etiquetasX necesita de 4 a 30 puntos");
  H.assert(Array.isArray(D.paneles) && D.paneles.length >= 4 && D.paneles.length <= 9, "multiples admite de 4 a 9 paneles");
  const n = D.etiquetasX.length, m = D.paneles.length;
  D.paneles.forEach((p) => {
    H.assert(p && typeof p.nombre === "string" && p.nombre.trim() && Array.isArray(p.valores) && p.valores.length === n, "cada panel necesita nombre y " + n + " valores (null = hueco)");
    p.valores.forEach((v) => H.assert(v === null || typeof v === "number", "valores: número o null"));
    H.assert(p.valores.filter((v) => v !== null).length >= 2, "el panel «" + p.nombre + "» tiene menos de 2 valores");
  });
  H.assert(D.referencia == null || (typeof D.referencia.valor === "number" && typeof D.referencia.texto === "string"), "referencia: {valor, texto} o null");
  const hi = D.destacar == null ? -1 : ((D.destacar % m) + m) % m;
  const ink = H.color.ink, a1 = H.color.a1;
  const f = (v) => H.num(v, D.formato);

  const todos = D.paneles.flatMap((p) => p.valores.filter((v) => v !== null)).concat(D.referencia ? [D.referencia.valor] : []);
  const dom = H.dominio(todos, D.yDesdeCero !== false);
  let tk = H.ticks(dom[0], dom[1], 3);
  if (tk.length > 5) tk = H.ticks(dom[0], dom[1], 2);
  const fEje = H.formatoEje(D.formato, tk);
  H.anotar((D.referencia ? "Línea punteada: " + D.referencia.texto + ". " : "") + "Misma escala en todos los paneles." + (D.yDesdeCero === false ? " Eje desde " + H.num(dom[0], fEje) + ", no desde cero." : ""));

  const cols = m <= 4 ? 2 : 3, filas = Math.ceil(m / cols), gap = 24, franjaX = 26;
  const W = 920, alto = H.espacio(Math.min(560, filas * 200 + (filas - 1) * gap + franjaX), filas * 120 + (filas - 1) * gap + franjaX);
  const svg = H.lienzo(W, alto);
  const izq = Math.max(...tk.map((t) => H.medir(H.num(t, fEje), "500 17px 'JetBrains Mono'"))) + 12;
  const pw = (W - izq - (cols - 1) * gap) / cols, ph = (alto - franjaX - (filas - 1) * gap) / filas;
  const cabH = 36, padX = 8;
  const fontV = "700 20px 'JetBrains Mono'", fontVHi = "700 22px 'JetBrains Mono'";
  const fontsN = ["600 21px Archivo", "600 19px Archivo", "600 17px Archivo"], fontsHi = ["800 23px Archivo", "800 21px Archivo", "800 19px Archivo", "800 17px Archivo"];
  const ultimoDeColumna = (c) => { let u = -1; for (let i = 0; i < m; i++) if (i % cols === c) u = i; return u; };

  D.paneles.forEach((p, i) => {
    const c = i % cols, r = Math.floor(i / cols), esHi = i === hi;
    const x = izq + c * (pw + gap), y = r * (ph + gap);
    const px0 = x + padX, px1 = x + pw - padX, py0 = y + cabH, py1 = y + ph - 10;
    const sx = H.escala([0, n - 1], [px0, px1]), sy = H.escala(dom, [py1, py0]);
    H.svgEl("rect", { x, y, width: pw, height: ph, fill: H.color.inkA(.06) }, svg);
    // Cabecera: nombre y último valor
    let ult = n - 1; while (ult >= 0 && p.valores[ult] === null) ult--;
    const val = f(p.valores[ult]), fv = esHi ? fontVHi : fontV, wV = H.medir(val, fv);
    const fn = H.encajar(p.nombre, esHi ? fontsHi : fontsN, pw - 2 * padX - wV - 10);
    H.assert(fn, "el nombre «" + p.nombre + "» no cabe en su panel: acórtalo");
    H.texto(svg, px0, y + 24, p.nombre, { style: "font:" + fn + ",sans-serif;fill:" + ink });
    H.texto(svg, px1, y + 24, val, { "text-anchor": "end", style: "font:" + fv + ",monospace;fill:" + ink });
    // Rejilla compartida; rótulos solo en la primera columna
    for (const t of tk) {
      const yt = sy(t);
      H.svgEl("line", { x1: px0, x2: px1, y1: yt, y2: yt, stroke: H.color.inkA(Math.abs(t) < 1e-9 ? .5 : .2), "stroke-width": 1 }, svg);
      if (c === 0) H.texto(svg, x - 8, yt + 6, H.num(t, fEje), { class: "t-eje", "text-anchor": "end" });
    }
    if (D.referencia) { const yr = sy(D.referencia.valor); H.svgEl("line", { x1: px0, x2: px1, y1: yr, y2: yr, stroke: H.color.inkA(.6), "stroke-width": 2, "stroke-dasharray": "5 6" }, svg); }
    // Línea y punto final
    let d = "", abierto = false;
    p.valores.forEach((v, j) => { if (v === null) { abierto = false; return; } d += (abierto ? " L" : " M") + sx(j).toFixed(1) + " " + sy(v).toFixed(1); abierto = true; });
    H.svgEl("path", { d: d.trim(), fill: "none", stroke: esHi ? a1 : ink, "stroke-width": esHi ? 5 : 4, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    H.svgEl("circle", { cx: sx(ult), cy: sy(p.valores[ult]), r: esHi ? 8 : 6, fill: esHi ? a1 : ink }, svg);
    // Etiquetas X: primera y última, solo bajo el último panel de cada columna
    if (i === ultimoDeColumna(c)) {
      H.texto(svg, px0, alto - 4, String(D.etiquetasX[0]), { class: "t-eje" });
      H.texto(svg, px1, alto - 4, String(D.etiquetasX[n - 1]), { class: "t-eje", "text-anchor": "end" });
    }
  });
}
</script>
