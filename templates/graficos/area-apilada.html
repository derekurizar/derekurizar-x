<!-- area-apilada · reparto del todo a lo largo de una serie, 100 % o absolutos (brief 7e). Contrato: referencias/diseno/graficos.md -->
<script>
// CIFRAS DE EJEMPLO (exportaciones por destino, Banguat) · verificar antes de publicar
const DATA = {
  kicker: "EXPORTACIONES POR DESTINO · % DEL TOTAL",
  titular: ["Vendemos menos a EE. UU.", "y más a los vecinos"],
  nota: "",
  fuente: "Banguat · comercio exterior 2015–2025",
  handle: "@DerekUrizar",
  formato: { prefijo: "", sufijo: "", decimales: 0, miles: true, escala: 1 },
  etiquetasX: ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"],
  partes: [
    { nombre: "EE. UU.",         valores: [3700, 3800, 3900, 4000, 4100, 3900, 4300, 4600, 4700, 4800, 4900] },
    { nombre: "Centroamérica",   valores: [3200, 3400, 3600, 3800, 4000, 3700, 4300, 4700, 4900, 5000, 5100] },
    { nombre: "Europa",          valores: [800, 820, 850, 900, 950, 880, 950, 1000, 980, 1000, 1000] },
    { nombre: "Resto del mundo", valores: [3000, 3100, 3300, 3500, 3700, 3400, 3900, 4200, 4300, 4400, 4500] }
  ],
  normalizar: true,   // true = cada punto suma 100 % (la plantilla calcula los %) · false = absolutos apilados con eje
  destacar: 1         // índice de la parte clave (banda en a1): mejor la de abajo o la de arriba, que se leen enteras
};

function render(D) {
  H.assert(Array.isArray(D.etiquetasX) && D.etiquetasX.length >= 5 && D.etiquetasX.length <= 30, "area-apilada admite de 5 a 30 puntos (etiquetasX)");
  H.assert(Array.isArray(D.partes) && D.partes.length >= 2 && D.partes.length <= 5, "area-apilada admite de 2 a 5 partes");
  const n = D.etiquetasX.length, m = D.partes.length;
  D.partes.forEach((p) => {
    H.assert(p && typeof p.nombre === "string" && p.nombre.trim() && Array.isArray(p.valores) && p.valores.length === n, "cada parte necesita nombre y " + n + " valores");
    p.valores.forEach((v) => H.assert(typeof v === "number" && isFinite(v) && v >= 0, "valores de «" + p.nombre + "»: números ≥ 0"));
  });
  const norm = D.normalizar !== false;
  const hi = D.destacar == null ? 0 : ((D.destacar % m) + m) % m;
  const totales = D.etiquetasX.map((_, c) => D.partes.reduce((s, p) => s + p.valores[c], 0));
  totales.forEach((t, c) => H.assert(t > 0, "el punto «" + D.etiquetasX[c] + "» suma 0"));
  const bg = H.color.bg, ink = H.color.ink, a1 = H.color.a1;
  // Colores sólidos: la destacada en a1, el resto en tonos de la tinta sobre el fondo (como apilada).
  const tonos = [1, 0.66, 0.42, 0.24];
  // Noche (fondo oscuro, acento claro): tonos de crema del más claro al más oscuro, separados entre sí (≥ 1.35:1)
  // y del acento (≥ 1.25:1) para que ninguna banda se confunda con su vecina; todos ≥ 1.6:1 sobre el fondo.
  const tonosNoche = (n, paso = 1.35) => {
    const out = [];
    for (let t = 1; t > 0.05 && out.length < n; t -= 0.01) {
      const c = H.mezcla(bg, ink, t);
      if (H.contraste(c, bg) < 1.6) break;
      if (H.contraste(c, a1) >= 1.25 && (!out.length || H.contraste(c, out[out.length - 1]) >= paso)) out.push(c);
    }
    H.assert(out.length === n, "no hay " + n + " tonos distinguibles sobre el fondo");
    return out;
  };
  const neutros = H.estilo() === "noche" ? tonosNoche(m - 1) : tonos.map((t) => H.mezcla(bg, ink, t));
  let k = 0;
  const colorDe = D.partes.map((_, j) => (j === hi ? a1 : neutros[Math.min(k++, 3)]));
  // Acumulado por punto: fracción del total si normaliza, absoluto si no. partes[0] va abajo.
  const acum = D.etiquetasX.map((_, c) => { let s = 0; return D.partes.map((p) => (s += p.valores[c])); });
  const altura = (c, j) => (j < 0 ? 0 : norm ? acum[c][j] / totales[c] : acum[c][j]);
  const pctDe = (c, j) => (D.partes[j].valores[c] / totales[c]) * 100;
  if (norm && [0, n - 1].some((c) => D.partes.reduce((s, _p, j) => s + Math.round(pctDe(c, j)), 0) !== 100))
    H.anotar("Porcentajes redondeados: pueden no sumar 100.");

  const f = (v) => H.num(v, D.formato);
  const fontV = "700 19px 'JetBrains Mono',monospace", fontEje = "500 17px 'JetBrains Mono'";
  const etiqIni = D.partes.map((p, j) => (norm ? H.pct(pctDe(0, j)) : f(p.valores[0])));
  const etiqFin = D.partes.map((p, j) => (norm ? H.pct(pctDe(n - 1, j)) : f(p.valores[n - 1])));
  // Canal derecho: «nombre NN%» en una línea; los nombres encogen 20→18→17 hasta caber en 320 px.
  const fontN = ["700 20px Archivo", "700 18px Archivo", "700 17px Archivo"].find((fn) => D.partes.every((p, j) => H.medir(p.nombre, fn) + H.medir(" " + etiqFin[j], fontV) <= 304));
  H.assert(fontN, "los nombres no caben en el canal derecho (320 px) ni a 17 px: acórtalos");
  const der = Math.max(...D.partes.map((p, j) => H.medir(p.nombre, fontN) + H.medir(" " + etiqFin[j], fontV))) + 16;

  const W = 920, alto = H.espacio(520, 300);
  const svg = H.lienzo(W, alto);
  const top = 12, abajo = 34, y0 = top, y1 = alto - abajo;
  let dom = [0, 1], tk = [], fEje = D.formato;
  if (!norm) { dom = H.dominio(totales, true); tk = H.ticks(dom[0], dom[1], 4); fEje = H.formatoEje(D.formato, tk); }
  const izq = (norm ? Math.max(...etiqIni.map((s) => H.medir(s, fontV))) : Math.max(...tk.map((t) => H.medir(H.num(t, fEje), fontEje)))) + 14;
  const x0 = izq, x1 = W - der;
  const sx = H.escala([0, n - 1], [x0, x1]);
  const sy = H.escala(dom, [y1, y0]);

  // Absolutos: ticks rotulados a la izquierda (con rejilla bajo las bandas).
  if (!norm) for (const t of tk) {
    H.svgEl("line", { x1: x0, x2: x1, y1: sy(t), y2: sy(t), stroke: H.color.inkA(.18), "stroke-width": 1 }, svg);
    H.texto(svg, x0 - 10, sy(t) + 6, H.num(t, fEje), { class: "t-eje", "text-anchor": "end" });
  }

  // Bandas: path cerrado (borde superior de ida, inferior de vuelta); filo del color del fondo sobre cada borde interior.
  const px = (c) => sx(c).toFixed(1), py = (c, j) => sy(altura(c, j)).toFixed(1);
  const borde = (j) => D.etiquetasX.map((_, c) => (c ? "L" : "M") + px(c) + " " + py(c, j)).join(" ");
  D.partes.forEach((_, j) => {
    const vuelta = D.etiquetasX.map((_, c) => "L" + px(n - 1 - c) + " " + py(n - 1 - c, j - 1)).join(" ");
    H.svgEl("path", { d: borde(j) + " " + vuelta + " Z", fill: colorDe[j] }, svg);
  });
  for (let j = 0; j < m - 1; j++) H.svgEl("path", { d: borde(j), fill: "none", stroke: bg, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  // 100 %: guías tenues en 25/50/75 % sobre las bandas (del color del fondo, punteadas).
  if (norm) for (const q of [0.25, 0.5, 0.75]) H.svgEl("line", { x1: x0, x2: x1, y1: sy(q), y2: sy(q), stroke: bg, "stroke-width": 1.5, "stroke-dasharray": "4 8", opacity: .45 }, svg);

  // Rótulos al inicio (valor) y al fin (nombre + valor) en el centro de cada banda; anti-solape con guía si se mueven.
  const centro = (c, j) => (sy(altura(c, j)) + sy(altura(c, j - 1))) / 2;
  const colocar = (c, gap, xBorde, xGuia, pinta) => {
    const its = D.partes.map((_, j) => ({ j, yo: centro(c, j), y: centro(c, j) }));
    H.antiSolape(its, { minGap: gap, min: y0 + 10, max: y1 - 6 });
    for (const it of its) {
      if (Math.abs(it.y - it.yo) > 8) H.svgEl("line", { x1: xBorde, y1: it.yo, x2: xGuia, y2: it.y, stroke: H.color.inkA(.5), "stroke-width": 1.5 }, svg);
      pinta(it);
    }
  };
  colocar(0, 27, x0 - 2, x0 - 8, (it) => H.texto(svg, x0 - 10, it.y + 6, etiqIni[it.j], { "text-anchor": "end", style: "font:" + fontV + ";fill:" + ink }));
  colocar(n - 1, 28, x1 + 2, x1 + 10, (it) => {
    const t = H.svgEl("text", { x: x1 + 12, y: it.y + 7, style: "font:" + fontN + ",sans-serif;fill:" + ink + (it.j === hi ? ";font-weight:800" : "") }, svg);
    H.svgEl("tspan", {}, t).textContent = D.partes[it.j].nombre;
    H.svgEl("tspan", { style: "font:" + fontV }, t).textContent = " " + etiqFin[it.j];
  });

  // Etiquetas X: como máximo 6, siempre la primera y la última.
  const paso = Math.max(1, Math.ceil((n - 1) / 5));
  const idx = []; for (let c = 0; c < n; c += paso) idx.push(c);
  if (idx[idx.length - 1] !== n - 1) { if (n - 1 - idx[idx.length - 1] < paso / 2) idx.pop(); idx.push(n - 1); }
  for (const c of idx) H.texto(svg, sx(c), y1 + 28, String(D.etiquetasX[c]), { "text-anchor": "middle", style: "font:" + (c === n - 1 ? "700" : "500") + " 19px 'JetBrains Mono',monospace;fill:" + ink });
}
</script>
