<!-- dona · reparto del todo en 2–5 partes (brief 4b). Contrato: referencias/diseno/graficos.md -->
<style>
.dona-grid { display: grid; grid-template-columns: 380px 1fr; column-gap: 64px; align-items: center; height: 100%; }
.dona-aro { width: 380px; height: 380px; border-radius: 50%; position: relative; }
.dona-aro::after { content: ""; position: absolute; inset: 86px; border-radius: 50%; background: var(--bg); }
.dona-centro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; text-align: center; }
.dona-centro .v { font-size: 92px; line-height: .9; letter-spacing: -.02em; }   /* familia y peso: .cifra-heroe */
.dona-centro .t { font: 600 19px/1.2 Archivo, sans-serif; margin-top: 10px; max-width: 180px; }
.dona-lista { display: flex; flex-direction: column; gap: 22px; }
.dona-item { display: flex; align-items: center; gap: 16px; }
.dona-item .sw { width: 22px; height: 22px; flex: none; }
.dona-item .n { font: 600 24px/1.15 Archivo, sans-serif; flex: 1; }
.dona-item .p { font: 700 36px/1 'JetBrains Mono', monospace; }
/* Noche: el agujero es hueco de verdad (se ve el grano del fondo, no un disco plano de --bg). El aro sigue llevando su
   conic-gradient en style.background (animar.js lo lee y lo barre), pero no lo pinta: lo hereda ::before, recortado
   en anillo con una máscara radial (86 px de grosor, como el inset del clásico). */
body[data-estilo="noche"] .dona-aro { background-size: 0 0 !important; }
body[data-estilo="noche"] .dona-aro::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; background-size: auto;
  -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 86.5px), var(--ink) calc(100% - 85.5px));
          mask: radial-gradient(closest-side, transparent calc(100% - 86.5px), var(--ink) calc(100% - 85.5px)); }
body[data-estilo="noche"] .dona-aro::after { content: none; }
body[data-estilo="noche"] .dona-centro .v { letter-spacing: 0; }
</style>
<script>
// CIFRAS DE EJEMPLO · verificar antes de publicar
const DATA = {
  kicker: "EXPORTACIONES · % DEL VALOR TOTAL 2025",
  titular: ["Cuatro productos", "hacen un tercio"],
  nota: "Porcentajes redondeados al entero.",
  fuente: "Banguat · comercio exterior",
  handle: "@DerekUrizar",
  formato: { prefijo: "", sufijo: "", decimales: 0, miles: true, escala: 1 },
  partes: [
    { nombre: "Prendas de vestir", valor: 12 },
    { nombre: "Banano", valor: 9 },
    { nombre: "Café", valor: 8 },
    { nombre: "Azúcar", valor: 6 },
    { nombre: "Todo lo demás", valor: 65 }
  ],
  destacar: 0,                          // índice de la parte clave
  centro: { valor: 35, texto: "en cuatro productos" }   // opcional; si falta, usa la parte destacada
};

function render(D) {
  H.assert(Array.isArray(D.partes) && D.partes.length >= 2 && D.partes.length <= 5, "dona admite de 2 a 5 partes");
  D.partes.forEach((p) => H.assert(p && p.nombre && typeof p.valor === "number" && p.valor >= 0, "cada parte necesita nombre y valor ≥ 0"));
  const total = D.partes.reduce((s, p) => s + p.valor, 0);
  H.assert(total > 0, "la suma de las partes es 0");
  const hi = ((D.destacar || 0) % D.partes.length + D.partes.length) % D.partes.length;
  const ink = H.color.ink;
  // Las demás partes: ink, a2, a3 por ese orden; la quinta, crema al 45 % (en Noche al 28 %: a2 ya es la crema al 55 %).
  const ROL = [ink, H.color.a2, H.color.a3, H.color.inkA(H.estilo() === "noche" ? .28 : .45)];

  const alto = H.espacio(420, 380);
  const g = document.getElementById("grafico");
  g.style.height = alto + "px";
  const grid = H.el("div", "dona-grid", g);
  const aro = H.el("div", "dona-aro", grid);
  let acc = 0, k = 0, stops = [];
  const colores = D.partes.map((p, i) => (i === hi ? H.color.a1 : ROL[Math.min(k++, ROL.length - 1)]));
  D.partes.forEach((p, i) => { const a = acc, b = acc + (p.valor / total) * 100; stops.push(colores[i] + " " + a.toFixed(2) + "% " + b.toFixed(2) + "%"); acc = b; });
  aro.style.background = "conic-gradient(" + stops.join(",") + ")";
  const centro = H.el("div", "dona-centro", aro);
  const c = D.centro || { valor: Math.round((D.partes[hi].valor / total) * 100), texto: D.partes[hi].nombre };
  const vtxt = typeof c.valor === "number" ? H.pct(c.valor) : String(c.valor);
  const vEl = H.el("div", "v cifra-heroe", centro, H.esc(vtxt));
  const tEl = H.el("div", "t", centro, H.esc(c.texto || ""));
  // La cifra cabe en el agujero (radio 104 px) a la altura de su borde superior, como en hemiciclo: baja de 92 px
  // hasta que su ancho entra en la cuerda del círculo a esa altura (un «43.5%» a 92 px pisaba el aro).
  const rIn = 190 - 86, tH = c.texto ? tEl.offsetHeight + 10 : 0;
  let px = 92;
  const cabe = () => { const dy = (0.9 * px + tH) / 2 - 0.05 * px; const semi = dy < rIn ? Math.sqrt(rIn * rIn - dy * dy) : 0; return H.medirCifra(vtxt, px) / 2 <= semi - 6; };
  while (px > 48 && !cabe()) px -= 2;
  H.assert(cabe(), "la cifra del centro («" + vtxt + "») no cabe en el agujero de la dona: acórtala");
  vEl.style.fontSize = px + "px";

  const lista = H.el("div", "dona-lista", grid);
  D.partes.forEach((p, i) => {
    const it = H.el("div", "dona-item", lista);
    const sw = H.el("span", "sw", it); sw.style.background = colores[i];
    H.el("span", "n", it, H.esc(p.nombre));
    H.el("span", "p", it, H.esc(H.pct((p.valor / total) * 100, D.formato.decimales || 0)));
  });
}
</script>
