<!-- PRUEBA DE ESTRÉS · barras-v: 12 barras + valores grandes + referencia -->
<script>
const DATA = {
  kicker: "PRUEBA · DOCE MESES · MILLONES",
  titular: ["Doce barras con", "valores de seis cifras"],
  nota: "",
  fuente: "Prueba de estrés · datos ficticios",
  handle: "@DerekUrizar",
  formato: { prefijo: "", sufijo: "", decimales: 0, miles: true, escala: 1 },
  etiquetas: ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"],
  valores: [120500,131200,128900,140100,150300,149800,160200,171500,168900,180400,190100,205600],
  destacar: -1, rotular: "destacada",
  referencia: { valor: 175000, texto: "meta" }
};
function render(D) {
  H.assert(Array.isArray(D.etiquetas) && Array.isArray(D.valores) && D.etiquetas.length === D.valores.length, "etiquetas y valores deben tener la misma longitud");
  const n = D.valores.length;
  H.assert(n >= 2 && n <= 12, "barras-v admite de 2 a 12 barras");
  D.valores.forEach((v) => H.assert(typeof v === "number", "valores debe ser numérico"));
  const idx = D.destacar == null ? -1 : D.destacar;
  const P = H.validarPeriodos(D.periodos, n);
  const hi = ((idx % n) + n) % n;

  const W = 920, alto = H.espacio(470, 300);
  const svg = H.lienzo(W, alto);
  const colY = 84, arriba = P.length ? 78 : 44, abajo = 46;
  const x0 = colY, x1 = W, y0 = arriba, y1 = alto - abajo;
  const dom = H.dominio(D.valores, true);
  if (D.referencia) dom[1] = Math.max(dom[1], D.referencia.valor * 1.05);
  // Con negativos, deja 36 px bajo la barra más baja para su rótulo (va debajo de la barra).
  const minV = Math.min(...D.valores), r = 36 / (y1 - y0);
  if (minV < 0) dom[0] = Math.min(dom[0], (minV - r * dom[1]) / (1 - r));
  const sy = H.escala(dom, [y1, y0]);
  const yz = sy(0);   // la base de las barras es el cero, no el borde inferior (negativos)
  const ink = H.color.ink;
  const gap = n > 8 ? 12 : 22;
  const bw = (x1 - x0 - gap * (n - 1)) / n;

  if (P.length) H.periodos(svg, P, (i) => [x0 + i * (bw + gap) - (i ? gap / 2 : 0), x0 + i * (bw + gap) + bw + (i < n - 1 ? gap / 2 : 0)], 34, y1, 22);

  // Rejilla + eje Y (mono 17px) — la base siempre es cero.
  const tk = H.ticks(dom[0], dom[1], 4);
  const fEje = Object.assign({}, D.formato, { decimales: H.decimalesDe(tk.map((t) => t / (D.formato.escala || 1)), D.formato.decimales || 0) });
  for (const t of tk) {
    const y = sy(t);
    if (Math.abs(y - yz) > 1) H.svgEl("line", { x1: x0, x2: x1, y1: y, y2: y, stroke: H.color.inkA(.22), "stroke-width": 1 }, svg);
    H.texto(svg, x0 - 14, y + 6, H.num(t, fEje), { class: "t-eje", "text-anchor": "end" });
  }
  D.valores.forEach((v, i) => {
    const x = x0 + i * (bw + gap), yv = sy(v);
    const esHi = i === hi;
    const op = esHi ? 1 : (0.45 + 0.43 * (n > 1 ? i / (n - 1) : 1)).toFixed(2);
    H.svgEl("rect", { x, y: Math.min(yv, yz), width: bw, height: Math.abs(yz - yv), fill: esHi ? H.color.a1 : ink, opacity: op }, svg);
    if (D.rotular !== "destacada" || esHi)
      H.texto(svg, x + bw / 2, v < 0 ? yv + 30 : yv - 12, H.num(v, D.formato), { class: "t-val", "text-anchor": "middle", style: esHi ? "font-size:24px" : "" });
    H.texto(svg, x + bw / 2, alto - 8, D.etiquetas[i], { "text-anchor": "middle", style: "font:" + (esHi ? "800" : "600") + " " + (n > 8 ? 18 : 21) + "px Archivo,sans-serif;fill:" + ink });
  });

  H.svgEl("line", { x1: x0, x2: x1, y1: yz, y2: yz, stroke: ink, "stroke-width": 3 }, svg);

  if (D.referencia) {
    const y = sy(D.referencia.valor);
    H.svgEl("line", { x1: x0, x2: x1, y1: y, y2: y, stroke: H.color.a1, "stroke-width": 3, "stroke-dasharray": "8 8" }, svg);
    H.texto(svg, x1, y - 10, D.referencia.texto + " · " + H.num(D.referencia.valor, D.formato), { class: "t-rot", "text-anchor": "end", fill: H.color.a1 });
  }
}
</script>
