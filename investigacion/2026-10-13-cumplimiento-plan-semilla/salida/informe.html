<!--
  BASE DE INFORME (@DerekUrizar · sistema «Hilos» llevado a documento)
  ====================================================================
  No se edita a mano en los entregables: scripts/informe.py ensambla esta base con
    I:PALETAS   paletas desde design/tokens.json (bg/ink/a1… de la tarjeta + papel_tinta/papel_barra)
    I:HELPERS   el bloque `const H` de templates/base.html (una sola fuente de los helpers)
    I:GRAFICOS  investigacion/graficos/*.js  (G.<tipo>: gráficos dibujados en el documento)
    I:PAGINAS   investigacion/paginas/*.js   (PAGINAS.<tipo>: una función por tipo de página)
    INFORME_JSON el informe.json ya resuelto (numeración, referencias, índice, cifras)
  Diseño de referencia: lienzo «Informe de investigación» (ver investigacion/README.md).
  Las fuentes se piden como url(fonts/x.woff2): informe.py copia design/fonts/ junto al HTML y
  scripts/render_informe.js las sirve desde design/fonts/ (cero peticiones externas).
-->
<style>
@font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(fonts/instrument-serif-400.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url(fonts/instrument-serif-400i.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 100 900; src: url(fonts/archivo-var.woff2) format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800; src: url(fonts/jetbrains-mono-var.woff2) format('woff2'); }

body[data-paleta="cielo"] { --bg:#4B92DB; --ink:#0C1520; --a1:#F6F2E8; --a2:#2B4A66; --a3:#8FB8E6; --ink-rgb:12,21,32; --x-fg:#4B92DB; --rule:rgba(12,21,32,.3); --kicker:#0C1520; --tinta:#2B4A66; --barra:#4B92DB; }
body[data-paleta="jade"] { --bg:#1E6B5C; --ink:#F6F2E8; --a1:#9FD4BF; --a2:#0E3B32; --a3:#5FA38C; --ink-rgb:246,242,232; --x-fg:#1E6B5C; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#1E6B5C; --barra:#1E6B5C; }
body[data-paleta="maiz"] { --bg:#E0A33C; --ink:#1A1208; --a1:#F3D08A; --a2:#B97A1C; --a3:#6E440B; --ink-rgb:26,18,8; --x-fg:#E0A33C; --rule:rgba(26,18,8,.3); --kicker:#1A1208; --tinta:#6E440B; --barra:#B97A1C; }
body[data-paleta="terracota"] { --bg:#B23A26; --ink:#F6F2E8; --a1:#3A0F08; --a2:#E8836F; --a3:#F2C2B6; --ink-rgb:246,242,232; --x-fg:#B23A26; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#B23A26; --barra:#B23A26; }
body[data-paleta="cacao"] { --bg:#4A2F22; --ink:#F6F2E8; --a1:#D9A66B; --a2:#A8744A; --a3:#7A5038; --ink-rgb:246,242,232; --x-fg:#4A2F22; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#4A2F22; --barra:#A8744A; }
body[data-paleta="jacaranda"] { --bg:#6B4E96; --ink:#F6F2E8; --a1:#1F1530; --a2:#B9A3DB; --a3:#8E73B8; --ink-rgb:246,242,232; --x-fg:#6B4E96; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#6B4E96; --barra:#6B4E96; }
body[data-paleta="atitlan"] { --bg:#3FA3A0; --ink:#0C1520; --a1:#F6F2E8; --a2:#7CC3C0; --a3:#1D5E5C; --ink-rgb:12,21,32; --x-fg:#3FA3A0; --rule:rgba(12,21,32,.3); --kicker:#0C1520; --tinta:#1D5E5C; --barra:#3FA3A0; }
body[data-paleta="obsidiana"] { --bg:#16181D; --ink:#F6F2E8; --a1:#F08A4B; --a2:#8C8F96; --a3:#3A3D44; --ink-rgb:246,242,232; --x-fg:#16181D; --rule:rgba(246,242,232,.3); --kicker:#F08A4B; --tinta:#16181D; --barra:#F08A4B; }

@page { size: 8.5in 11in; margin: 0; }
@page apaisada { size: 11in 8.5in; margin: 0; }

:root { --papel: #F6F2E8; --tp: #0C1520; --tp-rgb: 12,21,32; --regla: rgba(12,21,32,.2); --regla-f: rgba(12,21,32,.3); --gris: rgba(12,21,32,.68); --suave: rgba(12,21,32,.06); --base: rgba(12,21,32,.2); }
html, body { margin: 0; padding: 0; }
body { background: #D9D4C7; font-family: Archivo, system-ui, sans-serif; color: var(--tp); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
@media screen { body { padding: 32px 0; } .pagina { margin: 0 auto 32px; box-shadow: 0 2px 18px rgba(0,0,0,.18); } }
@media print { body { background: var(--papel); } }

/* ---- Hoja ---- */
.pagina { width: 816px; height: 1056px; box-sizing: border-box; padding: 56px 72px 48px; display: flex; flex-direction: column; background: var(--papel); color: var(--tp); overflow: hidden; position: relative; break-after: page; page: carta; }
.pagina.apaisada { width: 1056px; height: 816px; padding: 48px 72px 40px; page: apaisada; }
.pagina.color { background: var(--bg); color: var(--ink); padding: 64px 72px 56px; }
.pagina.sin-margen { padding: 0; }
@page carta { size: 8.5in 11in; margin: 0; }

/* ---- Tipografía ---- */
.k { font: 500 12px/1.3 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
.k.acento { color: var(--tinta); }
.color .k.acento, .banda .k.acento, .panel .k.acento { color: var(--kicker); }
.mono { font: 400 12px/1.45 'JetBrains Mono', monospace; }
.mono-b { font: 700 12px/1.45 'JetBrains Mono', monospace; }
.gris { color: var(--gris); }
.t-portada { margin: 56px 0 0; font: 400 104px/.92 'Instrument Serif', Georgia, serif; letter-spacing: -.02em; text-wrap: balance; }
.t1 { margin: 40px 0 0; font: 400 72px/.95 'Instrument Serif', Georgia, serif; letter-spacing: -.015em; }
.t2 { margin: 36px 0 0; font: 400 56px/.95 'Instrument Serif', Georgia, serif; letter-spacing: -.015em; text-wrap: balance; }
.t3 { margin: 32px 0 0; font: 400 36px/1.05 'Instrument Serif', Georgia, serif; letter-spacing: -.01em; text-wrap: balance; }
.lead { margin: 24px 0 0; max-width: 540px; font: 400 18px/1.55 Archivo, sans-serif; text-wrap: pretty; }
.p { margin: 14px 0 0; max-width: 560px; font: 400 16px/1.62 Archivo, sans-serif; text-wrap: pretty; }
.p + .p { margin-top: 12px; }
.capitular { float: left; font: 400 64px/.8 'Instrument Serif', Georgia, serif; margin: 6px 10px 0 0; color: var(--tinta); }
.serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }
em.serif { font-size: 1.15em; line-height: 1; }
.cifra-g { font: 400 64px/.9 'Instrument Serif', Georgia, serif; color: var(--tinta); }

/* ---- Encabezado corrido y pie ---- */
.corrido { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--regla); }
.corrido.sobre-color { border-bottom: 1.5px solid var(--rule); padding-bottom: 20px; }
.pie-pag { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: auto; padding-top: 16px; border-top: 1.5px solid var(--regla-f); }
.pie-pag.sobre-color { border-top-color: var(--rule); padding-top: 18px; }
.autor { display: flex; align-items: center; gap: 16px; flex: none; }
.marca { display: flex; align-items: center; gap: 8px; }
.x { width: 22px; height: 22px; border-radius: 5px; background: var(--tp); color: var(--papel); display: flex; align-items: center; justify-content: center; font: 800 12px/1 Archivo, sans-serif; flex: none; }
.sobre-color .x, .panel .x { background: var(--ink); color: var(--x-fg); }
.handle { font: 600 14px/1 Archivo, sans-serif; }

/* ---- Bloques de cuerpo ---- */
.con-margen { display: flex; gap: 24px; margin-top: 14px; }
.con-margen > .texto { flex: 1; min-width: 0; }
.con-margen > .texto .p:first-child { margin-top: 0; }
.margen { flex: none; width: 136px; display: flex; flex-direction: column; gap: 18px; }
.margen > span { border-top: 1px solid var(--regla-f); padding-top: 8px; font: 400 12px/1.45 'JetBrains Mono', monospace; color: rgba(12,21,32,.72); }
.margen b { font-weight: 700; color: var(--tinta); }
.cita { margin: 32px 0 0; padding: 20px 0; border-top: 1.5px solid var(--tp); border-bottom: 1px solid var(--regla); display: flex; gap: 24px; align-items: baseline; }
.cita .k { flex: none; width: 128px; }
.cita .frase { flex: 1; font: 400 italic 30px/1.15 'Instrument Serif', Georgia, serif; text-wrap: balance; }
.caja { margin-top: 28px; padding: 20px 24px; background: var(--suave); display: flex; gap: 24px; }
.caja > .k { flex: none; width: 104px; }
.caja .items { flex: 1; display: flex; flex-direction: column; gap: 8px; font: 400 15px/1.45 Archivo, sans-serif; }
.caja.vertical { flex-direction: column; gap: 14px; }
.caja.vertical > .k { width: auto; }
.lectura .pasos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.lectura .paso { display: flex; gap: 12px; font: 400 14px/1.5 Archivo, sans-serif; }
.marcador { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--tp); color: var(--papel); display: flex; align-items: center; justify-content: center; font: 700 12px/1 'JetBrains Mono', monospace; }
.marcador.pill { width: auto; padding: 0 7px; border-radius: 11px; }

/* ---- Figuras ---- */
figure { margin: 0; }
.fig { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.fig .marco { display: flex; flex-direction: column; }
.fig--papel .marco { border-top: 1.5px solid var(--tp); padding-top: 14px; }
.fig .titular { margin-top: 10px; font: 400 26px/1.1 'Instrument Serif', Georgia, serif; text-wrap: balance; }
.fig--panel .titular.grande { font-size: 40px; line-height: 1; letter-spacing: -.015em; }
.panel { background: var(--bg); color: var(--ink); padding: 26px 30px 18px; }
.panel.compacto { padding: 20px 20px 14px; flex: 1; }
.panel .k { color: var(--kicker); }
.panel .nota { margin-top: 12px; font: 500 12px/1.4 'JetBrains Mono', monospace; }
.fig--papel .nota { margin-top: 12px; font: 400 12px/1.4 'JetBrains Mono', monospace; color: var(--gris); }
.panel .pie-fig { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1.5px solid var(--rule); }
.panel .pie-fig .x { width: 20px; height: 20px; font-size: 12px; }
.panel .pie-fig .handle { font-size: 13px; }
.grafico { margin-top: 18px; position: relative; }
.grafico svg { display: block; overflow: visible; }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; font: 600 14px/1 Archivo, sans-serif; }
.leyenda span { display: flex; align-items: center; gap: 8px; }
.leyenda i { display: block; width: 14px; height: 14px; }
.leyenda i.linea { width: 28px; height: 3px; }
figcaption, .figcap { display: flex; gap: 12px; font: 400 12px/1.45 'JetBrains Mono', monospace; }
.figno { flex: none; font-weight: 700; color: var(--tinta); }
.dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 26px; }
.dos > .fig { margin-top: 0; }
.tarjeta-img { display: block; width: 100%; height: auto; }

/* ---- Tablas ---- */
table.t { width: 100%; border-collapse: collapse; font: 400 14px/1.3 Archivo, sans-serif; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 500 12px/1.25 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; padding: 0 0 8px; vertical-align: bottom; border-bottom: 1.5px solid var(--tp); }
table.t td { padding: 5px 0; border-bottom: 1px solid var(--regla); }
table.t tr:last-child td { border-bottom: 1.5px solid var(--tp); }
table.t .num { text-align: right; font-family: 'JetBrains Mono', monospace; }
table.t th.num { text-align: right; }
table.t th + th, table.t td + td { padding-left: 16px; }
table.t tr.dest td { background: var(--suave); font-weight: 700; }
table.t tr.dest td:first-child { color: var(--tinta); padding-left: 8px; }
table.t tr.dest td:last-child { padding-right: 8px; }
table.t tr.total td { font-weight: 700; }
table.t td.b { font-weight: 700; }
table.t tr.con-detalle td { border-bottom: 0; padding-bottom: 1px; }
table.t tr.detalle td { font: 400 13px/1.4 Archivo, sans-serif; color: rgba(12,21,32,.8); padding: 0 0 7px; }
table.t tr.detalle.dest td { font-weight: 400; }
table.t tr.detalle td:first-child { padding-left: 0; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--tinta); color: var(--papel); font: 500 12px/1.4 'JetBrains Mono', monospace; }
.chip.borde { background: none; border: 1px solid var(--tinta); color: var(--tinta); padding: 1px 7px; }
.chip.tachado { background: none; border: 1px dashed rgba(12,21,32,.5); color: var(--gris); text-decoration: line-through; padding: 1px 7px; }
.notas-tabla { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; font: 400 12px/1.45 'JetBrains Mono', monospace; color: rgba(12,21,32,.75); }
.notas-tabla b { color: var(--tp); }

/* ---- Rejillas de página ---- */
.rejilla2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.rejilla3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.rejilla4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.celda { border-top: 1.5px solid var(--tp); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.lista-reglas { display: flex; flex-direction: column; border-top: 1.5px solid var(--tp); }
.lista-reglas > * { border-bottom: 1px solid var(--regla); }
.lista-reglas > *:last-child { border-bottom: 1.5px solid var(--tp); }

/* ---- Bandas de color (aperturas) ---- */
.banda { background: var(--bg); color: var(--ink); }
.sobre-color .regla-c { height: 1.5px; background: var(--rule); }
.cifra-heroe { font: 400 228px/.8 'Instrument Serif', Georgia, serif; letter-spacing: -.03em; color: var(--a1); }
[hidden] { display: none !important; }
</style>

nes denunciadas al MP, 2015 a 2025.", "etiquetasX": ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]}}, {"kicker": "Carga tributaria neta · % del PIB", "valor": "11.88%", "contexto": "en 2025; 11.68% en 2023, frente a la meta de 13%", "fuente": "SAT, Boletín Estadístico, hoja F1", "grafico": {"tipo": "chispa", "id": "mac-c04", "etiquetas": ["2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"], "valores": [10.28, 11.25, 11.07, 11.07, 10.83, 11.44, 11.74, 10.96, 10.26, 10.4, 10.91, 10.95, 11.13, 10.98, 10.45, 10.78, 10.77, 10.67, 10.54, 10.04, 11.66, 11.95, 11.68, 11.76, 11.88], "aria": "Carga tributaria neta, 2001 a 2025.", "etiquetasX": ["2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]}}], "_n": 6, "_n_texto": "06", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "Cómo medimos", "bloques": [{"b": "titulo", "texto": "Cómo medimos el avance"}, {"b": "texto", "parrafos": ["Cada uno de los 133 compromisos distintos del plan recibe un puntaje de 0 a 100 según lo que prometió. Siete aparecen en dos semillas: son espejos, se evalúan una vez y cuentan en ambas; por eso el plan suma 140 entradas. De los 133, 109 están en las 10 semillas y 24 en el marco fiscal (15 orientaciones y 9 metas macro). El avance global, 22.9%, es el promedio simple de las 10 semillas; el marco fiscal se mide aparte (44.9%, capítulo 11).", "Solo cuenta lo ocurrido en el mandato, desde el 14 de enero de 2024, con cifras verificadas o ajustadas. Sin dato oficial, el compromiso es no verificable y **cuenta 0**. Si hay dato, pero lo que existe ya existía, o la meta ya se cumplía, antes de esa fecha, es **no atribuible** y también cuenta 0.", "Las metas con número puntúan la parte recorrida entre la línea base y la meta: (observado − base) ÷ (meta − base) × 100, con tope de 100. Por ejemplo, la cobertura eléctrica pasó de 90.39% en 2023 a 91.5% en 2025: (91.5 − 90.39) ÷ (100 − 90.39) = 11.6 de 100. Si el dato empeora frente a la base, aunque sea por poco, el compromiso queda en retroceso y cuenta 0; si queda exactamente igual, está sin iniciar y también cuenta 0. Los hitos puntúan 100 cumplidos, 50 en proceso, 25 anunciados y 0 sin iniciar o incumplidos."], "margen": [{"termino": "Espejos", "texto": "140 = 133 + 7 espejos; 133 − 24 = 109, cálculo propio sobre el inventario."}]}], "id": "como-medimos", "indice": {"titulo": "Cómo medimos"}, "_n": 7, "_n_texto": "07", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "Cómo medimos", "bloques": [{"b": "texto", "parrafos": ["El **ritmo del mandato** es la parte del periodo ya transcurrida: 68.7% a octubre de 2026. Cada avance se compara con esa parte, sin suponer que cada meta deba avanzar en línea recta. Un compromiso está en **retroceso** cuando el dato del mandato es peor que la línea base, aunque sea por poco (si es exactamente igual, está sin iniciar), e **incumplido** cuando tenía fecha o condición y no se dio; los dos cuentan 0."]}, {"b": "caja", "etiqueta": "Reglas del puntaje", "items": ["**Meta**: lo logrado ÷ la meta; si la meta es un nivel, el avance desde la línea base de 2023 o del inicio del mandato, nunca anterior.", "**Monto**: lo ejecutado (devengado) desde 2024 ÷ lo prometido.", "**Hito**: por hechos del mandato. Cumplido 100, en proceso 50, anunciado 25; sin iniciar, incumplido o retroceso, 0.", "**No atribuible**: hay dato, pero el programa o la norma ya existía, o la meta ya se cumplía, antes del 14-ene-2024. Cuenta 0 y no es «sin dato».", "**Tendencia**: un cambio de 10% o más en el sentido prometido vale 100; menor, 50; en contra, retroceso.", "**Semilla**: promedio simple de sus compromisos. **Global**: promedio de las 10 semillas. El marco fiscal se informa aparte.", "**Aparte**: el avance solo con dato (26.7%) y los puntos que restan los no verificables (3.8).", "**Ritmo**: metas acumulativas y montos se comparan con la parte del mandato transcurrida a la fecha del dato."]}], "_n": 8, "_n_texto": "08", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "Cómo medimos", "bloques": [{"b": "titulo", "texto": "Ninguna semilla va al ritmo del mandato"}, {"b": "texto", "parrafos": ["El promedio de las 10 semillas es 22.9%, con 68.7% del mandato transcurrido. La más avanzada, Función pública (Semilla 9), llega a 38.7%; la más rezagada, Ciudadanía sin fronteras (8), queda en 0.0%, y Nuevo contrato social (10), en 8.3%. Las demás: Infraestructura (4), 37.3%; Seguridad (6), 35.8%; Desnutrición (3), 29.2%; Desarrollo social (1), 26.6%; Tecnología (5), 18.4%; Naturaleza (7), 18.2%, y Protección social (2), 16.8%. El marco fiscal (44.9%) se mide aparte, en el capítulo 11; la tabla 1 da cada semilla con y sin los compromisos sin dato."]}, {"b": "figura", "id": "avance-semillas", "tipo": "papel", "kicker": "Plan de Gobierno · avance por semilla · %", "titular": "Las 10 semillas, por debajo de 68.7%", "indice": "Avance por semilla", "derivado": true, "grafico": {"tipo": "barras_h", "id": "aud-c01", "orden": "desc", "formato": {"prefijo": "", "sufijo": "", "decimales": 1, "miles": true, "escala": 1}, "items": [{"nombre": "Semilla 1", "valor": 26.6}, {"nombre": "Semilla 2", "valor": 16.8}, {"nombre": "Semilla 3", "valor": 29.2}, {"nombre": "Semilla 4", "valor": 37.3}, {"nombre": "Semilla 5", "valor": 18.4}, {"nombre": "Semilla 6", "valor": 35.8}, {"nombre": "Semilla 7", "valor": 18.2}, {"nombre": "Semilla 8", "valor": 0.0}, {"nombre": "Semilla 9", "valor": 38.7}, {"nombre": "Semilla 10", "valor": 8.3}], "aria": "Barras horizontales: avance de cada una de las 10 semillas, ordenado de mayor a menor."}, "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "pie": "Promedio simple de los compromisos de cada  {"c": ["Marco fiscal (aparte)", "24 de 24", "44.9", "44.9"]}], "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "pie": "Compromisos con dato oficial sobre los de cada semilla, espejos incluidos; los no atribuibles cuentan como con dato, con 0. Promedios simples: 229.3 ÷ 10 = 22.9 (22.93 redondeado) y 267.3 ÷ 10 = 26.7 (26.73 redondeado), cálculo propio. La segunda fuente reproduce el cálculo.", "_n": "Tabla 1"}], "_n": 10, "_n_texto": "10", "_mostrar_numero": true}, {"tipo": "cuerpo", "id": "estado-pag", "seccion": "Cómo medimos", "bloques": [{"b": "titulo", "texto": "Qué se pudo medir y en qué estado está"}, {"b": "texto", "parrafos": ["Hay dato oficial para 120 de los 133 compromisos distintos, incluidos los 24 del marco fiscal. Están cumplidos 10 (6 en las semillas, con el piso de cemento contado una vez, y 4 en el marco fiscal), el 7.5% de los 133 (10 ÷ 133, cálculo propio); los otros 123, el 92.5%, no están cumplidos: en proceso, anunciados, sin iniciar, incumplidos, en retroceso, no atribuibles o sin dato oficial. Por estado: en proceso, 68; anunciados, 9; sin iniciar, 20; incumplidos, 2; en retroceso, 7, y no atribuibles, 4: la evaluación educativa, el adulto mayor, la estrategia del IGSS y el IGSS para migrantes tienen dato, pero ya existían o ya se cumplían antes del mandato. Los 13 restantes no son verificables: no tienen dato oficial."]}, {"b": "figuras", "items": [{"id": "avance-global", "tipo": "tarjeta", "desde": "investigacion/2026-10-13-cumplimiento-plan-semilla/tarjetas-informe/tarjeta_2.png", "indice": "Avance global con y sin dato", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "pie": "Avance global (22.9%), con dato (26.7%) y los 3.8 puntos que restan los 13 sin dato oficial. La segunda fuente reproduce el cálculo.", "_n": "Figura 2", "_src": "figuras/fig_01.png"}, {"id": "estados-global", "tipo": "tarjeta", "desde": "investigacion/2026-10-13-cumplimiento-plan-semilla/tarjetas-informe/tarjeta_ n dato oficial o no atribuible cuenta 0. La segunda fuente reproduce el cálculo.", "_n": "Figura 4"}, {"b": "texto", "parrafos": ["Si se promedian los 109 compromisos uno por uno, sin agruparlos por semilla, el avance es 25.6%. No es el avance global (22.9%): el global promedia las 10 semillas, cada una con el mismo peso, y los 7 espejos cuentan en las dos semillas donde aparecen. Los puntajes son los mismos; cambia cómo se agregan.", "La semilla que más avanza lo muestra: a Función pública (38.7%) la empujan hitos, como los foros anticorrupción, cumplidos, mientras su monto, Q1,500 millones para gestión pública, va en 7 de 100 (capítulo 09)."]}], "_n": 12, "_n_texto": "12", "_mostrar_numero": true}, {"tipo": "cuerpo", "id": "hacia-atras", "seccion": "Lo que va hacia atrás", "indice": {"titulo": "Lo que va hacia atrás"}, "bloques": [{"b": "titulo", "texto": "Lo que va hacia atrás"}, {"b": "texto", "parrafos": ["En este método, un compromiso está en **retroceso** cuando su indicador está peor que en 2023, antes del mandato, aunque sea por poco; cuenta 0. Son 7 de 133: tres de Desarrollo social, uno de Infraestructura, dos de Seguridad y uno del marco fiscal (tabla 2). Cada fila remite a la página del capítulo que explica por qué."]}, {"b": "tabla", "id": "retrocesos", "indice": "Los 7 retrocesos", "columnas": [{"t": "Compromiso", "ancho": 200}, {"t": "2023", "num": true}, {"t": "Último dato", "num": true}, {"t": "Cambio", "num": true}, {"t": "Pág.", "num": true, "ancho": 44}], "filas": [{"c": ["S1-02 · Matrícula oficial", "3,163,681", "3,149,866 (2025)", "−13,815", "17"]}, {"c": ["S1-10 · Artes del MCD", "Q155.0 M", "Q147.9 M (2025)", "−4.58%", "20"]}, {"c": ["S1-11 · Patrimonio del MCD", "Q253.6 M", "Q165.9 M (2025)", "−34.59%", "20"], "dest": true}, {"c": ["S4-05 · Mantenimiento vial", "11,852 km", "11,117 km (2025)", "−735 km", "52"]}, {"c": ["S6-02 · Extorsiones (tasa)", "102.11", "102.13 (ago-2026)", "+0.02", "65"]}, {"c": ["S6-11 · Homicidios (tasa)", "16.61", odos los demás tramos; IVA, ISR e IDP no subieron. Aun así, el plan prometía no subir impuestos. El PIB de 2025 creció, pero no llegó al Q1 billón previsto; las proyecciones de Banguat lo superan en 2026."]}, {"b": "caja", "etiqueta": "Cómo leer estos datos", "items": ["**Extorsiones**: son denuncias, no hechos; la tasa es de 12 meses por 100 mil habitantes.", "**Caminos**: km programados en el plan anual de Covial, no ejecutados; los tipos de trabajo de 2023 y 2025 se nombran distinto.", "**Cultura**: devengado en quetzales corrientes, sin ajustar por inflación.", "**PIB**: las cifras de 2023 a 2025 son preliminares."]}], "_n": 14, "_n_texto": "14", "_mostrar_numero": true}, {"tipo": "capitulo", "id": "cap01", "variante": "banda", "numero": "01", "kicker": "Capítulo 01 · Semilla 1", "titulo": "Desarrollo social", "titulo_corto": "Social", "descripcion": "Educación, salud, vivienda y empleo: 40 compromisos", "lead": "La semilla más grande del plan reúne 40 compromisos de educación, cultura, salud, vivienda, servicios y empleo. Avanza 26.6%, con 68.7% del mandato transcurrido; 34 de los 40 tienen dato oficial.", "bloques": [{"b": "texto", "parrafos": ["Lo prometido es sobre todo dinero y metas: montos para educación, salud, vivienda y empleo en 2024–2027, más estudiantes, aulas, libros, puestos de salud, electricidad para todos, formación para el trabajo y créditos blandos.", "Tres están cumplidos: el alza del presupuesto del MSPAS en cada año, los pisos de cemento y la Bolsa de Empleo. Veinte siguen en proceso, 2 anunciados, 5 sin iniciar y 3 en retroceso: la matrícula oficial y el gasto del MCD en artistas y en patrimonio. La evaluación de la calidad educativa no es atribuible al mandato y cuenta 0: Graduandos se aplica desde 2013.", "Seis no tienen dato oficial y cuentan cero: los baños escolares, los 7 millones más de atendidos en salud, el monto para vivienda y servicios, y las metas de agua potable, saneamiento y tratamiento de aguas."], "margen": [{"termino": duandos con logro en Lectura y Matemáticas, 2013 a 2025.", "etiquetasX": ["2013", "2014", "2015", "2016", "2017", "2018", "2019", "2022", "2023", "2024", "2025"]}, "alto": 190, "fuente": "Mineduc/Digeduca, Informes Graduandos", "pie": "Sin evaluación en 2020 y 2021. La serie empieza en 2013: la evaluación es anterior al mandato (ficha S1-07). La segunda fuente reproduce la primaria.", "_n": "Figura 7"}]}, {"b": "texto", "parrafos": ["En Matemáticas, el logro de los graduandos subió de 10.07% en 2023 a 16.2% en 2025; en Lectura, de 31.73% a 35.38% (figura 7). No hay un programa formal contra la deserción, pero desde 2024 opera la Estrategia de Nivelación de Aprendizajes: por eso el compromiso puntúa 50, como hito en proceso. La deserción en básico bajó de 13.54% en 2024 a 12.63% en 2025."]}], "_n": 17, "_n_texto": "17", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "titulo", "texto": "Institutos, aulas, docentes y baños"}, {"b": "texto", "parrafos": ["Ninguno de los 8 institutos de excelencia funciona: al 24 de agosto de 2026 los primeros 6 estaban en pre-bases en Guatecompras y la construcción empieza en 2027 (0 de 100). El único conteo ligado a aulas son 49 establecimientos equipados con laboratorios y talleres en 2025, que mide establecimientos y no aulas (0.1 de 100).", "La nueva formación inicial docente está solo anunciada (25): el FID con la Usac sigue con el modelo de 2009 —718 becados universitarios y 4,305 inscritos en la etapa preparatoria en 2024— y la Memoria 2024 anuncia que se actualizará el convenio.", "Los 36,000 baños escolares no tienen dato oficial y cuentan 0: no hay cifra de baños nuevos en 2024–2026; el diagnóstico de 2024 halló 5,386 escuelas sin agua y 21,062 con baños por reparar."]}, {"b": "cita", "etiqueta": "En una frase", "texto": "Ningún instituto de excelencia funciona."}], "_n": 18, "_n_texto": "18", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "titulo", "texto": "Cultura: dos programas con menos gasto"}, {"b": "texto", "parrafos": ["Dos de los cinco compromisos de cultura están en proceso (50 cada uno): en 2025 el MCD creó la Dirección General de Interculturalidad, con Q8.3 millones vigentes y Q0.7 millones devengados, y la Biblioteca Nacional digitalizó 120,252 documentos o páginas, aunque no hay Biblioteca Nacional ni Centro Cultural en formato virtual. El fondo de Q125 millones para contenidos no aparece en el presupuesto del MCD de 2025 ni de 2026: está sin iniciar."]}, {"b": "figura", "id": "s1-cultura", "tipo": "papel", "kicker": "Semilla 1 · cultura · avance 0–100", "titular": "Artistas y patrimonio, en retroceso", "indice": "S1 · cultura", "derivado": true, "grafico": {"tipo": "barras_h", "id": "aud-c11", "orden": "desc", "formato": {"prefijo": "", "sufijo": "", "decimales": 1, "miles": true, "escala": 1}, "items": [{"nombre": "+30% para artistas del MCD", "valor": 0.0}, {"nombre": "Patrimonio cultural", "valor": 0}, {"nombre": "Diversidad cultural", "valor": 50}, {"nombre": "Cultura y Biblioteca virtuales", "valor": 50}, {"nombre": "Fondo de Q125 M de contenidos", "valor": 0}], "aria": "Barras horizontales: avance de cada compromiso, de 0 a 100, ordenado de mayor a menor; sin dato oficial cuenta 0."}, "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "pie": "Compromisos S1-10 a S1-14. La segunda fuente reproduce el cálculo. Cada barra, con su hallazgo, su fuente y su cálculo, en la tabla 5 (p. 27).", "_n": "Figura 8"}, {"b": "texto", "parrafos": ["El devengado del programa de artes bajó 4.58% de 2023 a 2025, frente al alza de 30% prometida, y el de patrimonio, 34.59%: los dos están en retroceso y cuentan 0 (figura 8, tabla 4)."]}, {"b": "tabla", "id": "mcd-programas", "indice": "Devengado del MCD, 2023 y 2025", "columnas": [{"t": "Devengado (quetzales)", "ancho": 200}, {"t": "2023", "num": true}, {"t": "2025", "num": true}, {"t": "Variación %", "num": true}], "filas": [{"c": ["11 · Artes (formación y difusión)", "155,039,376.85", "147,937,290.3", "−4.58"]}, {"c": ["12 · Patrimonio (restauración)", "253,604,080.59", "165,891,582.08", "−34.59"], "dest": true}, {"c": ["Total del MCD", "815,524,520.39", "624,423,391.27", "−23.43"], "total": true}], "fuente": "MCD, Memoria de Labores 2025; MCD/Sicoin, analíticos 2023", "pie": "Quetzales corrientes. Variación: cálculo propio de la fuente. La segunda fuente reproduce la primaria.", "_n": "Tabla 4"}], "_n": 19, "_n_texto": "19", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "titulo", "texto": "Artes y patrimonio: menos gasto que en 2023"}, {"b": "texto", "parrafos": ["El plan prometía 30% más para los artistas y el personal de las artes. El programa 11 del MCD (formación, fomento y difusión de las artes) devengó en 2025 un 4.58% menos que en 2023 (figura 9), aunque su presupuesto vigente subió: se asignó más y se gastó menos. Por eso está en retroceso y cuenta 0.", "También prometía proteger el patrimonio cultural. El programa 12, que restaura y preserva museos, sitios y la Biblioteca Nacional, devengó 34.59% menos, un tercio menos (figura 10), y su vigente también bajó. En 2026 tiene Q213.34 millones vigentes. Los montos están en la tabla 4."]}, {"b": "figuras", "items": [{"id": "t12-artes", "tipo": "tarjeta", "desde": "investigacion/2026-10-13-cumplimiento-plan-semilla/hilo/tuit_12.png", "indice": "Artes del MCD, 2023 y 2025", "fuente": "MCD, Memoria de Labores 2025 y Sicoin 2023", "pie": "Retroceso 2 de 7: devengado del programa 11 en quetzales corrientes, sin deflactar.", "_n": "Figura 9", "_src": "figuras/fig_04.png"}, {"id": "t13-patrimonio", "tipo": "tarjeta", "desde": "investigacion/2026-10-13-cumplimiento-plan-semilla/hilo/tuit_13.png", "indice": "Patrimonio del MCD, 2023–2025", "fuente": "MCD, Memoria de Labores 2025 y Sicoin 2023", "pie": "Retroceso 3 de 7: devengado del programa 12 en quetzales corrientes, sin deflactar.", "_n": "Figura 10", "_src": "figuras/fig_05.png"}]}], "_n": 20, "_n_texto": "20", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "titulo", "texto": "Salud: presupuesto arriba, obras lejos"}, {"b": "texto", "parrafos": ["El MSPAS devengó Q30,252.7 millones de 2024 al 30 de marzo de 2026, el 49.6 de 100 del monto prometido. Su presupuesto vigente subió en cada uno de los tres años: es el único compromiso de salud cumplido."]}, {"b": "figura", "id": "s1-salud", "tipo": "papel", "kicker": "Semilla 1 · salud · avance 0–100", "titular": "Presupuesto cumplido; CAP y puestos, lejos", "indice": "S1 · salud", "derivado": true, "grafico": {"tipo": "barras_h", "id": "aud-c11", "orden": "desc", "formato": {"prefijo": "", "sufijo": "", "decimales": 1, "miles": true, "escala": 1}, "items": [{"nombre": "Q61 millardos en salud", "valor": 49.6}, {"nombre": "7 millones más atendidos", "valor": 0.0}, {"nombre": "400 puestos de salud", "valor": 20.5}, {"nombre": "50 CAP nuevos", "valor": 4.0}, {"nombre": "Hospital de cáncer", "valor": 50}, {"nombre": "Reestructurar la Unaerc", "valor": 25}, {"nombre": "Atención intercultural", "valor": 50}, {"nombre": "Medicinas para crónicos", "valor": 0}, {"nombre": "Garantía de vacunación", "valor": 50}, {"nombre": "Red de farmacias públicas", "valor": 50}, {"nombre": "Más presupuesto al MSPAS", "valor": 100.0}], "aria": "Barras horizontales: avance de cada compromiso, de 0 a 100, ordenado de mayor a menor; sin dato oficial cuenta 0."}, "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "pie": "Compromisos S1-15 a S1-25. Siete millones más de atendidos: sin dato oficial, cuenta 0. La segunda fuente reproduce el cálculo. Cada barra, con su hallazgo, su fuente y su cálculo, en la tabla 5 (p. 27).", "_n": "Figura 11"}, {"b": "texto", "parrafos": ["Se documentan 82 puestos de salud intervenidos (40 nuevos y 42 remozados) y 2 CAP nuevos, frente a 400 puestos y 50 CAP (20.5 y 4 de 100). La página siguiente explica los hitos de la figura 11."]}], "_n": 21, "_n_texto": "21", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "texto", "parrafos": ["El hospital de cáncer puntúa 50, en proceso: el convenio con Taiwán por US$35 millones se firmó en febrero de 2026 y hay terreno en la zona 13, sin obra a octubre de 2026.", "También están en proceso la atención intercultural —en 2025 se aprobó el Modelo de Atención Integral e Incluyente (MAIIS-RAS), con un estipendio a comadronas en 7 departamentos— y la red de farmacias: no se creó una empresa estatal, pero la red pública Proam sumó 28 farmacias en 2025 y tenía 214 al 27 de marzo de 2026.", "La reestructuración de la Unaerc está solo anunciada (25): en diciembre de 2025 el MSPAS presentó la estrategia Salud Renal 2030, sin acuerdo de reestructuración. Las medicinas para crónicos están sin iniciar (0): no se halló un programa de adscripción con entrega de medicamentos; el MSPAS los ofrece a bajo costo en las farmacias Proam.", "Los 7 millones más de atendidos no tienen dato oficial y cuentan 0: el MSPAS no publica las personas atendidas en el primer nivel ni en 2023 ni en el mandato. El único compromiso de salud cumplido es el alza del presupuesto del MSPAS en cada año (página siguiente)."]}, {"b": "caja", "etiqueta": "Los 11 compromisos de salud", "items": ["Cumplido (100): más presupuesto al MSPAS.", "En proceso: hospital de cáncer, atención intercultural, vacunación y red de farmacias (50 cada uno), el monto (49.6), los puestos (20.5) y los CAP (4).", "Anunciado (25): Unaerc. Sin iniciar (0): medicinas para crónicos. Sin dato (0): 7 millones más atendidos."]}], "_n": 22, "_n_texto": "22", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "titulo", "texto": "La pentavalente bajó a 77% en 2025"}, {"b": "texto", "parrafos": ["Las estimaciones de OMS y UNICEF ubican la tercera dosis de pentavalente (DTP3) en 77% en 2025, frente a 88% en 2023. La primera dosis contra el sarampión pasó de 89% a 90% y la segunda, de 78% a 84%."]}, {"b": "figura", "id": "vacunas", "tipo": "papel", "kicker": "Vacunación · cobertura en menores · %", "titular": "La DTP3 cae; el sarampión se mantiene", "indice": "Vacunación, 2016–2025", "leyenda": [{"texto": "DTP3 (pentavalente)", "estilo": "dest", "forma": "linea"}, {"texto": "Sarampión, 1.ª dosis", "estilo": "fuerte", "forma": "linea"}, {"texto": "Sarampión, 2.ª dosis", "estilo": "base", "forma": "linea"}], "grafico": {"tipo": "linea", "max": 100, "sufijo": "%", "etiquetas": ["2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"], "series": [{"nombre": "Sarampión, 2.ª dosis", "id": "sal-c10", "valores": [67, 89, 78, 78, 79, 79, 71, 78, 79, 84]}, {"nombre": "Sarampión, 1.ª dosis", "id": "sal-c09", "valores": [89, 94, 89, 90, 89, 88, 86, 89, 91, 90]}, {"nombre": "DTP3", "id": "sal-c08", "destacar": true, "valores": [83, 91, 85, 88, 90, 80, 81, 88, 90, 77]}], "aria": "Líneas: cobertura de vacunación DTP3 y de las dos dosis contra el sarampión, 2016 a 2025; DTP3 destacada.", "etiquetasX": ["2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]}, "alto": 280, "fuente": "OMS/UNICEF WUENIC vía GHO", "pie": "Estimaciones WUENIC de cobertura; la segunda dosis, sobre su cohorte. La segunda fuente reproduce la primaria.", "_n": "Figura 12"}, {"b": "texto", "parrafos": ["El presupuesto vigente del MSPAS pasó de Q11,327.5 millones en 2023 a Q14,854.8 millones en 2024, Q15,200.0 millones en 2025 y Q16,537.7 millones en 2026: subió en cada año y el compromiso está cumplido. La garantía de vacunación puntúa 50, como hito en proceso: en 2025 se añadieron varicela y hexavalente al esquema."]}], "_n": 23, "_n_texto": "23", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "titulo", "texto": "Vivienda y servicios: pisos sí, agua sin dato"}, {"b": "texto", "parrafos": ["El programa de pisos de la estrategia Mano a Mano construyó más de 50,000 en 2025 y 11 municipios fueron declarados libres de piso de tierra. El Fopavi pagó Q303.1 millones en subsidios en 2024–2025, frente a Q4,000 millones prometidos (7.6 de 100)."]}, {"b": "figura", "id": "s1-viv", "tipo": "papel", "kicker": "Semilla 1 · vivienda y servicios · avance 0–100", "titular": "Pisos cumplidos; agua y drenaje, sin dato", "indice": "S1 · vivienda y servicios", "derivado": true, "grafico": {"tipo": "barras_h", "id": "aud-c11", "orden": "desc", "formato": {"prefijo": "", "sufijo": "", "decimales": 1, "miles": true, "escala": 1}, "items": [{"nombre": "Q22 millardos en vivienda", "valor": 0.0}, {"nombre": "Q4 millardos para vivienda", "valor": 7.6}, {"nombre": "Piso de cemento", "valor": 100}, {"nombre": "Agua potable 88→95%", "valor": 0.0}, {"nombre": "Saneamiento 46→85%", "valor": 0.0}, {"nombre": "Tratamiento de agua 49→80%", "valor": 0.0}, {"nombre": "Electricidad para todos", "valor": 11.6}], "aria": "Barras horizontales: avance de cada compromiso, de 0 a 100, ordenado de mayor a menor; sin dato oficial cuenta 0."}, "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "pie": "Compromisos S1-26 a S1-32. Sin dato oficial, cuentan 0: monto de vivienda y servicios, agua, saneamiento y tratamiento. La segunda fuente reproduce el cálculo. Cada barra, con su hallazgo, su fuente y su cálculo, en la tabla 5 (p. 27).", "_n": "Figura 13"}, {"b": "texto", "parrafos": ["La cobertura eléctrica pasó de 90.39% en 2023 a 91.5% en 2025: recorrió 11.6 de 100 del camino a la cobertura total, (91.5 − 90.39) ÷ (100 − 90.39), cálculo propio (figura 13). Agua por tubería, drenaje y aguas tratadas no tienen una medición oficial comparable entre 2023 y 2025: la ENDESA 2025 da 93% de la población con agua al menos básica, un indicador distinto al del plan.", "El monto de Q22 millardos para vivienda, agua, saneamiento y electrificación no tiene dato oficial del devengado 2024–2026 y cuenta 0; como parcial, el programa de vivienda del CIV ejecutó Q131.2 millones de Q667.9 millones en 2024 (19.6%)."]}], "_n": 24, "_n_texto": "24", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "titulo", "texto": "Empleo: la Bolsa supera su meta"}, {"b": "texto", "parrafos": ["El Servicio Nacional de Empleo atendió a 150,240 personas en 2024–2025, por encima de su meta; son personas orientadas e intermediadas, no colocadas. Salvo la capacitación del Mineco, las demás metas de empleo avanzan poco."]}, {"b": "figura", "id": "s1-emp", "tipo": "papel", "kicker": "Semilla 1 · empleo · avance 0–100", "titular": "Bolsa cumplida; créditos y formación, lejos", "indice": "S1 · empleo", "derivado": true, "grafico": {"tipo": "barras_h", "id": "aud-c11", "orden": "desc", "formato": {"prefijo": "", "sufijo": "", "decimales": 1, "miles": true, "escala": 1}, "items": [{"nombre": "Q6.9 millardos para empleo", "valor": 16.4}, {"nombre": "200,000 formados para trabajar", "valor": 3.6}, {"nombre": "100,000 en Bolsa de Empleo", "valor": 100.0}, {"nombre": "1 millón en empleo temporal", "valor": 0}, {"nombre": "50,000 emprendedores", "valor": 57.0}, {"nombre": "22 centros de emprendimiento", "valor": 0.0}, {"nombre": "50,000 créditos blandos", "valor": 3.1}, {"nombre": "Cooperativismo", "valor": 50}], "aria": "Barras horizontales: avance de cada compromiso, de 0 a 100, ordenado de mayor a menor; sin dato oficial cuenta 0."}, "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "pie": "Compromisos S1-33 a S1-40. La segunda fuente reproduce el cálculo. Cada barra, con su hallazgo, su fuente y su cálculo, en la tabla 5 (p. 27).", "_n": "Figura 14"}, {"b": "texto", "parrafos": ["El Mintrab reporta 7,284 personas formadas y certificadas en 2024–2025 (3.6 de 100) y los créditos blandos del Fondo MIPYME y de Tob'anik suman 1,537 en 2025 (3.1). El Mineco capacitó a más de 28,500 personas en 2025 (57.0). No se halló un programa de empleo temporal masivo (0)."]}], "_n": 25, "_n_texto": "25", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "01 · Desarrollo social", "bloques": [{"b": "texto", "parrafos": ["El programa de empleo del Mintrab y el total del Mineco devengaron Q1,133.7 millones en 2024–2025, frente a Q6,900 millones prometidos (16.4 de 100). El Mineco tiene 15 sedes de dinamización económica, las mismas en 2025 y en febrero de 2026: ninguna nueva frente a las 22 prometidas (0).", "El cooperativismo está en proceso (50): en 2025 el CHN colocó Q421.95 millones del fondo Tob'anik en 10 cooperativas de ahorro y crédito, sin una política específica del Inacop (figura 14). La Bolsa de Empleo está cumplida: 150,240 personas atendidas frente a 100,000 prometidas."]}, {"b": "cita", "etiqueta": "En una frase", "texto": "Atendidos no es lo mismo que colocados."}], "_n": 26, "_n_texto": "26", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra"}, {"b": "tabla", "id": "fichas-1", "indice": "Fichas de cumplimiento · Semilla 1", "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-01", "Q110 millardos en educación", "En proceso", "Q64,642.48 M ÷ Q110,000 M = 58.8%", "58.8%"], "detalle": "El Mineduc devengó Q64,642.5 M entre 2024 y el 31-ago-2026 (Q22,399.4 M en 2024, Q24,145.4 M en 2025 y Q18,097.8 M en 2026 a la fecha), frente a Q110,000 M prometidos para 2024–2027. Ritmo: rezagado (con 65.7% del mandato a la fecha del dato). Fuente: Mineduc, Tableros de rendición de cuentas dic-2025 y ago-2026; Memoria 2024 (Sicoin) · 2026-08-31.", "dest": false, "b": [0]}, {"c": ["S1-02", "540,000 estudiantes más", "Retroceso", "(3,149,866 − 3,163,681) ÷ 540,000 = −2.6% → 0", "0%"], "detalle": "La matrícula del sector oficial fue de 3,149,866 en 2025 frente a 3,163,681 en 2023 (−13,815). A febrero de 2026 el Mineduc reportó 150,000 inscritos más que un año antes. Meta: +540,000. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: Mineduc: Memoria 2023 (SIRE) y ministra Giracca vía AGN (mar-2026) · 2025.", "dest": false, "b": [0]}, {"c": ["S1-03", "70,000 aulas y laboratorios", "En proceso", "49 ÷ 70,000 = 0.1%", "0.1%"], "detalle": "El único conteo oficial del mandato son 49 establecimientos equipados con laboratorios y talleres en 2025. No hay cifra de aulas nuevas: los 504 institutos de 2025 usan infraestructura existente y los módulos de 2024 son temporales. Meta: 70,000. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: Informe Presidencial 2025 (Segeplán, ene-2026); Mineduc, Memoria 2024; CIV vía AGN · 2025-12.", "dest": false, "b": [0]}, {"c": ["S1-04", "29.5 millones de libros", "En proceso", "24,108,803 ÷ 29,500,000 = 81.7%", "81.7%"], "detalle": "El Mineduc reporta 2,108,803 textos distribuidos en 2024 y 11 millones entregados en cada ciclo 2025 y 2026: 24,108,803 en total frente a 29.5 millones de libros y guías prometidos. Ritmo: en ritmo (con 53.1% del mandato a la fecha del dato). Fuente: Mineduc, Memoria 2024; ministra Giracca vía La Hora (feb-2025) y AGN (feb-2026) · 2026-02.", "dest": false, "b": [0]}, {"c": ["S1-05", "36,000 baños escolares", "No verificable", "No verificable: cuenta 0", "0%*"], "detalle": "Sin dato oficial de baños nuevos ni de escuelas con agua en 2024–2026. El diagnóstico de 2024 halló 5,386 escuelas sin agua y 21,062 con baños por reparar; los 22,200 remozamientos incluyen baños, sin conteo. Meta: 36,000 baños. No verificable: Cuenta 0 por falta de dato. Se buscó en el Informe Presidencial 2025, la Memoria 2024 y los tableros de rendición de cuentas del Mineduc (sin metas físicas de obra), AGN, Prensa Latina y La Hora: el diagnóstico de 2024 es la línea de base del mandato, pero no hay medición posterior de escuelas con agua ni conteo de baños construidos; los remozamientos reparan baños sin cifra separada. Fuente: Informe Presidencial 2025 (Segeplán); diagnóstico Mineduc 2024 vía La Hora · 2025-12.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 5"}], "_n": 27, "_n_texto": "27", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-1-2", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-06", "Nueva formación inicial docente", "Anunciado", "Hito: anunciado = 25", "25%"], "detalle": "El FID con la Usac sigue con el modelo de 2009: 718 becados universitarios y 4,305 inscritos en la etapa preparatoria en 2024. La Memoria 2024 anuncia que se actualizará el convenio, sin un programa nuevo aprobado. Fuente: Mineduc, Memoria de Labores 2024 · 2024.", "dest": false, "b": [0]}, {"c": ["S1-07", "Evaluación de calidad educativa", "No atribuible", "No atribuible: cuenta 0", "0%"], "detalle": "Digeduca aplicó Graduandos en 2024 (146,833 evaluados) y 2025 (147,199), una evaluación que ya existía: hay resultados desde 2013 y 133,978 evaluados en 2023. No atribuible: la evaluación de Graduandos de Digeduca existe desde antes (resultados publicados desde 2013; 133,978 evaluados en 2023) y en 2024–2025 solo siguió aplicándose; no se halló una evaluación nueva del mandato. Fuente: Mineduc/Digeduca: Informe Graduandos 2024, Resultados 2025; Memoria 2024 · 2026-02.", "dest": false, "b": [0]}, {"c": ["S1-08", "Programa contra la deserción", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "No hay programa formal contra la deserción; opera la Estrategia de Nivelación de Aprendizajes desde 2024. La deserción en básico bajó de 13.54 % en 2024 a 12.63 % en 2025 y en diversificado de 10.19 % a 9.44 %. Fuente: Mineduc, Anuario Estadístico (SIRE) 2024–2025; Memoria de Labores 2024 · 2025.", "dest": false, "b": [0]}, {"c": ["S1-09", "8 institutos de excelencia", "Sin iniciar", "0 ÷ 8 = 0.0%", "0%"], "detalle": "Al 24-ago-2026 no funciona ningún instituto regional de excelencia: los primeros 6 están en pre-bases en Guatecompras y la construcción empieza en 2027 (Q350 M previstos para 10). Meta: 8 institutos. Ritmo: muy rezagado (con 65.2% del mandato a la fecha del dato). Fuente: Presidencia vía Emisoras Unidas (24-ago-2026); AGN (16-abr-2026) · 2026-08-24.", "dest": false, "b": [0]}, {"c": ["S1-10", "+30% para artistas del MCD", "Retroceso", "−4.58 ÷ 30 = −15.3% → 0", "0%"], "detalle": "El devengado del programa 11 de Artes del MCD bajó de Q155.0 M en 2023 a Q147.9 M en 2025 (−4.6 %); su vigente subió de Q156.9 M a Q176.5 M. Meta: +30 % en las asignaciones para artistas y personal del MCD. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: MCD, Memoria de Labores 2025; MCD/Sicoin, informes cuatrimestrales 2023 · 2025-12.", "dest": false, "b": [0]}, {"c": ["S1-11", "Patrimonio cultural", "Retroceso", "Hito: retroceso = 0", "0%"], "detalle": "El devengado del programa 12 de patrimonio del MCD (museos, sitios, Biblioteca Nacional) cayó de Q253.6 M en 2023 a Q165.9 M en 2025 (−34.6 %) y su vigente, de Q255.1 M a Q188.4 M. En 2026 tiene Q213.3 M vigentes. Fuente: MCD, Memoria de Labores 2025; MCD/Sicoin, informes cuatrimestrales 2023 · 2025-12.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 6"}], "_n": 28, "_n_texto": "28", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-1-3", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-12", "Diversidad cultural", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "En 2025 el MCD creó la Dirección General de Interculturalidad y el programa 15, con Q8.3 M vigentes y Q0.7 M devengados (8.4 %); en 2026 tiene Q15.6 M vigentes y meta de 3,512 beneficiarios. No hay una política nueva de diversidad cultural. Fuente: MCD, Memoria de Labores 2025 y Estrategia de calidad del gasto 2026 · 2026-03.", "dest": false, "b": [0]}, {"c": ["S1-13", "Cultura y Biblioteca virtuales", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "No hay Biblioteca Nacional ni Centro Cultural en formato virtual. En 2025 la Biblioteca Nacional digitalizó 120,252 documentos o páginas, y desde dic-2024 el portal del MCD aloja una Biblioteca Digital de Editorial Cultura con dos colecciones. Fuente: MCD, Memoria de Labores 2025; portal del MCD (API de WordPress, consultado 14-oct-2026) · 2025-11.", "dest": false, "b": [0]}, {"c": ["S1-14", "Fondo de Q125 M de contenidos", "Sin iniciar", "Hito: sin iniciar = 0", "0%"], "detalle": "El fondo de Q125 M no aparece en el presupuesto del MCD: ni entre sus programas de 2025 y 2026 ni en sus transferencias de 2025 (Q46.5 M a entidades como ADESCA, Cerlalc y FILGUA). Tampoco hay una línea así en los programas del Mineduc. Fuente: MCD, Memoria de Labores 2025 y Estrategia 2026; Mineduc, tableros de rendición de cuentas · 2026-03.", "dest": false, "b": [0]}, {"c": ["S1-15", "Q61 millardos en salud", "En proceso", "Q30,252.69 M ÷ Q61,000 M = 49.6%", "49.6%"], "detalle": "El MSPAS devengó Q30,252.7 M en 2024–2026 (Q13,256.5 M en 2024, Q13,987.2 M en 2025 y Q3,009.1 M en 2026 al 30 de marzo), frente a Q61,000 M prometidos para 2024–2027. Ritmo: rezagado (con 55.2% del mandato a la fecha del dato). Fuente: Minfin-Sicoin (Guate en Datos) y Transparencia Minfin vía Prensa Libre · 2026-03-30.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 7"}], "_n": 29, "_n_texto": "29", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-1-4", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-16", "7 millones más atendidos", "No verificable", "No verificable: cuenta 0", "0%*"], "detalle": "Sin dato oficial: el MSPAS no publica personas atendidas en el primer nivel en 2023 ni en el mandato, así que los 7 millones más prometidos no se pueden medir. Cuenta 0 en el puntaje. No verificable: Revisión 2026-10-14: se buscó de nuevo (9 búsquedas): memorias de labores 2024 y 2025 del MSPAS (mspas.gob.gt bloquea las descargas con 403); memorias de vigilancia de epidemiologia.mspas.gob.gt (la última publicada es de 2020); SIGSA y datos abiertos (sin serie de consultas 2023–2026); Informe Presidencial 2025 (da 4,374 servicios del primer nivel, no personas atendidas); primer informe de enero de 2025 (sin PDF en sgp.gob.gt, 404); metas físicas del MSPAS en Sicoin y en los proyectos de presupuesto (solo metas programadas, no ejecutadas); seguimiento de la PGG en Segeplán (sin resultados). El único conteo de personas atendidas hallado es el Programa de Salud Escolar del Mineduc (222,704 escolares en 2024 y 1,106,819 a oct-2025, AGN), que sustituyó al seguro escolar anterior: no mide personas nuevas atendidas por el MSPAS y no se usa como indicador. Sin dato oficial, cuenta 0. Fuente: Búsqueda en MSPAS, SIGSA, Informe Presidencial 2025 y AGN.", "dest": false, "b": [0]}, {"c": ["S1-17", "400 puestos de salud", "En proceso", "82 ÷ 400 = 20.5%", "20.5%"], "detalle": "El MSPAS reporta 82 puestos de salud intervenidos a diciembre de 2025 (40 nuevos y 42 remozados), frente a 400 puestos con capacidad mejorada prometidos. Ritmo: muy rezagado (con 48.8% del mandato a la fecha del dato). Fuente: MSPAS vía AGN (27-dic-2025); Informe Presidencial 2025 · 2025-12-27.", "dest": false, "b": [0]}, {"c": ["S1-18", "50 CAP nuevos", "En proceso", "2 ÷ 50 = 4.0%", "4%"], "detalle": "Se documentan 2 CAP nuevos en el mandato (Patzún, inaugurado el 3 de marzo de 2025, y Tectitán, informado por el MSPAS como nuevo CAP el 18 de mayo de 2026) y 1 en construcción, frente a 50 prometidos. Ritmo: muy rezagado (con 58.5% del mandato a la fecha del dato). Fuente: MSPAS vía AGN (3-mar-2025, 18-may-2026) · 2026-05-18.", "dest": false, "b": [0]}, {"c": ["S1-19", "Hospital de cáncer", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "El convenio con Taiwán por US$35 M para el hospital de cáncer se firmó en febrero de 2026; a octubre de 2026 hay terreno en zona 13 y la obra no ha iniciado, frente a Q800 M prometidos. Fuente: Informe Presidencial 2025; MSPAS vía AGN y La Hora (jun-2026) · 2026-10-02.", "dest": false, "b": [0]}, {"c": ["S1-20", "Reestructurar la Unaerc", "Anunciado", "Hito: anunciado = 25", "25%"], "detalle": "No se halló acuerdo de reestructuración de la Unaerc; el MSPAS presentó la estrategia Salud Renal 2030 (dic-2025) y abrió una sede con 20 máquinas de hemodiálisis en Cuilapa (ene-2026). Fuente: MSPAS vía AGN (2024, 2026); OPS (dic-2025) · 2026-01-07.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 8"}], "_n": 30, "_n_texto": "30", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-1-5", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-21", "Atención intercultural", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "El Informe Presidencial 2025 reporta la aprobación en 2025 del Modelo de Atención Integral e Incluyente (MAIIS-RAS), que integra saberes ancestrales, y un estipendio a comadronas en 7 departamentos. Fuente: Informe Presidencial 2025 (Segeplán, ene-2026) · 2025-12-31.", "dest": false, "b": [0]}, {"c": ["S1-22", "Medicinas para crónicos", "Sin iniciar", "Hito: sin iniciar = 0", "0%"], "detalle": "No se halló un programa de adscripción voluntaria con entrega de medicamentos para crónicos; el MSPAS ofrece esos fármacos a bajo costo en 214 farmacias Proam (marzo de 2026). Fuente: Informe Presidencial 2025; MSPAS-Proam vía AGN (abr-2026) · 2026-04-03.", "dest": false, "b": [0]}, {"c": ["S1-23", "Garantía de vacunación", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "WUENIC estima la DTP3 (pentavalente) en 77 % en 2025, frente a 88 % en 2023; la SPR1 pasó de 89 % a 90 % y la SPR2 de 78 % a 84 %. En 2025 se añadieron varicela y hexavalente al esquema. Fuente: OMS/UNICEF WUENIC vía GHO; Informe Presidencial 2025 · 2025.", "dest": false, "b": [0]}, {"c": ["S1-24", "Red de farmacias públicas", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "No se creó una empresa estatal de farmacias; la red pública Proam sumó 28 farmacias en 2025 y tenía 214 en funcionamiento al 27 de marzo de 2026. Fuente: Informe Presidencial 2025; MSPAS-Proam vía AGN (abr-2026) · 2026-03-27.", "dest": false, "b": [0]}, {"c": ["S1-25", "Más presupuesto al MSPAS", "Cumplido", "3 ÷ 3 = 100.0%", "100%"], "detalle": "El presupuesto vigente del MSPAS subió en los 3 años: Q11,327.5 M en 2023, Q14,854.8 M en 2024, Q15,200.0 M en 2025 y Q16,537.7 M en 2026. En 2025 se publicó el Plan Maestro de las RISS. Fuente: Minfin-Sicoin (Guate en Datos); Transparencia Minfin vía Prensa Libre · 2026-03-30.", "dest": true, "b": [0]}, {"c": ["S1-26", "Q22 millardos en vivienda", "No verificable", "No verificable: cuenta 0", "0%*"], "detalle": "Sin dato oficial del devengado 2024–2026 de vivienda, agua, saneamiento y electrificación frente a Q22,000 M. Parciales: el programa de vivienda del CIV ejecutó Q131.2 M de Q667.9 M en 2024 (19.6 %). No verificable: Monto: se mide la ejecución desde ene-2024 (base_fecha). Se buscó en Sicoin (solo consulta interactiva), la ejecución por finalidad de Minfin (Urbanización y servicios comunitarios, Protección ambiental: no descargable), el informe de evaluación de la ejecución 2024 de Segeplán (sí: solo por programa) y su edición 2025 (no publicada o no hallada), memorias del CIV y prensa. Parciales: Codedes agua Q1,589.8 M y aguas residuales Q923.4 M vigentes a sep-2025 (38.3 % y 41.8 % ejecutado). Sin total, cuenta 0. Fuente: Segeplán con datos de Minfin (2024); Icefi con base en Sicoin; Minfin vía Guate en Datos · 2025.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 9"}], "_n": 31, "_n_texto": "31", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-1-6", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-27", "Q4 millardos para vivienda", "En proceso", "Q303.06 M ÷ Q4,000 M = 7.6%", "7.6%"], "detalle": "Fopavi pagó Q104.5 M en subsidios en 2024 y Q198.6 M en 2025 (al 16 de diciembre): Q303.1 M frente a Q4,000 M prometidos; otorgó 4,931 subsidios en 2025. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: CIV vía La Hora (2025); Prensa Libre (2024); Informe Presidencial 2025 · 2025.", "dest": false, "b": [0]}, {"c": ["S1-28", "Piso de cemento", "Cumplido", "Hito: cumplido = 100", "100%"], "detalle": "El programa de pisos de la estrategia Mano a Mano (Mides) construyó más de 50,000 pisos en 2025 y 11 municipios fueron declarados libres de piso de tierra en 2024–2025. Fuente: Informe Presidencial 2025 (Segeplán) · 2025.", "dest": true, "b": [0]}, {"c": ["S1-29", "Agua potable 88→95%", "No verificable", "No verificable: cuenta 0", "0%*"], "detalle": "Sin medición oficial comparable entre 2023 y 2025 del agua por tubería. La ENDESA 2025 (INE) da 93 % de la población con agua al menos básica (JMP: 92.97 % en 2023), pero mide población y otro indicador que la meta del plan (hogares con agua por tubería). No verificable: Primera medición del mandato; sin dos puntos comparables dentro del mandato, no_verificable (cuenta 0 y se menciona que la falta de dato empeora el caso). Base 88 % del plan no se usa. base_fecha 2023 correcta. Fuente: INE, ENDESA 2025 (infografía de calidad de agua, abr-2026) · 2025.", "dest": false, "b": [0]}, {"c": ["S1-30", "Saneamiento 46→85%", "No verificable", "No verificable: cuenta 0", "0%*"], "detalle": "Sin dato oficial posterior que mida el cambio. Al inicio del mandato (ago-2023 a sep-2024) 34.5 % de los hogares tenía inodoro conectado al alcantarillado (GCNN); la ENDESA 2025 no ha publicado ese indicador. No verificable: Base del mandato hallada: 33.0 % (inodoro privado) + 1.5 % (compartido) conectados al alcantarillado = 34.5 % de los hogares (cálculo propio, Cuadro D.6a). La base del plan (46 %) no se usa. Se buscaron ENCOVI 2023 (solo pobreza publicada), ENDESA 2025 (solo agua para beber), ENEI e Infom: sin medición posterior. El presupuesto de aguas residuales de los Codedes (Q923.4 M vigentes a sep-2025) no mide cobertura. Cuenta 0. Fuente: SESAN/INCAP/INE, evaluación final de la GCNN 2023/2024; Icefi con base en Sicoin · 2025.", "dest": false, "b": [0]}, {"c": ["S1-31", "Tratamiento de agua 49→80%", "No verificable", "No verificable: cuenta 0", "0%*"], "detalle": "Sin dato oficial del % de aguas tratadas en 2023 ni después frente a la meta de 80 %. Lo único medible es el presupuesto de aguas residuales de los Codedes: Q923.4 M vigentes a septiembre de 2025, 41.8 % ejecutado. No verificable: Se buscó en MARN (una revista de la USAC cita sus conteos de descargas y plantas de 2025, sin % de caudal tratado), Infom, Informe Presidencial 2025 (5.5 millones de m³ tratados en Amatitlán, norma municipal de saneamiento) y Segeplán. No hay serie del % de tratamiento desde 2023. Cuenta 0. Fuente: Icefi con base en Sicoin (2025) · 2025.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 10"}], "_n": 32, "_n_texto": "32", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-1-7", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-32", "Electricidad para todos", "En proceso", "(91.5 − 90.39) ÷ (100 − 90.39) = 11.6%", "11.6%"], "detalle": "El índice de cobertura eléctrica pasó de 90.39 % en 2023 a 91.5 % en 2025, con 23,861 hogares conectados en 2025, frente a la meta de 100 %. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: Informe Presidencial 2025; MEM vía BID (2023) · 2025.", "dest": false, "b": [0]}, {"c": ["S1-33", "Q6.9 millardos para empleo", "En proceso", "Q1,133.71 M ÷ Q6,900 M = 16.4%", "16.4%"], "detalle": "El programa de empleo del Mintrab y el total del Mineco devengaron Q1,133.7 M en 2024–2025, frente a Q6,900 M prometidos para medidas de empleo. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: Mintrab, Memorias 2024–2025; Minfin-Sicoin vía Guate en Datos · 2025.", "dest": false, "b": [0]}, {"c": ["S1-34", "200,000 formados para trabajar", "En proceso", "7,284 ÷ 200,000 = 3.6%", "3.6%"], "detalle": "El Mintrab reporta 7,284 personas formadas y certificadas en competencias técnicas para el empleo en 2024–2025, frente a 200,000 graduados prometidos. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: Mintrab, Memorias de Labores 2024 y 2025 · 2025.", "dest": false, "b": [0]}, {"c": ["S1-35", "100,000 en Bolsa de Empleo", "Cumplido", "150,240 ÷ 100,000 = 150.2% → 100 (tope)", "100%"], "detalle": "El Servicio Nacional de Empleo atendió a 150,240 personas (orientadas e intermediadas) en 2024–2025, frente a 100,000 beneficiarios prometidos; no son colocaciones. Ritmo: en ritmo (con 49.1% del mandato a la fecha del dato). Fuente: Mintrab, Memorias de Labores 2024 y 2025 (SIGES) · 2025.", "dest": true, "b": [0]}, {"c": ["S1-36", "1 millón en empleo temporal", "Sin iniciar", "Hito: sin iniciar = 0", "0%"], "detalle": "No se halló un Programa de Empleo Masivo Temporal con medios jornales; en 2025 el MAGA reporta 244,557 familias en Alimentos por Acciones (pago en alimentos), frente a 1 millón prometido. Fuente: Informe Presidencial 2025; memorias Mintrab 2024–2025 · 2025.", "dest": false, "b": [0]}, {"c": ["S1-37", "50,000 emprendedores", "En proceso", "28,500 ÷ 50,000 = 57.0%", "57%"], "detalle": "El Mineco reporta más de 28,500 personas capacitadas en formación técnica y asistencia productiva en 2025, frente a 50,000 emprendedores atendidos prometidos. Ritmo: en ritmo (con 49.1% del mandato a la fecha del dato). Fuente: Informe Presidencial 2025, p. 147 · 2025.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 11"}], "_n": 33, "_n_texto": "33", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:1", "seccion": "Semilla 1 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 1 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-1-8", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S1-38", "22 centros de emprendimiento", "Sin iniciar", "(15 − 15) ÷ 22 = 0.0%", "0%"], "detalle": "El Mineco tiene 15 sedes de dinamización económica en 15 departamentos, las mismas en 2025 y en febrero de 2026: ninguna nueva desde el primer conteo del mandato, frente a 22 prometidas. Ritmo: muy rezagado (con 53.1% del mandato a la fecha del dato). Fuente: Mineco, Vicemipyme 2025; AGN, 24-feb-2026 y 21-feb-2024 · 2026-02.", "dest": false, "b": [0]}, {"c": ["S1-39", "50,000 créditos blandos", "En proceso", "1,537 ÷ 50,000 = 3.1%", "3.1%"], "detalle": "El Fondo MIPYME (más de 800 préstamos, Q91.5 M) y Tob'anik del CHN (737 productores según el MAGA, Q79.9 M desembolsados; 557 y Q60.6 M según el Informe Presidencial) suman 1,537 créditos en 2025, frente a 50,000 beneficiarios prometidos. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: Informe Presidencial 2025, pp. 144 y 155; MAGA, Memoria de Labores 2025-2026 · 2025.", "dest": false, "b": [0]}, {"c": ["S1-40", "Cooperativismo", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "En 2025 el CHN colocó Q421.95 M del fondo Tob'anik en 10 cooperativas de ahorro y crédito, y el  de mejora del IGSS tampoco: se apoya en su Plan Estratégico Institucional 2023-2027. Cinco siguen en proceso y uno sin iniciar: el aporte sigue en Q500 al mes, el mismo monto de 2023.", "El cuidado infantil no tiene dato oficial: no se halló la creación de una red nacional y los Hogares Comunitarios de la SOSEP atendieron a 13,429 niñas y niños en 2025. Cuenta cero."], "margen": [{"termino": "Cobertura", "texto": "8 de 9 con dato oficial: 88.9%."}], "capitular": true}], "_n": 35, "_n_texto": "35", "_mostrar_numero": true}, {"tipo": "cuerpo", "seccion": "02 · Protección social", "bloques": [{"b": "titulo", "texto": "Bono y registro avanzan; aporte y cuota, no"}, {"b": "texto", "parrafos": ["El Bono Social llega a 243,718 familias en julio de 2026: medido desde las 82,784 de 2023, el compromiso de 500,000 va en 38.6 de 100: (243,718 − 82,784) ÷ (500,000 − 82,784). El Registro Social de Hogares (en proceso, 50) identificó más de 400,000 hogares en 55 municipios a diciembre de 2025."]}, {"b": "figura", "id": "s2-avance", "tipo": "papel", "kicker": "Semilla 2 · protección y seguridad social · 0–100", "titular": "Bono y registro arriba; IGSS, lejos", "indice": "S2 · protección social", "derivado": true, "grafico": {"tipo": "barras_h", "id": "aud-c12", "orden": "desc", "formato": {"prefijo": "", "sufijo": "", "decimales": 1, "miles": true, "escala": 1}, "items": [{"nombre": "Registro único de beneficiarios", "valor": 50}, {"nombre": "500,000 hogares con bono", "valor": 38.6}, {"nombre": "Adulto mayor: 200,000", "valor": 0.0}, {"nombre": "Adulto mayor: Q625 al mes", "valor": 0.0}, {"nombre": "Política de discapacidad", "valor": 50}, {"nombre": "Cuidado infantil: 350,000", "valor": 0.0}, {"nombre": "Estrategia de mejora del IGSS", "valor": 0.0}, {"nombre": "Cuota del Estado al IGSS", "valor": 0.0}, {"nombre": "1.5 millones de cotizantes", "valor": 12.5}], "aria": "Barras horizontales: avance de cada compromiso, de 0 a 100, ordenado de mayor a menor; sin dato oficial cuenta  ["S6-04", "Cárcel para penas graves", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "La cárcel de máxima seguridad El Triunfo (Izabal, capacidad cercana a 2,000 reos) tuvo primera piedra el 27 de marzo de 2026; un amparo provisional frenó los trabajos y la CC lo dejó sin efecto el 2 de julio de 2026. La Defensa preveía iniciar la obra el 15 de agosto; plazo previsto: 12 meses y sin avance ni monto oficial. Fuente: AGN, 2-jul-2026 y 23-abr-2026 · 2026-07-02.", "dest": false, "b": [0]}, {"c": ["S6-05", "Control de las cárceles", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "En 2025 el hacinamiento penitenciario era de 340 % y El Infiernito pasó a ser Renovación I de máxima seguridad; en octubre de 2025 se fugaron 20 reos de Fraijanes II y en enero de 2026 rigió un estado de sitio nacional. Fuente: Informe Presidencial 2025; AGN; Emisoras Unidas · 2026-01-21.", "dest": false, "b": [0]}, {"c": ["S6-06", "12,000 policías nuevos", "En proceso", "9,316 ÷ 12,000 = 77.6%", "77.6%"], "detalle": "La PNC graduó 9,316 agentes de 2024 a septiembre de 2026 (6,218 en 2024–2025 y 3,098 en 2026), frente a 12,000 nuevos prometidos. Ritmo: en ritmo (con 66.3% del mandato a la fecha del dato). Fuente: AGN, 9-sep-2026 (datos PNC); Mingob, Memoria 2025 · 2026-09-09.", "dest": false, "b": [0]}], "fuente": "Plan de Gobierno 2024-2028 (Movimiento Semilla); evaluación propia con fuentes oficiales", "pie": "Sigue en la página siguiente. *Sin dato oficial cuenta 0.", "_n": "Tabla 23"}], "_n": 68, "_n_texto": "68", "_mostrar_numero": true}, {"tipo": "cuerpo", "auto": "fichas:6", "seccion": "Semilla 6 · fichas", "bloques": [{"b": "titulo", "texto": "Semilla 6 · de dónde sale cada barra (continuación)"}, {"b": "tabla", "id": "fichas-6-2", "indice": false, "columnas": [{"t": "ID", "ancho": 50}, {"t": "Compromiso"}, {"t": "Estado", "ancho": 92}, {"t": "Cálculo", "ancho": 196}, {"t": "Avance", "num": true, "ancho": 54}], "filas": [{"c": ["S6-07", "Policía comunitaria", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "El modelo de policía comunitaria cerró su fase II en julio de 2026 en 55 subestaciones de 13 municipios del departamento de Guatemala; la PNC debe replicarlo en otras sedes. Fuente: Mingob vía AGN, 24-jul-2026 · 2026-07-24.", "dest": false, "b": [0]}, {"c": ["S6-08", "Sedes de la PNC Q1.2 mil M", "En proceso", "Q267.21 M ÷ Q1,200 M = 22.3%", "22.3%"], "detalle": "El Mingob devengó Q267.2 M en inversión en 2024–2025 (todo el ministerio, no solo sedes), frente a Q1,200 M prometidos en sedes de la PNC; el gobierno reporta más de 60 instalaciones habilitadas. Ritmo: muy rezagado (con 49.1% del mandato a la fecha del dato). Fuente: Minfin-Sicoin (vía Guate en Datos); AGN, 14-jul-2026 · 2025-12-31.", "dest": false, "b": [0]}, {"c": ["S6-09", "Inteligencia profesional", "No verificable", "No verificable: cuenta 0", "0%*"], "detalle": "No se hallaron reformas ni acuerdos formales sobre la SIE o la DIGICI a octubre de 2026; el Mingob reporta cursos de inteligencia estratégica y contrainteligencia para personal de la PNC (junio de 2026). No verificable: la verificación no encontró sustento: Ningún dato mide el hito dentro del mandato: «no iniciado» se apoya en ausencia de evidencia (dos búsquedas sin resultado), no en un hecho comprobado. Sin dato verificable queda no_verificable y cuenta 0; la falta de información agrava, no atenúa. Hay cursos del INEES (jun-2026), que no son reforma formal. Fuente: Mingob, comunicado 9-jun-2026 · 2026-06-09.", "dest": false, "b": [0]}, {"c": ["S6-10", "Vigilancia de fronteras", "En proceso", "Hito: en proceso = 50", "50%"], "detalle": "En 2025 se decomisaron más de 9.8 toneladas de cocaína, frente a 5,036.66 kg en 2023 (SGAIA), aunque menos que las 18.2 t de 2024; hubo 33,751 operaciones conjuntas en ocho aduanas y diez puestos de control. Fuente: SGAIA vía AGN (2023); EFE (2024–2025); Informe Presidencial 2025 · 2025-12-31.", "dest": false, "b": [0]}, {"c": ["S6-11", "Menos homicidios", id": "glosario", "indice": {"titulo": "Glosario", "clase": "anexo"}, "corte": 6, "terminos": [{"t": "Avance", "d": "Puntaje de 0 a 100. Meta con número: (observado − base) ÷ (meta − base) × 100, con tope de 100. Semilla: promedio simple; sin dato oficial cuenta 0."}, {"t": "Avance con dato", "d": "Promedio que deja fuera los compromisos no verificables; los no atribuibles entran con 0. Se publica aparte (26.7%) para ver cuánto pesa la falta de datos."}, {"t": "Compromiso espejo", "d": "Compromiso que el plan repite en dos semillas. Se evalúa una vez y cuenta en ambas."}, {"t": "Devengado", "d": "Gasto ya comprometido por un bien o servicio recibido, según el Sicoin. Es la medida de ejecución que usa el informe."}, {"t": "Hito", "d": "Compromiso sin cifra de meta: una ley, un programa, un plan. Puntúa 100 cumplido, 50 en proceso, 25 anunciado y 0 sin iniciar."}, {"t": "Mandato transcurrido", "d": "Parte del periodo del 14 de enero de 2024 al 14 de enero de 2028 que ya pasó a la fecha de corte: 68.7%."}, {"t": "No verificable", "d": "Compromiso sin cifra oficial que lo mida dentro del mandato. Cuenta 0 y resta en el avance global; no equivale a incumplido."}, {"t": "Vigente", "d": "Presupuesto aprobado más sus modificaciones durante el año. La ejecución es el devengado ÷ el vigente."}, {"t": "Veredicto", "d": "Resultado de verificar una cifra con una segunda fuente: verificada, ajustada o no confirmada. Solo las dos primeras aparecen aquí."}], "siglas": [{"s": "CIV", "d": "Ministerio de Comunicaciones, Infraestructura y Vivienda"}, {"s": "IGSS", "d": "Instituto Guatemalteco de Seguridad Social"}, {"s": "Mineduc", "d": "Ministerio de Educación"}, {"s": "MSPAS", "d": "Ministerio de Salud Pública y Asistencia Social"}, {"s": "PNC", "d": "Policía Nacional Civil"}, {"s": "Sicoin", "d": "Sistema de Contabilidad Integrada Gubernamental del Minfin"}], "_n": 107, "_n_texto": "107", "_mostrar_numero": true}, {"tipo": "glosario", "titulo": "Glosario (cont.)", "corte": 5, "terminos": [{"t": "Anunciado", "d": "Hito que el gobierno anunció o empezó a preparar, sin un hecho que lo ponga en marcha. Vale 25."}, {"t": "Cumplido", "d": "Meta alcanzada o hito hecho dentro del mandato, con dato oficial. Vale 100."}, {"t": "En proceso", "d": "Hito con un hecho del mandato que lo pone en marcha, sin completarse; vale 50. En una meta con número, el puntaje es la parte recorrida."}, {"t": "Incumplido", "d": "El hito tenía fecha o condición y no se dio. Cuenta 0."}, {"t": "Línea base", "d": "Valor de partida de una meta: el de 2023 o el del inicio del mandato, nunca anterior. En metas que se acumulan desde 2024, es 0."}, {"t": "No atribuible", "d": "Hay dato, pero lo que existe ya existía, o la meta ya se cumplía, antes del 14 de enero de 2024 y solo se sostiene. Cuenta 0 y entra en el avance con dato; no es «sin dato»."}, {"t": "Retroceso", "d": "El dato del mandato es peor que la línea base, aunque sea por poco, en contra de lo que el plan prometía; si es exactamente igual, el compromiso está sin iniciar. Cuenta 0."}, {"t": "Ritmo del mandato", "d": "El 68.7% del periodo ya transcurrido. El informe compara cada avance con esa parte, sin suponer que cada meta deba avanzar en línea recta."}, {"t": "Sin iniciar", "d": "Hito sin ningún hecho oficial del mandato que lo ponga en marcha. Cuenta 0."}], "siglas": [], "_n": 108, "_n_texto": "108", "_mostrar_numero": true}, {"tipo": "anexo", "id": "siglas", "titulo": "Siglas", "seccion": "Siglas", "indice": {"titulo": "Siglas", "clase": "anexo"}, "lead": "Las siglas del informe y de sus fichas, con el nombre oficial de cada entidad, programa o indicador.", "bloques": [{"b": "tabla", "indice": false, "numero": "S1", "columnas": [{"t": "Sigla", "ancho": 110}, {"t": "Nombre"}], "filas": [{"c": ["ADESCA", "Aporte para la Descentralización Cultural"]}, {"c": ["AGN", "Agencia Guatemalteca de Noticias"]}, {"c": ["Anadie", "Agencia Nacional de Alianzas para el Desarrollo de Infraestructura Económica"]}, {"c": ["Banguat",
