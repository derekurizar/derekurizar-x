<style>
  :root { --papel:#F6F2E8; --tinta:#0C1520; --gris:#5c6470; --linea:rgba(12,21,32,.14); --acento:#4B92DB; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { font: 700 30px/1.15 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  header .meta { color: var(--gris); font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--tinta); color: var(--papel); }
  .tesis { margin: 18px 0 0; padding: 14px 18px; border-left: 4px solid var(--acento); background: rgba(75,146,219,.08); font-size: 17px; }
  .contacto { margin-top: 18px; }
  .contacto a { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--acento); }
  .contacto img { width: 100%; max-width: 760px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .tuit { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--linea); }
  .tuit .cab { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--gris); }
  .tuit .cab .n { font-weight: 800; font-size: 15px; color: var(--tinta); }
  .texto { position: relative; margin-top: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--linea); border-radius: 10px; white-space: pre-wrap; font-size: 17px; }
  .texto.vacio { color: var(--gris); font-style: italic; }
  .fila { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--gris); }
  .fila .cnt.alerta { color: #B23A26; font-weight: 700; }
  button { font: 600 13px/1 system-ui, sans-serif; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); cursor: pointer; }
  button:hover { background: var(--tinta); color: var(--papel); }
  .img { margin-top: 14px; }
  .img img { width: 100%; max-width: 560px; display: block; border-radius: 12px; box-shadow: 0 2px 14px rgba(0,0,0,.12); }
  .alt { margin-top: 10px; font-size: 14px; color: var(--gris); }
  .alt b { color: var(--tinta); }
  .fuente { margin-top: 6px; font-size: 13px; color: var(--gris); }
  section.extra { margin-top: 44px; padding-top: 24px; border-top: 2px solid var(--tinta); }
  section.extra h2 { font: 700 18px/1.2 system-ui, sans-serif; margin: 22px 0 8px; }
  section.extra ul { margin: 0; padding-left: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>

<script id="hilo-json" type="application/json">{"slug": "cumplimiento-plan-semilla", "fecha": "2026-10-13", "tema": "Cumplimiento del Plan de Gobierno 2024-2028 del Movimiento Semilla (gobierno de Bernardo Arévalo) a octubre de 2026: avance de cada uno de sus 140 compromisos, de cada una de las 10 semillas, del marco fiscal y global", "tesis": "A octubre de 2026, con el 68.7% del mandato transcurrido, el Plan de Gobierno de Semilla avanza 22.9% (promedio de las 10 semillas, con los compromisos sin dato oficial en 0); ninguna semilla va al ritmo del mandato y lo que más avanza es el marco fiscal (44.9%).", "paleta": "obsidiana", "hook_tipo": "giro_inversion", "modo": "investigacion", "pregunta": "A octubre de 2026, con el 68.7% del mandato transcurrido, ¿cuánto avanzó el Plan de Gobierno de Semilla según datos oficiales verificables?", "n_tuits": 20, "estado": "listo", "tuits": [{"n": 1, "beat": "gancho", "texto": "Ya pasaron más de dos tercios del mandato de Bernardo Arévalo.\nPero el plan de gobierno con el que Semilla ganó en 2023 no avanza al mismo paso. Revisamos sus 133 compromisos contra datos oficiales. 🧵", "caracteres": 201, "alt_text": "Tarjeta de cifra: el Plan de Gobierno de Semilla avanza 22.9% (promedio de sus 10 semillas) a octubre de 2026, frente a 68.7% del mandato 2024–2028 ya transcurrido; dos barras comparan ambos porcentajes. Los compromisos sin dato oficial cuentan 0. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_1.png", "plantilla": "cifra", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c02", "aud-c05"]}, {"n": 2, "beat": "contexto", "texto": "Primero, la cuenta más simple: cumplido o no, sin dar crédito por el avance parcial. Después, el avance de cada compromiso frente a su meta.", "caracteres": 140, "alt_text": "Tarjeta de cifra: 7.5% de los 133 compromisos del Plan de Gobierno de Semilla están cumplidos a octubre de 2026, sin contar el avance parcial; dos barras lo comparan con el 92.5% no cumplido (en proceso, anunciados, sin iniciar, incumplidos, en retroceso, no atribuibles al mandato o sin dato oficial). Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_2.png", "plantilla": "cifra", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c09", "aud-c10"]}, {"n": 3, "beat": "contexto", "texto": "Cada compromiso se mide contra su meta desde enero de 2024. No suma lo que no se puede comprobar con datos oficiales, ni lo que ya existía o ya se cumplía antes del mandato.", "caracteres": 173, "alt_text": "Barras horizontales: el avance global del plan sería 26.7% si solo contaran los compromisos con dato oficial y es 22.9% al contar los 133, con los 13 sin dato oficial en cero; la diferencia es de 3.8 puntos. 120 de 133 compromisos tienen dato oficial. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_3.png", "plantilla": "barras-h", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c03", "aud-c02", "aud-c08", "aud-c07", "aud-c04"]}, {"n": 4, "beat": "contexto", "texto": "Los sin iniciar, en retroceso o incumplidos suman más del doble que los cumplidos. Y una parte no se puede comprobar con datos oficiales.", "caracteres": 137, "alt_text": "Barras horizontales de los 133 compromisos del Plan de Gobierno por estado a octubre de 2026: En proceso 68, Sin iniciar 20, No verificable 13, Cumplido 10, Anunciado 9, Retroceso 7, No atribuible 4 e Incumplido 2. Los no verificables no tienen dato oficial para comprobarlos; los no atribuibles ya existían o ya se cumplían antes del mandato. Ambos cuentan 0. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_4.png", "plantilla": "barras-h", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c04"]}, {"n": 5, "beat": "contexto", "texto": "Arriba, función pública e infraestructura; abajo, protección social, el nuevo contrato social y los migrantes, en cero. Siete de las diez semillas no llegan a 30% de avance.", "caracteres": 173, "alt_text": "Barras verticales del avance por semilla del Plan de Gobierno a octubre de 2026, de mayor a menor: Semilla 9 (función pública) 38.7%, Semilla 4 (infraestructura) 37.3%, Semilla 6 (seguridad) 35.8%, Semilla 3 (desnutrición) 29.2%, Semilla 1 (desarrollo social) 26.6%, Semilla 5 (tecnología) 18.4%, Semilla 7 (naturaleza) 18.2%, Semilla 2 (protección social) 16.8%, Semilla 10 (nuevo contrato social) 8.3% y Semilla 8 (migrantes) 0.0%. Una línea marca el 68.7% del mandato transcurrido: ninguna la alcanza. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_5.png", "plantilla": "barras-v", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c01", "aud-c05"]}, {"n": 6, "beat": "contexto", "texto": "🌱 La que más avanza: función pública. La empujan hitos, como los foros anticorrupción ya cumplidos; su meta de dinero, Q1,500 millones para gestión pública, apenas arranca.", "caracteres": 173, "alt_text": "Barras horizontales del avance de los 6 compromisos de la Semilla 9 (Función pública legítima y eficaz), la más avanzada del plan, a octubre de 2026: Foros anticorrupción 100%, Sistema Nacional Anticorrupción 50%, Gobierno electrónico 50%, Ley de Servicio Civil 25%, Q1,500 M en gestión pública 7% y Muerte civil por corrupción 0%. Promedio de la semilla: 38.7%. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_6.png", "plantilla": "barras-h", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c19", "aud-c39"]}, {"n": 7, "beat": "contexto", "texto": "🌱 La que menos: la de los guatemaltecos en el exterior, en 0%. El IGSS para migrantes funciona, pero rige desde noviembre de 2023, antes del mandato: no cuenta.", "caracteres": 161, "alt_text": "Pictograma de 5 figuras de persona, una por compromiso de la Semilla 8 (Ciudadanía sin fronteras), ninguna resaltada: 0 de 5 compromisos se cumplieron en el mandato a octubre de 2026. Hay 2 sin iniciar, 2 sin dato oficial y 1 no atribuible: el IGSS para migrantes rige desde noviembre de 2023, con el gobierno anterior. Avance de la semilla: 0%. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_7.png", "plantilla": "pictograma", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c38", "aud-c18"]}, {"n": 8, "beat": "giro", "texto": "Lo más sólido del plan está fuera de las semillas, en las finanzas públicas y las metas macroeconómicas. Aun así, tampoco llega al ritmo del mandato.", "caracteres": 149, "alt_text": "Barras horizontales de los 24 compromisos del marco fiscal y las metas macroeconómicas del Plan de Gobierno por estado a octubre de 2026: En proceso 13, Cumplido 4, Sin iniciar 3, Incumplido 2, Anunciado 1 y Retroceso 1; todos tienen dato oficial. Su avance, 44.9%, supera al de cualquier semilla (la mayor, Semilla 9, 38.7%) y queda por debajo del 68.7% del mandato transcurrido. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_8.png", "plantilla": "barras-h", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c41", "aud-c21", "aud-c19"]}, {"n": 9, "beat": "contexto", "texto": "Por tipo de compromiso, lo que se anuncia o se tramita (leyes, programas, instituciones) avanza más que lo que se mide: el dinero ejecutado y las metas con número.", "caracteres": 163, "alt_text": "Barras verticales del avance promedio por tipo de compromiso en las 10 semillas del Plan de Gobierno a octubre de 2026: hitos (leyes, programas, instituciones) 31.2%, montos de dinero ejecutado 20.3% y metas con número 19.5%. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_9.png", "plantilla": "barras-v", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c22"]}, {"n": 10, "beat": "contexto", "texto": "Ahora, lo que va hacia atrás. En este método, retroceso es que el indicador esté peor que en 2023, antes del mandato, aunque sea por poco. Uno por uno:", "caracteres": 151, "alt_text": "Tarjeta de cifra: 7 de los 133 compromisos del Plan de Gobierno de Semilla están en retroceso a octubre de 2026 (matrícula, artistas, patrimonio, mantenimiento vial, extorsiones, homicidios y ejecución del gasto) y otros 2 ya están incumplidos. Fuente: cálculo propio sobre el Plan de Gobierno y fuentes oficiales.", "imagen": "tuit_10.png", "plantilla": "cifra", "fuente": "Cálculo propio sobre el Plan de Gobierno y fuentes oficiales", "cifra_ids": ["aud-c04"]}, {"n": 11, "beat": "contexto", "texto": "↩ 1 de 7: El plan prometía 540,000 estudiantes más en el sector público. La matrícula subió en 2024, pero en 2025 quedó por debajo de la de 2023.", "caracteres": 146, "alt_text": "Línea de la matrícula inicial del sector oficial, todos los niveles: 3,163,681 estudiantes en 2023, 3,211,267 en 2024 y 3,149,866 en 2025, por debajo del año previo al mandato. La meta del plan era sumar 540,000. Fuente: Mineduc, Memorias de Labores.", "imagen": "tuit_11.png", "plantilla": "linea", "fuente": "Mineduc, Memorias de Labores (matrícula inicial, sector oficial)", "cifra_ids": ["edu-c05"]}, {"n": 12, "beat": "contexto", "texto": "↩ 2 de 7: El plan prometía 30% más para los artistas. El programa de artes del Ministerio de Cultura gastó en 2025 menos que en 2023.", "caracteres": 134, "alt_text": "Antes y después del devengado del programa 11 del Ministerio de Cultura y Deportes (Formación, fomento y difusión de las artes): Q155.0 millones en 2023 y Q147.9 millones en 2025, una caída de 4.58%, frente al aumento de 30% que prometía el plan. Fuente: MCD, Memoria de Labores 2025 y Sicoin.", "imagen": "tuit_12.png", "plantilla": "antes-despues", "fuente": "MCD, Memoria de Labores 2025 y Sicoin 2023", "cifra_ids": ["edu-c28", "edu-c27", "edu-c29"]}, {"n": 13, "beat": "contexto", "texto": "↩ 3 de 7: El plan prometía proteger el patrimonio cultural. El programa que lo restaura y preserva gastó en 2025 un tercio menos que en 2023.", "caracteres": 142, "alt_text": "Tarjeta de cifra: el devengado del programa 12 del Ministerio de Cultura y Deportes (Restauración, preservación y protección del patrimonio cultural y natural) cayó 34.59% entre 2023 y 2025, de Q253.6 millones a Q165.9 millones. Fuente: MCD, Memoria de Labores 2025 y Sicoin.", "imagen": "tuit_13.png", "plantilla": "cifra", "fuente": "MCD, Memoria de Labores 2025 y Sicoin 2023", "cifra_ids": ["edu-c30", "edu-c28", "edu-c27"]}, {"n": 14, "beat": "contexto", "texto": "↩ 4 de 7: El plan prometía mantenimiento para 18,200 km de carreteras. Covial programó para 2025 menos kilómetros que en 2023: 11,117 frente a 11,852.", "caracteres": 151, "alt_text": "Pesas de los kilómetros programados por Covial en su plan anual, 2023 frente a 2025: total 11,852 frente a 11,117; red pavimentada 6,453 frente a 6,348; terracería 5,349 frente a 4,769. Cada año nombra distinto los trabajos: en 2023 (AGN), pavimentación, mantenimiento de terracería y 50 km de recapeo; en 2025 (CIV), mantenimiento rutinario de cada red. La meta del plan es 18,200 km. Fuente: Covial (CIV) y AGN.", "imagen": "tuit_14.png", "plantilla": "pesas", "fuente": "Covial, planes anuales de mantenimiento (CIV y AGN)", "cifra_ids": ["inf-c23", "inf-c09"]}, {"n": 15, "beat": "contexto", "texto": "↩ 5 de 7: La tasa de denuncias de extorsión subió hasta julio de 2025 y luego bajó, pero hoy está apenas por encima de la de 2023. El plan prometía que bajara: aunque sea por poco, es retroceso.", "caracteres": 195, "alt_text": "Línea mensual de la tasa de denuncias de extorsión por 100 mil habitantes (12 meses móviles), de noviembre de 2023 a agosto de 2026: 102.11 en diciembre de 2023, pico de 152.04 en julio de 2025 y 102.13 en agosto de 2026; una línea plana marca el nivel de diciembre de 2023. Fuente: CIEN, Boletín del IDD.", "imagen": "tuit_15.png", "plantilla": "linea", "fuente": "CIEN, Boletín del IDD agosto 2026 (datos de PNC y MP)", "cifra_ids": ["seg-c08"]}, {"n": 16, "beat": "contexto", "texto": "↩ 6 de 7: La tasa de homicidios bajó en 2024, subió en 2025 y hoy está apenas por encima de la de 2023. El plan prometía que bajara; quedar apenas peor cuenta como retroceso.", "caracteres": 175, "alt_text": "Barras verticales de la tasa de homicidios por 100 mil habitantes (12 meses móviles): 16.61 en diciembre de 2023, 15.97 en diciembre de 2024, 17.25 en diciembre de 2025 y 16.65 en agosto de 2026. Fuente: CIEN, Boletín del IDD.", "imagen": "tuit_16.png", "plantilla": "barras-v", "fuente": "CIEN, Boletín del IDD agosto 2026 (datos de PNC y MP)", "cifra_ids": ["seg-c05"]}, {"n": 17, "beat": "contexto", "texto": "↩ 7 de 7: El plan prometía ejecutar mejor el presupuesto. El gobierno central gastó en 2025 una parte menor de lo aprobado que en 2023, y en inversión la caída es mayor.", "caracteres": 170, "alt_text": "Pendiente de la ejecución presupuestaria de la Administración Central (devengado sobre presupuesto vigente) entre 2023 y 2025: total, de 96.97% a 90.76%; inversión, de 93.74% a 78.18%. Fuente: Minfin, Sicoin vía Guate en Datos.", "imagen": "tuit_17.png", "plantilla": "pendiente", "fuente": "Minfin, Sicoin vía Guate en Datos", "cifra_ids": ["ori-c01", "ori-c02"]}, {"n": 18, "beat": "contexto", "texto": "Y dos promesas ya están incumplidas: no subir impuestos, porque el nuevo IUSI (Decreto 18-2026) sube la tasa de los inmuebles comerciales inscritos hasta Q20,000, y un PIB de Q1 billón en 2025.", "caracteres": 193, "alt_text": "Barras verticales del PIB nominal de Guatemala en miles de millones de quetzales corrientes: Q816.9 mil millones en 2023, Q878.4 mil millones en 2024 y Q947.0 mil millones en 2025 (preliminares), por debajo del Q1 billón que el plan prometía para <script>
/* Peso según X: copia literal de scripts/contar_x.js (pesoX). No editar aquí; regenerar desde el script. */
function pesoX(texto) {
  // Reglas: NFC; cada URL pesa 23; puntos de código en 0–4351, 8192–8205,
  // 8208–8223 y 8242–8247 pesan 1; el resto 2; los emoji compuestos
  // (FE0F, ZWJ+siguiente, tono 1F3FB–1F3FF, keycap 20E3, par regional) son uno y pesan 2.
  var t = String(texto == null ? "" : texto).normalize("NFC");
  var reUrl = /https?:\/\/\S+|www\.\S+|(?<![\p{L}\p{N}\p{M}_])[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|gt|org|net|io|edu|gov|mx|sv|hn|es|info|co)(\/\S*)?/giu;
  var rangos1 = [[0, 4351], [8192, 8205], [8208, 8223], [8242, 8247]];
  var pesoCp = function (cp) {
    for (var k = 0; k < rangos1.length; k++) if (cp >= rangos1[k][0] && cp <= rangos1[k][1]) return 1;
    return 2;
  };
  var esTono = function (cp) { return cp >= 0x1f3fb && cp <= 0x1f3ff; };
  var esRegional = function (cp) { return cp >= 0x1f1e6 && cp <= 0x1f1ff; };
  var pesoPlano = function (s) {
    var cps = Array.from(s, function (c) { return c.codePointAt(0); });
    var i = 0, n = cps.length, total = 0;
    while (i < n) {
      var j = i + 1;
      if (esRegional(cps[i]) && j < n && esRegional(cps[j])) j += 1; // bandera
      while (j < n) {
        if (cps[j] === 0xfe0f || cps[j] === 0x20e3 || esTono(cps[j])) j += 1;
        else if (cps[j] === 0x200d && j + 1 < n) j += 2; // ZWJ + siguiente
        else break;
      }
      total += j - i > 1 ? 2 : pesoCp(cps[i]);
      i = j;
    }
    return total;
  };
  var total = 0, pos = 0, m;
  while ((m = reUrl.exec(t)) !== null) {
    total += pesoPlano(t.slice(pos, m.index)) + 23;
    pos = m.index + m[0].length;
    if (m[0].length === 0) reUrl.lastIndex++;
  }
  return total + pesoPlano(t.slice(pos));
}
</script>
<script>
(() => {
  const H = JSON.parse(document.getElementById("hilo-json").textContent);
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const toast = (m) => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1400); };
  const copiar = async (txt) => {
    try { await navigator.clipboard.writeText(txt); toast("Copiado"); return; } catch (e) { /* fallback */ }
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copiado"); } catch (e) { toast("No se pudo copiar"); }
    ta.remove();
  };
  if (!H) { app.innerHTML = "<p>Sin datos: este archivo lo genera scripts/ensamblar.py.</p>"; return; }

  let html = `<header>
    <h1>${esc(H.tema)}</h1>
    <div class="meta"><span class="chip">${esc(H.paleta)}</span><span>${esc(H.fecha)}</span>${H.modo && H.modo !== "hilo" ? `<span class="chip" style="background:#e9e3d6;color:#0C1520">modo: ${esc(H.modo)}</span>` : ""}<span>${H.n_tuits} tuits · ${H.tuits.filter((t) => t.imagen).length} imágenes</span><span>gate mecánico: ${esc(H.gate_mecanico)}</span></div>
    ${H.tesis ? `<p class="tesis"><b>Tesis:</b> ${esc(H.tesis)}</p>` : ""}
    ${H.modo && H.modo !== "hilo" && H[H.modo] ? `<div class="meta" style="margin-top:8px;display:block"><b>modo ${esc(H.modo)}:</b> ${Object.entries(H[H.modo]).map(([k, v]) => Array.isArray(v) && v.length && typeof v[0] === "object" ? `<div>${esc(k)}: ${v.map((x) => Object.values(x).map(esc).join(" · ")).join(" | ")}</div>` : `<span style="margin-right:14px">${esc(k)}: ${esc(Array.isArray(v) ? v.join(", ") : v)}</span>`).join("")}</div>` : ""}
  </header>
  <div class="contacto" id="contacto" hidden>
    <a href="contacto.png" target="_blank" rel="noopener">Ver hoja de contacto</a>
    <img src="contacto.png" alt="Hoja de contacto: todas las tarjetas del hilo" onload="this.parentNode.hidden=false" onerror="this.parentNode.remove()">
  </div>`;
  for (const t of H.tuits) {
    const vacio = !t.texto.trim();
    const peso = pesoX(t.texto);
    html += `<article class="tuit" id="t${t.n}">
      <div class="cab"><span class="n">Tuit ${t.n}/${H.n_tuits}</span><span class="chip" style="background:#e9e3d6;color:#0C1520">${esc(t.beat || "")}</span>${t.plantilla ? `<span>tarjeta: ${esc(t.plantilla)}</span>` : "<span>sin imagen</span>"}</div>
      <div class="texto${vacio ? " vacio" : ""}">${vacio ? "(sin texto: la imagen lo dice)" : esc(t.texto)}</div>
      <div class="fila"><span class="cnt${peso > 280 ? " alerta" : ""}">${peso}/280 (peso X${peso !== t.caracteres ? `, ${t.caracteres} caracteres` : ""})</span>${vacio ? "" : `<button data-copy="${esc(t.texto)}">Copiar texto</button>`}</div>
      ${t.imagen ? `<div class="img"><img src="${esc(t.imagen)}" alt="${esc(t.alt_text)}"></div>
      <div class="alt"><b>Alt:</b> ${esc(t.alt_text)} <button data-copy="${esc(t.alt_text)}">Copiar alt</button></div>
      <div class="fuente">Fuente en el pie: ${esc(t.fuente || "")} · cifras: ${esc((t.cifra_ids || []).join(", "))}</div>` : ""}
    </article>`;
  }
  html += `<section class="extra">
    <h2>Lo que este hilo NO afirma</h2><ul>${(H.no_afirma || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Incertidumbre declarada</h2><ul>${(H.incertidumbre || []).map((x) => `<li>${esc(x)}</li>`).join("") || "<li>(nada declarado)</li>"}</ul>
    <h2>Fuentes</h2><ul>${(H.fuentes || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <p style="color:var(--gris);font-size:13px">Detalle de cifras y veredictos en <code>datos.json</code>; texto listo para pegar en <code>post.md</code>.</p>
  </section>`;
  app.innerHTML = html;
  app.addEventListener("click", (e) => { const b = e.target.closest("button[data-copy]"); if (b) copiar(b.getAttribute("data-copy")); });
})();
</script>
