<!--
  BASE DE INFORME (@DerekUrizar · sistema «Hilos» llevado a documento)
  ====================================================================
  No se edita a mano en los entregables: scripts/informe.py ensambla esta base con
    I:PALETAS   paletas desde design/tokens.json (bg/ink/a1… de la tarjeta + papel_tinta/papel_barra)
    I:HELPERS   el bloque `const H` de templates/base.html (una sola fuente de los helpers)
    I:GRAFICOS  investigacion/graficos/*.js  (G.<tipo>: gráficos dibujados en el documento)
    I:PAGINAS   investigacion/paginas/*.js   (PAGINAS.<tipo>: una función por tipo de página)
    INFORME_JSON el informe.json ya resuelto (numeración, referencias, índice, cifras)
  Diseño de referencia: lienzo «Informe de investigación» (ver investigacion/README.md).
  Las fuentes se piden como url(fonts/x.woff2): informe.py copia design/fonts/ junto al HTML y
  scripts/render_informe.js las sirve desde design/fonts/ (cero peticiones externas).
-->
<style>
@font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(fonts/instrument-serif-400.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url(fonts/instrument-serif-400i.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 100 900; src: url(fonts/archivo-var.woff2) format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800; src: url(fonts/jetbrains-mono-var.woff2) format('woff2'); }

body[data-paleta="cielo"] { --bg:#4B92DB; --ink:#0C1520; --a1:#F6F2E8; --a2:#2B4A66; --a3:#8FB8E6; --ink-rgb:12,21,32; --x-fg:#4B92DB; --rule:rgba(12,21,32,.3); --kicker:#0C1520; --tinta:#2B4A66; --barra:#4B92DB; }
body[data-paleta="jade"] { --bg:#1E6B5C; --ink:#F6F2E8; --a1:#9FD4BF; --a2:#0E3B32; --a3:#5FA38C; --ink-rgb:246,242,232; --x-fg:#1E6B5C; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#1E6B5C; --barra:#1E6B5C; }
body[data-paleta="maiz"] { --bg:#E0A33C; --ink:#1A1208; --a1:#F3D08A; --a2:#B97A1C; --a3:#6E440B; --ink-rgb:26,18,8; --x-fg:#E0A33C; --rule:rgba(26,18,8,.3); --kicker:#1A1208; --tinta:#6E440B; --barra:#B97A1C; }
body[data-paleta="terracota"] { --bg:#B23A26; --ink:#F6F2E8; --a1:#3A0F08; --a2:#E8836F; --a3:#F2C2B6; --ink-rgb:246,242,232; --x-fg:#B23A26; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#B23A26; --barra:#B23A26; }
body[data-paleta="cacao"] { --bg:#4A2F22; --ink:#F6F2E8; --a1:#D9A66B; --a2:#A8744A; --a3:#7A5038; --ink-rgb:246,242,232; --x-fg:#4A2F22; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#4A2F22; --barra:#A8744A; }
body[data-paleta="jacaranda"] { --bg:#6B4E96; --ink:#F6F2E8; --a1:#1F1530; --a2:#B9A3DB; --a3:#8E73B8; --ink-rgb:246,242,232; --x-fg:#6B4E96; --rule:rgba(246,242,232,.3); --kicker:#F6F2E8; --tinta:#6B4E96; --barra:#6B4E96; }
body[data-paleta="atitlan"] { --bg:#3FA3A0; --ink:#0C1520; --a1:#F6F2E8; --a2:#7CC3C0; --a3:#1D5E5C; --ink-rgb:12,21,32; --x-fg:#3FA3A0; --rule:rgba(12,21,32,.3); --kicker:#0C1520; --tinta:#1D5E5C; --barra:#3FA3A0; }
body[data-paleta="obsidiana"] { --bg:#16181D; --ink:#F6F2E8; --a1:#F08A4B; --a2:#8C8F96; --a3:#3A3D44; --ink-rgb:246,242,232; --x-fg:#16181D; --rule:rgba(246,242,232,.3); --kicker:#F08A4B; --tinta:#16181D; --barra:#F08A4B; }

@page { size: 8.5in 11in; margin: 0; }
@page apaisada { size: 11in 8.5in; margin: 0; }

:root { --papel: #F6F2E8; --tp: #0C1520; --tp-rgb: 12,21,32; --regla: rgba(12,21,32,.2); --regla-f: rgba(12,21,32,.3); --gris: rgba(12,21,32,.68); --suave: rgba(12,21,32,.06); --base: rgba(12,21,32,.2); }
html, body { margin: 0; padding: 0; }
body { background: #D9D4C7; font-family: Archivo, system-ui, sans-serif; color: var(--tp); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
@media screen { body { padding: 32px 0; } .pagina { margin: 0 auto 32px; box-shadow: 0 2px 18px rgba(0,0,0,.18); } }
@media print { body { background: var(--papel); } }

/* ---- Hoja ---- */
.pagina { width: 816px; height: 1056px; box-sizing: border-box; padding: 56px 72px 48px; display: flex; flex-direction: column; background: var(--papel); color: var(--tp); overflow: hidden; position: relative; break-after: page; page: carta; }
.pagina.apaisada { width: 1056px; height: 816px; padding: 48px 72px 40px; page: apaisada; }
.pagina.color { background: var(--bg); color: var(--ink); padding: 64px 72px 56px; }
.pagina.sin-margen { padding: 0; }
@page carta { size: 8.5in 11in; margin: 0; }

/* ---- Tipografía ---- */
.k { font: 500 12px/1.3 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
.k.acento { color: var(--tinta); }
.color .k.acento, .banda .k.acento, .panel .k.acento { color: var(--kicker); }
.mono { font: 400 12px/1.45 'JetBrains Mono', monospace; }
.mono-b { font: 700 12px/1.45 'JetBrains Mono', monospace; }
.gris { color: var(--gris); }
.t-portada { margin: 56px 0 0; font: 400 104px/.92 'Instrument Serif', Georgia, serif; letter-spacing: -.02em; text-wrap: balance; }
.t1 { margin: 40px 0 0; font: 400 72px/.95 'Instrument Serif', Georgia, serif; letter-spacing: -.015em; }
.t2 { margin: 36px 0 0; font: 400 56px/.95 'Instrument Serif', Georgia, serif; letter-spacing: -.015em; text-wrap: balance; }
.t3 { margin: 32px 0 0; font: 400 36px/1.05 'Instrument Serif', Georgia, serif; letter-spacing: -.01em; text-wrap: balance; }
.lead { margin: 24px 0 0; max-width: 540px; font: 400 18px/1.55 Archivo, sans-serif; text-wrap: pretty; }
.p { margin: 14px 0 0; max-width: 560px; font: 400 16px/1.62 Archivo, sans-serif; text-wrap: pretty; }
.p + .p { margin-top: 12px; }
.capitular { float: left; font: 400 64px/.8 'Instrument Serif', Georgia, serif; margin: 6px 10px 0 0; color: var(--tinta); }
.serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }
em.serif { font-size: 1.15em; line-height: 1; }
.cifra-g { font: 400 64px/.9 'Instrument Serif', Georgia, serif; color: var(--tinta); }

/* ---- Encabezado corrido y pie ---- */
.corrido { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--regla); }
.corrido.sobre-color { border-bottom: 1.5px solid var(--rule); padding-bottom: 20px; }
.pie-pag { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: auto; padding-top: 16px; border-top: 1.5px solid var(--regla-f); }
.pie-pag.sobre-color { border-top-color: var(--rule); padding-top: 18px; }
.autor { display: flex; align-items: center; gap: 16px; flex: none; }
.marca { display: flex; align-items: center; gap: 8px; }
.x { width: 22px; height: 22px; border-radius: 5px; background: var(--tp); color: var(--papel); display: flex; align-items: center; justify-content: center; font: 800 12px/1 Archivo, sans-serif; flex: none; }
.sobre-color .x, .panel .x { background: var(--ink); color: var(--x-fg); }
.handle { font: 600 14px/1 Archivo, sans-serif; }

/* ---- Bloques de cuerpo ---- */
.con-margen { display: flex; gap: 24px; margin-top: 14px; }
.con-margen > .texto { flex: 1; min-width: 0; }
.con-margen > .texto .p:first-child { margin-top: 0; }
.margen { flex: none; width: 136px; display: flex; flex-direction: column; gap: 18px; }
.margen > span { border-top: 1px solid var(--regla-f); padding-top: 8px; font: 400 12px/1.45 'JetBrains Mono', monospace; color: rgba(12,21,32,.72); }
.margen b { font-weight: 700; color: var(--tinta); }
.cita { margin: 32px 0 0; padding: 20px 0; border-top: 1.5px solid var(--tp); border-bottom: 1px solid var(--regla); display: flex; gap: 24px; align-items: baseline; }
.cita .k { flex: none; width: 128px; }
.cita .frase { flex: 1; font: 400 italic 30px/1.15 'Instrument Serif', Georgia, serif; text-wrap: balance; }
.caja { margin-top: 28px; padding: 20px 24px; background: var(--suave); display: flex; gap: 24px; }
.caja > .k { flex: none; width: 104px; }
.caja .items { flex: 1; display: flex; flex-direction: column; gap: 8px; font: 400 15px/1.45 Archivo, sans-serif; }
.caja.vertical { flex-direction: column; gap: 14px; }
.caja.vertical > .k { width: auto; }
.lectura .pasos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.lectura .paso { display: flex; gap: 12px; font: 400 14px/1.5 Archivo, sans-serif; }
.marcador { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--tp); color: var(--papel); display: flex; align-items: center; justify-content: center; font: 700 12px/1 'JetBrains Mono', monospace; }
.marcador.pill { width: auto; padding: 0 7px; border-radius: 11px; }

/* ---- Figuras ---- */
figure { margin: 0; }
.fig { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.fig .marco { display: flex; flex-direction: column; }
.fig--papel .marco { border-top: 1.5px solid var(--tp); padding-top: 14px; }
.fig .titular { margin-top: 10px; font: 400 26px/1.1 'Instrument Serif', Georgia, serif; text-wrap: balance; }
.fig--panel .titular.grande { font-size: 40px; line-height: 1; letter-spacing: -.015em; }
.panel { background: var(--bg); color: var(--ink); padding: 26px 30px 18px; }
.panel.compacto { padding: 20px 20px 14px; flex: 1; }
.panel .k { color: var(--kicker); }
.panel .nota { margin-top: 12px; font: 500 12px/1.4 'JetBrains Mono', monospace; }
.fig--papel .nota { margin-top: 12px; font: 400 12px/1.4 'JetBrains Mono', monospace; color: var(--gris); }
.panel .pie-fig { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1.5px solid var(--rule); }
.panel .pie-fig .x { width: 20px; height: 20px; font-size: 12px; }
.panel .pie-fig .handle { font-size: 13px; }
.grafico { margin-top: 18px; position: relative; }
.grafico svg { display: block; overflow: visible; }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; font: 600 14px/1 Archivo, sans-serif; }
.leyenda span { display: flex; align-items: center; gap: 8px; }
.leyenda i { display: block; width: 14px; height: 14px; }
.leyenda i.linea { width: 28px; height: 3px; }
figcaption, .figcap { display: flex; gap: 12px; font: 400 12px/1.45 'JetBrains Mono', monospace; }
.figno { flex: none; font-weight: 700; color: var(--tinta); }
.dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 26px; }
.dos > .fig { margin-top: 0; }
.tarjeta-img { display: block; width: 100%; height: auto; }

/* ---- Tablas ---- */
table.t { width: 100%; border-collapse: collapse; font: 400 14px/1.3 Archivo, sans-serif; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 500 12px/1.25 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; padding: 0 0 8px; vertical-align: bottom; border-bottom: 1.5px solid var(--tp); }
table.t td { padding: 5px 0; border-bottom: 1px solid var(--regla); }
table.t tr:last-child td { border-bottom: 1.5px solid var(--tp); }
table.t .num { text-align: right; font-family: 'JetBrains Mono', monospace; }
table.t th.num { text-align: right; }
table.t th + th, table.t td + td { padding-left: 16px; }
table.t tr.dest td { background: var(--suave); font-weight: 700; }
table.t tr.dest td:first-child { color: var(--tinta); padding-left: 8px; }
table.t tr.dest td:last-child { padding-right: 8px; }
table.t tr.total td { font-weight: 700; }
table.t td.b { font-weight: 700; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--tinta); color: var(--papel); font: 500 12px/1.4 'JetBrains Mono', monospace; }
.chip.borde { background: none; border: 1px solid var(--tinta); color: var(--tinta); padding: 1px 7px; }
.chip.tachado { background: none; border: 1px dashed rgba(12,21,32,.5); color: var(--gris); text-decoration: line-through; padding: 1px 7px; }
.notas-tabla { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; font: 400 12px/1.45 'JetBrains Mono', monospace; color: rgba(12,21,32,.75); }
.notas-tabla b { color: var(--tp); }

/* ---- Rejillas de página ---- */
.rejilla2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.rejilla3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.rejilla4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.celda { border-top: 1.5px solid var(--tp); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.lista-reglas { display: flex; flex-direction: column; border-top: 1.5px solid var(--tp); }
.lista-reglas > * { border-bottom: 1px solid var(--regla); }
.lista-reglas > *:last-child { border-bottom: 1.5px solid var(--tp); }

/* ---- Bandas de color (aperturas) ---- */
.banda { background: var(--bg); color: var(--ink); }
.sobre-color .regla-c { height: 1.5px; background: var(--rule); }
.cifra-heroe { font: 400 228px/.8 'Instrument Serif', Georgia, serif; letter-spacing: -.03em; color: var(--a1); }
[hidden] { display: none !important; }
</style>
</head>

  // 0 si todos son enteros, si no los del formato.
  const decimalesDe = (vals, max = 2) => {
    for (let d = 0; d <= max; d++) if (vals.every((v) => Math.abs(v * Math.pow(10, d) - Math.round(v * Math.pow(10, d))) < 1e-9)) return d;
    return max;
  };

  const css = (k) => getComputedStyle(document.body).getPropertyValue("--" + k).trim();
  const color = { get bg() { return css("bg"); }, get ink() { return css("ink"); },
                  get a1() { return css("a1"); }, get a2() { return css("a2"); }, get a3() { return css("a3"); },
                  inkA(a) { return "rgba(" + css("ink-rgb") + "," + a + ")"; } };

  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs = {}, padre = null) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, v);
    if (padre) padre.appendChild(e);
    return e;
  };
  // EL único <svg> de la tarjeta, dentro de #grafico, viewBox 1:1 con px CSS.
  const lienzo = (w, h) => {
    const g = document.getElementById("grafico");
    g.innerHTML = ""; g.style.width = w + "px"; g.style.height = h + "px";
    return svgEl("svg", { viewBox: "0 0 " + w + " " + h, width: w, height: h }, g);
  };
  // <text> SVG. `fill` va como style: una clase .t-* con fill ganaría al atributo.
  const texto = (svg, x, y, str, attrs = {}) => {
    const a = Object.assign({ x, y }, attrs);
    if (a.fill) { a.style = (a.style ? a.style + ";" : "") + "fill:" + a.fill; delete a.fill; }
    const t = svgEl("text", a, svg);
    t.textContent = str; return t;
  };
  // Leyenda construida desde render() (cuando los colores salen de las series).
  const leyenda = (items) => {
    const ley = document.getElementById("leyenda"); ley.innerHTML = "";
    for (const it of items) {
      const item = el("div", "item", ley);
      const sw = el("span", "sw" + (it.forma ? " " + it.forma : ""), item);
      sw.style.background = it.color || color.ink;
      el("span", null, item, esc(it.nombre));
    }
    ley.hidden = !items.length;
  };
  const el = (tag, cls, padre, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls; if (html != null) e.innerHTML = html;
    if (padre) padre.appendChild(e); return e;
  };

  const escala = (dom, rango) => {
    const k = dom[1] - dom[0] === 0 ? 0 : (rango[1] - rango[0]) / (dom[1] - dom[0]);
    return (v) => rango[0] + (v - dom[0]) * k;
  };
  // Cortes redondos: 1, 2, 2.5, 5 × 10^n.
  const ticks = (min, max, n = 4) => {
    if (max === min) return [min];
    const bruto = (max - min) / Math.max(1, n);
    const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
    const paso = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= bruto) || 10 * mag;
    const out = [];
    for (let v = Math.ceil(min / paso) * paso; v <= max + paso * 1e-9; v += paso) out.push(Math.round(v / paso) * paso);
    return out;
  };
  // Dominio "bonito" que contiene [min,max] (y el 0 si se pide).
  const dominio = (vals, desdeCero = true) => {
    let min = Math.min(...vals), max = Math.max(...vals);
    if (desdeCero) { min = Math.min(0, min); max = Math.max(0, max); }
    if (max === min) max = min + 1;
    const t = ticks(min, max, 4);
    const paso = t.length > 1 ? t[1] - t[0] : (max - min);
    return [Math.min(min, t[0]), Math.max(max, t[t.length - 1] + (t[t.length - 1] < max ? paso : 0))];
  };
  // Empuje 1-D de rótulos para que no se solapen (muta y devuelve el array).
  const antiSolape = (items, o = {}) => {
    const gap = o.minGap || 26, lim0 = o.min ?? -Infinity, lim1 = o.max ?? Infinity;
    const orden = items.slice().sort((a, b) => a.y - b.y);
    for (let k = 1; k < orden.length; k++) if (orden[k].y - orden[k - 1].y < gap) orden[k].y = orden[k - 1].y + gap;
    const ult = orden[orden.length - 1];
    if (ult && ult.y > lim1) { ult.y = lim1; for (let k = orden.length - 2; k >= 0; k--) if (orden[k + 1].y - orden[k].y < gap) orden[k].y = orden[k + 1].y - gap; }
    if (orden.length && orden[0].y < lim0) orden[0].y = lim0;
    return items;
  };
  // Ancho de un texto con una fuente dada (para decidir rótulos).
  const medir = (str, font) => {
    const c = medir._c || (medir._c = document.createElement("canvas").getContext("2d"));
    c.font = font; return c.measureText(str).width;
  };
  // Alto disponible para #grafico entre la cabecera y el pie (margin-top:auto
  // absorbe el hueco). Devuelve min(max, libre) y falla si no hay sitio.
  const espacio = (max = 520, min = 240) => {
    const g = document.getElementById("grafico");
    g.innerHTML = ""; g.style.height = "0px";
    let prev = g.previousElementSibling;
    while (prev && prev.hidden) prev = prev.previousElementSibling;
    const top = g.getBoundingClientRect().top, prevB = prev ? prev.getBoundingClientRect().bottom : 76;
    const libre = Math.floor(top - prevB - 28);
    assert(libre >= min, "no queda espacio para el gráfico (" + libre + "px): acorta el titular, la nota o la leyenda");
    return Math.min(max, libre);
  };

  // ---- Rampa secuencial (mapa, calor) ----
  // H.rampa(n) → n colores hex de la clase MÁS BAJA a la MÁS ALTA. La rampa va del
  // fondo hacia la tinta (no hacia a1: en maíz a1 apenas contrasta con el fondo, y
  // a1 se reserva para el destacado, que así siempre se ve encima de la rampa):
  //   · se interpola en RGB lineal (sRGB linealizado con gamma 2.4 y vuelta) para
  //     que la luminancia avance sin grises sucios ni bandas;
  //   · los escalones se reparten uniformes en L* (CIELAB), no en luminancia: con
  //     tinta oscura (cielo, maíz, atitlán) los pasos en luminancia lineal se
  //     apelotonan en lo oscuro y solo el último salta;
  //   · el escalón más bajo se aleja del fondo hasta 1.5:1 (WCAG) para que lea
  //     como zona pintada y no como fondo; el más alto es la tinta.
  // Resultado: monótona en luminancia en las 8 paletas (hacia oscuro con tinta
  // oscura, hacia claro con tinta clara) y cada color contrasta ≥ 1.5:1 con --bg.
  const RAMPA_MIN_CONTRASTE = 1.5;
  const rgbDe = (hex) => { const h = String(hex).trim().replace("#", ""); const s = h.length === 3 ? h.split("").map((c) => c + c).join("") : h; return [0, 2, 4].map((i) => parseInt(s.slice(i, i + 2), 16)); };
  const linealizar = (c) => c.map((v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  const hexDe = (c) => "#" + c.map((v) => { v = Math.max(0, Math.min(1, v)); v = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; return Math.round(v * 255).toString(16).padStart(2, "0"); }).join("");
  const luminancia = (lin) => 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
  const Lstar = (y) => y <= 216 / 24389 ? y * 24389 / 27 : 116 * Math.cbrt(y) - 16;
  const Yde = (L) => L <= 8 ? L * 27 / 24389 : Math.pow((L + 16) / 116, 3);
  const rampa = (n = 5) => {
    n = Math.max(2, Math.min(9, Math.round(n)));
    const lb = linealizar(rgbDe(color.bg)), li = linealizar(rgbDe(color.ink));
    const yb = luminancia(lb), yi = luminancia(li), haciaClaro = yi > yb;
    let y0 = haciaClaro ? RAMPA_MIN_CONTRASTE * (yb + 0.05) - 0.05 : (yb + 0.05) / RAMPA_MIN_CONTRASTE - 0.05;
    y0 = haciaClaro ? Math.min(y0, yi) : Math.max(y0, yi);
    const L0 = Lstar(y0), L1 = Lstar(yi), out = [];
    for (let k = 0; k < n; k++) {
      const y = Yde(L0 + (L1 - L0) * k / (n - 1));
      const t = yi === yb ? 1 : Math.max(0, Math.min(1, (y - yb) / (yi - yb)));
      out.push(hexDe(lb.map((v, i) => v + (li[i] - v) * t)));
    }
    return out;
  };
  // Color de clase de un valor: [min,max] partido en n intervalos iguales (el máximo cae en la última clase).
  const rampaColor = (v, dom, n = 5) => {
    assert(typeof v === "number" && isFinite(v), "rampaColor: valor no numérico: " + JSON.stringify(v));
    const cs = rampa(n), [a, b] = dom;
    if (!(b > a)) return cs[cs.length - 1];
    return cs[Math.min(cs.length - 1, Math.max(0, Math.floor((v - a) / (b - a) * cs.length)))];
  };

  // ---- Mezclas de color (apilada, treemap, pirámide) ----
  // H.mezcla(a, b, t) → hex en RGB lineal: t=0 es `a`, t=1 es `b`. Sirve para dar
  // tonos sólidos de la tinta sobre el fondo (mismo color en el SVG y en la leyenda).
  const mezcla = (a, b, t) => { const la = linealizar(rgbDe(a)), lb = linealizar(rgbDe(b)); return hexDe(la.map((v, i) => v + (lb[i] - v) * t)); };
  const contraste = (a, b) => { const ya = luminancia(linealizar(rgbDe(a))), yb = luminancia(linealizar(rgbDe(b))); return (Math.max(ya, yb) + 0.05) / (Math.min(ya, yb) + 0.05); };
  // Color de texto legible sobre un relleno: el que más contraste entre la tinta, el fondo
  // y los dos neutros del sistema (papel y noche, presentes en todas las paletas).
  const textoSobre = (relleno) => [color.ink, color.bg, "#F6F2E8", "#0C1520"].reduce((m, c) => (contraste(relleno, c) > contraste(relleno, m) ? c : m));

  // ---- Periodos (linea, barras-v): bandas alternas con nombre arriba ----
  // P = [{desde, hasta, nombre}] (índices sobre las etiquetas, en orden y sin solaparse, ≤ 4);
  // bordes(i) → [xIzq, xDer] del hueco que ocupa la marca i. Dibuja en `svg` entre yTop e yBot
  // y escribe el nombre centrado en yNombre. Llamar ANTES de dibujar las marcas.
  const validarPeriodos = (P, n) => {
    if (P == null) return [];
    assert(Array.isArray(P) && P.length <= 4, "periodos: como máximo 4");
    let prev = -1;
    for (const p of P) {
      assert(p && typeof p.nombre === "string" && p.nombre.trim(), "cada periodo necesita nombre");
      assert(Number.isInteger(p.desde) && Number.isInteger(p.hasta) && p.desde >= 0 && p.hasta < n && p.desde <= p.hasta, "periodo «" + p.nombre + "»: desde/hasta deben ser índices 0.." + (n - 1) + " con desde ≤ hasta");
      assert(p.desde > prev, "periodos en orden y sin solaparse («" + p.nombre + "»)");
      prev = p.hasta;
    }
    return P;
  };
  const periodos = (svg, P, bordes, yTop, yBot, yNombre) => {
    P.forEach((p, k) => {
      const xa = bordes(p.desde)[0], xb = bordes(p.hasta)[1];
      if (k % 2 === 0) svgEl("rect", { x: xa, y: yTop, width: xb - xa, height: yBot - yTop, fill: color.inkA(.09) }, svg);
      else svgEl("line", { x1: xa, x2: xa, y1: yTop, y2: yBot, stroke: color.inkA(.25), "stroke-width": 1.5, "stroke-dasharray": "4 6" }, svg);
      const w = medir(p.nombre, "500 17px 'JetBrains Mono'");
      assert(w <= xb - xa - 8, "periodo «" + p.nombre + "» no cabe en su banda (" + Math.round(w) + "px > " + Math.round(xb - xa - 8) + "): acórtalo");
      texto(svg, (xa + xb) / 2, yNombre, p.nombre, { class: "t-eje", "text-anchor": "middle" });
    });
  };

  // ---- Cabecera común: kicker, titular, leyenda, nota, pie ----
  const cabecera = (D) => {
    assert(typeof D.kicker === "string" && D.kicker.trim(), "kicker vacío");
    assert(Array.isArray(D.titular) && D.titular.length >= 1 && D.titular.length <= 3, "titular debe ser un array de 1 a 3 líneas");
    assert(typeof D.fuente === "string" && D.fuente.trim(), "fuente vacía (el pie es obligatorio)");
    assert(!/^fuente:/i.test(D.fuente.trim()), "fuente: no antepongas 'Fuente:', lo pone la plantilla");
    assert(!/https?:\/\//i.test(JSON.stringify(D)), "no van URLs dentro de la tarjeta");
    document.getElementById("kicker").textContent = D.kicker;
    document.getElementById("titular").innerHTML = D.titular.map(esc).join("<br>");
    const nota = document.getElementById("nota");
    if (D.nota && D.nota.trim()) { nota.textContent = D.nota; nota.hidden = false; } else nota.hidden = true;
    document.getElementById("fuente").textContent = "Fuente: " + D.fuente;
    document.getElementById("handle").textContent = D.handle || "@DerekUrizar";
    const ley = document.getElementById("leyenda"); ley.innerHTML = "";
    if (Array.isArray(D.leyenda) && D.leyenda.length) {
      for (const it of D.leyenda) {
        const item = el("div", "item", ley);
        const sw = el("span", "sw" + (it.forma ? " " + it.forma : ""), item);
        sw.style.background = it.color || color.ink;
        el("span", null, item, esc(it.nombre));
      }
      ley.hidden = false;
    } else ley.hidden = true;
  };
  // Nota automática de la plantilla (redondeo, agrupación): se suma a la del guion.
  // Llamar ANTES de H.espacio, que mide el hueco con la nota ya puesta.
  const anotar = (t) => {
    const nota = document.getElementById("nota");
    const prev = nota.hidden ? "" : nota.textContent.trim();
    nota.textContent = prev ? prev + " " + t : t; nota.hidden = false;
  };
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  // ---- Utilidades de rotulado compartidas ----
  // Formato de eje: los decimales que de verdad necesitan los ticks (0 si todos son enteros).
  const formatoEje = (f, tk) => Object.assign({}, f || {}, { decimales: decimalesDe(tk.map((t) => t / ((f && f.escala) || 1)), (f && f.decimales) || 0) });
  // Primera fuente de la lista en la que `str` cabe en maxW (null si ninguna): para encoger nombres 23→21→19→17.
  const encajar = (str, fuentes, maxW) => fuentes.find((fn) => medir(str, fn) <= maxW) || null;
  // Halo del color del fondo para texto que pisa barras o líneas (paint-order).
  const halo = () => "paint-order:stroke;stroke:" + color.bg + ";stroke-width:6px;stroke-linejoin:round";

  // ---- Verificación final: lo que ningún check de píxeles ve a tiempo ----
  const verificar = (D) => {
    const util = 920;
    for (const linea of D.titular) {
      const w = medir(linea, "400 88px 'Instrument Serif'") * 0.985; // letter-spacing -.015em
      assert(w <= util, "titular no cabe en una línea (" + Math.round(w) + "px > " + util + "): «" + linea + "»");
    }
    assert(medir(D.kicker.toUpperCase(), "500 20px 'JetBrains Mono'") * 1.16 <= util, "kicker demasiado largo");
    const g = document.getElementById("grafico");
    const r = g.getBoundingClientRect();
    assert(r.height >= 200, "#grafico mide " + Math.round(r.height) + "px de alto (< 200): el gráfico no se maquetó");
    assert(g.children.length > 0, "#grafico está vacío");
    const tarjeta = document.querySelector(".tarjeta").getBoundingClientRect();
    const pie = document.querySelector(".pie").getBoundingClientRect();
    assert(pie.bottom <= 1080 + 0.5, "el contenido desborda la tarjeta (pie en y=" + Math.round(pie.bottom) + ")");
    void tarjeta;
  };

  const fuentesListas = () => Promise.all([
    document.fonts.load("400 88px 'Instrument Serif'"),
    document.fonts.load("500 20px 'JetBrains Mono'"),
    document.fonts.load("700 22px 'JetBrains Mono'"),
    document.fonts.load("600 24px Archivo"),
    document.fonts.load("800 19px Archivo"),
  ]);


  // ---- Aritmética compartida con el informe (investigacion/graficos/): la tarjeta y el documento
  // calculan EL MISMO número y el guionista nunca lo escribe (píldora, «N de cada 100», acumulados,
  // mayoría, cortes del mapa, squarified, asientos del hemiciclo). Son funciones puras: nada del DOM. ----
  // Departamentos: nombres oficiales (INE). scripts/build_mapa.py --check los coteja con el svg.
  const NOMBRES = {
    GT01: "Guatemala", GT02: "El Progreso", GT03: "Sacatepéquez", GT04: "Chimaltenango",
    GT05: "Escuintla", GT06: "Santa Rosa", GT07: "Sololá", GT08: "Totonicapán",
    GT09: "Quetzaltenango", GT10: "Suchitepéquez", GT11: "Retalhuleu", GT12: "San Marcos",
    GT13: "Huehuetenango", GT14: "Quiché", GT15: "Baja Verapaz", GT16: "Alta Verapaz",
    GT17: "Petén", GT18: "Izabal", GT19: "Zacapa", GT20: "Chiquimula",
    GT21: "Jalapa", GT22: "Jutiapa"
  };
  const normDepto = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]/g, "");
  const DEPTO_POR_NOMBRE = {};
  Object.keys(NOMBRES).forEach((id) => { DEPTO_POR_NOMBRE[normDepto(NOMBRES[id])] = id; });
  // H.idDepto("Petén") → "GT17"; acepta el id o el nombre oficial; falla si no es un departamento.
  const idDepto = (k) => {
    const s = String(k).trim().toUpperCase();
    if (NOMBRES[s]) return s;
    const id = DEPTO_POR_NOMBRE[normDepto(k)];
    assert(id, "«" + k + "» no es un departamento: usa GT01–GT22 o el nombre oficial");
    return id;
  };
  // H.cortes(valores, {cortes, clases, metodo, redondear}) → límites internos de las clases (mapa, calor):
  // cortes dados (2–5), o cuantiles con `clases` (`metodo: "iguales"` = intervalos iguales). Con `redondear`
  // (por defecto) los cortes se llevan a pasos «bonitos» (1·2·5·10 × 10ⁿ) sin dejar clases vacías:
  //   1) cuantiles redondeados al paso más grueso que conserve ≥ k−2 cortes distintos;
  //   2) si se apelotonan, intervalos iguales al mismo paso, salvo que una clase acapare > 50 %;
  //   3) datos sesgados: cada cuantil al paso del hueco mínimo entre cortes.
  const cortes = (valores, o = {}) => {
    const v = valores.slice().sort((a, b) => a - b), min = v[0], max = v[v.length - 1];
    let cs;
    if (Array.isArray(o.cortes) && o.cortes.length) {
      cs = o.cortes.slice().sort((a, b) => a - b);
      assert(cs.length >= 2 && cs.length <= 5 && cs.every((c) => typeof c === "number" && isFinite(c)), "cortes: de 2 a 5 límites numéricos");
    } else {
      const k = Math.max(3, Math.min(6, Math.round(o.clases || 5)));
      cs = [];
      for (let i = 1; i < k; i++) {
        if (o.metodo === "iguales") { cs.push(min + (max - min) * i / k); continue; }
        const p = (v.length - 1) * i / k, lo = Math.floor(p), t = p - lo;
        cs.push(v[lo] + (v[Math.min(lo + 1, v.length - 1)] - v[lo]) * t);
      }
      if (o.redondear !== false && max > min) {
        const enRango = (a) => a.filter((c, i) => c > min && c < max && (i === 0 || c > a[i - 1]));
        const redondea = (a, paso) => enRango(a.map((c) => +(Math.round(c / paso) * paso).toFixed(10)));
        const conteo = (a) => { const n = new Array(a.length + 1).fill(0); v.forEach((x) => { let j = 0; while (j < a.length && x >= a[j]) j++; n[j]++; }); return n; };
        const nice = (x, ms) => { const e = Math.pow(10, Math.floor(Math.log10(x))); return ms.map((m) => m * e); };
        const iguales = Array.from({ length: k - 1 }, (_, i) => min + (max - min) * (i + 1) / k);
        let mejor = null;
        for (const paso of nice((max - min) / k, [10, 5, 2, 1])) {
          const q = redondea(cs, paso), g = redondea(iguales, paso);
          if (q.length >= k - 2) { mejor = q; break; }
          if (g.length >= k - 1 && Math.max(...conteo(g)) / v.length <= 0.5) { mejor = g; break; }
        }
        if (!mejor) {
          const huecos = cs.slice(1).map((c, i) => c - cs[i]).filter((h) => h > 0);
          if (huecos.length) { const h = Math.min(...huecos); mejor = redondea(cs, nice(h, [5, 2, 1]).find((p) => p <= h)); }
        }
        if (mejor && mejor.length >= 2) { const n = conteo(mejor); cs = mejor.filter((c, i) => n[i + 1] > 0); }
      }
      cs = cs.filter((c, i) => c > min && c < max && (i === 0 || c > cs[i - 1]));  // empates → menos clases
    }
    return cs;
  };
  // Índice de clase de un valor según los cortes (0 = la más baja).
  const claseDe = (v, cs) => { let k = 0; while (k < cs.length && v >= cs[k]) k++; return k; };
  // H.pildora(antes, despues, "factor"|"porcentaje"|"ninguna", decimales) → "×1.77" | "+77%" | null.
  const pildora = (antes, despues, modo = "factor", dec) => {
    if (modo === "ninguna") return null;
    assert(antes !== 0, "la píldora no se puede calcular con antes.valor = 0");
    const d = dec == null ? 2 : dec, factor = despues / antes;
    if (modo === "factor") return "×" + factor.toFixed(d);
    const p = (factor - 1) * 100;
    return (p < 0 ? MENOS : "+") + Math.abs(p).toFixed(d > 1 ? 0 : d) + "%";
  };
  // «N de cada 100» (o de cada 1,000 si no llega a 1). Por debajo de 10 lleva un decimal:
  // redondear 1.7 a «2» contradiría «menos de 2».
  const deCada = (v, ref) => {
    const corto = (x) => num(x, { decimales: x < 10 && Math.abs(x - Math.round(x)) >= 0.05 ? 1 : 0 });
    const p = (v / ref) * 100;
    if (p >= 1 || p === 0) return corto(p) + " de cada 100";
    if (p >= 0.1) return corto(p * 10) + " de cada 1,000";
    return "menos de 1 de cada 1,000";
  };
  // Etiqueta de la etapa i de un embudo según `porcentaje`: inicio | anterior | ninguno.

// Comunes de los gráficos del informe. Cada G.<tipo>(el, spec, ctx) dibuja UN <svg> (o HTML) dentro de
// `el`; ctx = { ancho, alto, col } y col es el esquema de color del lugar (I.esquema: papel o panel):

//   · tinta (solo en papel: acento para texto, papel_tinta)
// Las cifras llegan crudas y en la unidad de la fuente; el formato lo pone spec.formato.
// Regla: un G.* pinta SOLO con col.* y GX.*; nunca con H.color/H.rampa/H.halo/H.periodos/H.textoSobre

    return H.num(v, ff);
  };
  const lienzo = (el, w, h, aria) => {
    el.innerHTML = "";

  const linea = (svg, x1, y1, x2, y2, stroke, extra) => H.svgEl("line", Object.assign({ x1, y1, x2, y2, stroke, "stroke-width": 1.5 }, extra || {}), svg);
  const t = (svg, x, y, s, font, fill, extra) => H.texto(svg, x, y, s, Object.assign({ style: "font:" + font, fill }, extra || {}));
  // Tipografías del documento (piso 12 px, tokens.documento.pisoPx).
  const MONO = "500 12px 'JetBrains Mono', monospace", MONO_B = "700 12px 'JetBrains Mono', monospace", MONO_D = "700 14px 'JetBrains Mono', monospace";

  // Rampa secuencial de n clases (2–9) de la MÁS BAJA a la MÁS ALTA, según el lugar:
  //   panel → H.rampa (lee --bg/--ink del body, que informe.py define para la paleta);
  //   papel → de un tinte claro de col.dest (≥ 1.5:1 sobre el papel) a col.tinta, en RGB lineal (H.mezcla).
  const rampa = (n, col) => {
    n = Math.max(2, Math.min(9, Math.round(n)));
    if (!col.tinta) return H.rampa(n);
    let t0 = 0.25, a = H.mezcla(col.sobre, col.dest, t0);
    while (H.contraste(a, col.sobre) < 1.5 && t0 < 0.9) a = H.mezcla(col.sobre, col.dest, (t0 += 0.05));
    return Array.from({ length: n }, (_, k) => H.mezcla(a, col.tinta, k / (n - 1)));
  };
  // Color de texto legible sobre un relleno: el de más contraste entre texto, fondo y los dos neutros.
  const textoSobre = (relleno, col) => [col.texto, col.sobre, "#F6F2E8", "#0C1520"].reduce((m, c) => (H.contraste(relleno, c) > H.contraste(relleno, m) ? c : m));
  // Halo del color del fondo para texto que pisa barras o líneas (paint-order).
  const halo = (col) => "paint-order:stroke;stroke:" + col.sobre + ";stroke-width:4px;stroke-linejoin:round";
  // Nota automática del gráfico (redondeo, agrupación, dos escalas): un <span class="nota"> tras el SVG,
  // dentro de .grafico (base.html ya la viste a 12 px mono en papel y en panel). Espejo de H.anotar.
  const anotar = (el, texto) => {
    if (!texto) return;
    let n = el.querySelector(":scope > span.nota");
    if (!n) { n = document.createElement("span"); n.className = "nota"; n.style.display = "block"; el.appendChild(n); }
    n.textContent = (n.textContent ? n.textContent + " " : "") + texto;
  };
  // Periodos (linea, barras_v): bandas alternas con nombre arriba, a 12 px. P = H.validarPeriodos(...);
  // bordes(i) → [xIzq, xDer] del hueco de la marca i. Llamar ANTES de dibujar las marcas.
  const periodos = (svg, P, bordes, yTop, yBot, yNombre, col) => {
    P.forEach((p, k) => {
      const xa = bordes(p.desde)[0], xb = bordes(p.hasta)[1];
      if (k % 2 === 0) rect(svg, xa, yTop, xb - xa, yBot - yTop, col.suave);
      else linea(svg, xa, yTop, xa, yBot, col.linea, { "stroke-width": 1, "stroke-dasharray": "3 5", "stroke-opacity": 0.5 });
      const w = H.medir(p.nombre, MONO);
      H.assert(w <= xb - xa - 6, "periodo «" + p.nombre + "» no cabe en su banda (" + Math.round(w) + "px > " + Math.round(xb - xa - 6) + "): acórtalo");
      t(svg, (xa + xb) / 2, yNombre, p.nombre, MONO, col.texto, { "text-anchor": "middle" });
    });
  };
  // Patrón rayado «sin dato» (mapa, calor); devuelve la url(#id) y lo define una sola vez por svg.
  const sinDato = (svg, col) => {
    const id = "sinDato" + Math.random().toString(36).slice(2, 7);
    const defs = H.svgEl("defs", {}, svg);
    const pat = H.svgEl("pattern", { id, width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
    H.svgEl("rect", { width: 8, height: 8, fill: col.suave }, pat);
    H.svgEl("line", { x1: 0, y1: 0, x2: 0, y2: 8, stroke: col.base, "stroke-width": 2 }, pat);
    return "url(#" + id + ")";
  };
  return { fmt, lienzo, rect, linea, t, MONO, MONO_B, MONO_D, SANS, SANS_D, SANS_S, serif, indice, marcador, rampa, textoSobre, halo, anotar, periodos, sinDato };
})();

// ---- investigacion/graficos/apiladas.js
// Apiladas · el reparto del todo por fila, a lo largo de una serie o en dos lados: apilada, area_apilada y piramide.
// Mismo contrato que las plantillas de tarjeta (templates/graficos/apilada.html, area-apilada.html, piramide.html):
// los porcentajes los calcula el gráfico, la parte destacada va en col.dest y el resto en la rampa de GX
// (de oscuro a claro), con el mismo tono en las marcas y en la leyenda.

// apilada · barras horizontales apiladas por fila (años o categorías), 100 % o absolutos.
//   etiquetas[2–8], partes[2–5] {nombre, valores}, normalizar (true: cada fila suma 100 %; false: absolutos con el
//   total al final), destacar (índice de la parte clave), rotular "todas"|"destacada", formato.
//   Filas de 34 px con segmentos de 18; leyenda de partes en una fila bajo el gráfico. Alto: 34·n + 30 (+18 por
//   fila extra de leyenda).
G.apilada = (el, S, { ancho, col }) => {
  H.assert(Array.isArray(S.etiquetas) && S.etiquetas.length >= 2 && S.etiquetas.length <= 8, "apilada admite de 2 a 8 filas (etiquetas)");
  H.assert(Array.isArray(S.partes) && S.partes.length >= 2 && S.partes.length <= 5, "apilada admite de 2 a 5 partes");
  const n = S.etiquetas.length, m = S.partes.length;
  S.partes.forEach((p) => {
    H.assert(p && typeof p.nombre === "string" && Array.isArray(p.valores) && p.valores.length === n, "cada parte necesita nombre y " + n + " valores");
    p.valores.forEach((v) => H.assert(typeof v === "number" && v >= 0, "valores: números ≥ 0"));
  });
  const norm = S.normalizar !== false, hi = GX.indice(S.destacar == null ? 0 : S.destacar, m);
  const totales = S.etiquetas.map((_, r) => S.partes.reduce((s, p) => s + p.valores[r], 0));
  totales.forEach((t, r) => H.assert(t > 0, "la fila «" + S.etiquetas[r] + "» suma 0"));
  const pct = (r, j) => (S.partes[j].valores[r] / totales[r]) * 100;
  const W = ancho, fila = 34, barH = 18;
  const rampa = GX.rampa(Math.max(2, m - 1), col).reverse();
  let k = 0;
  const colorDe = S.partes.map((_, j) => (j === hi ? col.dest : rampa[Math.min(k++, rampa.length - 1)]));
  // Leyenda: swatch 10×10 + nombre, en filas de 18 px (se parte si no cabe en una).
  const ley = S.partes.map((p, j) => ({ j, w: 16 + H.medir(p.nombre, GX.MONO) }));
  let lx = 0, lfila = 0;
  ley.forEach((it) => { if (lx > 0 && lx + it.w > W) { lx = 0; lfila++; } it.x = lx; it.fila = lfila; lx += it.w + 16; });
  const Hh = n * fila + 30 + lfila * 18;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  const colIzq = Math.ceil(Math.max(...S.etiquetas.map((e) => H.medir(String(e), GX.SANS)))) + 12;
  const totW = norm ? 0 : Math.ceil(Math.max(...totales.map((t) => H.medir(GX.fmt(t, S.formato), GX.MONO_B)))) + 10;
  const maxT = Math.max(...totales), util = W - colIzq - totW;
  S.etiquetas.forEach((e, r) => {
    const cy = r * fila + fila / 2, y = cy - barH / 2;
    GX.t(svg, 0, cy + 5, String(e), GX.SANS, col.texto);
    const largo = norm ? util : (totales[r] / maxT) * util;
    let x = colIzq;
    S.partes.forEach((p, j) => {
      const w = (p.valores[r] / totales[r]) * largo, wDib = Math.max(0, w - (j === m - 1 ? 0 : 1));   // filo de 1 px
      if (wDib > 0) GX.rect(svg, x, y, wDib, barH, colorDe[j]);
      if (S.rotular !== "destacada" || j === hi) {
        const txt = norm ? H.pct(pct(r, j)) : GX.fmt(p.valores[r], S.formato);
        if (H.medir(txt, GX.MONO_B) <= wDib - 6) GX.t(svg, x + wDib / 2, cy + 4, txt, GX.MONO_B, GX.textoSobre(colorDe[j], col), { "text-anchor": "middle" });
      }
      x += w;
    });
    if (!norm) GX.t(svg, x + 8, cy + 4, GX.fmt(totales[r], S.formato), GX.MONO_B, col.texto);
  });
  const ly = n * fila + 8;
  ley.forEach((it) => {
    const yy = ly + it.fila * 18;
    GX.rect(svg, it.x, yy + 1, 10, 10, colorDe[it.j]);
    GX.t(svg, it.x + 16, yy + 10, S.partes[it.j].nombre, GX.MONO, col.texto);
  });
  if (norm && S.etiquetas.some((_, r) => S.partes.reduce((s, _p, j) => s + Math.round(pct(r, j)), 0) !== 100))
    GX.anotar(el, "Los porcentajes no suman 100 por redondeo.");
};

// area_apilada · bandas apiladas a lo largo de una serie, 100 % o absolutos con eje a la izquierda.
//   etiquetasX[5–30], partes[2–5] {nombre, valores} (partes[0] va abajo), normalizar, destacar (índice), formato.
//   Canal derecho fijo de 120 px con nombre + valor final (una línea si cabe, si no dos); a la izquierda el % inicial
//   (en absolutos, el eje). Etiquetas X: primera, última y cada ⌈n/6⌉ (o más espaciadas si no caben). Alto 260.
G.area_apilada = (el, S, { ancho, alto, col }) => {
  H.assert(Array.isArray(S.etiquetasX) && S.etiquetasX.length >= 5 && S.etiquetasX.length <= 30, "area-apilada admite de 5 a 30 puntos (etiquetasX)");
  H.assert(Array.isArray(S.partes) && S.partes.length >= 2 && S.partes.length <= 5, "area-apilada admite de 2 a 5 partes");
  const n = S.etiquetasX.length, m = S.partes.length;
  S.partes.forEach((p) => {
    H.assert(p && typeof p.nombre === "string" && p.nombre.trim() && Array.isArray(p.valores) && p.valores.length === n, "cada parte necesita nombre y " + n + " valores");
    p.valores.forEach((v) => H.assert(typeof v === "number" && isFinite(v) && v >= 0, "valores de «" + p.nombre + "»: números ≥ 0"));
  });
  const norm = S.normalizar !== false, hi = GX.indice(S.destacar == null ? 0 : S.destacar, m);
  const totales = S.etiquetasX.map((_, c) => S.partes.reduce((s, p) => s + p.valores[c], 0));
  totales.forEach((t, c) => H.assert(t > 0, "el punto «" + S.etiquetasX[c] + "» suma 0"));
  const acum = S.etiquetasX.map((_, c) => { let s = 0; return S.partes.map((p) => (s += p.valores[c])); });
  const altura = (c, j) => (j < 0 ? 0 : norm ? acum[c][j] / totales[c] : acum[c][j]);
  const pctDe = (c, j) => (S.partes[j].valores[c] / totales[c]) * 100;
  const rampa = GX.rampa(Math.max(2, m - 1), col).reverse();
  let k = 0;
  const colorDe = S.partes.map((_, j) => (j === hi ? col.dest : rampa[Math.min(k++, rampa.length - 1)]));
  const etiqIni = S.partes.map((p, j) => (norm ? H.pct(pctDe(0, j)) : GX.fmt(p.valores[0], S.formato)));
  const etiqFin = S.partes.map((p, j) => (norm ? H.pct(pctDe(n - 1, j)) : GX.fmt(p.valores[n - 1], S.formato)));
  const W = ancho, Hh = alto || 260, canal = 120, top = 10, y1 = Hh - 24, x1 = W - canal;
  const SANS_HI = "800 12px Archivo, sans-serif";
  S.partes.forEach((p) => H.assert(H.medir(p.nombre, GX.SANS_S) <= canal - 12, "doc: el nombre «" + p.nombre + "» no cabe en el canal derecho (120 px): acórtalo"));
  const unaLinea = S.partes.every((p, j) => H.medir(p.nombre, j === hi ? SANS_HI : GX.SANS_S) + H.medir(" " + etiqFin[j], GX.MONO_B) <= canal - 12);
  let dom = [0, 1], tk = [], fEje = S.formato;
  if (!norm) { dom = H.dominio(totales, true); tk = H.ticks(dom[0], dom[1], 4); fEje = H.formatoEje(S.formato, tk); }
  const izq = Math.ceil(norm ? Math.max(...etiqIni.map((s) => H.medir(s, GX.MONO))) : Math.max(...tk.map((t) => H.medir(H.num(t, fEje), GX.MONO)))) + 10;
  const x0 = izq;
  const sx = H.escala([0, n - 1], [x0, x1]), sy = H.escala(dom, [y1, top]);
  const svg = GX.lienzo(el, W, Hh, S.aria);
  if (!norm) for (const t of tk) {
    if (t > 0) GX.linea(svg, x0, sy(t), x1, sy(t), col.suave, { "stroke-width": 1 });
    if (t > 0) GX.t(svg, x0 - 6, sy(t) + 4, H.num(t, fEje), GX.MONO, col.texto, { "text-anchor": "end" });
  }
  // Bandas: path cerrado (borde superior de ida, inferior de vuelta) y filo de 1 px del fondo entre bandas.
  const px = (c) => sx(c).toFixed(1), py = (c, j) => sy(altura(c, j)).toFixed(1);
  const borde = (j) => S.etiquetasX.map((_, c) => (c ? "L" : "M") + px(c) + " " + py(c, j)).join(" ");
  S.partes.forEach((_, j) => {
    const vuelta = S.etiquetasX.map((_, c) => "L" + px(n - 1 - c) + " " + py(n - 1 - c, j - 1)).join(" ");
    H.svgEl("path", { d: borde(j) + " " + vuelta + " Z", fill: colorDe[j] }, svg);
  });
  for (let j = 0; j < m - 1; j++) H.svgEl("path", { d: borde(j), fill: "none", stroke: col.sobre, "stroke-width": 1, "stroke-linejoin": "round" }, svg);
  if (norm) for (const q of [0.25, 0.5, 0.75]) GX.linea(svg, x0, sy(q), x1, sy(q), col.sobre, { "stroke-width": 1, "stroke-dasharray": "3 6", "stroke-opacity": 0.5 });
  GX.linea(svg, x0, y1, x1, y1, col.linea, { "stroke-width": 1 });
  // Rótulos en el centro de cada banda; si el anti-solape los mueve, una guía fina los une a su banda.
  const centro = (c, j) => (sy(altura(c, j)) + sy(altura(c, j - 1))) / 2;
  const colocar = (c, gap, xBorde, xGuia, pinta) => {
    const its = S.partes.map((_, j) => ({ j, yo: centro(c, j), y: centro(c, j) }));
    H.antiSolape(its, { minGap: gap, min: top + (gap > 14 ? 14 : 8), max: y1 - (gap > 14 ? 16 : 8) });
    for (const it of its) {
      if (Math.abs(it.y - it.yo) > 6) GX.linea(svg, xBorde, it.yo, xGuia, it.y, col.suave, { "stroke-width": 1 });
      pinta(it);
    }
  };
  if (norm) colocar(0, 14, x0 - 1, x0 - 5, (it) => GX.t(svg, x0 - 6, it.y + 4, etiqIni[it.j], GX.MONO, col.texto, { "text-anchor": "end" }));
  colocar(n - 1, unaLinea ? 14 : 28, x1 + 1, x1 + 6, (it) => {
    const d = it.j === hi, tc = d ? (col.tinta || col.dest) : col.texto, nombre = S.partes[it.j].nombre, fn = d ? SANS_HI : GX.SANS_S;
    if (unaLinea) {
      const t = H.svgEl("text", { x: x1 + 8, y: it.y + 4, style: "font:" + fn + ";fill:" + tc }, svg);
      H.svgEl("tspan", {}, t).textContent = nombre;
      H.svgEl("tspan", { style: "font:" + GX.MONO_B }, t).textContent = " " + etiqFin[it.j];
    } else {
      GX.t(svg, x1 + 8, it.y - 2, nombre, fn, tc);
      GX.t(svg, x1 + 8, it.y + 12, etiqFin[it.j], GX.MONO_B, tc);
    }
  });
  // Etiquetas X: primera, última y cada ⌈n/6⌉; más espaciadas si no caben a 12 px.
  const wX = Math.max(...S.etiquetasX.map((e) => H.medir(String(e), GX.MONO_B))), pasoPx = (x1 - x0) / (n - 1);
  const paso = Math.max(1, Math.ceil(n / 6), Math.ceil((wX + 8) / pasoPx));
  const idx = []; for (let c = 0; c < n; c += paso) idx.push(c);
  if (idx[idx.length - 1] !== n - 1) { while (idx.length && (n - 1 - idx[idx.length - 1]) * pasoPx < wX + 8) idx.pop(); idx.push(n - 1); }
  for (const c of idx) GX.t(svg, sx(c), Hh - 8, String(S.etiquetasX[c]), c === n - 1 ? GX.MONO_B : GX.MONO, col.texto, { "text-anchor": "middle" });
  if (norm && [0, n - 1].some((c) => S.partes.reduce((s, _p, j) => s + Math.round(pctDe(c, j)), 0) !== 100))
    GX.anotar(el, "Los porcentajes no suman 100 por redondeo.");
};

// piramide · distribución en dos lados con la misma escala (edades por sexo, grupos por zona).
//   grupos[4–12] (de arriba abajo), izquierda {nombre, valores}, derecha {nombre, valores}, destacar (índice del
//   grupo clave; null = ninguno), rotular null|"todos"|"destacado" (null: todos si ≤ 8 grupos y ancho ≥ 480, si no
//   solo el destacado), formato. Columna central con los grupos; barras col.base (la derecha al 70 %) y el grupo
//   destacado en col.dest a ambos lados; valores fuera de la barra. Alto: 24·n + 30 (nombres de lado arriba).
G.piramide = (el, S, { ancho, col }) => {
  H.assert(Array.isArray(S.grupos) && S.grupos.length >= 4 && S.grupos.length <= 12, "piramide admite de 4 a 12 grupos");
  const n = S.grupos.length;
  for (const lado of ["izquierda", "derecha"]) {
    const L = S[lado];
    H.assert(L && typeof L.nombre === "string" && Array.isArray(L.valores) && L.valores.length === n, lado + " necesita nombre y " + n + " valores");
    L.valores.forEach((v) => H.assert(typeof v === "number" && v >= 0, lado + ": valores numéricos ≥ 0"));
  }
  const W = ancho, fila = 24, cab = 30, Hh = n * fila + cab, barH = 15;
  const hi = GX.indice(S.destacar, n);
  const rotTodos = S.rotular ? S.rotular === "todos" : (n <= 8 && W >= 480);
  const f = (v) => GX.fmt(v, S.formato);
  const todos = S.izquierda.valores.concat(S.derecha.valores), max = Math.max(...todos) || 1;
  const colC = Math.ceil(Math.max(...S.grupos.map((g) => H.medir(String(g), GX.MONO_B)))) + 16;
  const labW = Math.ceil(Math.max(...todos.map((v) => H.medir(f(v), GX.MONO_B)))) + 8;   // hueco del valor fuera de la barra
  const lado = (W - colC) / 2, util = lado - labW - 6, xc0 = lado, xc1 = lado + colC;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  GX.t(svg, xc0 - 6, 14, S.izquierda.nombre, GX.SANS, col.texto, { "text-anchor": "end" });
  GX.t(svg, xc1 + 6, 14, S.derecha.nombre, GX.SANS, col.texto);
  S.grupos.forEach((g, i) => {
    const d = i === hi, cy = cab + i * fila + fila / 2, y = cy - barH / 2;
    GX.t(svg, (xc0 + xc1) / 2, cy + 4, String(g), d ? GX.MONO_B : GX.MONO, col.texto, { "text-anchor": "middle" });
    const vi = S.izquierda.valores[i], vd = S.derecha.valores[i], wi = (vi / max) * util, wd = (vd / max) * util;
    GX.rect(svg, xc0 - 6 - wi, y, wi, barH, d ? col.dest : col.base);
    GX.rect(svg, xc1 + 6, y, wd, barH, d ? col.dest : col.base, d ? {} : { "fill-opacity": 0.7 });
    if (rotTodos || d) {
      const tc = d ? (col.tinta || col.dest) : col.texto;
      GX.t(svg, xc0 - 12 - wi, cy + 4, f(vi), GX.MONO_B, tc, { "text-anchor": "end" });
      GX.t(svg, xc1 + 12 + wd, cy + 4, f(vd), GX.MONO_B, tc);
    }
  });
};

// ---- investigacion/graficos/barras.js
// barras_v · periodos o grupos en columnas, una destacada (Fig. «casos a la SE 35», «edades»).
//   Contrato de la tarjeta barras-v: etiquetas[], valores[] (con negativos el eje queda en el cero y el rótulo
//   va bajo la barra), destacar (índice; -1 = última), rotular "todas"|"destacada", referencia {valor, texto}
//   (línea punteada en el acento con rótulo), periodos [{desde, hasta, nombre}] (≤ 4 bandas con nombre arriba),
//   formato. Extensiones del documento: nivel (índice: línea punteada a la altura de esa barra), banda {desde,
//   hasta, texto}, marcadores [{i, n, lado}] (círculos numerados para una lectura guiada), claves (nombres
//   largos de las etiquetas; no se dibujan). Alto por defecto 250. De 2 a 12 barras (doc: hasta 16 si el ancho
//   es ≥ 560). Si los rótulos no caben en su hueco se rotula solo la destacada (y se anota); si las etiquetas
//   no caben, se escriben alternas conservando la de la destacada.
G.barras_v = (el, S, { ancho, alto, col }) => {
  H.assert(Array.isArray(S.etiquetas) && Array.isArray(S.valores) && S.etiquetas.length === S.valores.length, "etiquetas y valores deben tener la misma longitud");
  const n = S.valores.length;
  H.assert(n >= 2 && (n <= 12 || (n <= 16 && ancho >= 560)), n > 12 && n <= 16 ? "doc: barras_v admite hasta 16 barras solo con ancho ≥ 560 px (aquí " + ancho + ")" : "barras-v admite de 2 a 12 barras");
  S.valores.forEach((v) => H.assert(typeof v === "number" && isFinite(v), "valores debe ser numérico"));
  const P = H.validarPeriodos(S.periodos, n), R = S.referencia || null;
  if (R) H.assert(typeof R.valor === "number" && isFinite(R.valor) && typeof R.texto === "string" && R.texto.trim(), "referencia necesita valor numérico y texto");
  const W = ancho, Hh = alto || 250, arriba = P.length ? 40 : 22, abajo = 22, base = Hh - abajo;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  const vals = S.valores, hi = GX.indice(S.destacar == null ? -1 : S.destacar, n);
  const dom = H.dominio(vals.concat(R ? [R.valor] : []), true);
  // Con negativos, 16 px bajo la barra más baja para su rótulo (va debajo de la barra, como en la tarjeta).
  const minV = Math.min(...vals);
  if (minV < 0) { const r = 16 / (base - arriba); dom[0] = Math.min(dom[0], (minV - r * dom[1]) / (1 - r)); }
  const y = H.escala(dom, [base, arriba]), yz = y(0);
  const slot = W / n, bw = Math.min(40, slot * 0.6);
  const fV = (i) => GX.fmt(vals[i], S.formato), fontV = (i) => (i === hi ? GX.MONO_D : GX.MONO_B), fontE = (i) => (i === hi ? GX.MONO_B : GX.MONO);
  // Rótulos de valor: todos si dos vecinos no se pisan; si no, alternos (con la destacada); si ni así, solo la destacada.
  const wV = vals.map((v, i) => H.medir(fV(i), fontV(i)));
  const caben = (p) => wV.every((w, i) => i + p >= n || (w + wV[i + p]) / 2 <= p * slot - 4);
  let rotular = S.rotular === "destacada" ? "destacada" : "todas", pasoV = 1;
  if (rotular === "todas" && !caben(1)) {
    if (caben(2)) pasoV = 2;
    else { rotular = "destacada"; GX.anotar(el, "Se rotula solo la barra destacada: las cifras no caben a este ancho."); }
  }
  const etW = S.etiquetas.map((e, i) => H.medir(String(e), fontE(i)));
  let paso = 1;
  if (etW.some((w) => w > slot - 2)) {
    paso = 2;
    H.assert(etW.every((w) => w <= 2 * slot - 2), "doc: las etiquetas no caben a " + W + " px: acórtalas o usa menos barras");
  }
  const bordes = (i) => [i * slot, (i + 1) * slot];
  if (P.length) GX.periodos(svg, P, bordes, 16, base, 12, col);
  if (S.banda) {
    const x0 = S.banda.desde * slot, x1 = (S.banda.hasta + 1) * slot, yb = P.length ? 16 : 0;
    GX.rect(svg, x0, yb, x1 - x0, base - yb, col.dest, { "fill-opacity": 0.1 });
    if (S.banda.texto) GX.t(svg, x0 + 10, yb + 18, S.banda.texto, GX.MONO_B, col.tinta || col.texto);
  }
  if (S.nivel != null) GX.linea(svg, 0, y(vals[S.nivel]), W, y(vals[S.nivel]), col.dest, { "stroke-dasharray": "4 4" });
  vals.forEach((v, i) => {
    const x = i * slot + (slot - bw) / 2, d = i === hi, yv = y(v);
    GX.rect(svg, x, Math.min(yv, yz), bw, Math.abs(yz - yv), d ? col.dest : col.base);
    if (d || (rotular === "todas" && (i - hi) % pasoV === 0)) GX.t(svg, x + bw / 2, v < 0 ? yv + (d ? 15 : 13) : yv - 8, fV(i), fontV(i), d ? (col.tinta || col.dest) : col.texto, { "text-anchor": "middle" });
    if ((i - hi) % paso === 0) GX.t(svg, x + bw / 2, Hh - 4, String(S.etiquetas[i]), fontE(i), col.texto, { "text-anchor": "middle" });
  });
  GX.linea(svg, 0, yz, W, yz, col.linea);
  if (R) {
    const yr = y(R.valor);
    GX.linea(svg, 0, yr, W, yr, col.dest, { "stroke-dasharray": "5 4" });
    GX.t(svg, W, yr - 5, R.texto.trim() + " · " + GX.fmt(R.valor, S.formato), GX.MONO_B, col.tinta || col.dest, { "text-anchor": "end" });
  }
  for (const m of S.marcadores || []) {
    const x = m.i * slot + slot / 2 + (m.lado === "derecha" ? bw / 2 + 18 : 0);
    GX.marcador(svg, x, Math.max(14, y(vals[m.i]) - (m.lado === "derecha" ? 0 : 34)), m.n, col);
  }
};

// barras_h · ranking con nombre a la izquierda y valor al final de la barra (tarjeta barras-h).
//   items [{nombre, valor, valor_texto?}] (valor_texto sustituye al número formateado), destacar (índice tras
//   ordenar), orden "desc" (defecto) | "dado", formato. De 2 a 12 items; alto fijo n × 30. Los nombres ocupan
//   hasta el 45 % del ancho (los que no caben bajan a 12 px).
G.barras_h = (el, S, { ancho, col }) => {
  H.assert(Array.isArray(S.items) && S.items.length >= 2 && S.items.length <= 12, "barras_h: 2 a 12 items");
  S.items.forEach((it) => H.assert(it && typeof it.nombre === "string" && typeof it.valor === "number", "cada item necesita nombre y valor numérico"));
  const items = S.orden === "dado" ? S.items.slice() : S.items.slice().sort((a, b) => b.valor - a.valor);
  const n = items.length, fila = 30, Hh = n * fila, W = ancho;
  const hi = GX.indice(S.destacar == null ? 0 : S.destacar, n);
  const txt = (it) => (it.valor_texto != null && it.valor_texto !== "" ? String(it.valor_texto) : GX.fmt(it.valor, S.formato));
  const maxN = Math.floor(W * 0.45) - 16;
  const fontN = items.map((it, i) => {
    const fn = H.encajar(it.nombre, [i === hi ? GX.SANS_D : GX.SANS, GX.SANS_S], maxN);
    H.assert(fn, "doc: «" + it.nombre + "» no cabe en la columna de nombres (" + maxN + " px): acórtalo");
    return fn;
  });
  const etiq = Math.ceil(Math.max(...items.map((it, i) => H.medir(it.nombre, fontN[i])))) + 16;
  const valW = Math.ceil(Math.max(...items.map((it, i) => H.medir(txt(it), i === hi ? GX.MONO_D : GX.MONO_B)))) + 10;
  const util = W - etiq - valW, max = Math.max(...items.map((it) => Math.abs(it.valor))) || 1;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  items.forEach((it, i) => {
    const d = i === hi, w = Math.max(2, (Math.abs(it.valor) / max) * util), yy = i * fila;
    GX.t(svg, 0, yy + 20, it.nombre, fontN[i], col.texto);
    GX.rect(svg, etiq, yy + 7, w, 16, d ? col.dest : col.base);
    GX.t(svg, etiq + w + 8, yy + 20, txt(it), d ? GX.MONO_D : GX.MONO_B, d ? (col.tinta || col.dest) : col.texto);
  });
  GX.linea(svg, etiq, 0, etiq, Hh, col.linea, { "stroke-width": 1 });
};

// divergente · cambios con signo; nombre encima de cada barra (cabe a media página). Tarjeta divergente.
//   items [{nombre, valor}], destacar (índice tras ordenar), orden "desc" (defecto: de mayor a menor) | "dado",
//   formato (signo siempre; sufijo). De 2 a 10 items; alto fijo n × 31.
G.divergente = (el, S, { ancho, col }) => {
  H.assert(Array.isArray(S.items) && S.items.length >= 2 && S.items.length <= 10, "divergente admite de 2 a 10 items");
  S.items.forEach((it) => H.assert(it && typeof it.nombre === "string" && typeof it.valor === "number", "cada item necesita nombre y valor numérico"));
  const items = S.orden === "dado" ? S.items.slice() : S.items.slice().sort((a, b) => b.valor - a.valor);
  const n = items.length, fila = 31, Hh = n * fila, W = ancho;
  const hi = GX.indice(S.destacar == null ? 0 : S.destacar, n);
  const fmt = Object.assign({ signo: true }, S.formato || {}), lab = (it) => GX.fmt(it.valor, fmt);
  const vals = items.map((it) => it.valor), min = Math.min(0, ...vals), max = Math.max(0, ...vals);
  const labW = Math.ceil(Math.max(...items.map((it) => H.medir(lab(it), GX.MONO_B)))) + 8;
  const xL = min < 0 ? labW : 0, xR = W - (max > 0 ? labW : 0);
  const esc = (xR - xL) / ((max - min) || 1), x0 = xL + (-min) * esc;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  items.forEach((it, i) => {
    const d = i === hi, yy = i * fila, w = Math.abs(it.valor) * esc, x = it.valor < 0 ? x0 - w : x0;
    GX.t(svg, 0, yy + 11, it.nombre, d ? "800 13px Archivo, sans-serif" : "600 13px Archivo, sans-serif", d ? (col.tinta || col.dest) : col.texto);
    GX.rect(svg, x, yy + 15, Math.max(2, w), 11, d ? col.dest : col.base);
    GX.t(svg, it.valor < 0 ? x - 6 : x + w + 6, yy + 24, lab(it), GX.MONO_B, d ? (col.tinta || col.dest) : col.texto, { "text-anchor": it.valor < 0 ? "end" : "start" });
  });
  GX.linea(svg, x0, 0, x0, Hh, col.linea);
};

// agrupadas · 2–3 series por categoría en barras horizontales desde cero (tarjeta agrupadas).
//   etiquetas[2–6], series[2–3] {nombre, valores (≥ 0, uno por categoría), destacar?} (≤ 1 destacada; sin ella,
//   la última), rotular "todas" (defecto) | "destacada" | null (sin cifras), referencia {valor, texto} (línea
//   vertical punteada con rótulo), formato. Leyenda de series en una fila arriba dentro del SVG; la destacada
//   en el acento, las otras en tinta (.85) y tinta atenuada. Los nombres ocupan hasta el 40 % del ancho (bajan
//   a 12 px o a dos líneas). Alto por defecto n × (k × 14 + 16) + 24 (+ 18 con referencia).
G.agrupadas = (el, S, { ancho, alto, col }) => {
  H.assert(Array.isArray(S.etiquetas) && S.etiquetas.length >= 2 && S.etiquetas.length <= 6, "agrupadas admite de 2 a 6 categorías");
  H.assert(Array.isArray(S.series) && S.series.length >= 2 && S.series.length <= 3, "agrupadas admite de 2 a 3 series");
  const n = S.etiquetas.length, k = S.series.length, W = ancho;
  S.series.forEach((s) => {
    H.assert(s && typeof s.nombre === "string" && s.nombre.trim() && Array.isArray(s.valores) && s.valores.length === n, "cada serie necesita nombre y " + n + " valores");
    s.valores.forEach((v) => H.assert(typeof v === "number" && isFinite(v) && v >= 0, "valores de «" + s.nombre + "»: números ≥ 0"));
  });
  H.assert(S.series.filter((s) => s.destacar).length <= 1, "solo una serie puede llevar destacar: true");
  let hi = S.series.findIndex((s) => s.destacar); if (hi < 0) hi = k - 1;
  const R = S.referencia || null;
  if (R) H.assert(typeof R.valor === "number" && isFinite(R.valor) && typeof R.texto === "string" && R.texto.trim(), "referencia necesita valor numérico y texto");
  const rot = S.rotular === undefined || S.rotular === "todas" ? "todas" : S.rotular === "destacada" ? "destacada" : null;
  let o = 0;
  const estilo = S.series.map((s, j) => (j === hi ? { fill: col.dest, op: 1 } : [{ fill: col.texto, op: 0.85 }, { fill: col.base, op: 1 }][Math.min(o++, 1)]));
  const f = (v) => GX.fmt(v, S.formato);
  // Leyenda: swatch 10×10 + nombre; pasa a una segunda fila si no cabe.
  const ley = []; let lx = 0, lf = 0;
  S.series.forEach((s, j) => {
    const w = 14 + H.medir(s.nombre, GX.MONO);
    if (lx > 0 && lx + w > W) { lx = 0; lf++; }
    ley.push({ j, x: lx, fila: lf }); lx += w + 16;
  });
  const yTop = 24 + lf * 16 + (R ? 18 : 0), grupoH = k * 14 - 2, def = yTop + n * (k * 14 + 16);
  const Hh = Math.max(alto || 0, def), filaH = (Hh - yTop) / n;
  // Nombres: 14 px, 12 px o dos líneas de 12 px partidas por el espacio que mejor equilibra.
  const maxN = Math.floor(W * 0.4);
  const ajustar = (s) => {
    const fn = H.encajar(s, [GX.SANS, GX.SANS_S], maxN);
    if (fn) return { lineas: [s], font: fn };
    const p = s.split(" "); let mejor = null;
    for (let i = 1; i < p.length; i++) {
      const a = p.slice(0, i).join(" "), b = p.slice(i).join(" ");
      if (H.encajar(a, [GX.SANS_S], maxN) && H.encajar(b, [GX.SANS_S], maxN)) {
        const dif = Math.abs(H.medir(a, GX.SANS_S) - H.medir(b, GX.SANS_S));
        if (!mejor || dif < mejor.dif) mejor = { lineas: [a, b], font: GX.SANS_S, dif };
      }
    }
    return mejor;
  };
  const nom = S.etiquetas.map((e) => { const a = ajustar(String(e)); H.assert(a, "doc: la categoría «" + e + "» no cabe en " + maxN + " px: acórtala"); return a; });
  const colIzq = Math.ceil(Math.max(...nom.map((a) => Math.max(...a.lineas.map((l) => H.medir(l, a.font)))))) + 12;
  const labW = rot ? Math.ceil(Math.max(...S.series.flatMap((s) => s.valores.map((v) => H.medir(f(v), GX.MONO_B))))) + 8 : 0;
  const x0 = colIzq, x1 = W - labW, max = Math.max(...S.series.flatMap((s) => s.valores), R ? R.valor : 0) || 1;
  const sx = (v) => x0 + (v / max) * (x1 - x0);
  const svg = GX.lienzo(el, W, Hh, S.aria);
  ley.forEach((it) => {
    const y = 3 + it.fila * 16;
    GX.rect(svg, it.x, y, 10, 10, estilo[it.j].fill, { "fill-opacity": estilo[it.j].op });
    GX.t(svg, it.x + 14, y + 9, S.series[it.j].nombre, GX.MONO, col.texto);
  });
  if (R) {
    const x = sx(R.valor), txt = R.texto.trim() + " · " + f(R.valor), cabe = x + 6 + H.medir(txt, GX.MONO_B) <= W;
    GX.linea(svg, x, yTop - 4, x, Hh, col.texto, { "stroke-width": 1, "stroke-dasharray": "4 4" });
    GX.t(svg, cabe ? x + 6 : x - 6, yTop - 7, txt, GX.MONO_B, col.texto, { "text-anchor": cabe ? "start" : "end" });
  }
  S.etiquetas.forEach((e, i) => {
    const top = yTop + i * filaH + (filaH - grupoH) / 2, cy = top + grupoH / 2, a = nom[i];
    if (a.lineas.length === 1) GX.t(svg, 0, cy + 5, a.lineas[0], a.font, col.texto);
    else a.lineas.forEach((l, q) => GX.t(svg, 0, cy - 2 + q * 13, l, a.font, col.texto));
    S.series.forEach((s, j) => {
      const y = top + j * 14, v = s.valores[i], w = Math.max(2, sx(v) - x0), d = j === hi;
      GX.rect(svg, x0, y, w, 12, estilo[j].fill, { "fill-opacity": estilo[j].op });
      if (rot === "todas" || (rot === "destacada" && d)) GX.t(svg, x0 + w + 6, y + 10, f(v), GX.MONO_B, d ? (col.tinta || col.dest) : col.texto);
    });
  });
  GX.linea(svg, x0, yTop, x0, Hh, col.linea, { "stroke-width": 1 });
};

// bullet · valor contra meta o referencia, una fila por item (tarjeta bullet).
//   items[1–6] {nombre, valor (≥ 0), meta?}, meta (común), texto_meta, maximo (tope; null = el mayor entre
//   valores y metas), destacar (índice), formato. Fila de 44 px: nombre (+ meta propia a la derecha) y valor al
//   final de la línea; pista hasta el tope, barra de 12 px hasta la meta, exceso rayado y marcador de meta.
//   Con meta común, «texto_meta · valor» al pie. Alto por defecto n × 44 + 20.
G.bullet = (el, S, { ancho, alto, col }) => {
  H.assert(Array.isArray(S.items) && S.items.length >= 1 && S.items.length <= 6, "bullet admite de 1 a 6 items");
  const items = S.items.map((it) => {
    H.assert(it && typeof it.nombre === "string" && typeof it.valor === "number" && it.valor >= 0, "cada item necesita nombre y valor numérico ≥ 0");
    const meta = typeof it.meta === "number" ? it.meta : S.meta;
    H.assert(typeof meta === "number" && meta > 0, "«" + it.nombre + "» no tiene meta: usa `meta` común o `meta` por item");
    return { nombre: it.nombre, valor: it.valor, meta };
  });
  const n = items.length, hi = S.destacar == null ? -1 : GX.indice(S.destacar, n);
  const maxDato = Math.max(...items.flatMap((it) => [it.valor, it.meta]));
  const max = S.maximo == null ? maxDato : S.maximo;
  H.assert(max >= maxDato, "maximo (" + max + ") es menor que algún valor o meta (" + maxDato + ")");
  const metaComun = items.every((it) => it.meta === items[0].meta), txtMeta = (S.texto_meta || "meta").trim();
  const f = (v) => GX.fmt(v, S.formato);
  const W = ancho, fila = 44, Hh = Math.max(alto || 0, n * fila + 20), filaH = (Hh - 20) / n;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  const sx = (v) => (v / max) * W;
  // Rayado (del color del fondo) sobre el tramo que excede la meta.
  const pid = "bl" + Math.random().toString(36).slice(2, 7);
  const pat = H.svgEl("pattern", { id: pid, width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, H.svgEl("defs", {}, svg));
  H.svgEl("rect", { width: 3, height: 6, fill: col.sobre, "fill-opacity": 0.75 }, pat);
  items.forEach((it, i) => {
    const d = i === hi, top = i * filaH + (filaH - fila) / 2, yN = top + 14, yP = top + 20;
    const vTxt = f(it.valor), fontV = d ? GX.MONO_D : GX.MONO_B;
    let xDer = W - H.medir(vTxt, fontV) - 10;
    if (!metaComun) {
      const m = txtMeta + " " + f(it.meta) + " ·";
      GX.t(svg, xDer, yN, m, GX.MONO, col.texto, { "text-anchor": "end" });
      xDer -= H.medir(m, GX.MONO) + 8;
    }
    const fontN = H.encajar(it.nombre, [d ? GX.SANS_D : GX.SANS, GX.SANS_S], xDer - 8);
    H.assert(fontN, "«" + it.nombre + "»: nombre, meta y valor no caben en una línea");
    GX.t(svg, 0, yN, it.nombre, fontN, col.texto);
    GX.t(svg, W, yN, vTxt, fontV, d ? (col.tinta || col.dest) : col.texto, { "text-anchor": "end" });
    GX.rect(svg, 0, yP, W, 16, col.suave);
    const xv = sx(it.valor), xm = sx(it.meta), fill = d ? col.dest : col.base;
    GX.rect(svg, 0, yP + 2, Math.max(2, Math.min(xv, xm)), 12, fill);
    if (xv > xm) { GX.rect(svg, xm, yP + 2, xv - xm, 12, fill); GX.rect(svg, xm, yP + 2, xv - xm, 12, "url(#" + pid + ")"); }
    GX.rect(svg, Math.min(W - 2, xm - 1), yP, 2, 16, col.texto);
  });
  if (metaComun) {
    const xm = sx(items[0].meta), t = txtMeta + " · " + f(items[0].meta), w = H.medir(t, GX.MONO);
    const anc = xm + w / 2 > W ? "end" : xm - w / 2 < 0 ? "start" : "middle";
    GX.t(svg, anc === "end" ? W : anc === "start" ? 0 : xm, Hh - 4, t, GX.MONO, col.texto, { "text-anchor": anc });
  }
};

// columnas · dos series por periodo en columnas verticales (p. ej. año completo frente a SE 35); valores null = sin dato.
//   Solo documento (la plantilla de tarjeta `agrupadas` es horizontal y tiene su propio G.agrupadas).
//   etiquetas[], series [{nombre, valores, estilo "base"|"fuerte"}], destacar {serie, i},
//   rotular [[serie, i], …] (qué valores llevan cifra), formato.
G.columnas = (el, S, { ancho, alto, col }) => {
  const n = S.etiquetas.length, k = S.series.length, W = ancho, Hh = alto || 326, arriba = 30, base = Hh - 26;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  const max = Math.max(...S.series.flatMap((s) => s.valores.filter((v) => v != null))) || 1;
  const slot = W / n, bw = Math.min(20, (slot * 0.7) / k), gap = 2, grupo = k * bw + (k - 1) * gap;
  const y = (v) => base - (v / max) * (base - arriba);
  const rot = new Set((S.rotular || []).map((p) => p.join(":")));
  S.etiquetas.forEach((et, i) => {
    const gx = i * slot + (slot - grupo) / 2;
    S.series.forEach((s, j) => {
      const v = s.valores[i];
      if (v == null) return;
      const d = S.destacar && S.destacar.serie === j && S.destacar.i === i;
      const x = gx + j * (bw + gap);
      GX.rect(svg, x, y(v), bw, base - y(v), d ? col.dest : s.estilo === "fuerte" ? col.linea : col.base);
      if (rot.has(j + ":" + i) || d) GX.t(svg, x + bw / 2, y(v) - 8, GX.fmt(v, S.formato), d ? GX.MONO_D : GX.MONO_B, d ? col.dest : col.texto, { "text-anchor": "middle" });
    });
    GX.t(svg, i * slot + slot / 2, Hh - 6, et, i === n - 1 ? GX.MONO_B : GX.MONO, col.texto, { "text-anchor": "middle" });
  });
  GX.linea(svg, 0, base, W, base, col.linea);
};

// ---- investigacion/graficos/cambio.js
// Gráficos de cambio: dos fechas por categoría (pendiente, pesas), dos cifras (antes_despues) y acumulados
// (cascada). Mismo contrato que las plantillas de tarjeta; la aritmética compartida (píldora, acumulados)
// la pone H, nunca el gráfico.

// pendiente · cambio entre dos fechas para 2–6 categorías (slope, tarjeta pendiente).
//   fechas[2], items[2–6] {nombre, a, b}, destacar (índice; línea gruesa en el acento), formato.
//   Ejes a 1/4 y 3/4 del ancho (se acercan si los rótulos no caben; los nombres bajan a 12 px), fechas arriba;
//   «nombre valor» a la izquierda y el valor a la derecha, empujados con H.antiSolape. Dominio sin cero.
//   Alto por defecto 280.
G.pendiente = (el, S, { ancho, alto, col }) => {
  H.assert(Array.isArray(S.fechas) && S.fechas.length === 2, "fechas debe tener exactamente 2 valores");
  H.assert(Array.isArray(S.items) && S.items.length >= 2 && S.items.length <= 6, "pendiente admite de 2 a 6 items");
  S.items.forEach((it) => H.assert(it && it.nombre && typeof it.a === "number" && typeof it.b === "number", "cada item necesita nombre, a y b numéricos"));
  const n = S.items.length, hi = GX.indice(S.destacar || 0, n), W = ancho, Hh = alto || 280;
  const f = (v) => GX.fmt(v, S.formato);
  const medidaIzq = (fn) => Math.max(...S.items.map((it, i) => H.medir(String(it.nombre), fn(i)) + 6 + H.medir(f(it.a), GX.MONO_B))) + 8;
  let fN = (i) => (i === hi ? GX.SANS_D : GX.SANS), izqW = medidaIzq(fN);
  if (izqW > W / 4) { fN = () => GX.SANS_S; izqW = medidaIzq(fN); }
  const derW = Math.max(...S.items.map((it) => H.medir(f(it.b), GX.MONO_B))) + 8;
  const x0 = Math.max(W / 4, izqW), x1 = Math.min((W * 3) / 4, W - derW);
  H.assert(x1 - x0 >= 60, "doc: pendiente no cabe en " + W + " px: acorta los nombres o usa menos items");
  const y0 = 26, y1 = Hh - 8;
  const sy = H.escala(H.dominio(S.items.flatMap((it) => [it.a, it.b]), false), [y1, y0]);
  const svg = GX.lienzo(el, W, Hh, S.aria);
  GX.linea(svg, x0, y0, x0, y1, col.linea, { "stroke-width": 1, "stroke-opacity": 0.5 });
  GX.linea(svg, x1, y0, x1, y1, col.linea, { "stroke-width": 1, "stroke-opacity": 0.5 });
  GX.t(svg, x0, 12, String(S.fechas[0]), GX.MONO_B, col.texto, { "text-anchor": "middle" });
  GX.t(svg, x1, 12, String(S.fechas[1]), GX.MONO_B, col.texto, { "text-anchor": "middle" });
  const izq = S.items.map((it, i) => ({ i, y: sy(it.a) })), der = S.items.map((it, i) => ({ i, y: sy(it.b) }));
  H.antiSolape(izq, { minGap: 16, min: y0 + 4, max: Hh - 8 });
  H.antiSolape(der, { minGap: 16, min: y0 + 4, max: Hh - 8 });
  const orden = S.items.map((_, i) => i).sort((a, b) => (a === hi) - (b === hi));
  for (const i of orden) {
    const it = S.items[i], d = i === hi, c = d ? col.dest : col.base, tc = d ? (col.tinta || col.dest) : col.texto;
    GX.linea(svg, x0, sy(it.a), x1, sy(it.b), c, { "stroke-width": d ? 3 : 1.5, "stroke-linecap": "round" });
    H.svgEl("circle", { cx: x0, cy: sy(it.a), r: d ? 4.5 : 3, fill: c }, svg);
    H.svgEl("circle", { cx: x1, cy: sy(it.b), r: d ? 4.5 : 3, fill: c }, svg);
    const yi = izq.find((p) => p.i === i).y + 4, yd = der.find((p) => p.i === i).y + 4, va = f(it.a);
    GX.t(svg, x0 - 8, yi, va, GX.MONO_B, tc, { "text-anchor": "end" });
    GX.t(svg, x0 - 8 - H.medir(va, GX.MONO_B) - 6, yi, String(it.nombre), fN(i), tc, { "text-anchor": "end" });
    GX.t(svg, x1 + 8, yd, f(it.b), GX.MONO_B, tc);
  }
};

// pesas · dos fechas por categoría, puntos unidos (dumbbell, tarjeta pesas).
//   fechas[2], items[2–8] {nombre, a, b}, destacar (índice tras ordenar), orden "dado" (defecto) | "desc" (por b),
//   desdeCero (false: eje desde el mínimo, anotado «Eje desde N»), formato. Filas de 30 px; las fechas como
//   leyenda arriba, rejilla con ticks al pie; punto a en tinta y punto b en el acento; valores fuera de los puntos.
//   Los nombres ocupan hasta el 40 % del ancho. Alto por defecto n × 30 + 40.
G.pesas = (el, S, { ancho, alto, col }) => {
  H.assert(Array.isArray(S.fechas) && S.fechas.length === 2, "fechas debe tener exactamente 2 valores");
  H.assert(Array.isArray(S.items) && S.items.length >= 2 && S.items.length <= 8, "pesas admite de 2 a 8 items");
  S.items.forEach((it) => H.assert(it && typeof it.nombre === "string" && typeof it.a === "number" && typeof it.b === "number", "cada item necesita nombre, a y b numéricos"));
  const items = S.orden === "desc" ? S.items.slice().sort((x, y) => y.b - x.b) : S.items.slice();
  const n = items.length, hi = GX.indice(S.destacar || 0, n), W = ancho;
  const yTop = 24, Hh = Math.max(alto || 0, n * 30 + 40), filaH = (Hh - 40) / n, yBot = yTop + n * filaH;
  const f = (v) => GX.fmt(v, S.formato), wLab = (v) => H.medir(f(v), GX.MONO_B);
  const maxN = Math.floor(W * 0.4);
  const fontN = items.map((it, i) => {
    const fn = H.encajar(it.nombre, [i === hi ? GX.SANS_D : GX.SANS, GX.SANS_S], maxN);
    H.assert(fn, "doc: «" + it.nombre + "» no cabe en la columna de nombres (" + maxN + " px): acórtalo");
    return fn;
  });
  const colN = Math.ceil(Math.max(...items.map((it, i) => H.medir(it.nombre, fontN[i])))) + 12;
  const dom = H.dominio(items.flatMap((it) => [it.a, it.b]), S.desdeCero !== false);
  const tk = H.ticks(dom[0], dom[1], W - colN < 220 ? 2 : 4), fEje = H.formatoEje(S.formato, tk);
  // Reservas: a la derecha, el valor del extremo derecho; a la izquierda, lo que exija el valor del extremo
  // izquierdo que más se acerque a la columna de nombres (x(v) − 12 − ancho ≥ colN + 2, resuelto en cerrado).
  const x1 = W - (Math.max(...items.map((it) => wLab(Math.max(it.a, it.b)))) + 12);
  let res = 0;
  items.forEach((it) => {
    const v = Math.min(it.a, it.b), t = (v - dom[0]) / (dom[1] - dom[0]);
    if (t < 0.999) res = Math.max(res, (14 + wLab(v) - t * (x1 - colN)) / (1 - t));
  });
  const x0 = colN + Math.ceil(Math.max(0, res));
  H.assert(x1 - x0 >= 60, "doc: pesas no cabe en " + W + " px: acorta los nombres o usa escala en formato");
  const sx = H.escala(dom, [x0, x1]);
  const svg = GX.lienzo(el, W, Hh, S.aria);
  H.svgEl("circle", { cx: 5, cy: 8, r: 5, fill: col.texto }, svg);
  GX.t(svg, 16, 12, String(S.fechas[0]), GX.MONO, col.texto);
  const xf = 16 + H.medir(String(S.fechas[0]), GX.MONO) + 18;
  H.svgEl("circle", { cx: xf + 6, cy: 8, r: 6, fill: col.dest }, svg);
  GX.t(svg, xf + 18, 12, String(S.fechas[1]), GX.MONO, col.texto);
  let prevR = -Infinity;
  for (const tick of tk) {
    const x = sx(tick), s = H.num(tick, fEje), w = H.medir(s, GX.MONO);
    GX.linea(svg, x, yTop, x, yBot, col.suave, { "stroke-width": 1 });
    if (x - w / 2 >= prevR + 6 && x - w / 2 >= colN - 10 && x + w / 2 <= W) { GX.t(svg, x, Hh - 2, s, GX.MONO, col.texto, { "text-anchor": "middle" }); prevR = x + w / 2; }
  }
  GX.linea(svg, x0, yBot, x1, yBot, col.linea, { "stroke-width": 1 });
  items.forEach((it, i) => {
    const d = i === hi, cy = yTop + i * filaH + filaH / 2, xa = sx(it.a), xb = sx(it.b);
    GX.t(svg, 0, cy + 5, it.nombre, fontN[i], col.texto);
    GX.rect(svg, Math.min(xa, xb), cy - 3, Math.abs(xb - xa), 6, col.base);
    H.svgEl("circle", { cx: xa, cy, r: 5, fill: col.texto }, svg);
    H.svgEl("circle", { cx: xb, cy, r: 6, fill: col.dest }, svg);
    const izq = it.a <= it.b ? ["a", xa] : ["b", xb], der = it.a <= it.b ? ["b", xb] : ["a", xa];
    const cv = (q) => (d && q === "b" ? (col.tinta || col.dest) : col.texto);
    GX.t(svg, izq[1] - 12, cy + 4, f(it[izq[0]]), GX.MONO_B, cv(izq[0]), { "text-anchor": "end" });
    GX.t(svg, der[1] + 12, cy + 4, f(it[der[0]]), GX.MONO_B, cv(der[0]));
  });
  if (S.desdeCero === false) GX.anotar(el, "Eje desde " + H.num(dom[0], fEje) + ".");
};

// antes_despues · dos cifras grandes, flecha y píldora ×N o ±% calculada (tarjeta antes-despues), en SVG.
//   antes {etiqueta, valor, sub}, despues {etiqueta, valor, sub}, pildora "factor"|"porcentaje"|"ninguna",
//   decimales_pildora, formato. Dos columnas: etiqueta, número en serif (48 → 40 → 32 hasta caber en
//   ancho/2 − 40), sub y barra proporcional de 10 px; la píldora la calcula H.pildora (la misma aritmética que
//   la tarjeta) y va sobre el acento. Alto fijo 150.
G.antes_despues = (el, S, { ancho, col }) => {
  for (const k of ["antes", "despues"]) H.assert(S[k] && typeof S[k].valor === "number" && S[k].etiqueta, k + " necesita etiqueta y valor numérico");
  const W = ancho, Hh = 150, colW = (W - 40) / 2, maxNum = W / 2 - 40;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  const max = Math.max(Math.abs(S.antes.valor), Math.abs(S.despues.valor)) || 1;
  const txtP = H.pildora(S.antes.valor, S.despues.valor, S.pildora || "factor", S.decimales_pildora);
  const columna = (D, x, d) => {
    GX.t(svg, x, 12, String(D.etiqueta).toUpperCase(), GX.MONO, col.texto);
    const s = GX.fmt(D.valor, S.formato), fn = H.encajar(s, [GX.serif(48), GX.serif(40), GX.serif(32)], maxNum);
    H.assert(fn, "doc: la cifra «" + s + "» no cabe en " + Math.round(maxNum) + " px ni a 32 px: usa escala en formato");
    GX.t(svg, x, 60, s, fn, d ? (col.tinta || col.dest) : col.texto);
    if (D.sub) GX.t(svg, x, 82, String(D.sub), GX.SANS_S, col.texto);
    GX.rect(svg, x, 92, Math.max(3, (Math.abs(D.valor) / max) * colW), 10, d ? col.dest : col.base);
  };
  columna(S.antes, 0, false);
  columna(S.despues, colW + 40, true);
  const xa = colW + 6, xb = colW + 34, ya = 48;
  GX.linea(svg, xa, ya, xb - 6, ya, col.texto, { "stroke-width": 2 });
  H.svgEl("polygon", { points: (xb - 8) + "," + (ya - 5) + " " + xb + "," + ya + " " + (xb - 8) + "," + (ya + 5), fill: col.texto }, svg);
  if (txtP) {
    const w = H.medir(txtP, GX.MONO_D) + 20;
    GX.rect(svg, 0, 114, w, 26, col.dest, { rx: 10 });
    GX.t(svg, w / 2, 132, txtP, GX.MONO_D, GX.textoSobre(col.dest, col), { "text-anchor": "middle" });
  }
};

// cascada · del inicio al fin sumando y restando (waterfall horizontal, tarjeta cascada).
//   inicio {nombre, valor} | null, pasos[2–8] {nombre, valor ≥ 0, efecto suma|resta}, fin {nombre, valor?} | null,
//   destacar "inicio"|"fin"|índice de paso (defecto: fin, o el último paso), formato. Los acumulados los calcula
