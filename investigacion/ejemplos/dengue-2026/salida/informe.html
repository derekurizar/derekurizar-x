        GX.rect(svg, x, y, celda, celda, sinDato, { rx: 3 });
        if (mostrarValor) GX.t(svg, x + celda / 2, y + celda / 2 + 4, "—", GX.MONO, col.texto, { "text-anchor": "middle", "fill-opacity": 0.5 });
        return;
      }
      const c = colorDe(v);
      GX.rect(svg, x, y, celda, celda, c, { rx: 3 });
      if (mostrarValor) { const s = f(v); if (H.medir(s, GX.MONO) <= celda - 4) GX.t(svg, x + celda / 2, y + celda / 2 + 4, s, GX.MONO, GX.textoSobre(c, col), { "text-anchor": "middle" }); }
    });
  });
  if (hiC) {  // contorno de la destacada: halo del fondo + acento de 2 px, por dentro de la celda
    const x = x0 + hiC.col * (celda + gap), y = y0 + hiC.fila * (celda + gap);
    H.svgEl("rect", { x: x + 1, y: y + 1, width: celda - 2, height: celda - 2, rx: 2, fill: "none", stroke: col.sobre, "stroke-width": 4 }, svg);
    H.svgEl("rect", { x: x + 1, y: y + 1, width: celda - 2, height: celda - 2, rx: 2, fill: "none", stroke: col.dest, "stroke-width": 2 }, svg);
  }
  // Leyenda: mín · rampa · máx (y «sin dato» a la derecha si hay nulos)
  const ly = Hh - 8, sw = 18, sh = 10, tMin = f(min), tMax = f(max);
  let lx = x0;
  GX.t(svg, lx, ly, tMin, GX.MONO, col.texto);
  lx += H.medir(tMin, GX.MONO) + 6;
  cs.forEach((c, k) => GX.rect(svg, lx + k * sw, ly - sh + 1, sw - 1, sh, c));
  lx += nc * sw + 5;
  GX.t(svg, lx, ly, tMax, GX.MONO, col.texto);
  if (sinDato) {
    const wS = H.medir("sin dato", GX.MONO), xs = W - wS - 6 - sw;
    H.assert(lx + H.medir(tMax, GX.MONO) + 10 <= xs, "doc: la leyenda no cabe a este ancho: menos clases");
    GX.rect(svg, xs, ly - sh + 1, sw, sh, sinDato, { rx: 2 });
    GX.t(svg, W, ly, "sin dato", GX.MONO, col.texto, { "text-anchor": "end" });
  }
};

// linea_tiempo · eventos[3–8] {fecha (empieza por AAAA), nombre ≤ 40, valor ≥ 0, sub ≤ 40, valor_texto}, proporcional,
//   forma "barra" | "circulo" | "ninguna", destacar (índice). Alto por defecto n × 44 (filas iguales, o centradas según
//   el año si proporcional). Columnas: fecha serif 22 (+ sub MONO si cabe en los 110 px) · espina punteada con círculo ·
//   nombre SANS (14 → 12) · magnitud y valor. Si los sub no caben en la columna de fecha van bajo el nombre y la
//   columna se estrecha a la fecha más ancha; si la magnitud no tiene ≥ 80 px (media página), el nombre va arriba y la
//   barra debajo, en la misma columna.
G.linea_tiempo = (el, S, { ancho, alto, col }) => {
  const E = S.eventos;
  H.assert(Array.isArray(E) && E.length >= 3 && E.length <= 8, "linea-tiempo admite de 3 a 8 eventos");
  E.forEach((e) => {
    H.assert(e && typeof e.fecha === "string" && /^\d{4}/.test(e.fecha.trim()), "cada evento necesita fecha (texto que empieza por el año AAAA)");
    H.assert(typeof e.nombre === "string" && e.nombre.trim() && e.nombre.length <= 40, "cada evento necesita nombre de 1 a 40 caracteres");
    H.assert(typeof e.valor === "number" && isFinite(e.valor) && e.valor >= 0, "cada evento necesita valor numérico ≥ 0 («" + e.nombre + "»)");
    H.assert(e.sub == null || (typeof e.sub === "string" && e.sub.length <= 40), "sub de «" + e.nombre + "»: texto de ≤ 40 caracteres");
  });
  const forma = S.forma == null ? "barra" : S.forma;
  H.assert(["barra", "circulo", "ninguna"].includes(forma), "forma debe ser barra, circulo o ninguna");
  const prop = S.proporcional === true, n = E.length, hi = GX.indice(S.destacar, n);
  const W = ancho, Hh = alto || n * 44;
  const svg = GX.lienzo(el, W, Hh, S.aria);
  GX.anotar(el, prop ? "Intervalos proporcionales al tiempo." : "Intervalos no proporcionales al tiempo.");
  // Centros de fila: equidistantes, o según la fecha (año y mes) si proporcional.
  let cys;
  if (prop) {
    const t = E.map((e) => { const m = /^(\d{4})(?:-(\d{2}))?/.exec(e.fecha.trim()); return +m[1] + (m[2] ? (+m[2] - 1) / 12 : 0); });
    for (let i = 1; i < n; i++) H.assert(t[i] >= t[i - 1], "con proporcional:true los eventos van en orden cronológico («" + E[i].fecha + "»)");
    const sy = H.escala([t[0], t[n - 1]], [22, Hh - 22]);
    cys = t.map(sy);
  } else { const fila = Hh / n; cys = E.map((_, i) => i * fila + fila / 2); }
  const hueco = Math.min(...cys.slice(1).map((y, k) => y - cys[k]));
  // Columnas y modo: en línea (nombre y magnitud en columnas) o apilado (nombre arriba, barra debajo).
  const subEnFecha = E.every((e) => !e.sub || H.medir(e.sub, GX.MONO) <= 98);
  // La columna de fecha mide 110 px cuando lleva los sub; si no, solo lo que pide la fecha más ancha.
  const fechaW = subEnFecha ? 110 : Math.min(110, Math.ceil(Math.max(...E.map((e) => H.medir(e.fecha, GX.serif(22))))) + 14);
  const xSpine = fechaW + 10, xName = xSpine + 12;
  const etiq = E.map((e) => (e.valor_texto != null ? String(e.valor_texto) : GX.fmt(e.valor, S.formato)));
  const fontsN = (d) => (d ? [GX.SANS_D, "800 12px Archivo, sans-serif"] : [GX.SANS, GX.SANS_S]);
  const labW = Math.ceil(Math.max(...etiq.map((s, i) => H.medir(s, i === hi ? GX.MONO_D : GX.MONO_B)))) + 8;
  const magW = forma === "ninguna" ? 0 : 80;
  let nameMax = W - xName - labW - magW - 12;
  let fuentes = E.map((e, i) => H.encajar(e.nombre, fontsN(i === hi), nameMax));
  const cabeSub = (max) => E.every((e) => !e.sub || subEnFecha || H.medir(e.sub, GX.MONO) <= max);
  const apilado = fuentes.some((x) => !x) || !cabeSub(nameMax);
  if (apilado) {
    nameMax = W - xName;
    fuentes = E.map((e, i) => H.encajar(e.nombre, fontsN(i === hi), nameMax));
    E.forEach((e, i) => H.assert(fuentes[i], "doc: el nombre «" + e.nombre + "» no cabe a este ancho: acórtalo"));
    E.forEach((e) => H.assert(!e.sub || subEnFecha || H.medir(e.sub, GX.MONO) <= nameMax, "doc: el sub «" + e.sub + "» no cabe a este ancho: acórtalo"));
  }
  const subBajoNombre = !subEnFecha && E.some((e) => e.sub && e.sub.trim());
  const minFila = apilado ? (subBajoNombre ? 44 : 34) : subBajoNombre ? 36 : 30;
  const par = cys.findIndex((y, k) => k > 0 && y - cys[k - 1] < minFila - 0.5);
  H.assert(par < 0, "doc: hitos a menos de " + minFila + " px (" + (par > 0 ? E[par - 1].fecha + " y " + E[par].fecha : "") + "): " + (prop ? "usa proporcional:false" : "sube alto"));
  const nameW = apilado ? 0 : Math.max(...E.map((e, i) => Math.max(H.medir(e.nombre, fuentes[i]), e.sub && !subEnFecha ? H.medir(e.sub, GX.MONO) : 0)));
  const x0m = apilado ? xName : xName + nameW + 12, x1m = W - labW;
  const max = Math.max(...E.map((e) => e.valor)) || 1;
  const rMax = apilado ? 7 : Math.max(6, Math.min(16, hueco / 2 - 4));
  GX.linea(svg, xSpine, cys[0], xSpine, cys[n - 1], col.suave, { "stroke-width": 2, "stroke-dasharray": "2 4" });
  E.forEach((e, i) => {
    const d = i === hi, cy = cys[i], fill = d ? col.dest : col.texto, conSub = !!(e.sub && e.sub.trim()), subAqui = conSub && subEnFecha;
    GX.t(svg, fechaW - 10, subAqui ? cy - 2 : cy + 7, e.fecha, GX.serif(22), col.texto, { "text-anchor": "end" });
    if (subAqui) GX.t(svg, fechaW - 10, cy + 15, e.sub, GX.MONO, col.texto, { "text-anchor": "end", "fill-opacity": 0.75 });
    H.svgEl("circle", { cx: xSpine, cy, r: d ? 6 : 5, fill }, svg);
    const tc = d ? (col.tinta || col.dest) : col.texto;
    let yBar, hBar, yVal;
    if (apilado) {
      const tres = conSub && !subAqui;
      GX.t(svg, xName, tres ? cy - 12 : cy - 4, e.nombre, fuentes[i], col.texto);
      if (tres) GX.t(svg, xName, cy + 2, e.sub, GX.MONO, col.texto, { "fill-opacity": 0.75 });
      hBar = 8; yBar = tres ? cy + 9 : cy + 4; yVal = yBar + 8;
    } else {
      GX.t(svg, xName, conSub && !subAqui ? cy - 2 : cy + 5, e.nombre, fuentes[i], col.texto);
      if (conSub && !subAqui) GX.t(svg, xName, cy + 14, e.sub, GX.MONO, col.texto, { "fill-opacity": 0.75 });
      hBar = d ? 14 : 12; yBar = cy - hBar / 2; yVal = cy + 4;
    }
    let xLab = x0m;
    if (forma === "barra") {
      const w = Math.max(2, (e.valor / max) * (x1m - x0m));
      GX.rect(svg, x0m, yBar, w, hBar, d ? col.dest : col.base);
      xLab = x0m + w + 6;
    } else if (forma === "circulo") {
      const r = Math.max(1.5, rMax * Math.sqrt(e.valor / max));
      H.svgEl("circle", { cx: x0m + rMax, cy: yBar + hBar / 2, r, fill: d ? col.dest : col.base }, svg);
      xLab = x0m + 2 * rMax + 8;
    }
    GX.t(svg, xLab, yVal, etiq[i], d ? GX.MONO_D : GX.MONO_B, tc);
  });
};

</script>
<script>
// ---- investigacion/paginas/_comun.js
// Piezas comunes de las páginas. C(R, P) devuelve el contexto que recibe cada PAGINAS.<tipo>(P, ctx):
//   cab(derecha)        encabezado corrido (kicker del informe a la izquierda)
//   pie(izquierda)      pie de página: texto, número de página y badge X + handle
//   bloques(lista)      bloques de cuerpo: titulo · texto · figura · figuras · tabla · cita · caja · lectura
//   fig(f) / tabla(t)   una figura o una tabla con su número y su pie («Fuente: …»)
// La numeración (P._n, f._n, t._n), las referencias {fig:id}/{pag:id}, el índice y las cifras de
// método ya llegan resueltas por scripts/informe.py: aquí solo se dibuja.
const C = (R, P) => {
  const M = R.meta, md = I.md, esc = I.esc;
  const marca = () => '<div class="marca"><div class="x">X</div><span class="handle">' + esc(M.handle) + "</span></div>";
  const cab = (der, opc) => '<div class="corrido' + (opc && opc.color ? " sobre-color" : "") + '"><span class="k acento">' + esc((opc && opc.izq) || M.corrido) + '</span><span class="k">' + esc(der || "") + "</span></div>";
  const pie = (izq, opc) => {
    const o = opc || {};
    return '<div class="pie-pag' + (o.color ? " sobre-color" : "") + '"><span class="mono">' + esc(izq || M.pie) + '</span><div class="autor">' +
      (P._mostrar_numero === false ? "" : '<span class="mono" style="font-weight:500">' + esc(P._n_texto) + "</span>") + (o.sin_marca ? "" : marca()) + "</div></div>";
  };

  const leyenda = (items) => !items || !items.length ? "" : '<div class="leyenda">' + items.map((it) =>
    '<span><i class="' + (it.forma === "linea" ? "linea" : "") + '" style="background:' + (it.forma === "linea" && (it.estilo || "base") === "base" ? "var(--fig-fuerte);opacity:.55" : { dest: "var(--fig-dest)", base: "var(--fig-base)", fuerte: "var(--fig-fuerte)" }[it.estilo || "base"]) + '"></i>' + esc(it.texto) + "</span>").join("") + "</div>";

  const fig = (f, opc) => {
    const o = opc || {}, tipo = f.tipo || "papel", compacto = !!o.compacto;
    const cap = '<figcaption><span class="figno">' + esc(f._n) + "</span><span>" + md(f.pie || "") +
      (tipo === "panel" ? "" : (f.pie ? " " : "") + "Fuente: " + esc(f.fuente) + ".") + (f.derivado ? " Incluye cálculo propio." : "") + "</span></figcaption>";
    if (tipo === "tarjeta") {
      return '<figure class="fig fig--tarjeta"' + (f.ancho ? ' style="width:' + f.ancho + 'px"' : "") + '><img class="tarjeta-img" src="' + esc(f._src) + '" alt="' + esc(f.alt || f.titular || "") + '">' + cap + "</figure>";
    }
    const vars = tipo === "panel" ? "--fig-dest:var(--a1);--fig-base:rgba(var(--ink-rgb),.45);--fig-fuerte:var(--ink)" : "--fig-dest:var(--barra);--fig-base:rgba(12,21,32,.2);--fig-fuerte:#0C1520";
    const titular = f.titular ? '<span class="titular' + (tipo === "panel" && !compacto ? " grande" : "") + '">' + md(Array.isArray(f.titular) ? f.titular.join("\n") : f.titular).replace(/\n/g, "<br>") + "</span>" : "";
    let cuerpo;
    if (!f.lista) cuerpo = I.grafico(f.grafico, tipo, f.alto);
    else {
      cuerpo = '<div style="display:flex;gap:32px;margin-top:20px"><div style="flex:none;width:' + (f.grafico.ancho || 400) + 'px">' + I.grafico(f.grafico, tipo, f.alto) + '</div><div style="flex:1;min-width:0;display:flex;flex-direction:column">' +
        '<div class="lista-reglas" style="border-top-width:1px">' + f.lista.map((it) =>
          '<div style="display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0"><span class="marcador">' + esc(it.n) + '</span><span style="font:' + (it.destacar ? 800 : 600) + ' 14px/1.25 Archivo,sans-serif">' + esc(it.nombre) + '</span><span style="font:700 ' + (it.destacar ? 14 : 12) + "px/1 'JetBrains Mono',monospace" + (it.destacar ? ";color:var(--tinta)" : "") + '">' + esc(it.valor) + "</span></div>").join("") +
        "</div>" + leyenda(f.leyenda).replace('class="leyenda"', 'class="leyenda" style="flex-direction:column;gap:8px;margin-top:18px;font:500 12px/1.3 \'JetBrains Mono\',monospace"') + "</div></div>";
    }
    const nota = f.nota ? '<span class="nota">' + md(f.nota) + "</span>" : "";
    const pieFig = tipo === "panel" ? '<div class="pie-fig"><span class="mono">Fuente: ' + esc(f.fuente) + "</span>" + marca() + "</div>" : "";
    return '<figure class="fig fig--' + tipo + '" style="' + vars + (o.estilo ? ";" + o.estilo : "") + '"><div class="marco' + (tipo === "panel" ? " panel" + (compacto ? " compacto" : "") : "") + '"' + (o.estilo ? ' style="flex:1"' : "") + ">" +
      (f.kicker ? '<span class="k acento">' + esc(f.kicker) + "</span>" : "") + titular + (f.lista ? "" : leyenda(f.leyenda)) + cuerpo + nota + pieFig + "</div>" + cap + "</figure>";
  };

  const tabla = (t) => {
    const cols = t.columnas;
    const th = cols.map((c) => '<th class="' + (c.num ? "num" : "") + '" style="text-align:' + (c.num ? "right" : "left") + (c.ancho ? ";width:" + c.ancho + "px" : "") + '">' + esc(c.t).replace(/\n/g, "<br>") + "</th>").join("");
    const filas = t.filas.map((f) => '<tr class="' + (f.dest ? "dest" : "") + (f.total ? " total" : "") + '">' + f.c.map((v, i) => {
      const b = (f.b || []).includes(i) || (f.dest && i === 0);
      const chip = typeof v === "object" && v && v.chip;
      const contenido = chip ? '<span class="chip' + (v.chip === "ajustada" ? " borde" : "") + '">' + esc(v.chip) + "</span>" : esc(v == null ? "—" : v);
      return '<td class="' + (cols[i].num ? "num" : "") + (b ? " b" : "") + '"' + (f.dest && cols[i].num ? ' style="color:var(--tinta)"' : "") + ">" + contenido + "</td>";
    }).join("") + "</tr>").join("");
    const notas = t.notas && t.notas.length ? '<div class="notas-tabla">' + t.notas.map((n) => "<span><b>" + esc(n.m) + "</b> · " + md(n.texto) + "</span>").join("") + "</div>" : "";
    return '<figure class="fig tabla">' + (t.titulo ? '<span class="k acento">' + esc(t.titulo) + "</span>" : "") + '<table class="t">' + "<thead><tr>" + th + "</tr></thead><tbody>" + filas + "</tbody></table>" +
      '<figcaption><span class="figno">' + esc(t._n) + "</span><span>" + md(t.pie || "") + (t.pie ? " " : "") + "Fuente: " + esc(t.fuente) + ".</span></figcaption>" + notas + "</figure>";
  };

  const parrafos = (B) => I.lista(B.parrafos || B.texto).map((s, i) => i === 0 && B.capitular
    ? '<p class="p"><span class="capitular">' + esc(s[0]) + "</span>" + md(s.slice(1)) + "</p>"
    : '<p class="p">' + md(s) + "</p>").join("");

  const bloque = (B) => {
    switch (B.b) {
      case "titulo": return '<h3 class="t3">' + md(B.texto) + "</h3>";
      case "texto":
        if (B.margen) return '<div class="con-margen"><div class="texto">' + parrafos(B) + '</div><div class="margen">' +
          B.margen.map((m) => "<span><b>" + esc(m.termino) + "</b> · " + md(m.texto) + "</span>").join("") + "</div></div>";
        return parrafos(B);
      case "figura": return fig(B);
      case "figuras": return '<div class="dos">' + B.items.map((f) => fig(f, { compacto: true })).join("") + "</div>";
      case "tabla": return tabla(B);
      case "cita": return '<blockquote class="cita"><span class="k acento">' + esc(B.etiqueta) + '</span><span class="frase">' + md(B.texto) + "</span></blockquote>";
      case "caja": return '<div class="caja"><span class="k acento">' + esc(B.etiqueta) + '</span><div class="items">' + B.items.map((s) => "<span>" + md(s) + "</span>").join("") + "</div></div>";
      case "lectura": return '<div class="caja vertical lectura"><span class="k acento">' + esc(B.titulo) + '</span><div class="pasos">' +
        B.items.map((it) => '<div class="paso"><span class="marcador">' + esc(it.n) + "</span><span>" + md(it.texto) + "</span></div>").join("") + "</div>" +
        (B.nota ? '<span class="mono" style="color:rgba(12,21,32,.72)">' + md(B.nota) + "</span>" : "") + "</div>";
      default: throw new Error("bloque desconocido: " + B.b);
    }
  };
  const bloques = (lista) => I.lista(lista).map(bloque).join("");
  return { M, md, esc, cab, pie, marca, fig, tabla, bloques, bloque, leyenda };
};

// ---- investigacion/paginas/anexos.js
// Páginas de cierre: método y fuentes, glosario y la hoja de tarjetas del hilo.

// metodo · pasos [{titulo, texto}] (por defecto los tres del flujo; [] los omite), fuentes: false omite la lista, _cifras [{concepto, valor, veredicto, aparece}]
// (informe.py las arma desde datos.json por id), nota, _fuentes [texto] (meta.fuentes numeradas)
PAGINAS.metodo = (P, X) => {
  const pasos = (P.pasos || [
    { titulo: "Evidencia", texto: "Cada cifra llega con la URL de la fuente primaria, la cita textual y una copia local del archivo." },
    { titulo: "Segunda fuente", texto: "Un verificador parte de esa evidencia y busca una segunda fuente para cada cifra." },
    { titulo: "Veredicto", texto: "Solo entran las cifras verificadas o ajustadas; manda el valor final." },
  ]).map((p, i) => '<div class="celda" style="padding-top:12px;gap:8px"><span style="font:400 32px/1 \'Instrument Serif\',Georgia,serif;color:var(--tinta)">' + String(i + 1).padStart(2, "0") + '</span><span style="font:700 14px/1.2 Archivo,sans-serif">' + X.esc(p.titulo) + '</span><span style="font:400 14px/1.45 Archivo,sans-serif">' + X.md(p.texto) + "</span></div>").join("");
  const filas = (P._cifras || []).map((c) => ({ c: [c.concepto, c.valor, { chip: c.veredicto }, c.aparece] }));
  const tabla = '<table class="t" style="margin-top:12px;font-size:13px"><thead><tr><th>Cifra</th><th class="num">Valor</th><th>Veredicto</th><th class="num">Aparece en</th></tr></thead><tbody>' +
    filas.map((f) => "<tr><td>" + X.esc(f.c[0]) + '</td><td class="num" style="font-weight:700">' + X.esc(f.c[1]) + '</td><td><span class="chip' + (f.c[2].chip === "ajustada" ? " borde" : "") + '">' + X.esc(f.c[2].chip) + '</span></td><td class="num" style="font-size:12px">' + X.esc(f.c[3]) + "</td></tr>").join("") + "</tbody></table>";
  const fuentes = (P._fuentes || []).map((f, i) => '<li style="display:flex;gap:14px"><span style="flex:none;width:20px;font:700 12px/1.6 \'JetBrains Mono\',monospace;color:var(--tinta)">' + (i + 1) + "</span><span>" + X.md(f) + "</span></li>").join("");
  return '<section class="pagina">' + X.cab(P.seccion || "Anexo") + '<h2 class="t2">' + X.esc(P.titulo || "Método y fuentes") + "</h2>" +
    '<div class="rejilla3" style="margin-top:28px">' + pasos + "</div>" +
    '<div style="display:flex;align-items:center;gap:10px;margin-top:20px;font:500 12px/1 \'JetBrains Mono\',monospace"><span class="chip">verificada</span><span class="chip borde">ajustada</span><span class="chip tachado">no confirmada</span><span class="gris">· nunca aparece en el informe</span></div>' +
    '<span class="k acento" style="margin-top:32px">Cifras usadas</span>' + tabla +
    (P.nota ? '<span class="mono gris" style="margin-top:8px">' + X.md(P.nota) + "</span>" : "") +
    (P.fuentes === false ? "" : '<span class="k acento" style="margin-top:28px">Fuentes</span><ol style="margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font:400 13px/1.45 Archivo,sans-serif">' + fuentes + "</ol>") +
    X.pie() + "</section>";
};

// glosario · terminos [{t, d}] (columna izquierda y, si sobran, arriba de la derecha), siglas [{s, d}]
PAGINAS.glosario = (P, X) => {
  const corte = P.corte || Math.ceil(P.terminos.length * 0.7);
  const term = (lst) => lst.map((x, i) => '<div style="display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:' + (i === 0 ? "1.5px solid var(--tp)" : "1px solid var(--regla)") + '"><span style="font:400 22px/1.1 \'Instrument Serif\',Georgia,serif;color:var(--tinta)">' + X.esc(x.t) + '</span><span style="font:400 13px/1.5 Archivo,sans-serif">' + X.md(x.d) + "</span></div>").join("");
  const siglas = (P.siglas || []).map((x) => '<b style="padding:9px 0;border-bottom:1px solid var(--regla);font:700 12px/1.6 \'JetBrains Mono\',monospace">' + X.esc(x.s) + '</b><span style="padding:9px 0;border-bottom:1px solid var(--regla)">' + X.esc(x.d) + "</span>").join("");
  return '<section class="pagina">' + X.cab(P.seccion || "Anexo") + '<h2 class="t2">' + X.esc(P.titulo || "Glosario") + "</h2>" +
    '<div class="rejilla2" style="margin-top:28px;align-items:start"><div style="display:flex;flex-direction:column;border-bottom:1.5px solid var(--tp)">' + term(P.terminos.slice(0, corte)) + "</div>" +
    '<div style="display:flex;flex-direction:column">' + term(P.terminos.slice(corte)) +
    (siglas ? '<span class="k acento" style="margin-top:20px;padding-bottom:10px;border-bottom:1.5px solid var(--tp)">Siglas</span><div style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:0 12px;font:400 13px/1.45 Archivo,sans-serif">' + siglas + "</div>" : "") +
    "</div></div>" + X.pie() + "</section>";
};

// tarjetas · titulo, lead, items [{_src, n, beat, titulo, alt}], tuit {gancho, texto, publicado}
PAGINAS.tarjetas = (P, X) => {
  const it = P.items.map((t) => '<figure style="display:flex;flex-direction:column;gap:8px"><img src="' + X.esc(t._src) + '" alt="' + X.esc(t.alt || t.titulo) + '" style="display:block;width:156px;height:156px;object-fit:cover"><figcaption style="display:flex;flex-direction:column;gap:3px"><span class="mono-b" style="line-height:1;color:var(--tinta)">' + X.esc(t.n + " · " + t.beat) + '</span><span style="font:400 13px/1.35 Archivo,sans-serif">' + X.esc(t.titulo) + "</span></figcaption></figure>").join("");
  const T = P.tuit;
  return '<section class="pagina">' + X.cab(P.seccion || "Anexo") + '<h2 class="t2">' + X.esc(P.titulo) + "</h2>" + (P.lead ? '<p class="p">' + X.md(P.lead) + "</p>" : "") +
    '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px;margin-top:28px">' + it + "</div>" +
    (T ? '<div class="caja" style="margin-top:36px"><span class="k acento">Tuit 1</span><div class="items" style="gap:10px"><span style="font:400 italic 22px/1.25 \'Instrument Serif\',Georgia,serif">' + X.md(T.gancho) + "</span><span style=\"font:400 14px/1.5 Archivo,sans-serif\">" + X.md(T.texto) + '</span><span class="mono" style="color:rgba(12,21,32,.72)">' + X.esc(T.publicado) + "</span></div></div>" : "") +
    X.pie() + "</section>";
};

// ---- investigacion/paginas/aperturas.js
// Páginas a sangre de color (la tarjeta hecha página): portada, aperturas de capítulo y contraportada.

// portada · kicker_izq, kicker_der, titulo, lead, cifra {valor, etiqueta, texto}; _capitulos y fuentes
PAGINAS.portada = (P, X) => {
  const caps = (P._capitulos || []).map((c) => '<div style="flex:1;border-top:1.5px solid var(--rule);padding-top:12px"><span style="opacity:.75">' + X.esc(c.numero) + "</span><br>" + X.esc(c.titulo) + "</div>").join("");
  return '<section class="pagina color">' +
    '<div class="corrido sobre-color"><span class="k acento">' + X.esc(P.kicker_izq) + '</span><span class="k">' + X.esc(P.kicker_der || "") + "</span></div>" +
    '<h1 class="t-portada">' + X.md(P.titulo) + "</h1>" +
    (P.lead ? '<p class="lead">' + X.md(P.lead) + "</p>" : "") +
    (P.cifra ? '<div style="margin-top:auto;display:flex;align-items:flex-end;gap:32px"><div class="cifra-heroe">' + X.esc(P.cifra.valor) + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px;padding-bottom:14px;max-width:260px"><span class="k">' + X.esc(P.cifra.etiqueta) + '</span><span style="font:400 16px/1.4 Archivo,sans-serif">' + X.md(P.cifra.texto || "") + "</span></div></div>" : '<div style="margin-top:auto"></div>') +
    (caps ? '<div style="display:flex;gap:24px;margin-top:44px;font:500 12px/1.4 \'JetBrains Mono\',monospace">' + caps + "</div>" : "") +
    '<div class="pie-pag sobre-color" style="margin-top:40px"><span class="mono">Fuentes: ' + X.esc(P.fuentes) + "</span>" + X.marca() + "</div></section>";
};

// capitulo · variante "banda" (banda de color + cuerpo), "dividida" (columna de color + contenido)
// o "destacado" (página entera de color con un antes → después).
PAGINAS.capitulo = (P, X) => {
  const v = P.variante || "banda";
  if (v === "banda") {
    return '<section class="pagina sin-margen"><div class="banda sobre-color" style="height:' + (P.alto_banda || 492) + 'px;box-sizing:border-box;padding:56px 72px 48px;display:flex;flex-direction:column">' +
      '<div style="display:flex;justify-content:space-between"><span class="k acento">' + X.esc(P.kicker) + '</span><span class="k">' + X.esc(X.M.corto) + "</span></div>" +
      '<div style="margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px"><div style="display:flex;flex-direction:column;gap:22px;max-width:470px">' +
      '<h2 style="margin:0;font:400 80px/.94 \'Instrument Serif\',Georgia,serif;letter-spacing:-.015em;text-wrap:balance">' + X.md(P.titulo) + "</h2>" +
      (P.lead ? '<p style="margin:0;font:400 17px/1.5 Archivo,sans-serif;text-wrap:pretty">' + X.md(P.lead) + "</p>" : "") + "</div>" +
      '<span style="font:400 220px/.78 \'Instrument Serif\',Georgia,serif;letter-spacing:-.03em;color:var(--a1)">' + X.esc(P.numero) + "</span></div></div>" +
      '<div style="flex:1;box-sizing:border-box;padding:30px 72px 48px;display:flex;flex-direction:column">' + X.bloques(P.bloques) + X.pie() + "</div></section>";
  }
  if (v === "dividida") {
    const secs = (P.secciones || []).map((s) => '<div style="display:flex;justify-content:space-between;gap:16px;padding:12px 0;font:400 15px/1.4 Archivo,sans-serif"><span>' + X.md(s.texto) + '</span><span class="mono" style="font-weight:500">' + X.esc(s.pag) + "</span></div>").join("");
    return '<section class="pagina sin-margen" style="flex-direction:row">' +
      '<div class="banda sobre-color" style="flex:none;width:320px;box-sizing:border-box;padding:56px 40px 48px 72px;display:flex;flex-direction:column">' +
      '<span class="k acento">' + X.esc(P.kicker) + '</span><span class="k" style="margin-top:8px">' + X.esc(P.kicker2 || "") + "</span>" +
      '<span style="margin-top:auto;font:400 184px/.76 \'Instrument Serif\',Georgia,serif;letter-spacing:-.04em;color:var(--a1)">' + X.esc(P.numero) + "</span>" +
      '<div style="margin-top:40px;padding-top:16px;border-top:1.5px solid var(--rule)">' + X.marca() + "</div></div>" +
      '<div style="flex:1;min-width:0;box-sizing:border-box;padding:56px 72px 48px 48px;display:flex;flex-direction:column">' +
      '<span class="k acento" style="padding-bottom:14px;border-bottom:1px solid var(--regla)">' + X.esc(X.M.corrido) + "</span>" +
      '<h2 style="margin:120px 0 0;font:400 68px/.94 \'Instrument Serif\',Georgia,serif;letter-spacing:-.015em;text-wrap:balance">' + X.md(P.titulo) + "</h2>" +
      (P.lead ? '<p style="margin:24px 0 0;font:400 17px/1.55 Archivo,sans-serif;text-wrap:pretty">' + X.md(P.lead) + "</p>" : "") +
      (secs ? '<div style="margin-top:48px"><span class="k acento" style="display:block;padding-bottom:10px">En este capítulo</span><div class="lista-reglas">' + secs + "</div></div>" : "") +
      '<div class="pie-pag"><span class="mono">' + X.esc(X.M.pie) + '</span><span class="mono" style="font-weight:500">' + X.esc(P._n_texto) + "</span></div></div></section>";
  }
  if (v === "destacado") {
    const D = P.dato;
    const flecha = '<svg viewBox="0 0 72 40" width="72" height="40" aria-hidden="true" style="display:block;margin-bottom:92px"><line x1="0" y1="20" x2="64" y2="20" stroke="currentColor" stroke-width="3"></line><polyline points="50,6 66,20 50,34" fill="none" stroke="currentColor" stroke-width="3"></polyline></svg>';
    return '<section class="pagina color">' +
      '<div class="corrido sobre-color"><span class="k acento">' + X.esc(P.kicker) + '</span><span class="k">' + X.esc(X.M.corto) + "</span></div>" +
      '<h2 style="margin:56px 0 0;font:400 88px/.92 \'Instrument Serif\',Georgia,serif;letter-spacing:-.02em;text-wrap:balance">' + X.md(P.titulo) + "</h2>" +
      (P.lead ? '<p class="lead" style="max-width:520px">' + X.md(P.lead) + "</p>" : "") +
      '<div style="margin-top:auto;display:flex;flex-direction:column;gap:18px"><span class="k">' + X.esc(D.kicker) + '</span><div style="display:flex;align-items:flex-end;gap:28px">' +
      '<div style="display:flex;flex-direction:column;gap:14px"><span style="font:400 200px/.8 \'Instrument Serif\',Georgia,serif;letter-spacing:-.03em;opacity:.6">' + X.esc(D.antes.valor) + '</span><span class="mono" style="font-weight:500">' + X.esc(D.antes.etiqueta) + "</span></div>" + flecha +
      '<div style="display:flex;flex-direction:column;gap:14px"><span style="font:400 200px/.8 \'Instrument Serif\',Georgia,serif;letter-spacing:-.03em;color:var(--a1)">' + X.esc(D.despues.valor) + '</span><span class="mono-b">' + X.esc(D.despues.etiqueta) + "</span></div></div></div>" +
      '<div style="margin-top:48px">' + X.pie("Fuente: " + P.fuente, { color: true }) + "</div></section>";
  }
  throw new Error("capitulo: variante desconocida " + v);
};

// contraportada · lema y ficha [[clave, valor], …] (la paleta se rellena sola).
PAGINAS.contraportada = (P, X) => {
  const ficha = (P.ficha || []).map(([k, v]) => '<div style="display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1.5px solid var(--rule)"><span style="opacity:.8">' + X.esc(k) + "</span><span>" + X.esc(v) + "</span></div>").join("");
  return '<section class="pagina color">' +
    '<div class="corrido sobre-color"><span class="k acento">' + X.esc(X.M.numero_largo) + '</span><span class="k">' + X.esc(X.M.fecha) + "</span></div>" +
    '<p style="margin:64px 0 0;max-width:560px;font:400 64px/.98 \'Instrument Serif\',Georgia,serif;letter-spacing:-.015em;text-wrap:balance">' + X.md(P.lema) + "</p>" +
    '<div style="margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;font:400 12px/1.4 \'JetBrains Mono\',monospace;border-bottom:1.5px solid var(--rule)">' + ficha + "</div>" +
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:56px"><div style="display:flex;align-items:center;gap:16px"><div class="x" style="width:56px;height:56px;border-radius:12px;font-size:30px;background:var(--ink);color:var(--x-fg)">X</div><span style="font:600 32px/1 Archivo,sans-serif">' + X.esc(X.M.handle) + "</span></div>" +
    '<span class="mono" style="text-align:right">Tipografía: Instrument Serif,<br>Archivo y JetBrains Mono</span></div></section>';
};

// ---- investigacion/paginas/lectura.js
// Páginas de lectura sobre papel: cuerpo (bloques), anexo (bloques con título de anexo),
// apaisada (texto lateral + una figura ancha) y cronología.

// cuerpo · seccion (encabezado derecho), bloques [...]
PAGINAS.cuerpo = (P, X) => '<section class="pagina">' + X.cab(P.seccion) + X.bloques(P.bloques) + X.pie(P.pie) + "</section>";

// anexo · seccion, titulo, lead, bloques
PAGINAS.anexo = (P, X) => '<section class="pagina">' + X.cab(P.seccion) +
  '<h2 class="t2">' + X.md(P.titulo) + "</h2>" + (P.lead ? '<p class="p">' + X.md(P.lead) + "</p>" : "") +
  X.bloques(P.bloques) + X.pie(P.pie) + "</section>";

// apaisada · seccion, lateral [bloques: titulo, texto, notas], figura (panel o papel)
PAGINAS.apaisada = (P, X) => {
  const lat = I.lista(P.lateral).map((B) => {
    if (B.b === "titulo") return '<h3 class="t3" style="margin-top:0">' + X.md(B.texto) + "</h3>";
    if (B.b === "texto") return I.lista(B.parrafos).map((s) => '<p class="p" style="font-size:15px;line-height:1.6">' + X.md(s) + "</p>").join("");
    if (B.b === "notas") return '<div class="margen" style="width:auto;margin-top:auto">' + B.items.map((m) => "<span><b>" + X.esc(m.termino) + "</b> · " + X.md(m.texto) + "</span>").join("") + "</div>";
    return X.bloque(B);
  }).join("");
  const f = Object.assign({}, P.figura);
  return '<section class="pagina apaisada">' + X.cab(P.seccion) +
    '<div style="flex:1;display:flex;gap:40px;margin-top:32px;min-height:0"><div style="flex:none;width:272px;display:flex;flex-direction:column">' + lat + "</div>" +
    '<div style="flex:1;min-width:0;display:flex">' + X.fig(f, { estilo: "margin-top:0;flex:1" }) + "</div></div>" +
    X.pie(P.pie) + "</section>";
};

// cronologia · seccion, titulo, lead, eventos [{fecha, sub, texto, detalle, destacar, pendiente}], fuente
PAGINAS.cronologia = (P, X) => {
  const ev = P.eventos.map((e, i) => {
    const ult = i === P.eventos.length - 1;
    const punto = e.destacar ? '<span style="flex:none;width:16px;height:16px;margin-top:4px;border-radius:50%;background:var(--barra)"></span>'
      : '<span style="flex:none;width:12px;height:12px;margin-top:6px;border-radius:50%;box-sizing:border-box;border:2px ' + (e.pendiente ? "dashed rgba(12,21,32,.5)" : "solid #0C1520") + ';background:var(--papel)"></span>';
    const color = e.destacar ? "color:var(--tinta)" : e.pendiente ? "color:rgba(12,21,32,.62)" : "";
    return '<div style="display:grid;grid-template-columns:128px 24px minmax(0,1fr);gap:0 16px">' +
      '<div style="display:flex;flex-direction:column;gap:4px;padding-bottom:26px"><span style="font:400 24px/1 \'Instrument Serif\',Georgia,serif;' + color + '">' + X.esc(e.fecha) + '</span><span class="mono" style="font-weight:' + (e.destacar ? 700 : 500) + ";" + color + '">' + X.esc(e.sub || "") + "</span></div>" +
      '<div style="display:flex;flex-direction:column;align-items:center">' + punto + (ult ? "" : '<span style="flex:1;width:2px;background:rgba(12,21,32,.25)"></span>') + "</div>" +
      '<div style="padding-bottom:26px;display:flex;flex-direction:column;gap:6px;font:400 15px/1.5 Archivo,sans-serif' + (e.pendiente ? ";color:rgba(12,21,32,.72)" : "") + '">' +
      '<span style="font-weight:' + (e.destacar ? 700 : 400) + '">' + X.md(e.texto) + "</span>" + (e.detalle ? "<span>" + X.md(e.detalle) + "</span>" : "") + "</div></div>";
  }).join("");
  return '<section class="pagina">' + X.cab(P.seccion) + '<h3 class="t3" style="margin-top:36px">' + X.md(P.titulo) + "</h3>" +
    (P.lead ? '<p class="p">' + X.md(P.lead) + "</p>" : "") + '<div style="display:flex;flex-direction:column;margin-top:32px">' + ev + "</div>" +
    X.pie("Fuentes: " + P.fuente) + "</section>";
};

// ---- investigacion/paginas/sintesis.js
// Páginas de síntesis: índice (se genera solo), resumen, tablero de cifras clave y conclusiones.

// indice · titulo; _entradas [{clase, numero, titulo, desc, pag}] · _anexos · _figuras [{no, titulo, pag}] · leer []
PAGINAS.indice = (P, X) => {
  const e = P._entradas || [];
  const fila = (it) => it.clase === "capitulo"
    ? '<div style="display:grid;grid-template-columns:72px minmax(0,1fr) 48px;gap:16px;align-items:baseline;padding:11px 0"><span style="font:400 44px/.9 \'Instrument Serif\',Georgia,serif;color:var(--tinta)">' + X.esc(it.numero) + '</span><div style="display:flex;flex-direction:column;gap:6px"><span style="font:400 28px/1.1 \'Instrument Serif\',Georgia,serif">' + X.md(it.titulo) + '</span><span style="font:400 14px/1.45 Archivo,sans-serif">' + X.md(it.desc || "") + '</span></div><span class="mono" style="text-align:right;font-weight:500">' + X.esc(it.pag) + "</span></div>"
    : '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:12px 0"><span style="font:400 26px/1.1 \'Instrument Serif\',Georgia,serif">' + X.md(it.titulo) + '</span><span class="mono" style="font-weight:500">' + X.esc(it.pag) + "</span></div>";
  // Dos entradas simples seguidas (p. ej. Resumen y Cifras clave) comparten fila.
  const filas = [];
  for (let i = 0; i < e.length; i++) {
    if (e[i].clase !== "capitulo" && e[i + 1] && e[i + 1].clase !== "capitulo") {
      filas.push('<div class="rejilla2" style="padding:0">' + fila(e[i]) + fila(e[i + 1]) + "</div>");
      i++;
    } else filas.push(fila(e[i]));
  }
  const anexos = (P._anexos || []).map((a) => '<div style="display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--regla-f)"><span style="font-weight:700">' + X.esc(a.pag) + "</span><span>" + X.esc(a.titulo) + "</span></div>").join("");
  const figs = (P._figuras || []).map((f) => '<div style="display:flex;gap:10px;break-inside:avoid"><b style="flex:none;width:64px">' + X.esc(f.no) + '</b><span style="flex:1">' + X.esc(f.titulo) + "</span><span>" + X.esc(f.pag) + "</span></div>").join("");
  // Con más de 10 figuras y tablas, la lista va a dos columnas (si no, con 5 capítulos solo caben 11).
  // Con más de 14 figuras y tablas, la caja «Cómo leer» pasa arriba a lo ancho y la lista va a todo el ancho en
  // dos columnas (a una columna caben ~12 con tres capítulos; la caja a lo ancho cuesta ~80 px, así que solo compensa desde 15).
  const nF = (P._figuras || []).length, largo = nF > 14;
  const leerCaja = (estilo) => (P.leer ? '<div style="' + estilo + 'padding:18px 20px;background:var(--suave);display:flex;' + (largo ? 'gap:24px;align-items:flex-start' : 'flex-direction:column;gap:10px') + '"><span class="k acento"' + (largo ? ' style="flex:none;width:104px;padding-top:3px"' : '') + '>Cómo leer</span>' +
    (largo ? '<div style="display:flex;flex-direction:column;gap:6px">' : '') + P.leer.map((s) => '<span style="font:400 13px/1.5 Archivo,sans-serif">' + X.md(s) + "</span>").join("") + (largo ? "</div>" : "") + "</div>" : "");
  const listaFigs = largo
    ? '<div style="display:grid;grid-auto-flow:column;grid-template-rows:repeat(' + Math.ceil(nF / 2) + ',auto);column-gap:28px;row-gap:4px;margin-top:12px;font:400 12px/1.35 \'JetBrains Mono\',monospace">' + figs + "</div>"
    : '<div style="display:flex;flex-direction:column;gap:4px;margin-top:12px;font:400 12px/1.35 \'JetBrains Mono\',monospace">' + figs + "</div>";
  return '<section class="pagina">' + X.cab("Contenido") + '<h1 class="t1" style="margin-top:28px;font-size:64px">' + X.esc(P.titulo || "Contenido") + "</h1>" +
    '<div class="lista-reglas" style="margin-top:28px">' + filas.join("") + "</div>" +
    (anexos ? '<div style="display:grid;grid-template-columns:repeat(' + Math.min(5, P._anexos.length) + ',minmax(0,1fr));gap:16px;margin-top:16px;font:400 12px/1.4 \'JetBrains Mono\',monospace">' + anexos + "</div>" : "") +
    (largo ? leerCaja("margin-top:24px;") : "") +
    '<div style="display:flex;gap:32px;margin-top:' + (largo ? 24 : 32) + 'px"><div style="flex:1;display:flex;flex-direction:column"><span class="k acento">Figuras y tablas</span>' + listaFigs + "</div>" +
    (largo ? "" : leerCaja("flex:none;width:232px;align-self:flex-start;")) +
    "</div>" + X.pie() + "</section>";
};

// resumen · tesis, cifras [{kicker, valor, texto, fuente, id}], no_afirma []
PAGINAS.resumen = (P, X) => {
  const cif = P.cifras.map((c) => '<div class="celda"><span class="k">' + X.esc(c.kicker) + '</span><span class="cifra-g">' + X.esc(c.valor) + '</span><span style="font:400 15px/1.45 Archivo,sans-serif">' + X.md(c.texto) + '</span><span class="mono gris">Fuente: ' + X.esc(c.fuente) + "</span></div>").join("");
  return '<section class="pagina">' + X.cab("Resumen") + '<h1 class="t1" style="margin-top:36px">' + X.esc(P.titulo || "Resumen") + "</h1>" +
    '<div style="display:flex;gap:24px;margin-top:28px"><span class="k acento" style="flex:none;width:128px;padding-top:6px">Tesis</span><p style="margin:0;flex:1;font:400 19px/1.55 Archivo,sans-serif;text-wrap:pretty">' + X.md(P.tesis) + "</p></div>" +
    '<div class="rejilla2" style="margin-top:32px;row-gap:28px">' + cif + "</div>" +
    (P.no_afirma ? X.bloque({ b: "caja", etiqueta: "No afirma", items: P.no_afirma }).replace('class="caja"', 'class="caja" style="margin-top:32px"') : "") +
    X.pie() + "</section>";
};

// tablero · titulo, subtitulo, cifras [{kicker, valor, contexto, grafico, fuente, id}]
PAGINAS.tablero = (P, X) => {
  const t = P.cifras.map((c) => '<div class="celda" style="padding-top:12px;gap:8px"><span class="k">' + X.esc(c.kicker) + '</span>' +
    '<div style="display:flex;align-items:baseline;gap:10px"><span style="font:400 48px/.9 \'Instrument Serif\',Georgia,serif;color:var(--tinta)">' + X.esc(c.valor) + '</span><span style="font:400 14px/1.3 Archivo,sans-serif">' + X.md(c.contexto || "") + "</span></div>" +
    '<div style="margin-top:6px">' + I.grafico(c.grafico, "papel").replace('class="grafico"', 'class="grafico" style="margin-top:0"') + "</div>" +
    '<span class="mono gris">Fuente: ' + X.esc(c.fuente) + "</span></div>").join("");
  return '<section class="pagina">' + X.cab(P.seccion || "Cifras clave") +
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:36px"><h2 class="t2" style="margin:0">' + X.esc(P.titulo || "Cifras clave") + '</h2><span style="max-width:280px;padding-bottom:6px;font:400 14px/1.45 Archivo,sans-serif">' + X.md(P.subtitulo || "") + "</span></div>" +
    '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 24px;margin-top:32px">' + t + "</div>" + X.pie() + "</section>";
};

// conclusiones · hallazgos [{titulo, texto, ref}], cierre, no_afirma [], limites []
PAGINAS.conclusiones = (P, X) => {
  const h = P.hallazgos.map((x, i) => '<li style="display:grid;grid-template-columns:56px minmax(0,1fr) 96px;gap:16px;align-items:baseline;padding:14px 0"><span style="font:400 36px/.9 \'Instrument Serif\',Georgia,serif;color:var(--tinta)">' + (i + 1) + '</span><div style="display:flex;flex-direction:column;gap:4px"><span style="font:700 16px/1.35 Archivo,sans-serif">' + X.md(x.titulo) + '</span><span style="font:400 15px/1.5 Archivo,sans-serif">' + X.md(x.texto) + '</span></div><span class="mono" style="text-align:right">' + X.esc(x.ref || "") + "</span></li>").join("");
  const col = (titulo, items) => '<div style="display:flex;flex-direction:column;gap:12px"><span class="k acento" style="padding-bottom:10px;border-bottom:1.5px solid var(--tp)">' + X.esc(titulo) + "</span>" + items.map((s) => '<span style="font:400 13px/1.5 Archivo,sans-serif">' + X.md(s) + "</span>").join("") + "</div>";
  return '<section class="pagina">' + X.cab(P.titulo || "En suma") + '<h2 class="t2">' + X.esc(P.titulo || "En suma") + "</h2>" +
    '<ol class="lista-reglas" style="margin:24px 0 0;padding:0;list-style:none">' + h + "</ol>" +
    (P.cierre ? '<p style="margin:28px 0 0;max-width:600px;font:400 italic 28px/1.2 \'Instrument Serif\',Georgia,serif;text-wrap:balance">' + X.md(P.cierre) + "</p>" : "") +
    '<div class="rejilla2" style="margin-top:32px">' + col("Este informe no afirma", P.no_afirma || []) + col("Límites de los datos", P.limites || []) + "</div>" + X.pie() + "</section>";
};

</script>
<script>
// =====================================================================
// Arranque: informe.json → páginas → gráficos → fuentes → data-listo.
// scripts/render_informe.js espera body[data-listo]; cualquier excepción deja body[data-error].
// =====================================================================
window.addEventListener("load", async () => {
  try {
    const R = JSON.parse(document.getElementById("informe-json").textContent);
    if (!R) throw new Error("informe.json vacío: esta base se ensambla con scripts/informe.py");
    document.body.dataset.paleta = R.meta.paleta;
    await Promise.all(["400 88px 'Instrument Serif'", "italic 400 30px 'Instrument Serif'", "500 12px 'JetBrains Mono'", "700 12px 'JetBrains Mono'", "400 16px Archivo", "700 16px Archivo", "800 12px Archivo"].map((f) => document.fonts.load(f)));
    const raiz = document.getElementById("informe");
    raiz.innerHTML = R.paginas.map((P) => {
      const fn = PAGINAS[P.tipo];
      H.assert(typeof fn === "function", "tipo de página desconocido: " + P.tipo);
      return fn(P, C(R, P));
    }).join("\n");
    I.dibujar();
    await document.fonts.ready;
    document.body.dataset.listo = "1";
  } catch (e) {
    document.body.dataset.error = e.message;
    throw e;
  }
});
</script>
</body>
