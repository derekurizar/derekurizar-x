<!doctype html>
<!-- Maqueta 3D de /video-3d: composición de HyperFrames que escribe scripts/maqueta3d.py (no se edita a mano).
     El mundo es, según el motor del estilo: el lienzo #gl que dibuja assets/motor.js (three.js), o la placa
     que renderizó Blender (#placa: un <video>, o fotos para los cuadros sueltos) con assets/placa.js. Encima, la capa 2D
     de assets/capa.js. Todo es función pura del tiempo que pide HyperFrames (evento hf-seek). Los datos llegan resueltos
     en assets/datos.js (window.MAQUETA).
     Colores y medidas: variables de :root inyectadas desde design/tokens.json y design/sets3d/estilos.json. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=@W@, height=@H@" />
    <style>
@RAIZ_CSS@
@CSS@
    </style>
  </head>
  <body data-estilo="@ESTILO@">
    <div id="root" data-composition-id="main" data-start="0" data-duration="@D@" data-fps="@FPS@" data-width="@W@" data-height="@H@"
      data-layout-allow-overflow data-layout-allow-overlap>
      @FONDO@
      <div class="capa">
@CAPA@
      </div>
    </div>
    <script src="assets/gsap.min.js"></script>
    <script>
      // La línea de tiempo solo fija la duración (el lint la exige): todo se dibuja en el listener hf-seek.
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, @D@);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script src="assets/datos.js"></script>
    <script src="assets/capa.js"></script>
    @MOTOR@
  </body>
</html>
