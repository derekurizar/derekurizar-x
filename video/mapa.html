<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Escena «mapa» de /video (?n=N): la tarjeta de mapa del hilo (tuit N) dibujada a pantalla completa, sin columna:
     los 22 departamentos a ~820 px de alto, cada uno se enciende en el orden de la geometría; el destacado entra al
     final con su contorno y su rótulo (nombre · valor) junto al departamento; cuando la voz dice el valor de otro
     departamento, ese brilla y muestra el suyo. Debajo, la leyenda en una fila y la fuente; arriba el golpe y la
     barra de progreso; abajo los subtítulos. Lee los DATA de tarjeta_N.html (los sirve scripts/video_grabar.js, que
     también sirve h.js = bloque H de templates/base.html y geometria.js = GEOMETRIA de templates/graficos/mapa.html).
     Zona segura (V.zona, gate V13): el mapa termina en x ≤ 890 (los íconos de la app cubren x ≥ 900 desde y≈1070) y
     la leyenda y la fuente van en un pie que fluye bajo el mapa y termina antes de los subtítulos. La graba
     scripts/video_grabar.js llamando a seek(t). -->
<link rel="stylesheet" href="comun.css">
<style>
#kicker { position: absolute; top: 440px; left: var(--izq); font: 500 24px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
#mapa { position: absolute; top: 474px; left: var(--izq); width: 805px; height: 770px; transform-origin: 50% 50%; will-change: transform; }
#mapa svg { width: 100%; height: 100%; display: block; }
#mapa path { stroke: var(--bg); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#mapa path.halo { fill: none; stroke: var(--bg); stroke-width: 9; }
#mapa path.borde { fill: none; stroke: var(--a1); stroke-width: 4.5; }
#mapa .rotulo rect { fill: var(--bg); stroke: var(--ink); stroke-width: 3; }
#mapa .rotulo text { font: 800 30px Archivo, sans-serif; fill: var(--ink); }
#mapa .rotulo text.v { font: 700 30px 'JetBrains Mono', monospace; }
#mapa .rotulo line { stroke: var(--ink); stroke-width: 3; }
#pie { position: absolute; top: 1268px; left: var(--izq); right: var(--der); }
#leyenda { display: flex; flex-wrap: wrap; gap: 10px 26px; font: 500 22px/1 'JetBrains Mono', monospace; }
#leyenda span { display: inline-flex; align-items: center; gap: 10px; }
#leyenda i { width: 24px; height: 24px; display: inline-block; }
#fuente { margin-top: 12px; font: 500 20px/1.2 'JetBrains Mono', monospace; opacity: .75; }
/* formato 4:5 (1080×1350) para el feed */
html.f45 #kicker { top: 250px; }
html.f45 #mapa { top: 290px; width: 910px; height: 640px; }
html.f45 #pie { top: 950px; }
</style>
<script src="h.js"></script>
<script src="geometria.js"></script>
</head>
<body>
<div id="arriba"><div id="golpe"></div><div id="progreso"></div></div>
<div id="kicker"></div>
<div id="mapa"></div>
<div id="pie"><div id="leyenda"></div><div id="fuente"></div></div>
<div id="subs"></div>
<script src="comun.js"></script>
<script>
const n = V.n, F45 = V.F45, { clamp, prog, esc } = V;
let S, TROZOS, D, M = null;
const clave = (v) => String(Number(v));
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, padre) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); padre.appendChild(e); return e; };

// el mapa: clases, colores y rótulos con los mismos helpers que la tarjeta (H.cortes, H.claseDe, H.rampa, H.num)
function dibujar() {
  const NOMBRES = H.NOMBRES, ids = Object.keys(NOMBRES), idDe = H.idDepto;
  const val = {};
  for (const [k, v] of Object.entries(D.valores || {})) if (v !== null && v !== undefined) val[idDe(k)] = v;
  const con = ids.filter((id) => id in val);
  const hi = D.destacar ? idDe(D.destacar) : null;
  const f = (v) => H.num(v, D.formato);
  const vals = con.map((id) => val[id]).sort((a, b) => a - b);
  const min = vals[0], max = vals[vals.length - 1];
  const cortes = H.cortes(vals, { cortes: D.cortes, clases: D.clases, metodo: D.metodo, redondear: D.redondear });
  const nc = cortes.length + 1, claseDe = (v) => H.claseDe(v, cortes), colores = H.rampa(nc);
  const svg = el('svg', { viewBox: GEOMETRIA.viewBox, preserveAspectRatio: 'xMidYMid meet' }, document.getElementById('mapa'));
  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'sinDato', width: 12, height: 12, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('rect', { width: 12, height: 12, fill: H.color.inkA(.10) }, pat);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 12, stroke: H.color.inkA(.35), 'stroke-width': 2 }, pat);
  M = { deptos: [], porValor: {}, dest: [], hi: null, f };
  for (const id of ids) {
    const geo = GEOMETRIA.deptos[id];
    const p = el('path', { d: geo.d, fill: id in val ? colores[claseDe(val[id])] : 'url(#sinDato)' }, svg);
    const d = { id, path: p, v: val[id], rotulo: null, color: id in val ? colores[claseDe(val[id])] : null };
    M.deptos.push(d);
    if (id in val) (M.porValor[clave(val[id])] = M.porValor[clave(val[id])] || []).push(d);
  }
  if (hi) {
    M.dest.push(el('path', { d: GEOMETRIA.deptos[hi].d, class: 'halo' }, svg));
    M.dest.push(el('path', { d: GEOMETRIA.deptos[hi].d, class: 'borde' }, svg));
    M.hi = M.deptos.find((d) => d.id === hi);
  }
  // rótulo «nombre · valor» de cada departamento con valor, junto a su centro: a la derecha si cabe, si no a la
  // izquierda, y si choca con un rótulo que se ve a la vez (el del destacado, siempre visible, o el de otro
  // departamento con el mismo valor, que se enciende con la misma palabra) prueba debajo, arriba o centrado
  const VB = GEOMETRIA.viewBox.split(' ').map(Number), xMax = VB[0] + VB[2], yMax = VB[1] + VB[3];
  const puestos = [];
  const choca = (x, y, w, h, otros) => otros.some((r) => x < r.x + r.w + 8 && x + w + 8 > r.x && y < r.y + r.h + 8 && y + h + 8 > r.y);
  const orden = M.deptos.filter((d) => d.id in val).sort((a, b) => (a === M.hi ? -1 : b === M.hi ? 1 : 0));
  for (const d of orden) {
    const bb = d.path.getBBox(), cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
    const g = el('g', { class: 'rotulo' }, svg);
    const t1 = el('text', { x: 0, y: 0 }, g); t1.textContent = NOMBRES[d.id];
    const t2 = el('text', { x: 0, y: 0, class: 'v' }, g); t2.textContent = f(val[d.id]);
    const w1 = t1.getBBox().width, w2 = t2.getBBox().width, w = w1 + 18 + w2 + 32, h = 52;
    const otros = puestos.filter((r) => r.d === M.hi || clave(r.d.v) === clave(d.v));
    const cands = [[cx + 70, cy - 80], [cx - 70 - w, cy - 80], [cx + 70, cy + 30], [cx - 70 - w, cy + 30],
                   [cx - w / 2, cy - 150], [cx - w / 2, cy + 80]];
    let x = null, y = null;
    for (const [px, py] of cands) {
      const xx = Math.min(Math.max(px, VB[0] + 6), xMax - w - 6), yy = Math.min(Math.max(VB[1] + 6, py), yMax - h - 6);
      if (x === null) { x = xx; y = yy; }   // la primera posición vale si ninguna queda libre
      if (!choca(xx, yy, w, h, otros)) { x = xx; y = yy; break; }
    }
    puestos.push({ d, x, y, w, h });
    const linea = el('line', { x1: cx, y1: cy, x2: Math.min(Math.max(cx, x), x + w), y2: y + h / 2 }, g);
    const rect = el('rect', { x, y, width: w, height: h, rx: 12 }, g);
    g.insertBefore(rect, t1); g.insertBefore(linea, rect);  // línea guía, píldora y, encima, los textos
    t1.setAttribute('x', x + 16); t1.setAttribute('y', y + 36);
    t2.setAttribute('x', x + 16 + w1 + 18); t2.setAttribute('y', y + 36);
    g.style.opacity = 0;
    d.rotulo = g;
  }
  // leyenda en una fila (clase alta primero) y fuente
  const ley = document.getElementById('leyenda');
  for (let i = nc - 1; i >= 0; i--) {
    const lo = i === 0 ? min : cortes[i - 1], hiV = i === nc - 1 ? max : cortes[i];
    ley.insertAdjacentHTML('beforeend', `<span><i style="background:${colores[i]}"></i>${esc(f(lo))} – ${esc(f(hiV))}</span>`);
  }
  if (con.length < ids.length) ley.insertAdjacentHTML('beforeend', `<span><i style="background:${H.color.inkA(.18)}"></i>Sin dato</span>`);
  document.getElementById('fuente').textContent = D.fuente ? 'Fuente: ' + D.fuente : '';
  document.getElementById('kicker').textContent = D.kicker || '';
}

window.__listo = (async () => {
  const C = await V.cargar(), todo = C.todo; S = C.S; TROZOS = C.trozos;
  const rgb = (h) => (h.replace('#', '').match(/../g) || []).map((x) => parseInt(x, 16)).join(',');
  document.documentElement.style.setProperty('--ink-rgb', rgb(todo.colores.ink));
  S.arriba = S.arriba || [];
  V.pintarGolpe(S);
  V.pintarProgreso(todo);
  D = await V.tarjeta(S.tuit);
  await document.fonts.ready;
  dibujar();
  V.ajustarGolpe(S, F45 ? 250 : 430);
})();

window.seek = (t) => {
  V.seekGolpe(t, S);
  V.seekProgreso(t, n, S.dur);
  const T = S.T, ini = T.ini;
  document.getElementById('kicker').style.opacity = prog(t, ini - 0.3, ini + 0.2);
  // los departamentos se encienden en 2 s en el orden de la geometría, cada uno con un brillo al entrar
  const nD = M.deptos.length;
  M.deptos.forEach((d, k) => { const a = ini + 2.0 * k / nD, p = prog(t, a, a + 0.45); d.path.style.opacity = p; d.brillo = (1 - p) * 0.35; });
  // el destacado: contorno y rótulo cuando el mapa está completo
  const pd = prog(t, ini + 2.1, ini + 2.6);
  M.dest.forEach((e) => (e.style.opacity = pd));
  // los valores que dice la voz: su departamento brilla y enseña su rótulo mientras dura la ventana
  const activos = new Map();
  for (const [k, [a, b]] of Object.entries(T.valores || {})) {
    const w = prog(t, a - 0.1, a + 0.3) * (1 - prog(t, b + 0.6, b + 1.0));
    for (const d of M.porValor[k] || []) activos.set(d, Math.max(activos.get(d) || 0, w));
  }
  for (const d of M.deptos) {
    const w = activos.get(d) || 0, b = d.brillo + 0.3 * w;
    // el brillo es un color calculado (mezcla hacia blanco), no un filter: el filter cambia el antialiasing de toda la
    // página de una grabación a otra y los clips dejan de ser deterministas
    if (d.color) d.path.setAttribute('fill', b > 0.01 ? H.mezcla(d.color, '#FFFFFF', Math.min(0.6, b)) : d.color);
    if (d.rotulo) { const o = d === M.hi ? Math.max(pd, w) : w; d.rotulo.style.opacity = o; d.rotulo.style.transform = `translateY(${((1 - o) * 14).toFixed(1)}px)`; }
  }
  document.getElementById('leyenda').style.opacity = prog(t, ini + 0.3, ini + 0.8);
  document.getElementById('fuente').style.opacity = prog(t, ini + 0.6, ini + 1.1);
  // deriva lenta del mapa durante la escena (nunca quieto)
  document.getElementById('mapa').style.transform = `scale(${(1 + 0.02 * clamp(t / S.dur)).toFixed(4)})`;   // ≤ x 898 (V13)
  V.subtitulos(t, S, TROZOS);
};
</script>
</body></html>
