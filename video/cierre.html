<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Cierre de /video: eco de la cifra del gancho (si la hay), resumen en dos líneas, la pregunta al espectador y
     «Sígueme en» (TikTok, Instagram y X) solo en pantalla, sin logo ni fuentes. Colores de la paleta del hilo
     (escenas.json); subtítulos con las cifras en grande. -->
<style>
@font-face { font-family: 'Instrument Serif'; font-weight: 400; src: url(fonts/instrument-serif-400.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 100 900; src: url(fonts/archivo-var.woff2) format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url(fonts/jetbrains-mono-var.woff2) format('woff2'); }
html, body { margin: 0; }
:root { --izq: 85px; --der: 204px; }
body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); position: relative; font-family: Archivo, sans-serif; }
#arriba { position: absolute; top: 250px; left: var(--izq); right: var(--der); }
#contexto { font: 500 26px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
#progreso { display: flex; gap: 10px; margin-top: 26px; }
#progreso i { flex: 1; height: 6px; background: color-mix(in srgb, var(--ink) 28%, transparent); border-radius: 3px; overflow: hidden; }
#progreso i b { display: block; height: 100%; width: 0; background: var(--ink); }
/* zona segura de TikTok: ver escena.html; resumen, pregunta y «Sígueme en» van apilados en la columna */
#cuerpo { position: absolute; top: 380px; left: var(--izq); right: var(--der); display: flex; flex-direction: column; gap: 70px; }
#eco { font: 400 96px/1 'Instrument Serif', serif; letter-spacing: -.02em; color: var(--acento, var(--ink)); display: none; }
#eco.si { display: block; }
#resumen { font: 400 70px/1.04 'Instrument Serif', serif; letter-spacing: -.015em; }
#resumen span { display: block; }
#pregunta { font: 400 96px/1.0 'Instrument Serif', serif; letter-spacing: -.015em; color: var(--pregunta); }
#sigue { }
#sigue .t { font: 500 28px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 30px; }
#sigue .c { display: flex; align-items: center; gap: 22px; margin-top: 22px; }
#sigue .i { width: 64px; height: 64px; border-radius: 14px; background: var(--ink); display: flex; align-items: center; justify-content: center; }
#sigue .i svg { width: 36px; height: 36px; fill: var(--bg); stroke: var(--bg); }
#sigue .h { font: 700 54px/1 Archivo, sans-serif; letter-spacing: .01em; }
#subs { position: absolute; top: 1500px; left: var(--izq); right: var(--der); text-align: center; font: 700 46px/1.25 Archivo, sans-serif; }
#subs .no { opacity: .38; }
#subs .cifra { font-size: 58px; font-weight: 800; letter-spacing: -.01em; }
#subs .ahora { color: var(--resalte-ink); background: var(--resalte-bg); border-radius: 10px; padding: 0 .12em; }
</style></head>
<body>
<div id="arriba"><div id="contexto"></div><div id="progreso"></div></div>
<div id="cuerpo">
<div id="eco"></div>
<div id="resumen"><span></span><span></span></div>
<div id="pregunta"></div>
<!-- solo texto: la voz no lo dice -->
<div id="sigue"><div class="t">Sígueme en</div></div>
</div>
<div id="subs"></div>
<script>
// contenido de cada ícono en un viewBox de 24×24 (relleno y trazo del color del fondo)
const ICONOS = {
  tiktok: '<path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>',
  instagram: '<rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4" fill="none" stroke-width="2.2"/><circle cx="12" cy="12" r="4.3" fill="none" stroke-width="2.2"/><circle cx="17.5" cy="6.5" r="1.4"/>',
  x: '<path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>',
};
let S, N, ECO = false;
const clamp = (x) => Math.max(0, Math.min(1, x)), eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const ap = (el, p, dy = 30) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
window.__listo = (async () => {
  const todo = await (await fetch('escenas.json')).json();
  for (const [k, v] of Object.entries(todo.colores)) document.documentElement.style.setProperty('--' + k.replace('_', '-'), v);
  S = todo.escenas.find((e) => e.tipo === 'cierre' || e.plantilla === 'cierre'); N = todo.escenas.length;
  document.getElementById('contexto').textContent = todo.contexto_superior;
  // eco: la cifra del gancho vuelve sobre el resumen (solo si la pantalla del gancho es numérica)
  if (todo.gancho && /\d/.test(todo.gancho.pantalla || '')) { ECO = true; const e = document.getElementById('eco'); e.textContent = todo.gancho.pantalla; e.classList.add('si'); }
  document.getElementById('progreso').innerHTML = todo.escenas.map(() => '<i><b></b></i>').join('');
  document.querySelectorAll('#resumen span').forEach((s, i) => (s.textContent = todo.cierre.resumen[i]));
  document.getElementById('pregunta').textContent = todo.cierre.pregunta;
  document.getElementById('sigue').insertAdjacentHTML('beforeend', todo.redes.map((r) =>
    `<div class="c"><div class="i"><svg viewBox="0 0 24 24">${ICONOS[r.red]}</svg></div><span class="h">${esc(r.handle)}</span></div>`).join(''));
  await document.fonts.ready;
})();
window.seek = (t) => {
  [...document.querySelectorAll('#progreso b')].forEach((b, i) => { b.style.width = (i + 1 < N ? 100 : 100 * clamp(t / S.dur)) + '%'; });
  const [r1, r2] = document.querySelectorAll('#resumen span');
  if (ECO) ap(document.getElementById('eco'), eo((t - 0.1) / 0.5), 24);
  ap(r1, eo((t - (ECO ? Math.max(0.3, S.T.r2 - 0.4) : 0.1)) / 0.5)); ap(r2, eo((t - S.T.r2) / 0.5));
  ap(document.getElementById('pregunta'), eo((t - S.T.preg) / 0.6), 40);
  [...document.querySelectorAll('#sigue > div')].forEach((el, i) => ap(el, eo((t - S.T.sigue - 0.15 * i) / 0.5), 20));
  const subs = document.getElementById('subs');
  const ini = S.palabras.findIndex((p) => t < p.end + 0.08);
  const k = ini < 0 ? S.palabras.length - 1 : ini;
  const ventana = S.palabras.slice(Math.max(0, k - 2), k + 3);
  subs.innerHTML = t > S.fin_voz + 0.4 ? '' : ventana.map((p) => `<span class="${t >= p.start && t < p.end + 0.08 ? 'ahora' : t >= p.end ? '' : 'no'}${p.num ? ' cifra' : ''}">${esc(p.text)}</span>`).join(' ');
};
</script>
</body></html>
