<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Cierre de /video en dos pantallas con una sola voz. A · Conclusiones (hasta T.preg): rótulo, eco de la cifra del
     gancho (si la hay) y el resumen en 2–3 líneas que entran en T.r. B · Frase final (desde T.preg): A sale hacia arriba
     y queda la frase final sola (un remate o, a veces, una pregunta al espectador; referencias/cierres.md), y luego «Sígueme en» (TikTok, Instagram y X) solo en pantalla, sin logo ni
     fuentes. Estilo Noche (video/comun.css): una sola cosa en el acento por pantalla. En A, el eco (la cifra del
     gancho); el resumen en crema, Archivo 800, con sus números en crema y peso 900 (destacan sin color: con 2–3 líneas
     serían 4–5 acentos). En B, la palabra que suena de la frase final (crema, Archivo 800), que se enciende palabra a
     palabra con la voz (lo que falta al 35 %) y, como la pantalla ya dice la voz, sin subtítulo debajo (en A sí: el
     resumen no es la locución). Con 5 líneas (/semana) cada una va en un solo renglón y el hueco baja.
     Todo dentro de la zona segura (V.zona: termina 30 px antes de los subtítulos de comun.css, y = 1400). -->
<link rel="stylesheet" href="comun.css">
<style>
#contexto { font: 600 26px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
/* zona segura de TikTok: ver escena.html; cada pantalla apila lo suyo en la columna */
.pant { position: absolute; top: 380px; left: var(--izq); right: var(--der); display: flex; flex-direction: column; gap: 64px; }
#pantB { gap: 100px; }
#rotulo { font: 600 30px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; margin-bottom: -26px; }
/* el eco: la cifra del gancho, Archivo 900 condensado en mayúsculas (el shorthand `font` resetea font-stretch) */
#eco { font: 900 150px/.84 Archivo, sans-serif; font-stretch: 62.5%; text-transform: uppercase; color: var(--acento, var(--ink)); display: none; white-space: nowrap; }
#eco.si { display: block; }
#resumen { font: 800 64px/1.06 Archivo, sans-serif; letter-spacing: -.015em; display: flex; flex-direction: column; gap: 26px; }
#resumen span { display: block; }
#resumen b { font-weight: 900; color: var(--ink); }   /* las cifras en crema: el acento de A es solo el eco */
#pregunta { font: 800 96px/1.02 Archivo, sans-serif; letter-spacing: -.02em; }
#pregunta span { display: inline-block; margin-right: .24em; }
#pregunta span.ahora { color: var(--acento, var(--ink)); }
#sigue { }
#sigparte { font: 600 30px/1.2 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--a1); margin: 0 0 46px; }
#sigparte:empty { display: none; }
html.f45 #sigparte { font-size: 24px; margin-bottom: 20px; }
/* /serie, partes 2…M: «Empieza por la Parte 1 · fijada en mi perfil»; bajo «Parte N+1 · título» va pegado a ella
   (.junto descuenta el gap de #pantB y el margen de #sigparte) */
#inicio { font: 600 26px/1.25 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); opacity: .7; margin: 0 0 46px; }
#inicio.junto { margin-top: -132px; }
#inicio:empty { display: none; }
html.f45 #inicio { font-size: 21px; margin: 0 0 20px; }
html.f45 #inicio.junto { margin-top: -74px; }
#sigue .fila { display: flex; align-items: center; gap: 26px; margin-bottom: 8px; }
#sigue .t { font: 600 28px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
/* el botón «Seguir» propio (no la interfaz de ninguna red): pastilla en el acento → «Siguiendo» con borde; ancho fijo */
#seguir { position: relative; overflow: hidden; height: 50px; padding: 0 24px; border-radius: 25px; background: var(--acento, var(--a1));
  border: 3px solid var(--acento, var(--a1)); display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
#seguir .lbl, #seguir .ya { position: absolute; display: flex; align-items: center; gap: 10px; font: 800 28px/1 Archivo, sans-serif; white-space: nowrap; }
#seguir .lbl { color: var(--bg); }
#seguir .ya { color: var(--ink); opacity: 0; }
#seguir .ya svg { width: 30px; height: 30px; stroke: var(--acento, var(--a1)); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
#seguir .onda { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: var(--ink); opacity: 0; pointer-events: none; }
#campana { position: relative; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; transform-origin: 50% 8%; }
#campana svg { width: 42px; height: 42px; stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#campana .punto { position: absolute; top: 4px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--acento, var(--a1));
  border: 3px solid var(--bg); transform: scale(0); }
#cursor { position: absolute; left: 0; top: 0; width: 58px; height: 58px; opacity: 0; pointer-events: none; z-index: 5; }
#cursor svg { width: 58px; height: 58px; stroke: var(--bg); fill: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#sigue .c { display: flex; align-items: center; gap: 22px; margin-top: 22px; }
#sigue .i { width: 64px; height: 64px; border-radius: 14px; background: var(--ink); display: flex; align-items: center; justify-content: center; }
#sigue .i svg { width: 36px; height: 36px; fill: var(--bg); stroke: var(--bg); }
#sigue .h { font: 800 52px/1 Archivo, sans-serif; letter-spacing: -.005em; }
/* formato 4:5 (1080×1350) para el feed: más compacto, «Sígueme en» en una fila */
html.f45 .pant { top: 230px; gap: 42px; }
html.f45 #pantB { gap: 64px; }
html.f45 #rotulo { font-size: 26px; margin-bottom: -16px; }
html.f45 #eco { font-size: 120px; }
html.f45 #resumen { font-size: 54px; gap: 18px; }
html.f45 #pregunta { font-size: 78px; }
html.f45 #sigue { display: flex; flex-wrap: wrap; align-items: center; column-gap: 40px; }
html.f45 #sigue .fila { width: 100%; margin-bottom: 8px; gap: 18px; }
html.f45 #seguir { height: 50px; padding: 0 20px; }
html.f45 #seguir .lbl, html.f45 #seguir .ya { font-size: 25px; }
html.f45 #seguir .ya svg { width: 24px; height: 24px; }
html.f45 #campana { width: 48px; height: 48px; }
html.f45 #campana svg { width: 38px; height: 38px; }
html.f45 #cursor, html.f45 #cursor svg { width: 46px; height: 46px; }
html.f45 #sigue .c { gap: 14px; margin-top: 12px; }
html.f45 #sigue .i { width: 48px; height: 48px; }
html.f45 #sigue .i svg { width: 28px; height: 28px; }
html.f45 #sigue .h { font-size: 38px; }
</style></head>
<body>
<div id="arriba"><div id="contexto"></div><div id="progreso"></div></div>
<div class="pant" id="pantA">
<div id="rotulo">Conclusiones</div>
<div id="eco"></div>
<div id="resumen"></div>
</div>
<div class="pant" id="pantB">
<div id="pregunta"></div>
<!-- /serie: la parte siguiente («Parte N+1 · título»), solo texto, entra con «Sígueme en» -->
<div id="sigparte"></div>
<!-- /serie, partes 2…M: «Empieza por la Parte 1 · fijada en mi perfil», solo texto -->
<div id="inicio"></div>
<!-- solo texto: la voz no lo dice -->
<div id="sigue"><div class="fila"><div class="t">Sígueme en</div>
<div id="seguir"><span class="lbl">Seguir</span><span class="ya"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Siguiendo</span><span class="onda"></span></div>
<div id="campana"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="punto"></span></div>
</div></div>
</div>
<!-- el cursor que toca «Seguir» (iconos Lucide, ISC: pointer, check y bell, dibujados en el color del sistema) -->
<div id="cursor"><svg viewBox="0 0 24 24"><path d="M10 9.5V4a2 2 0 0 0-4 0v10l-1.6-1.6a2 2 0 0 0-2.83 2.82l3.6 3.6C6.66 20.3 8.4 22 11.2 22H14a8 8 0 0 0 8-8v-3a2 2 0 0 0-4 0v-1a2 2 0 0 0-4 0V9a2 2 0 0 0-4 0z"/></svg></div>
<div id="subs"></div>
<script src="comun.js"></script>
<script>
// contenido de cada ícono en un viewBox de 24×24 (relleno y trazo del color del fondo)
const ICONOS = {
  tiktok: '<path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>',
  instagram: '<rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4" fill="none" stroke-width="2.2"/><circle cx="12" cy="12" r="4.3" fill="none" stroke-width="2.2"/><circle cx="17.5" cy="6.5" r="1.4"/>',
  facebook: '<path d="M14.2 8.1h3V4.2h-3.1c-3 0-4.6 1.9-4.6 4.8v2.3H7v3.9h2.5V24h4.1v-8.8h3.1l.5-3.9h-3.6V9.4c0-.8.3-1.3 1.1-1.3z"/>',
  youtube: '<path fill-rule="evenodd" d="M23.5 7.2a3 3 0 0 0-2.1-2.1C19.5 4.6 12 4.6 12 4.6s-7.5 0-9.4.5A3 3 0 0 0 .5 7.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-4.8zM9.6 15.6V8.4l6.2 3.6z"/>',
  x: '<path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>',
};
const { clamp, eo, esc, normal } = V;
const APAGADA = 0.35;   // lo que la voz aún no dice de la frase final (texto grande)
// cifras del resumen (en crema y peso 900), con su prefijo o su unidad pegada («US$5.90», «×1.8», «46.1 %»)
const RE_CIFRA = /(?:US\$|Q|\$|×)?[-−]?\d[\d,]*(?:\.\d+)?(?:\s?%)?/g;
let S, N, ECO = false, FINAL = [];
const ap = (el, p, dy = 30) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
const apx = (el, p, dx = -40) => { el.style.opacity = p; el.style.transform = `translateX(${(1 - p) * dx}px)`; };  // entra desde la izquierda
window.__listo = (async () => {
  const C = await V.cargar((e) => e.tipo === 'cierre' || e.plantilla === 'cierre'), todo = C.todo; S = C.S; N = todo.escenas.length;
  document.getElementById('contexto').textContent = todo.contexto_superior;
  // eco: la cifra del gancho vuelve sobre el resumen (solo si la pantalla del gancho es numérica)
  if (todo.gancho && /\d/.test(todo.gancho.pantalla || '')) { ECO = true; const e = document.getElementById('eco'); e.textContent = todo.gancho.pantalla; e.classList.add('si'); }
  V.pintarProgreso(todo);
  if (todo.cierre.rotulo) document.getElementById('rotulo').textContent = todo.cierre.rotulo;   // /noticias: «Hoy en Guatemala»
  document.getElementById('resumen').innerHTML = todo.cierre.resumen.map((r) => `<span>${esc(r).replace(RE_CIFRA, (m) => `<b>${m}</b>`)}</span>`).join('');
  // sin resumen (/sabias), el cierre es una sola pantalla: la frase final y «Sígueme en», sin conclusiones
  // (y la frase entra con la transición, sin esperar a que salga una pantalla A que no hay)
  if (!todo.cierre.resumen.length) { document.getElementById('pantA').style.display = 'none'; S.T.preg = Math.min(S.T.preg, -0.45); }
  // la frase final (remate o pregunta) palabra a palabra: el texto del cierre termina con ella (gate V5), así que sus
  // palabras son las últimas de la voz; si no casan (≥ 80 %), se encienden repartidas entre T.preg y el fin de la voz
  const final = String(todo.cierre.final || todo.cierre.pregunta || '').split(/\s+/).filter(Boolean);
  const P = document.getElementById('pregunta');
  P.innerHTML = final.map((w) => `<span>${esc(w)}</span>`).join('');
  // /serie: tras la frase final la voz dice la invitación (S.n_inv palabras): la frase casa con las de antes
  const ps = (S.palabras || []).slice(0, (S.palabras || []).length - (S.n_inv || 0)), cola = ps.slice(Math.max(0, ps.length - final.length));
  const casan = cola.length === final.length && cola.filter((p, i) => normal(p.text) === normal(final[i])).length >= 0.8 * final.length;
  const t0 = S.T.preg + 0.1, t1 = Math.max(t0 + 0.3, S.T.fin_final || S.fin_voz || t0 + 0.3), paso = (t1 - t0) / Math.max(1, final.length);
  FINAL = [...P.querySelectorAll('span')].map((el, i) => casan ? { el, start: cola[i].start, end: cola[i].end } : { el, start: t0 + i * paso, end: t0 + (i + 1) * paso });
  const SIG = todo.serie && todo.serie.siguiente;   // /serie: «Parte N+1 · título» (la última parte no lo lleva)
  if (SIG) document.getElementById('sigparte').textContent = `Parte ${SIG.n} · ${SIG.titulo}`;
  // /serie, partes 2…M: quien llega por aquí no vio el inicio; la Parte 1 va fijada en el perfil (solo texto)
  if (todo.serie && todo.serie.parte > 1) {
    const ini = document.getElementById('inicio');
    ini.textContent = 'Empieza por la Parte 1 · fijada en mi perfil';
    ini.classList.toggle('junto', !!SIG);
  }
  document.getElementById('sigue').insertAdjacentHTML('beforeend', todo.redes.map((r) =>
    `<div class="c"><div class="i"><svg viewBox="0 0 24 24">${ICONOS[r.red]}</svg></div><span class="h">${esc(r.handle)}</span></div>`).join(''));
  await document.fonts.ready;
  // «Seguir» y «Siguiendo» ocupan el mismo ancho (el mayor): el cambio no mueve la fila
  const SG = document.getElementById('seguir'), lb = SG.querySelector('.lbl'), ya = SG.querySelector('.ya');
  SG.style.width = Math.ceil(Math.max(lb.offsetWidth, ya.offsetWidth) + (V.F45 ? 44 : 60)) + 'px';
  // zona segura (V.zona, gate V13): cada pantalla termina antes de los subtítulos; se achican el eco, el resumen y la
  // frase final hasta caber (el eco, además, en una línea)
  const Z = V.zona(), cabe = (el) => el.offsetTop + el.offsetHeight <= Z.fin - 6;
  const eco = document.getElementById('eco'), col = eco.parentElement.clientWidth, A = document.getElementById('pantA'), B = document.getElementById('pantB');
  for (let fs = V.F45 ? 120 : 150; ECO && fs > 70 && eco.scrollWidth > col; fs -= 6) eco.style.fontSize = fs + 'px';
  // con 5 líneas (/semana: una por cifra de la cuenta) cada línea va en un solo renglón y el hueco entre ellas baja
  const RES = document.getElementById('resumen'), lineas = [...RES.querySelectorAll('span')];
  if (lineas.length >= 5) {
    RES.style.gap = V.F45 ? '12px' : '18px';
    for (let fs = V.F45 ? 54 : 64; fs > 36 && lineas.some((x) => x.offsetHeight > 1.3 * fs); fs -= 2) RES.style.fontSize = fs + 'px';
  }
  for (let fs = parseFloat(RES.style.fontSize) || (V.F45 ? 54 : 64); fs > 32 && !cabe(A); fs -= 2) RES.style.fontSize = fs + 'px';
  for (let fs = V.F45 ? 78 : 96; fs > 52 && !cabe(B); fs -= 4) P.style.fontSize = fs + 'px';
  // una frase final larga en una serie (con «Parte N+1» e «Empieza por la Parte 1»): si aún no cabe, se cierra el hueco
  for (let g = parseFloat(getComputedStyle(B).rowGap) || 100; g > 32 && !cabe(B); g -= 8) B.style.gap = g + 'px';
})();
// el botón «Seguir»: el cursor entra y lo toca (T.clic), una onda, pasa a «Siguiendo» con su check, y la campana suena
// con su punto (T.campana) y vuelve a sacudirse sola cada 1.6 s; en la portada, el estado final sin cursor
const bump = (x, d) => (x < 0 || x > d) ? 0 : Math.sin(Math.PI * x / d);
function seekSeguir(t) {
  const sig = S.T.sigue, clic = S.T.clic ?? sig + 0.9, camp = S.T.campana ?? clic + 0.5, port = !!V.portada;
  const SG = document.getElementById('seguir'), lb = SG.querySelector('.lbl'), ya = SG.querySelector('.ya'), onda = SG.querySelector('.onda');
  const hecho = port ? 1 : eo((t - clic - 0.15) / 0.3);
  SG.style.transform = `scale(${(1 - 0.06 * bump(t - clic, 0.14)).toFixed(4)})`;
  SG.style.background = `color-mix(in srgb, var(--acento, var(--a1)) ${(100 * (1 - hecho)).toFixed(1)}%, transparent)`;
  lb.style.opacity = (1 - hecho).toFixed(3); ya.style.opacity = hecho.toFixed(3);
  const o = port ? 0 : clamp((t - clic) / 0.45, 0, 1);
  onda.style.opacity = (o > 0 && o < 1 ? 0.35 * (1 - o) : 0).toFixed(3); onda.style.transform = `scale(${(0.2 + 4.2 * o).toFixed(3)})`;
  // la campana: el punto aparece con rebote y la campana se sacude (amortiguada); se repite cada 1.6 s, sin sonido
  const C = document.getElementById('campana'), pt = C.querySelector('.punto');
  const pp = port ? 1 : clamp((t - camp) / 0.35, 0, 1);
  pt.style.transform = `scale(${(pp <= 0 ? 0 : pp < 1 ? 1 + 0.35 * Math.sin(Math.PI * pp) * (1 - pp) + (pp - 1) * 0 : 1).toFixed(3)})`;
  let ang = 0;
  if (!port && t >= camp) {
    const desde = t - camp, k = desde < 2.1 ? 0 : Math.floor((desde - 2.1) / 1.6) + 1, x = k === 0 ? desde : desde - 2.1 - 1.6 * (k - 1);
    if (x < 0.9 && t < S.dur - 0.3) ang = (k === 0 ? 14 : 9) * Math.exp(-3.2 * x) * Math.sin(2 * Math.PI * x / 0.3);
  }
  C.style.transform = `rotate(${ang.toFixed(2)}deg)`;
  // el cursor: entra desde abajo a la derecha, toca el centro del botón y se va
  const K = document.getElementById('cursor'), r = SG.getBoundingClientRect();
  const fx = r.left + r.width * 0.55, fy = r.top + r.height * 0.45;
  const va = eo((t - (sig + 0.35)) / Math.max(0.2, clic - sig - 0.35)), sale = clamp((t - clic - 0.3) / 0.3, 0, 1);
  K.style.opacity = port ? 0 : (clamp((t - sig - 0.35) / 0.15, 0, 1) * (1 - sale)).toFixed(3);
  const presion = 1 - 0.12 * bump(t - clic, 0.14);
  K.style.transform = `translate(${(fx + 150 * (1 - va)).toFixed(1)}px, ${(fy + 190 * (1 - va)).toFixed(1)}px) scale(${presion.toFixed(3)})`;
}
window.seek = (t) => {
  V.seekProgreso(t, N, S.dur);
  // A · conclusiones: rótulo, eco y las líneas del resumen en T.r (con eco, la primera espera un poco)
  const R = S.T.r || [0.1, S.T.r2];
  const rot = document.getElementById('rotulo'), pr = eo((t - 0.05) / 0.4);
  ap(rot, pr, 16); rot.style.opacity = (0.7 * pr).toFixed(3);   // el rótulo, en crema atenuada
  if (ECO) ap(document.getElementById('eco'), eo((t - 0.1) / 0.5), 24);
  [...document.querySelectorAll('#resumen span')].forEach((s, i) => {
    const ti = i === 0 && ECO ? Math.max(0.3, (R[1] ?? 0.8) - 0.4) : (R[i] ?? R[R.length - 1]);
    apx(s, eo((t - ti) / 0.5));
  });
  // al llegar la frase final, A sale hacia arriba y entra B; cada palabra se enciende cuando la voz la dice y la que
  // suena va en el acento (en la portada, la frase entera encendida)
  const sale = eo((t - S.T.preg) / 0.4), A = document.getElementById('pantA');
  A.style.opacity = 1 - sale; A.style.transform = `translateY(${(-90 * sale).toFixed(1)}px)`;
  apx(document.getElementById('pregunta'), eo((t - S.T.preg - 0.15) / 0.6), -40);
  FINAL.forEach((x) => {
    const w = V.portada ? 1 : eo((t - x.start + 0.1) / 0.25);
    x.el.style.opacity = (APAGADA + (1 - APAGADA) * w).toFixed(3);
    x.el.classList.toggle('ahora', !V.portada && t >= x.start - 0.05 && t < x.end + 0.08);
  });
  ap(document.getElementById('sigparte'), eo((t - S.T.sigue + 0.1) / 0.5), 20);
  const ini = document.getElementById('inicio'), pi = eo((t - S.T.sigue - 0.05) / 0.5);
  ap(ini, pi, 20); ini.style.opacity = (0.7 * pi).toFixed(3);
  [...document.querySelectorAll('#sigue > div')].forEach((el, i) => ap(el, eo((t - S.T.sigue - 0.15 * i) / 0.5), 20));
  seekSeguir(t);
  // B respira despacio hasta el final (la pantalla nunca queda quieta: V12/V21)
  const deriva = clamp((t - S.T.preg) / Math.max(1, S.dur - S.T.preg), 0, 1), B = document.getElementById('pantB');
  B.style.transformOrigin = '0 100%'; B.style.transform = `scale(${(1 + 0.015 * deriva).toFixed(4)})`;   // desde abajo: los handles no bajan (V13)
  // subtítulos solo en A (el resumen no es la locución); en B la pantalla ya dice la voz
  if (t < S.T.preg) V.subtitulosVentana(t, S); else document.getElementById('subs').innerHTML = '';
};
</script>
</body></html>
