<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Escenario 16:9 (1920×1080) del video largo de YouTube (scripts/youtube.py, video_grabar.js --formato 16:9) para
     las escenas cuya página no tiene layout horizontal propio (mapa, ranking, escala, tiempo, cuenta, hemiciclo, el
     gancho con visual de gancho.html…): la escena en 4:5 (?src=<página>?n=N&f=45) en un iframe de 1080×1350 a escala
     0.8 (864×1080), al centro, sobre el fondo de la paleta con grano y el contexto arriba a la izquierda. Todo es
     función de t: seek(t) delega en la escena. V13 mide dentro del iframe (comun.js recorre los iframes). -->
<link rel="stylesheet" href="comun.css">
<style>
#esc { position: absolute; left: 528px; top: 0; width: 1080px; height: 1350px; border: 0; transform-origin: 0 0; transform: scale(.8); }
#borde { position: absolute; left: 527px; top: 0; width: 866px; height: 1080px; box-sizing: border-box; pointer-events: none;
  border-left: 2px solid color-mix(in srgb, var(--ink) 12%, transparent); border-right: 2px solid color-mix(in srgb, var(--ink) 12%, transparent); }
#ctx { position: absolute; left: 96px; top: 64px; width: 380px; font: 600 22px/1.3 'JetBrains Mono', monospace; letter-spacing: .12em;
  text-transform: uppercase; opacity: .7; }
</style></head>
<body>
<div id="ctx"></div>
<iframe id="esc"></iframe>
<div id="borde" data-fuera-de-zona></div>
<script src="comun.js"></script>
<script>
const q = new URLSearchParams(location.search);
window.__listo = (async () => {
  const todo = await (await fetch('escenas.json')).json();
  for (const [k, v] of Object.entries(todo.colores)) document.documentElement.style.setProperty('--' + k.replace('_', '-'), v);
  document.getElementById('ctx').textContent = todo.contexto_superior || '';
  const fr = document.getElementById('esc');
  const src = q.get('src') || '';
  if (!/^[a-z]+\.html\?/.test(src)) throw new Error('escenario sin ?src= válido: «' + src + '»');
  await new Promise((ok) => { fr.onload = ok; fr.src = src; });
  await fr.contentWindow.__listo;
  await document.fonts.ready;
})();
window.seek = async (t) => { await document.getElementById('esc').contentWindow.seek(t); };
</script>
</body></html>
