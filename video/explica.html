<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Escena «explica» de /video (?n=N): una animación que explica el mecanismo del fenómeno (por qué o cómo pasa), no los
     datos. Arriba el título como golpe y la barra de progreso; en medio el lienzo donde se dibuja la animación de la
     biblioteca video/animaciones/<id>.js (S.animacion), que se registra con ANIM.registrar(id, {meta, pintar, seek});
     abajo los subtítulos. Los pasos y sus tiempos (cuando la voz dice cada uno) vienen en S.T (video.py tiempos) y sus
     textos en S.P (con `rotulos` {limite, base} y, en una escena que `continua` la anterior, `previos`: los pasos que ya
     estaban). Con la cámara quieta (S.quieta) el lienzo no se mueve: solo entra lo que la voz dice (2026-11-07: nada de
     adorno continuo, ningún paso visible antes de que la voz lo diga; window.__anticipo lo mide al grabar, gate A2).
     Con S.sujeto, el retrato del personaje sobre quien actúa el mecanismo va fijo arriba del lienzo. Estilo Noche (video/comun.css): fondo
     oscuro con grano, título en Archivo 800, la animación en crema con una sola cosa en acento; sin subtítulo doble: un
     trozo cuyas palabras ya están todas en pantalla (el título o un paso) no se subtitula. La graba
     scripts/video_grabar.js llamando a seek(t). -->
<link rel="stylesheet" href="comun.css">
<style>
#lienzo { position: absolute; top: 450px; left: var(--izq); right: var(--der); height: 900px; transform-origin: 50% 50%; will-change: transform; }
/* formato 4:5 (1080×1350) para el feed */
html.f45 #lienzo { top: 260px; height: 800px; }
/* 16:9 (video largo de YouTube): el lienzo de la animación centrado (≈ 1000×800: las animaciones son de caja casi
   cuadrada), el título arriba */
html.f169.f45 #lienzo { top: 200px; height: 800px; left: 460px; right: 460px; }
html.f169.f45 #arriba { left: 460px; right: 460px; }   /* con la deriva (1.025) termina antes de y 1090 (gate V13) */
html.f169.f45.conmargen #lienzo { left: 96px; right: 760px; }
html.f169.f45.conmargen #arriba { left: 96px; right: 760px; }
</style>
</head>
<body>
<div id="arriba"><div id="golpe"></div><div id="progreso"></div></div>
<div id="lienzo"></div>
<div id="subs"></div>
<script src="comun.js"></script>
<script>
// registro de animaciones: cada video/animaciones/<id>.js llama ANIM.registrar('<id>', { meta, pintar, seek })
const ANIM = { _m: {}, registrar(id, m) { this._m[id] = m; } };
const n = V.n, F45 = V.F45, { clamp, normal } = V;
let S, TROZOS, M, EN_PANTALLA = new Set();
const cargarScript = (src) => new Promise((ok, mal) => {
  const s = document.createElement('script');
  s.src = src; s.onload = ok; s.onerror = () => mal(new Error('no existe ' + src));
  document.head.appendChild(s);
});

window.__listo = (async () => {
  const C = await V.cargar(), todo = C.todo; S = C.S; TROZOS = C.trozos;
  S.arriba = S.arriba || [];
  V.pintarGolpe(S);
  V.pintarProgreso(todo);
  // palabras que la pantalla ya dice (título y pasos): un trozo de subtítulo hecho solo de ellas no se repite abajo
  [S.P && S.P.titulo, ...((S.P && S.P.pasos) || [])].forEach((s) => String(s || '').split(/\s+/).forEach((w) => { const k = normal(w); if (k) EN_PANTALLA.add(k); }));
  if (!/^[a-z0-9-]+$/.test(S.animacion || '')) throw new Error('escena explica sin animación válida: «' + S.animacion + '»');
  await cargarScript('animaciones/' + S.animacion + '.js');
  M = ANIM._m[S.animacion];
  if (!M || typeof M.pintar !== 'function' || typeof M.seek !== 'function') throw new Error('animaciones/' + S.animacion + '.js no registra { pintar, seek }');
  await document.fonts.ready;
  V.ajustarGolpe(S, V.F169 ? 200 : F45 ? 250 : 430);
  const lienzo = document.getElementById('lienzo');
  const su = document.querySelector('.persona.sujeto');
  if (su) {   // el retrato del sujeto bajo el título; el lienzo empieza debajo y conserva su borde inferior
    // posición fija (no depende del largo del título): dos escenas seguidas con la misma animación encajan en el corte
    const base = lienzo.offsetTop + lienzo.offsetHeight;
    su.style.top = (V.F169 ? 200 : F45 ? 268 : 452) + 'px';
    const top = su.offsetTop + su.offsetHeight + (F45 ? 20 : 34);
    lienzo.style.top = top + 'px'; lienzo.style.height = Math.max(300, base - top) + 'px';
  }
  M.pintar(lienzo, S.P, { colores: todo.colores, F45, ancho: lienzo.clientWidth, alto: lienzo.clientHeight, V });
  await V.pintarActo(S);   // rótulo de acto (/historia, S.R); sus pasos ya llegan desplazados de python
})();

// A2 (lo mide video_grabar.js en los mismos cuadros que V13): un paso que la voz todavía no dice no se ve en el lienzo
// (ni completo ni «fantasma»): ningún elemento cuyo texto sea el paso con opacidad efectiva ≥ 0.06 antes de su start
window.__anticipo = (t) => {
  if (!S || !S.T || !S.T.pasos) return [];
  const lienzo = document.getElementById('lienzo'), out = [];
  const opac = (el) => { let o = 1; for (let x = el; x && x.nodeType === 1; x = x.parentElement) {
    const c = getComputedStyle(x); if (c.display === 'none' || c.visibility === 'hidden') return 0; o *= parseFloat(c.opacity); }
    return o; };
  S.T.pasos.forEach((p, i) => {
    if (t >= p.start - 0.15) return;
    const k = normal(p.texto);
    // el texto propio del elemento (sus nodos de texto directos: «1 Un número» con el número en un <span> cuenta) o todo
    const propio = (el) => [...el.childNodes].filter((x) => x.nodeType === 3).map((x) => x.textContent).join(' ');
    for (const el of lienzo.querySelectorAll('*')) {
      const igual = normal(propio(el)) === k || (normal(el.textContent || '') === k && ![...el.children].some((c) => normal(c.textContent || '') === k));
      if (!igual) continue;
      const o = opac(el);
      if (o >= 0.06) { out.push({ paso: p.texto, start: p.start, opacidad: Math.round(o * 100) / 100 }); break; }
    }
  });
  return out;
};

window.seek = (t) => {
  V.seekGolpe(t, S);
  V.seekProgreso(t, n, S.dur);
  V.seekActo(t, S);
  M.seek(t, S.T);
  // con rótulo de acto (S.R), el lienzo espera a que el rótulo se vaya: nada se dibuja debajo del año y su riel (A3)
  if (S.R) { const o = V.eo(clamp((t - S.R.fin) / 0.3)); const lz = document.getElementById('lienzo'); lz.style.opacity = o.toFixed(3); lz.style.visibility = o > 0.001 ? '' : 'hidden'; }
  // deriva lenta del lienzo durante la escena (nunca quieto)
  if (!S.quieta) document.getElementById('lienzo').style.transform = `scale(${(1 + 0.025 * clamp(t / S.dur)).toFixed(4)})`;   // quieta: se mueve lo de adentro
  V.subtitulos(t, S, TROZOS, { ocultar: (tr) => tr.every((x) => EN_PANTALLA.has(normal(x.text))) });
};
</script>
</body></html>
