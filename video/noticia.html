<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Escena de /noticias (?n=N) para el gancho (`titular`: la noticia más fuerte con su foto a sangre, oscurecida, y su
     titular entero desde el cuadro 0; la palabra que la voz dice se enciende en el realce al decirla) y cada `noticia`
     (estilo Noche: la foto a sangre arriba, oscurecida, con Ken Burns lento y la sombra del fondo arriba y abajo; encima,
     en la columna segura, los chips «2/4 · Sección» (y «En desarrollo») bajo la barra de progreso, el titular que entra
     con la voz, la cifra condensada en el acento que cuenta y late cuando la voz la dice, «Fuente: …» y «Foto: …»;
     subtítulos). Sin foto, la columna lleva el mapa de los 22 departamentos con el de la noticia encendido y su pin (o
     el icono de la noticia). Paleta del noticiero (escenas.json). Todo es función de t (seek): lo graba
     scripts/video_grabar.js.
     S.N = { indice, total, seccion, estado?, titular: [{text, start, dicha?}], foto, credito, encaje?, icono, depto,
             lugar, cifra: { texto, etiqueta, start, pulso } | null, fuente: { texto, start }, oraciones: [t] (la foto
             late), kb: { z: [z0, z1], x: [x0, x1], y: [y0, y1] }, fecha, conteo }
     /semana añade S.N.puesto (5→1: el numeral grande de la cuenta regresiva sobre el titular), S.N.humana = { texto,
     start } (la cifra a escala humana bajo la cifra) y S.N.chip = { b: sección, s: día }.
     /historia la usa con S.N.modo («titular»: el gancho con foto; «noticia»: la escena `foto`) y S.N.chip = { b, s } en
     lugar de «indice/total · sección» (la fecha o la época y el lugar: «1971 · Escuintla»). S.N.encaje = «contener»
     (un gráfico, un cartel o un logo con texto, ya con márgenes de scripts/historia.py encajar): más clara y casi sin
     Ken Burns, para que se lea entera.
     /historia, escena `toma`: S.N.toma = { dir, cuadros, fps, encaje: fondo|recorte, x, t0, audio } pinta en la lámina,
     en lugar de la foto, el clip de video cuadro a cuadro (dir/00001.jpg…, 30 fps) en un canvas: corre desde t0 (con
     audio original, t0 es cuando suena, tras la voz de entrada: antes queda su primer cuadro) y, si la escena dura más,
     queda el último cuadro con un zoom lento. «fondo»: el clip entero a todo el ancho sobre sí mismo ampliado, borroso y
     oscuro; «recorte»: el clip a sangre recortado alrededor de x (0–1). seek(t) espera a que el cuadro se decodifique. -->
<link rel="stylesheet" href="comun.css">
<style>
#progreso { margin-top: 0; }
/* chips: neutros (el acento es de la cifra o de la palabra que suena) */
#chip { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 16px; margin-top: 22px; font: 600 24px/1 'JetBrains Mono', monospace;
  letter-spacing: .12em; text-transform: uppercase; }
#chip b { background: color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 10px; padding: 9px 14px 10px; font-weight: 700; }
#chip span { opacity: .9; }
#chip em { font-style: normal; border: 2px solid color-mix(in srgb, var(--ink) 45%, transparent); border-radius: 10px; padding: 7px 12px 8px; }
/* la foto a sangre (fuera de la zona a propósito): una lámina de 1080×1200 arriba, la misma en 9:16 y en 4:5
   (proporción 0.9: scripts/historia.py encajar cuenta con ella), oscurecida (--brillo: 0.55; 0.45 si la foto se
   agranda más de 2×, una og:image apaisada típica; 0.7 con encaje «contener», que se tiene que leer), con la sombra
   del fondo arriba (la barra y los chips) y abajo (el texto y los subtítulos). El grano fijo de comun.css (body::before,
   debajo de la lámina) se copia encima de la foto (.grano) para que el aumento no se vea en bloques y para que el
   borde de abajo de la lámina (el velo termina en --bg) case con el fondo con grano: sin él queda una costura en
   y = 1200. Casa con el del fondo porque la lámina empieza en 0, 0 */
#sangre { position: absolute; left: 0; top: 0; width: 1080px; height: 1200px; overflow: hidden; }
#sangre img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%;
  will-change: transform; filter: brightness(var(--brillo, .55)); }
#sangre .velo { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 88%, transparent) 0%,
  color-mix(in srgb, var(--bg) 35%, transparent) 21%, transparent 34%, transparent 46%, color-mix(in srgb, var(--bg) 62%, transparent) 64%,
  color-mix(in srgb, var(--bg) 92%, transparent) 84%, var(--bg) 100%); }
#sangre .grano { position: absolute; inset: 0; background-size: 180px 180px; }
#sangre canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 42%; will-change: transform; }
#sangre svg.mapa { position: absolute; left: 12%; top: 21%; width: 68%; height: 40%; }
#sangre .icono { position: absolute; left: 50%; top: 40%; width: 240px; height: 240px; margin: -120px 0 0 -120px; color: var(--ink); opacity: .9; }
#sangre .icono svg, #figura .icono svg { width: 100%; height: 100%; stroke-width: 1.4; }
/* la columna segura: (sin foto, el mapa o el icono) → titular → cifra → fuente y crédito; abajo, antes de los subtítulos */
#col { position: absolute; top: 352px; bottom: calc(1920px - var(--fin) + 10px); left: var(--izq); right: var(--der);
  display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; }
#figura { position: relative; flex: 1 1 auto; min-height: 0; }
#figura svg.mapa { position: absolute; inset: 2% 4%; width: 92%; height: 96%; }
#figura .icono { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; color: var(--ink); opacity: .9; }
#figura .lugar { position: absolute; left: 0; top: 0; font: 600 24px/1 'JetBrains Mono', monospace; letter-spacing: .1em;
  text-transform: uppercase; border: 2px solid color-mix(in srgb, var(--ink) 45%, transparent); padding: 8px 12px; border-radius: 10px; }
#titular { font: 800 66px/1.04 Archivo, sans-serif; letter-spacing: -.015em; text-shadow: 0 2px 22px color-mix(in srgb, var(--bg) 70%, transparent); }
#titular span { display: inline-block; margin-right: .22em; position: relative; }
/* el subrayado (S.N.marcas): un trazo en el acento bajo la fecha o la cifra del titular cuando la voz la dice */
#titular span .trazo { position: absolute; left: -4px; right: -4px; bottom: -6px; height: 9px; border-radius: 5px;
  background: var(--acento, var(--a1)); transform-origin: 0 50%; transform: scaleX(0); opacity: .9; }
#cifra { display: flex; flex-direction: column; gap: 6px; transform-origin: 0 80%; }
#cifra .v { align-self: flex-start; font-size: 190px; line-height: .84; letter-spacing: -.005em; color: var(--acento); white-space: nowrap; }
/* con line-height .84 la caja termina a .086em bajo el renglón base; la coma (.19em), los paréntesis (.16em) y la cola
   de la Q (.13em) bajan de ella y pisarían la etiqueta: con ellos, .19em más deja ≥ .12em de aire entre la tinta de la
   cifra y la de la etiqueta (medido: «1,200» .14em; las cifras sin esos signos ya lo tienen, «35 %» .14em) */
#cifra .v.baja { margin-bottom: .19em; }
#cifra .e { font: 700 30px/1.15 Archivo, sans-serif; opacity: .88; }
#cifra .e:empty { display: none; }
#pie { display: flex; flex-direction: column; gap: 10px; }
#fuente { font: 600 22px/1.25 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }
/* el crédito de la foto: Mono 600 20 px, crema al 85 % (seek lo apaga con la foto, sin bajar de ahí) */
#credito { font: 600 20px/1.25 'JetBrains Mono', monospace; letter-spacing: .06em; opacity: .85; }
#fuente:empty, #credito:empty { display: none; }
/* /semana: el numeral del puesto de la cuenta regresiva (crema condensada, grande, sobre el titular) y la línea a
   escala humana bajo la cifra (crema, Archivo 700; el acento sigue siendo solo la cifra) */
#puesto { font-size: 210px; line-height: .8; letter-spacing: -.01em; margin-bottom: -6px; transform-origin: 0 100%; }
#puesto:empty, #humana:empty { display: none; }
#humana { font: 700 38px/1.18 Archivo, sans-serif; border-left: 6px solid color-mix(in srgb, var(--ink) 55%, transparent); padding-left: 18px; }
/* gancho: la misma lámina; el titular grande abajo, entero desde el cuadro 0 */
body.titular #col { display: none; }
#gancho { position: absolute; left: var(--izq); right: var(--der); bottom: calc(1920px - var(--fin) + 10px); display: none; }
body.titular #gancho { display: block; }
#hoy { display: flex; align-items: center; gap: 18px; font: 700 26px/1 'JetBrains Mono', monospace; letter-spacing: .12em;
  text-transform: uppercase; margin-bottom: 28px; }
/* la ficha («HOY · 23 OCT», la pantalla del gancho de /historia): neutra como #chip b; el acento es de la palabra que suena */
#hoy b { background: color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 10px; padding: 9px 15px 10px; }
#hoy span:empty { display: none; }
#gtit { font: 800 96px/1 Archivo, sans-serif; letter-spacing: -.025em; text-shadow: 0 2px 26px color-mix(in srgb, var(--bg) 70%, transparent); }
#gtit span { display: inline-block; margin-right: .2em; }
#gtit span.suena { color: var(--realce); }
/* gancho con pantalla numérica (familia resultado o escala con cifra, o la pantalla es esencialmente un número: «430»):
   la cifra héroe grande sobre la foto (Archivo condensado 900 en el acento, conserva su caja: «3.00 m» no es «3.00 M»),
   la etiqueta queda en la ficha y la línea baja a subtítulo debajo de la cifra */
#gcifra { display: none; font-size: 300px; line-height: .84; letter-spacing: -.01em; color: var(--acento); text-transform: none;
  white-space: nowrap; width: fit-content; margin-bottom: 26px; transform-origin: 0 80%;
  text-shadow: 0 2px 30px color-mix(in srgb, var(--bg) 70%, transparent); }
body.gcifra #gcifra { display: block; }
body.gcifra #gtit { font-size: 62px; line-height: 1.06; letter-spacing: -.015em; }
html.f45 #gcifra { font-size: 230px; margin-bottom: 18px; }
html.f45 body.gcifra #gtit { font-size: 50px; }
#gcred { margin-top: 24px; font: 600 20px/1.25 'JetBrains Mono', monospace; letter-spacing: .06em; opacity: .85; }
/* formato 4:5 (1080×1350) para el feed: la misma lámina; la sombra de abajo empieza antes (el texto sube) */
html.f45 #chip { margin-top: 16px; font-size: 21px; }
html.f45 #col { top: 150px; bottom: calc(1350px - var(--fin) + 10px); gap: 16px; }
html.f45 #gancho { bottom: calc(1350px - var(--fin) + 10px); }
html.f45 #sangre .velo { background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 80%, transparent) 0%, transparent 18%,
  transparent 32%, color-mix(in srgb, var(--bg) 66%, transparent) 52%, color-mix(in srgb, var(--bg) 90%, transparent) 72%, var(--bg) 92%); }
html.f45 #titular { font-size: 52px; }
html.f45 #cifra .v { font-size: 150px; }
html.f45 #cifra .e { font-size: 26px; }
html.f45 #gtit { font-size: 80px; }
html.f45 #puesto { font-size: 150px; }
html.f45 #humana { font-size: 30px; }
html.f45 #hoy { font-size: 22px; margin-bottom: 20px; }
/* 16:9 (video largo de YouTube): la foto a sangre en todo el cuadro; el velo oscurece la izquierda (la columna del
   texto) y el pie; el chip arriba y el titular, la cifra y la fuente abajo a la izquierda */
html.f169.f45 #sangre { width: 1920px; height: 1080px; }
html.f169.f45 #sangre .velo { background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 90%, transparent) 0%,
  color-mix(in srgb, var(--bg) 72%, transparent) 30%, transparent 60%), linear-gradient(0deg, color-mix(in srgb, var(--bg) 80%, transparent) 0%,
  transparent 38%), linear-gradient(180deg, color-mix(in srgb, var(--bg) 70%, transparent) 0%, transparent 16%); }
html.f169.f45 #arriba { left: 96px; right: auto; width: 1100px; }
html.f169.f45 #col { top: 170px; bottom: 64px; left: 96px; right: auto; width: 880px; }
html.f169.f45 #gancho { left: 96px; right: auto; width: 1200px; bottom: 80px; }
html.f169.f45 #titular { font-size: 60px; }
html.f169.f45 #gtit { font-size: 92px; }
</style></head>
<body>
<div id="sangre" data-fuera-de-zona><div class="velo"></div><div class="grano"></div></div>
<div id="arriba"><div id="progreso"></div><div id="chip"></div></div>
<div id="col">
  <div id="figura"></div>
  <div id="puesto" class="condensada"></div>
  <div id="titular"></div>
  <div id="cifra"></div>
  <div id="humana"></div>
  <div id="pie"><div id="fuente"></div><div id="credito"></div></div>
</div>
<div id="gancho"><div id="hoy"></div><div id="gcifra" class="cifra-heroe condensada"></div><div id="gtit"></div><div id="gcred"></div></div>
<div id="subs"></div>
<script src="comun.js"></script>
<script>
const n = V.n, F45 = V.F45, { clamp, eo, prog, esc, normal } = V;
let S, N, MODO, TROZOS, NUM = null, KB = null, KB_PASO = null, FIN_T = [], EN_PANTALLA = new Set();
const LAMINA = V.F169 ? { ancho: 1920, alto: 1080 } : { ancho: 1080, alto: 1200 };   // la lámina de la foto (#sangre), igual en 9:16 y 4:5; a sangre en 16:9
const RE_NUM = /([-−]?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?/;   // número dentro de un texto formateado (como golpe.html)
function numTexto(s) {
  const m = (s || '').match(RE_NUM);
  if (!m) return null;
  const dec = m[3] ? m[3].length : 0, miles = m[2].includes(',');
  const v = parseFloat(m[2].replace(/,/g, '') + (m[3] ? '.' + m[3] : '')) * (m[1] ? -1 : 1);
  const pre = s.slice(0, m.index), post = s.slice(m.index + m[0].length);
  const fmt = (x) => {
    let c = Math.abs(x).toFixed(dec);
    if (miles) { const [e, d] = c.split('.'); c = e.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : ''); }
    return pre + (x < 0 ? m[1] || '-' : '') + c + post;
  };
  return { v, dec, fmt };
}
const svgEl = (tag, at, padre) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(at)) e.setAttribute(k, v); padre.appendChild(e); return e; };
const cargarScript = (src) => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok;
  s.onerror = () => mal(new Error('no carga ' + src)); document.head.appendChild(s); });
// el localizador (S.N.minimapa {depto, desde, hasta}): Guatemala con el departamento encendido, en un recuadro arriba a
// la derecha de la foto durante ~1.7 s
async function minimapa(padre) {
  await cargarScript('geometria.js');
  const M = N.minimapa, caja = document.createElement('div');
  caja.id = 'minimapa';
  caja.style.cssText = 'position:absolute;top:330px;right:110px;width:250px;height:250px;border-radius:24px;padding:16px;box-sizing:border-box;' +
    'background:color-mix(in srgb, var(--bg) 82%, transparent);border:2px solid color-mix(in srgb, var(--ink) 20%, transparent);opacity:0;';
  padre.appendChild(caja);
  const svg = svgEl('svg', { viewBox: GEOMETRIA.viewBox, preserveAspectRatio: 'xMidYMid meet', width: '100%', height: '100%' }, caja);
  const ruta = M.ruta || [], PS = {};
  if (ruta.length) { caja.style.width = '340px'; caja.style.height = '340px'; }   // con ruta, más grande: se lee el recorrido
  for (const [id, geo] of Object.entries(GEOMETRIA.deptos))
    PS[id] = svgEl('path', { d: geo.d, fill: !ruta.length && id === M.depto ? 'var(--acento)' : 'color-mix(in srgb, var(--ink) 28%, transparent)',
      stroke: 'var(--bg)', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke' }, svg);
  // el mapa con ruta (M.ruta: departamentos en orden): cada uno se enciende a su turno y un trazo va del anterior a él
  RUTA = [];
  ruta.forEach((id, k) => {
    if (!PS[id]) throw new Error('departamento «' + id + '» sin geometría');
    const b = PS[id].getBBox(), c = [b.x + b.width / 2, b.y + b.height / 2], t = M.desde + 0.5 + 0.9 * k;
    const seg = k ? svgEl('line', { x1: RUTA[k - 1].c[0], y1: RUTA[k - 1].c[1], x2: c[0], y2: c[1], stroke: 'var(--ink)', 'stroke-width': 4,
      'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' }, svg) : null;
    RUTA.push({ id, c, t, p: PS[id], seg, L: seg ? seg.getTotalLength() : 0 });
  });
  if (RUTA.length) {   // el mapa se acerca al recorrido (con sus vecinos alrededor): entre departamentos chicos no se veía
    const bs = RUTA.map((r) => r.p.getBBox()), x0 = Math.min(...bs.map((b) => b.x)), y0 = Math.min(...bs.map((b) => b.y)),
      x1 = Math.max(...bs.map((b) => b.x + b.width)), y1 = Math.max(...bs.map((b) => b.y + b.height));
    const lado = Math.max(x1 - x0, y1 - y0) * 1.9, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    svg.setAttribute('viewBox', `${(cx - lado / 2).toFixed(1)} ${(cy - lado / 2).toFixed(1)} ${lado.toFixed(1)} ${lado.toFixed(1)}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice'); svg.style.borderRadius = '12px';
  }
  RUTA.forEach((r) => { r.pin = svgEl('circle', { cx: r.c[0], cy: r.c[1], r: 0, fill: 'var(--ink)', stroke: 'var(--bg)', 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke' }, svg);
    r.R = Math.max(4, svg.viewBox.baseVal.width / 60); });
}
let RUTA = [];
const seekMinimapa = (t) => {
  const el = document.getElementById('minimapa'), M = N.minimapa;
  if (!el || !M) return;
  const v = V.portada ? 0 : Math.min(eo((t - M.desde) / 0.3), 1 - eo((t - M.hasta) / 0.3));
  el.style.opacity = Math.max(0, v).toFixed(3); el.style.transform = `scale(${(0.9 + 0.1 * Math.max(0, v)).toFixed(3)})`;
  for (const r of RUTA) {
    const k = V.portada ? 1 : eo((t - r.t) / 0.45);
    r.p.setAttribute('fill', k > 0.5 ? 'var(--acento)' : 'color-mix(in srgb, var(--ink) 28%, transparent)');
    r.pin.setAttribute('r', (r.R * k).toFixed(2));
    if (r.seg) { const a = V.portada ? 1 : eo((t - (r.t - 0.7)) / 0.7); r.seg.style.strokeDasharray = r.L; r.seg.style.strokeDashoffset = (r.L * (1 - a)).toFixed(2);
      r.seg.style.opacity = a > 0.01 ? '1' : '0'; }
  }
};
// sin foto: el mapa con el departamento encendido y su pin, o el icono de la noticia (en la lámina en el gancho, en la
// columna en la noticia)
async function tipografica(caja) {
  if (N.depto) {
    await cargarScript('geometria.js');
    const svg = svgEl('svg', { class: 'mapa', viewBox: GEOMETRIA.viewBox, preserveAspectRatio: 'xMidYMid meet' }, caja);
    if (!GEOMETRIA.deptos[N.depto]) throw new Error('departamento «' + N.depto + '» sin geometría');
    let destacado = null;
    for (const [id, geo] of Object.entries(GEOMETRIA.deptos)) {
      const p = svgEl('path', { d: geo.d, fill: id === N.depto ? 'var(--acento)' : 'color-mix(in srgb, var(--ink) 22%, transparent)',
        stroke: 'var(--bg)', 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round' }, svg);
      if (id === N.depto) destacado = p;
    }
    const bb = destacado.getBBox();
    const g = svgEl('g', { id: 'pin' }, svg);
    svgEl('line', { x1: bb.x + bb.width / 2, y1: bb.y + bb.height / 2, x2: bb.x + bb.width / 2, y2: bb.y + bb.height / 2 - 70,
      stroke: 'var(--ink)', 'stroke-width': 5, 'vector-effect': 'non-scaling-stroke' }, g);
    svgEl('circle', { cx: bb.x + bb.width / 2, cy: bb.y + bb.height / 2, r: 11, fill: 'var(--ink)' }, g);
  } else if (N.icono) {
    const r = await fetch('iconos/' + N.icono + '.svg');
    if (!r.ok) throw new Error('icono «' + N.icono + '» no está en design/iconos/');
    caja.insertAdjacentHTML('beforeend', `<div class="icono">${await r.text()}</div>`);
  }
  if (N.lugar && caja.id === 'figura') caja.insertAdjacentHTML('beforeend', `<div class="lugar">${esc(N.lugar)}</div>`);
}
// la foto a sangre en la lámina, antes del velo; el brillo según cuánto se agranda (cover × el zoom mayor del Ken Burns)
async function foto(caja) {
  const img = new Image();
  img.src = N.foto;
  await img.decode().catch(() => { throw new Error('no carga la foto ' + N.foto); });
  caja.insertBefore(img, caja.firstChild);
  // 16:9: una foto vertical o casi cuadrada (o un cartel con encaje «contener») no se recorta para llenar el cuadro
  // (quedaba una corbata en lugar de la cara): va entera en un panel a la derecha sobre su copia ampliada, borrosa y
  // oscura; la cámara de sub-planos no la mueve, solo un acercamiento lento
  if (V.F169 && (img.naturalWidth / img.naturalHeight < 1.3 || N.encaje === 'contener')) {
    const fondo = new Image();
    fondo.src = N.foto;
    await fondo.decode().catch(() => {});
    fondo.style.cssText = 'filter: blur(38px) brightness(.3); transform: scale(1.12);';
    caja.insertBefore(fondo, caja.firstChild);
    img.style.cssText = 'inset: auto; left: 1000px; top: 40px; width: 824px; height: 1000px; object-fit: contain; ' +
      'object-position: 50% 50%; filter: brightness(.95); transform-origin: 50% 50%;';
    img.dataset.panel = '1';
    return img;

  }

  // sigue a otra de la misma secuencia de voz, S.seguida); el titular con la voz; la cifra cuando la voz la dice; la
  // fuente al final
  const D = V.desfase(S), K = S.seguida ? 0.6 : 1;
  const ch = eo((t - D - 0.1) / (0.4 * K)), chip = document.getElementById('chip');
  chip.style.opacity = ch; chip.style.transform = `translateX(${((1 - ch) * -40).toFixed(1)}px)`;
  // la foto (o el mapa) entra desde el fondo y late al empezar cada oración nueva (un evento visual cada pocos
  // segundos: V10)
  const fo = eo((t - D - 0.05) / (0.5 * K));
  const late = (N.oraciones || []).reduce((m, x) => Math.max(m, Math.sin(Math.PI * clamp((t - x) / 0.5))), 0);
  if (KB) {
    document.getElementById('sangre').style.opacity = fo.toFixed(3);
    kenBurns(KB, t, late);
    document.getElementById('credito').style.opacity = (0.85 * fo).toFixed(3);
  } else {
    const fig = document.getElementById('figura');
    fig.style.opacity = fo.toFixed(3); fig.style.transform = `scale(${((0.96 + 0.04 * fo) * (1 + 0.025 * late)).toFixed(4)})`;
  }
  [...document.querySelectorAll('#titular > span')].forEach((s, i) => {
    const w = eo((t - N.titular[i].start + 0.15) / 0.3); s.style.opacity = w; s.style.transform = `translateY(${((1 - w) * 26).toFixed(1)}px)`; });
  (N.marcas || []).forEach((m) => {
    const sp = document.querySelectorAll('#titular > span')[m.k];
    if (!sp) return;
    let tr = sp.querySelector('.trazo');
    if (!tr) { tr = document.createElement('i'); tr.className = 'trazo'; sp.appendChild(tr); }
    tr.style.transform = `scaleX(${(V.portada ? 1 : eo((t - m.t) / 0.3)).toFixed(3)})`;
  });
  if (N.cifra) {
    const C = N.cifra, cifra = document.getElementById('cifra'), v = cifra.querySelector('.v');
    const p = prog(t, C.start, C.start + 0.9), ap = eo((t - C.start + 0.1) / 0.35);
    v.textContent = NUM ? (p >= 1 ? C.texto : NUM.fmt(NUM.v * p)) : C.texto;
    let esc_ = 0.9 + 0.1 * ap;
    if (C.pulso) esc_ *= 1 + 0.07 * Math.sin(Math.PI * clamp((t - C.pulso[0]) / Math.max(0.001, C.pulso[1] - C.pulso[0])));
    cifra.style.opacity = ap; cifra.style.transform = `scale(${esc_.toFixed(4)})`;
  }
  if (N.puesto) {   // el numeral entra primero y queda quieto (el que late es la cifra)
    const q = eo((t - D - 0.05) / (0.35 * K)), el = document.getElementById('puesto');
    el.style.opacity = q.toFixed(3); el.style.transform = `scale(${(0.8 + 0.2 * q).toFixed(4)})`;
  }
  if (N.humana) {
    const h = eo((t - N.humana.start) / 0.4), el = document.getElementById('humana');
    el.style.opacity = h.toFixed(3); el.style.transform = `translateY(${((1 - h) * 20).toFixed(1)}px)`;
  }
  if (N.fuente) {
    const f = eo((t - N.fuente.start) / 0.4), el = document.getElementById('fuente');
    el.style.opacity = (0.9 * f).toFixed(3); el.style.transform = `translateX(${((1 - f) * -30).toFixed(1)}px)`;
  }
  moverPin(t);
  subtitulos(t);
};
</script>
</body></html>
