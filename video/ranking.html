<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Escena «ranking» de /video (?n=N): cuenta regresiva a pantalla completa con los `top` primeros de una tarjeta
     barras-h (items) o mapa (valores por departamento): las filas entran del último puesto al primero, cada una
     cuando la voz dice su valor (o repartidas si no lo dice), con su número de puesto, nombre, valor y una barra
     proporcional; el primero (o el destacado de la tarjeta) entra el último con el acento. Arriba el golpe y la
     barra de progreso; debajo el kicker y la fuente de la tarjeta; abajo los subtítulos. Los puestos y sus tiempos
     vienen en S.T.items (los calcula video.py tiempos con los DATA de la tarjeta); el formato de los valores se lee
     de los DATA de tarjeta_N.html (h.js = bloque H de templates/base.html). La graba scripts/video_grabar.js. -->
<link rel="stylesheet" href="comun.css">
<style>
#kicker { position: absolute; top: 440px; left: var(--izq); right: var(--der); font: 500 24px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
#lista { position: absolute; top: 500px; left: var(--izq); right: var(--der); transform-origin: 0 0; will-change: transform; }
.fila { display: grid; grid-template-columns: 130px 1fr auto; grid-template-rows: auto 16px; column-gap: 20px; row-gap: 14px; align-items: end; height: 150px; margin-bottom: 10px; opacity: 0; }
.puesto { grid-row: 1 / 3; font: 400 120px/1 'Instrument Serif', serif; letter-spacing: -.03em; opacity: .55; align-self: center; }
.nombre { font: 700 50px/1.05 Archivo, sans-serif; }
.valor { font: 700 56px/1 'JetBrains Mono', monospace; letter-spacing: -.02em; text-align: right; }
.barra { grid-column: 2 / 4; height: 16px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 22%, transparent); overflow: hidden; }
.barra b { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 8px; }
.fila.si .puesto { opacity: 1; color: var(--acento, var(--ink)); }
.fila.si .nombre { font-weight: 800; }
.fila.si .barra b { background: var(--acento, var(--ink)); }
#fuente { position: absolute; top: 1340px; left: var(--izq); right: var(--der); font: 500 20px/1.2 'JetBrains Mono', monospace; opacity: .75; }
/* formato 4:5 (1080×1350) para el feed */
html.f45 #kicker { top: 250px; }
html.f45 #lista { top: 300px; }
html.f45 .fila { height: 118px; margin-bottom: 8px; }
html.f45 .puesto { font-size: 96px; }
html.f45 .nombre { font-size: 42px; }
html.f45 .valor { font-size: 48px; }
html.f45 #fuente { top: 1000px; }
</style>
<script src="h.js"></script>
</head>
<body>
<div id="arriba"><div id="golpe"></div><div id="progreso"></div></div>
<div id="kicker"></div>
<div id="lista"></div>
<div id="fuente"></div>
<div id="subs"></div>
<script src="comun.js"></script>
<script>
const n = V.n, F45 = V.F45, { clamp, prog, esc } = V;
let S, TROZOS, D, FILAS = [];
const DERIVA = 0.02;   // la lista crece de 1 a 1 + DERIVA (nunca quieta); con origen arriba a la izquierda, ≤ x 892

window.__listo = (async () => {
  const C = await V.cargar(), todo = C.todo; S = C.S; TROZOS = C.trozos;
  S.arriba = S.arriba || [];
  V.pintarGolpe(S);
  V.pintarProgreso(todo);
  D = await V.tarjeta(S.tuit);
  document.getElementById('kicker').textContent = D.kicker || '';
  document.getElementById('fuente').textContent = D.fuente ? 'Fuente: ' + D.fuente : '';
  const f = (v) => H.num(v, D.formato || {});
  const items = S.T.items || [], max = Math.max(...items.map((x) => Math.abs(x.valor)), 1e-9);
  const lista = document.getElementById('lista');
  lista.innerHTML = items.map((it) => `<div class="fila${it.hi ? ' si' : ''}"><div class="puesto">${it.puesto}</div>` +
    `<div class="nombre">${esc(it.nombre)}</div><div class="valor"></div><div class="barra"><b></b></div></div>`).join('');
  FILAS = [...lista.querySelectorAll('.fila')].map((el, i) => ({ el, it: items[i], valor: el.querySelector('.valor'), barra: el.querySelector('.barra b'),
    ancho: 100 * Math.abs(items[i].valor) / max, f }));
  FILAS.forEach((x) => { x.valor.textContent = f(x.it.valor); });
  await document.fonts.ready;
  V.ajustarGolpe(S, F45 ? 250 : 430);
  // zona segura (V.zona, gate V13): las filas y la fuente, con la deriva, terminan antes de los subtítulos. Con top 6
  // las filas se achican (alto y letra en proporción); la fuente va justo debajo de la última fila.
  const Z = V.zona(), fu = document.getElementById('fuente'), base = F45 ? 118 : 150, sep = F45 ? 8 : 10;
  const cabe = Math.floor((Z.fin - lista.offsetTop - fu.offsetHeight - 14) / (1 + DERIVA) / Math.max(1, FILAS.length)) - sep;
  if (cabe < base) {
    const k = cabe / base;
    for (const x of FILAS) {
      x.el.style.height = cabe + 'px';
      for (const [sel, px] of [['.puesto', F45 ? 96 : 120], ['.nombre', F45 ? 42 : 50], ['.valor', F45 ? 48 : 56]])
        x.el.querySelector(sel).style.fontSize = Math.round(px * Math.max(0.7, k)) + 'px';
    }
  }
  fu.style.top = Math.ceil(lista.offsetTop + lista.offsetHeight * (1 + DERIVA) + 14) + 'px';
})();

window.seek = (t) => {
  V.seekGolpe(t, S);
  V.seekProgreso(t, n, S.dur);
  const T = S.T, ini = T.ini;
  document.getElementById('kicker').style.opacity = prog(t, ini - 0.3, ini + 0.2);
  document.getElementById('fuente').style.opacity = prog(t, ini + 0.3, ini + 0.8);
  // cada fila entra en su momento (del último puesto al primero): se desliza, su barra crece y su valor cuenta
  for (const x of FILAS) {
    const a = x.it.start, p = prog(t, a, a + 0.4), q = prog(t, a + 0.1, a + 0.7);
    x.el.style.opacity = p;
    x.el.style.transform = `translateX(${((1 - p) * -50).toFixed(1)}px)`;
    x.barra.style.width = (x.ancho * q).toFixed(2) + '%';
    x.valor.textContent = q >= 1 ? x.f(x.it.valor) : x.f(x.it.valor * q);
    // la fila que la voz está diciendo (o el primero al cerrar) late un poco
    const lat = x.it.dicho ? prog(t, x.it.dicho[0] - 0.1, x.it.dicho[0] + 0.25) * (1 - prog(t, x.it.dicho[1] + 0.3, x.it.dicho[1] + 0.7)) : 0;
    x.el.style.scale = (1 + 0.03 * lat).toFixed(4);
  }
  // deriva lenta de la lista durante la escena (nunca quieto)
  document.getElementById('lista').style.transform = `scale(${(1 + DERIVA * clamp(t / S.dur)).toFixed(4)})`;
  V.subtitulos(t, S, TROZOS);
};
</script>
</body></html>
