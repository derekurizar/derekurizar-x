<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Escena de texto cinético de /video (?n=N), para el gancho (escena 1) y los golpes: la cifra enorme que cuenta
     (o ≤ 4 palabras que entran de golpe), la línea que la explica palabra a palabra, la barra de progreso con el
     contexto pequeño debajo y los subtítulos. Sin tarjeta. Colores de la paleta del hilo (escenas.json); la cifra
     va en --acento. Zona segura de TikTok: columna x 85–876, arriba desde y=250, subtítulos en y=1500 (ver
     escena.html). La graba scripts/video_grabar.js llamando a seek(t).
     T = { pant: { texto, v, desde, hasta, pulso }, linea: [{ text, start }], fin } -->
<style>
@font-face { font-family: 'Instrument Serif'; font-weight: 400; src: url(fonts/instrument-serif-400.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 100 900; src: url(fonts/archivo-var.woff2) format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url(fonts/jetbrains-mono-var.woff2) format('woff2'); }
html, body { margin: 0; }
:root { --izq: 85px; --der: 204px; }
body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); position: relative; font-family: Archivo, sans-serif; }
#arriba { position: absolute; top: 250px; left: var(--izq); right: var(--der); }
#progreso { display: flex; gap: 10px; }
#progreso i { flex: 1; height: 6px; background: color-mix(in srgb, var(--ink) 28%, transparent); border-radius: 3px; overflow: hidden; }
#progreso i b { display: block; height: 100%; width: 0; background: var(--ink); }
#contexto { font: 500 22px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; margin-top: 18px; opacity: .85; }
#cuerpo { position: absolute; top: 560px; left: var(--izq); right: var(--der); }
#cifra { font: 400 300px/.9 'Instrument Serif', serif; letter-spacing: -.03em; color: var(--acento, var(--ink)); white-space: nowrap; transform-origin: 0 60%; }
#cifra.texto { font-size: 150px; line-height: 1; letter-spacing: -.015em; white-space: normal; }
#linea { font: 700 64px/1.1 Archivo, sans-serif; margin-top: 48px; }
#linea span { display: inline-block; margin-right: .25em; }
#subs { position: absolute; top: 1500px; left: var(--izq); right: var(--der); text-align: center; font: 700 48px/1.25 Archivo, sans-serif; }
#subs span { margin: 0 .1em; }
#subs .no { opacity: .38; }
#subs .cifra { font-size: 60px; font-weight: 800; letter-spacing: -.01em; }
#subs .ahora { color: var(--resalte-ink); background: var(--resalte-bg); border-radius: 10px; padding: 0 .12em; }
</style></head>
<body>
<div id="arriba"><div id="progreso"></div><div id="contexto"></div></div>
<div id="cuerpo"><div id="cifra"></div><div id="linea"></div></div>
<div id="subs"></div>
<script>
const n = Number(new URLSearchParams(location.search).get('n'));
let S, TROZOS, NUM = null;
const clamp = (x) => Math.max(0, Math.min(1, x)), eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const prog = (t, a, b) => (t >= b ? 1 : eo((t - a) / Math.max(0.001, b - a)));
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// número dentro de un texto formateado («US$5.90», «1,596.2 kg»): se cuenta con el mismo formato (copiado de animar.js)
const RE_NUM = /([-−]?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?/;
function numTexto(s) {
  const m = (s || '').match(RE_NUM);
  if (!m) return null;
  const dec = m[3] ? m[3].length : 0, miles = m[2].includes(',');
  const v = parseFloat(m[2].replace(/,/g, '') + (m[3] ? '.' + m[3] : '')) * (m[1] ? -1 : 1);
  const pre = s.slice(0, m.index), post = s.slice(m.index + m[0].length);
  const fmt = (x) => {
    let c = Math.abs(x).toFixed(dec);
    if (miles) { const [e, d] = c.split('.'); c = e.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : ''); }
    return pre + (x < 0 ? m[1] || '-' : '') + c + post;
  };
  return { v, dec, fmt };
}
const trocear = (ps) => { const out = []; let cur = [];
  for (const p of ps) { const largo = cur.map((x) => x.text).join(' ').length + p.text.length + 1;
    if (cur.length && largo > 26) { out.push(cur); cur = []; }
    cur.push(p); if (/[.?:;…]$/.test(p.text)) { out.push(cur); cur = []; } }
  if (cur.length) out.push(cur); return out; };
window.__listo = (async () => {
  const todo = await (await fetch('escenas.json')).json();
  for (const [k, v] of Object.entries(todo.colores)) document.documentElement.style.setProperty('--' + k.replace('_', '-'), v);
  S = todo.escenas.find((e) => e.n === n);
  TROZOS = trocear(S.palabras);
  document.getElementById('progreso').innerHTML = todo.escenas.map(() => '<i><b></b></i>').join('');
  document.getElementById('contexto').textContent = todo.contexto_superior || '';
  const cifra = document.getElementById('cifra'), P = S.T.pant;
  cifra.textContent = P.texto;
  // cuenta solo si es una cifra con algo que contar (≥ 2 o con decimales); «1 de cada 3» o «Menos denuncias» entran de golpe
  const nt = P.v != null ? numTexto(P.texto) : null;
  NUM = nt && (Math.abs(nt.v) >= 2 || nt.dec > 0) ? nt : null;
  document.getElementById('linea').innerHTML = (S.T.linea || []).map((w) => `<span>${esc(w.text)}</span>`).join('');
  await document.fonts.ready;
  const ancho = document.getElementById('cuerpo').clientWidth;
  if (NUM) {  // una línea: se achica hasta caber en la columna; si ni a 160 px cabe («8,402 kg de cocaína»), dos líneas
    for (let fs = 300; fs > 160 && cifra.scrollWidth > ancho; fs -= 10) cifra.style.fontSize = fs + 'px';
    if (cifra.scrollWidth > ancho) {
      cifra.style.whiteSpace = 'normal'; cifra.style.lineHeight = '.95';
      for (let fs = 160; fs > 100 && (cifra.scrollWidth > ancho || cifra.offsetHeight > 2.1 * fs); fs -= 8) cifra.style.fontSize = fs + 'px';
    }
  } else {    // texto: hasta dos líneas
    cifra.classList.add('texto');
    for (let fs = 150; fs > 96 && cifra.offsetHeight > 2.1 * fs; fs -= 6) cifra.style.fontSize = fs + 'px';
  }
})();
window.seek = (t) => {
  [...document.querySelectorAll('#progreso b')].forEach((b, i) => { b.style.width = (i + 1 < n ? 100 : i + 1 === n ? 100 * clamp(t / S.dur) : 0) + '%'; });
  const cifra = document.getElementById('cifra'), P = S.T.pant;
  const p = prog(t, P.desde, P.hasta);
  let escala = 1;
  if (NUM) {
    cifra.textContent = p >= 1 ? P.texto : NUM.fmt(NUM.v * p);
    cifra.style.opacity = prog(t, P.desde - 0.15, P.desde + 0.1);
    // latido cuando la voz dice la cifra más tarde que la pantalla
    if (P.pulso) escala = 1 + 0.06 * Math.sin(Math.PI * clamp((t - P.pulso[0]) / Math.max(0.001, P.pulso[1] - P.pulso[0])));
  } else {
    const q = prog(t, P.desde, P.desde + 0.35);
    cifra.style.opacity = q; escala = .92 + .08 * q;
  }
  cifra.style.transform = escala === 1 ? '' : `scale(${escala.toFixed(4)})`;
  [...document.querySelectorAll('#linea span')].forEach((s, i) => {
    const w = eo((t - S.T.linea[i].start + 0.15) / 0.3); s.style.opacity = w; s.style.transform = `translateY(${(1 - w) * 30}px)`; });
  const subs = document.getElementById('subs');
  const k = TROZOS.findIndex((c, j) => t >= c[0].start - 0.05 && t < ((TROZOS[j + 1] || [{ start: 1e9 }])[0].start - 0.05));
  const tr = TROZOS[k];
  subs.innerHTML = !tr || t > S.fin_voz + 0.4 ? '' : tr.map((x) => `<span class="${t >= x.start && t < x.end + 0.08 ? 'ahora' : t >= x.end ? '' : 'no'}${x.num ? ' cifra' : ''}">${esc(x.text)}</span>`).join(' ');
};
</script>
</body></html>
