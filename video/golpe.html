<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Escena de texto cinético de /video (?n=N), para el gancho (escena 1) y los golpes: la cifra enorme que cuenta
     (o ≤ 4 palabras que entran de golpe), la línea que la explica palabra a palabra, la barra de progreso con el
     contexto pequeño debajo y los subtítulos. Sin tarjeta. Estilo Noche (video/comun.css): la cifra (o las palabras,
     o el término) en Archivo condensado 900 y mayúsculas, sola en --acento; la línea, la pregunta y las opciones en
     crema, Archivo 800; el texto sobre el acento con --tinta-acento. Zona segura de TikTok: columna x 85–876, arriba
     desde y=250, subtítulos en y=1400 (V.zona, ver escena.html). La graba scripts/video_grabar.js llamando a seek(t).
     T = { pant: { texto, v, desde, hasta, pulso }, linea: [{ text, start }], fin } -->
<link rel="stylesheet" href="comun.css">
<style>
#progreso { margin-top: 0; }
#contexto { font: 600 22px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; margin-top: 18px; opacity: .85; }
#cuerpo { position: absolute; top: 560px; left: var(--izq); right: var(--der); transform-origin: 0 40%; will-change: transform; }
#icono { height: 0; margin-bottom: 0; color: var(--ink); }
#icono svg { width: 140px; height: 140px; stroke-width: 1.5; display: block; }
body.con-icono #icono { height: 140px; margin-bottom: 28px; }
html.f45 #icono svg { width: 110px; height: 110px; }
html.f45 body.con-icono #icono { height: 110px; margin-bottom: 20px; }
/* la cifra: Archivo 900 condensado en mayúsculas (más angosto que el serif de antes: arranca más grande y se achica
   hasta caber); el shorthand `font` resetea font-stretch, que va después */
#cifra { font: 900 360px/.84 Archivo, sans-serif; font-stretch: 62.5%; text-transform: uppercase; letter-spacing: -.005em;
  color: var(--acento, var(--ink)); white-space: nowrap; transform-origin: 0 60%; }
#cifra.texto { font-size: 190px; line-height: .88; white-space: normal; }
#linea { font: 800 62px/1.1 Archivo, sans-serif; letter-spacing: -.01em; margin-top: 44px; }
#cifra.baja { margin-bottom: .19em; }
#linea span { display: inline-block; margin-right: .25em; }
/* definición: el rótulo «Para entender» (en crema: el acento es solo del término) avisa que viene un concepto; el
   término como texto (no cuenta) y la definición en hasta tres líneas */
#rotulo { display: none; font: 600 30px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase;
  margin-bottom: 26px; opacity: 0; }
body.definicion #rotulo { display: block; }
html.f45 #rotulo { font-size: 26px; margin-bottom: 20px; }
body.definicion #linea { font-size: 56px; line-height: 1.15; margin-top: 40px; }
/* adivina: la pregunta y tres opciones que entran una a una; al revelar, la correcta se rellena con el acento (texto
   en --tinta-acento) y las otras se apagan. Las opciones son cifras: condensado 900; la letra, en mono */
body.adivina #cuerpo { top: 470px; }
#pregunta { font: 800 74px/1.06 Archivo, sans-serif; letter-spacing: -.015em; }
#pregunta span { display: inline-block; margin-right: .22em; }
#opciones { margin-top: 48px; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.op { font: 900 76px/1 Archivo, sans-serif; font-stretch: 62.5%; text-transform: uppercase; padding: 16px 34px 18px;
  border: 4px solid color-mix(in srgb, var(--ink) 55%, transparent); border-radius: 22px; transform-origin: 0 50%; opacity: 0;
  display: flex; align-items: center; }
.op b { font: 600 34px/1 'JetBrains Mono', monospace; opacity: .6; margin-right: .9em; }
.op.si { background: var(--acento, var(--ink)); color: var(--tinta-acento, var(--bg)); border-color: var(--acento, var(--ink)); }
.op.si b { opacity: .8; }
/* «pausa y responde»: entra cuando la voz lo pide; la barra de abajo se vacía hasta el revelado */
#pausa { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 20px; margin-top: 52px; padding: 18px 34px 22px 26px;
  border-radius: 999px; background: var(--ink); color: var(--bg); font: 700 42px/1 Archivo, sans-serif; opacity: 0; transform-origin: 0 50%; }
#pausa .barras { display: flex; gap: 8px; }
#pausa .barras i { width: 11px; height: 36px; border-radius: 3px; background: var(--bg); }
#pausa b { position: absolute; left: 0; bottom: 0; height: 7px; width: 100%; background: var(--bg); opacity: .6; transform-origin: 0 50%; }
/* formato 4:5 (1080×1350) para el feed */
html.f45 #cuerpo { top: 330px; }
html.f45 #linea { font-size: 56px; margin-top: 36px; }
html.f45 body.adivina #cuerpo { top: 290px; }
html.f45 #pregunta { font-size: 62px; }
html.f45 .op { font-size: 64px; padding: 12px 28px 14px; }
html.f45 .op b { font-size: 28px; }
html.f45 #opciones { margin-top: 32px; gap: 16px; }
html.f45 #pausa { margin-top: 34px; font-size: 36px; padding: 14px 28px 18px 22px; }
</style></head>
<body>
<div id="arriba"><div id="progreso"></div><div id="contexto"></div></div>
<div id="cuerpo"><div id="icono"></div><div id="rotulo">Para entender</div><div id="cifra"></div><div id="linea"></div></div>
<div id="subs"></div>
<script src="comun.js"></script>
<script>
const n = V.n, F45 = V.F45, { clamp, eo, prog, esc, normal } = V;
let S, TROZOS, NUM = null, TRAZOS = [], EN_PANTALLA = new Set(), T_CIFRA = 0;
const APAGADA = 0.35;   // Noche: lo que la voz aún no dice de la línea (o de la pregunta) se ve al 35 % (texto grande)
// número dentro de un texto formateado («US$5.90», «1,596.2 kg»): se cuenta con el mismo formato (copiado de animar.js)
const RE_NUM = /([-−]?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?/;
function numTexto(s) {
  const m = (s || '').match(RE_NUM);
  if (!m) return null;
  const dec = m[3] ? m[3].length : 0, miles = m[2].includes(',');
  const v = parseFloat(m[2].replace(/,/g, '') + (m[3] ? '.' + m[3] : '')) * (m[1] ? -1 : 1);
  const pre = s.slice(0, m.index), post = s.slice(m.index + m[0].length);
  const fmt = (x) => {
    let c = Math.abs(x).toFixed(dec);
    if (miles) { const [e, d] = c.split('.'); c = e.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : ''); }
    return pre + (x < 0 ? m[1] || '-' : '') + c + post;
  };
  return { v, dec, fmt };
}
// un año suelto («1974», «En 1886») entra entero: contarlo muestra años absurdos en tránsito («795»)
const esAnio = (s, nt) => !!nt && nt.dec === 0 && nt.v >= 1000 && nt.v <= 2100 && /^[^\d]*\b\d{4}[\s.:,;!?»"]*$/.test(s || '');
window.__listo = (async () => {
  const C = await V.cargar(), todo = C.todo; S = C.S; TROZOS = C.trozos;
  document.body.classList.add(S.tipo || 'golpe');
  V.pintarProgreso(todo);
  document.getElementById('contexto').textContent = todo.contexto_superior || '';
  // lo que ya está en pantalla (pantalla + línea, o pregunta + opciones) más el prefijo y el contexto: el subtítulo se
  // oculta mientras solo repita eso (la primera oración) y vuelve para lo que no está (la promesa, la respuesta)
  const enPantalla = S.tipo === 'adivina' ? [...S.T.pregunta.map((w) => w.text), ...S.T.opciones.map((o) => o.text)]
    : [S.T.pant.texto, ...(S.T.linea || []).map((w) => w.text)];
  [...enPantalla, 'En Guatemala', todo.contexto_superior || ''].forEach((s) => String(s).split(/\s+/).forEach((w) => { const k = normal(w); if (k) EN_PANTALLA.add(k); }));
  // en la adivina el subtítulo sale desde el principio: la frase que la voz dice antes de la pregunta («Aun así, …»)
  // no está en pantalla, y esconderla dejaba la pantalla quieta (V12)
  T_CIFRA = S.tipo === 'adivina' ? 0 : S.T.pant.desde;
  if (S.tipo === 'adivina') {
    document.getElementById('cuerpo').innerHTML = `<div id="pregunta">${S.T.pregunta.map((w) => `<span>${esc(w.text)}</span>`).join('')}</div>` +
      `<div id="opciones">${S.T.opciones.map((o, i) => `<div class="op"><b>${'ABC'[i]}</b>${esc(o.text)}</div>`).join('')}</div>` +
      (S.T.pausa != null ? '<div id="pausa"><span class="barras"><i></i><i></i></span><span>Pausa y responde</span><b></b></div>' : '');
    await document.fonts.ready;
    return;
  }
  const cifra = document.getElementById('cifra'), P = S.T.pant;
  cifra.textContent = P.texto;
  // la coma, el punto y coma, los paréntesis y la Q bajan del renglón (interlínea .84): más aire antes de la línea
  cifra.classList.toggle('baja', /[,;()Q]/i.test(P.texto));
  if (S.icono) {  // acento de la biblioteca fija (design/iconos/): se dibuja trazo a trazo al entrar la cifra
    const r = await fetch('iconos/' + S.icono + '.svg');
    if (!r.ok) throw new Error('icono «' + S.icono + '» no está en design/iconos/');
    document.getElementById('icono').innerHTML = await r.text();
    document.body.classList.add('con-icono');
    TRAZOS = [...document.querySelectorAll('#icono svg *')].filter((el) => el.getTotalLength).map((el) => {
      const L = el.getTotalLength(); el.style.strokeDasharray = L; el.style.strokeDashoffset = L; return { el, L }; });
  }
  // cuenta solo si es una cifra con algo que contar (≥ 2 o con decimales); «1 de cada 3» o «Menos denuncias» entran de golpe
  const nt = P.v != null ? numTexto(P.texto) : null;
  NUM = nt && (Math.abs(nt.v) >= 2 || nt.dec > 0) && !/\bde cada\b/i.test(P.texto) ? nt : null;
  if (NUM) NUM.anio = esAnio(P.texto, NUM);
  document.getElementById('linea').innerHTML = (S.T.linea || []).map((w) => `<span>${esc(w.text)}</span>`).join('');
  await document.fonts.ready;
  const ancho = document.getElementById('cuerpo').clientWidth;
  if (NUM) {  // una línea: se achica hasta caber en la columna; si ni a 190 px cabe («8,402 kg de cocaína»), dos líneas
    if (F45) cifra.style.fontSize = '300px';
    for (let fs = F45 ? 300 : 360; fs > 190 && cifra.scrollWidth > ancho; fs -= 10) cifra.style.fontSize = fs + 'px';
    if (cifra.scrollWidth > ancho) {
      cifra.style.whiteSpace = 'normal'; cifra.style.lineHeight = '.88';
      for (let fs = 190; fs > 110 && (cifra.scrollWidth > ancho || cifra.offsetHeight > 2 * fs); fs -= 8) cifra.style.fontSize = fs + 'px';
    }
  } else {    // texto: hasta dos líneas y sin palabra que se salga de la columna (el término de una definición arranca más chico)
    cifra.classList.add('texto');
    const fs0 = S.tipo === 'definicion' ? (F45 ? 124 : 144) : (F45 ? 160 : 190);
    cifra.style.fontSize = fs0 + 'px';
    for (let fs = fs0; fs > 100 && (cifra.offsetHeight > 2 * fs || cifra.scrollWidth > ancho); fs -= 6) cifra.style.fontSize = fs + 'px';
  }
  await V.pintarActo(S);   // rótulo de acto (/historia, S.R): solo en un golpe, nunca en gancho ni adivina
})();
// sin subtítulo antes de que aterrice la cifra ni doble: un trozo cuyas palabras ya están en pantalla no se repite
// debajo; las de enlace («o», «y», «de»…) no cuentan («¿67, 90 o 102?» con las opciones a la vista)
const ENLACE = new Set(['o', 'u', 'y', 'e', 'a', 'al', 'de', 'del', 'el', 'la', 'los', 'las', 'en', 'un', 'una', 'que', 'por']);
const repite = (tr) => tr.some((x) => EN_PANTALLA.has(normal(x.text))) && tr.every((x) => EN_PANTALLA.has(normal(x.text)) || ENLACE.has(normal(x.text)));
const subtitulos = (t) => V.subtitulos(t, S, TROZOS, { ocultar: (tr, t) => t < T_CIFRA + 0.3 || repite(tr) });
const seekAdivina = (t) => {
  const T = S.T, rev = eo((t - T.revelado) / 0.35);
  // la pregunta aparece entera y apagada justo antes de que la voz la diga; cada palabra se enciende al decirla (en
  // la portada, entera)
  const p0 = T.pregunta.length ? prog(t, T.pregunta[0].start - 0.45, T.pregunta[0].start - 0.1) : 1;
  [...document.querySelectorAll('#pregunta span')].forEach((s, i) => {
    const w = V.portada ? 1 : eo((t - T.pregunta[i].start + 0.15) / 0.3);
    s.style.opacity = (p0 * (APAGADA + (1 - APAGADA) * w)).toFixed(3); s.style.transform = `translateY(${((1 - w) * 8).toFixed(1)}px)`; });
  [...document.querySelectorAll('#opciones .op')].forEach((el, i) => {
    const w = eo((t - T.opciones[i].start) / 0.35), si = i === T.correcta;
    el.style.opacity = w * (1 - (si ? 0 : 0.65) * rev);
    el.style.transform = `translateX(${(1 - w) * -40}px) scale(${(1 + (si ? 0.08 : 0) * rev).toFixed(4)})`;
    el.classList.toggle('si', si && rev > 0.5);
  });
  const pz = document.getElementById('pausa');
  if (pz) {
    const w = eo((t - T.pausa) / 0.3);
    pz.style.opacity = w * (1 - rev);
    pz.style.transform = `translateY(${((1 - w) * 24).toFixed(1)}px) scale(${(0.94 + 0.06 * w).toFixed(4)})`;
    pz.querySelector('b').style.transform = `scaleX(${(1 - clamp((t - T.pausa) / Math.max(0.3, T.revelado - T.pausa))).toFixed(4)})`;
  }
  document.getElementById('cuerpo').style.transform = `scale(${(1 + 0.03 * clamp(t / S.dur)).toFixed(4)})`;
};
window.seek = (t) => {
  V.seekProgreso(t, n, S.dur);
  V.seekActo(t, S);
  if (S.tipo === 'adivina') { seekAdivina(t); subtitulos(t); return; }
  const cifra = document.getElementById('cifra'), P = S.T.pant;
  const p = prog(t, P.desde, P.hasta);
  // la cifra entra creciendo (.9 → 1) mientras cuenta; late cuando la voz la dice más tarde que la pantalla. En el
  // gancho (escena 1) está entera desde el cuadro 0: es la miniatura del feed y la vuelta del bucle (R12, gate V15)
  const gancho = S.tipo === 'gancho';
  let escala = gancho ? 1 : .9 + .1 * eo((t - P.desde + 0.15) / 0.45);
  if (gancho) {
    cifra.textContent = P.texto;
    cifra.style.opacity = 1;
    if (P.pulso) escala *= 1 + 0.06 * Math.sin(Math.PI * clamp((t - P.pulso[0]) / Math.max(0.001, P.pulso[1] - P.pulso[0])));
  } else if (NUM) {
    cifra.textContent = p >= 1 || NUM.anio ? P.texto : NUM.fmt(NUM.v * p);
    cifra.style.opacity = prog(t, P.desde - 0.15, P.desde + 0.1);
    if (P.pulso) escala *= 1 + 0.06 * Math.sin(Math.PI * clamp((t - P.pulso[0]) / Math.max(0.001, P.pulso[1] - P.pulso[0])));
  } else {
    cifra.style.opacity = prog(t, P.desde, P.desde + 0.35);
  }
  cifra.style.transform = `scale(${escala.toFixed(4)})`;
  // el rótulo de la definición entra un poco antes que el término
  if (S.tipo === 'definicion') document.getElementById('rotulo').style.opacity = prog(t, P.desde - 0.25, P.desde + 0.1);
  // el icono se traza de P.desde − 0.3 a P.desde + 0.2 y late con la cifra
  if (TRAZOS.length) {
    const q = prog(t, P.desde - 0.3, P.desde + 0.2);
    TRAZOS.forEach((x) => { x.el.style.strokeDashoffset = (x.L * (1 - q)).toFixed(2); });
    document.getElementById('icono').style.transform = `scale(${(escala / (.9 + .1)).toFixed(4)})`;
    document.getElementById('icono').style.opacity = Math.min(1, 0.3 + q);
  }
  // deriva lenta de todo el cuerpo durante la escena (nunca quieto)
  document.getElementById('cuerpo').style.transform = `scale(${(1 + 0.03 * clamp(t / S.dur)).toFixed(4)})`;
  // la línea aparece entera y apagada con la cifra (en el gancho, desde el cuadro 0: es la miniatura) y cada palabra
  // se enciende cuando la voz la dice (en la portada, entera)
  const base = gancho ? 1 : prog(t, P.desde - 0.15, P.desde + 0.25);
  [...document.querySelectorAll('#linea span')].forEach((s, i) => {
    const w = V.portada ? 1 : eo((t - S.T.linea[i].start + 0.15) / 0.3);
    s.style.opacity = (base * (APAGADA + (1 - APAGADA) * w)).toFixed(3); s.style.transform = `translateY(${((1 - w) * 8).toFixed(1)}px)`; });
  subtitulos(t);
};
</script>
</body></html>
