<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!-- Portada de texto de /video (portada_texto.png): el gancho leído en silencio para la miniatura del feed: el
     contexto arriba, la cifra (o las ≤ 4 palabras) enorme en --acento, la línea que la explica y el handle abajo.
     Sin barra de progreso ni subtítulos. Estilo Noche: fondo y grano de video/comun.css, la cifra en Archivo
     condensado 900 y mayúsculas (sola en el acento), la línea en crema, Archivo 800, y el contexto y el handle en
     JetBrains Mono 600. No carga comun.js: los colores de escenas.json se ponen aquí. La dibuja
     scripts/video_grabar.js --portadas (seek no hace nada: es un cuadro fijo). -->
<link rel="stylesheet" href="comun.css">
<style>
:root { --izq: 85px; --der: 85px; }
#contexto { position: absolute; top: 330px; left: var(--izq); right: var(--der); font: 600 26px/1 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
#regla { position: absolute; top: 384px; left: var(--izq); width: 120px; height: 8px; background: var(--ink); border-radius: 4px; }
#cuerpo { position: absolute; top: 520px; left: var(--izq); right: var(--der); }
/* el shorthand `font` resetea font-stretch, que va después */
#cifra { font: 900 380px/.84 Archivo, sans-serif; font-stretch: 62.5%; text-transform: uppercase; letter-spacing: -.005em;
  color: var(--acento, var(--ink)); white-space: nowrap; }
#cifra.texto { font-size: 200px; line-height: .88; white-space: normal; }
#linea { font: 800 74px/1.08 Archivo, sans-serif; letter-spacing: -.015em; margin-top: 52px; }
#pie { position: absolute; bottom: 300px; left: var(--izq); right: var(--der); font: 600 30px/1 'JetBrains Mono', monospace; letter-spacing: .06em; opacity: .8; }
</style></head>
<body>
<div id="contexto"></div><div id="regla"></div>
<div id="cuerpo"><div id="cifra"></div><div id="linea"></div></div>
<div id="pie"></div>
<script>
const n = Number(new URLSearchParams(location.search).get('n')) || 1;
const esc = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
window.seek = () => {};
window.__listo = (async () => {
  const todo = await (await fetch('escenas.json')).json();
  for (const [k, v] of Object.entries(todo.colores)) document.documentElement.style.setProperty('--' + k.replace('_', '-'), v);
  const S = todo.escenas.find((e) => e.n === n) || todo.escenas[0];
  document.getElementById('contexto').textContent = todo.contexto_superior || '';
  const cifra = document.getElementById('cifra'), P = (S.T && S.T.pant) || {};
  const texto = P.texto || (S.cinetico && S.cinetico.pantalla) || '';
  cifra.textContent = texto;
  if (P.v === null || P.v === undefined) cifra.classList.add('texto');
  document.getElementById('linea').textContent = ((S.T && S.T.linea) || []).map((w) => w.text).join(' ') || ((S.cinetico && S.cinetico.linea) || '');
  const redes = (todo.redes || []).map((r) => r.handle);
  document.getElementById('pie').textContent = [...new Set(redes)].join(' · ');
  await document.fonts.ready;
  // la cifra cabe en la columna: se encoge hasta que cabe (el texto, además, en dos líneas como mucho)
  const ancho = 1080 - 85 - 85, esTexto = cifra.classList.contains('texto');
  for (let fs = esTexto ? 200 : 380; fs > 120 && (cifra.scrollWidth > ancho || (esTexto && cifra.offsetHeight > 2 * fs)); fs -= 10) cifra.style.fontSize = fs + 'px';
})();
</script>
</body></html>
